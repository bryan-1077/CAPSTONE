- id: SYS_ORDERING
  text: Acceptance order defines global FIFO order. Dispatch transfers only the oldest
    previously stored request. Physical row state, legality, cleanup, refresh, and
    timing may delay service but may not select a younger request ahead of the oldest
    waiting request.
  owners: *id059
  verification: "source: system.rules.SYS_ORDERING\norigin: model_selected\nobligations:\n\
    \  V_SYS_ORDERING:\n    rules:\n    - SYS_ORDERING\n    scenario: Place older\
    \ row misses and conflicts ahead of newer row hits and vary\n      timing stalls.\n\
    \    expected: Dispatch and completion follow acceptance order despite different\
    \ command\n      setup costs.\n    status: planned_not_executed\n"
- id: SYS_SIMULTANEOUS
  text: At a reset edge, reset wins over admission, dispatch, command commit, retirement,
    response delivery, refresh due, and refresh acknowledgment. Without reset, a full
    waiting queue may admit and dispatch on the same edge using the pre-edge head
    and pre-edge incoming payload. Retirement does not authorize dispatch on its own
    edge. A refresh due coincident with REF commit leaves refresh pending set for
    a later service interval.
  owners: *id060
  verification: "source: system.rules.SYS_SIMULTANEOUS\norigin: model_selected\nobligations:\n\
    \  V_SYS_SIMULTANEOUS:\n    rules:\n    - SYS_SIMULTANEOUS\n    scenario: Align\
    \ reset, full-queue admission/dispatch, retirement, refresh due,\n      and REF\
    \ commit in separate and combined trials.\n    expected: Specified priority and\
    \ same-edge outcomes occur with no lost request,\n      duplicate request, or\
    \ lost refresh due.\n    status: planned_not_executed\n"
- id: SYS_STORAGE_OWNERSHIP
  text: Waiting storage, active-service storage, and captured response storage are
    logically distinct capacities. Active-service storage contains one complete dispatched
    request until final READ or WRITE commit. Captured response storage contains no
    request-capacity claim and survives active release, cleanup, and refresh service.
  owners: *id061
  verification: "source: system.rules.SYS_STORAGE_OWNERSHIP\norigin: model_selected\n\
    obligations:\n  V_SYS_STORAGE_OWNERSHIP:\n    rules:\n    - SYS_STORAGE_OWNERSHIP\n\
    \    scenario: Track waiting, active, and response occupancy through dispatch,\
    \ retirement,\n      cleanup, refresh, and response delivery.\n    expected: The\
    \ three storage categories remain capacity-independent as specified.\n    status:\
    \ planned_not_executed\n"
- id: EXEC_COMMANDS
  text: Exactly one non-NOP command may commit at a rising edge. Closed-bank service
    requires ACT then READ or WRITE; matching open-row service requires READ or WRITE;
    conflicting open-row service requires PRE then ACT then READ or WRITE. PRE and
    ACT are setup commands and never retire active service. Candidate payload remains
    stable while blocked, including when refresh becomes pending.
  owners: *id062
  verification: "source: execution.rules.EXEC_COMMANDS\norigin: model_selected\nobligations:\n\
    \  V_EXEC_COMMANDS:\n    rules:\n    - EXEC_COMMANDS\n    scenario: Run closed,\
    \ hit, and conflict sequences with multi-cycle timing stalls\n      and refresh\
    \ pending transitions.\n    expected: Committed trace is ACT-access, access, or\
    \ PRE-ACT-access as applicable;\n      setup never retires and no candidate changes\
    \ while blocked.\n    status: planned_not_executed\n"
- id: EXEC_PERMISSION
  text: Candidate selection and validity are independently available before timing
    permission. Permission is computed from registered bank and timing history and
    the independent candidate. ACT acceptance equals ACT candidate and permission,
    but permission has no combinational dependency on the accepted ACT pulse or on
    same-edge committed command outputs.
  owners: *id063
  verification: "source: execution.rules.EXEC_PERMISSION\norigin: model_selected\n\
    obligations:\n  V_EXEC_PERMISSION:\n    rules:\n    - EXEC_PERMISSION\n    scenario:\
    \ Probe permission with fixed registered history while varying candidate\n   \
    \   and compare against stalled and accepted ACT behavior.\n    expected: Candidate\
    \ validity remains independently observable; permission is history-based\n   \
    \   and acceptance feedback-free.\n    status: planned_not_executed\n"
- id: EXEC_BANK_STATE
  text: Only committed ACT sets the target bank valid and row, committed PRE clears
    the target bank validity, and committed REF leaves all banks closed after required
    preparation. READ and WRITE do not alter row state. Proposals, admissions, dispatch,
    timing probes, and stalled candidates do not alter row state.
  owners: *id064
  verification: "source: execution.rules.EXEC_BANK_STATE\norigin: model_selected\n\
    obligations:\n  V_EXEC_BANK_STATE:\n    rules:\n    - EXEC_BANK_STATE\n    scenario:\
    \ Commit ACT, PRE, READ, WRITE, and REF in multiple banks and separately\n   \
    \   issue uncommitted proposals.\n    expected: Only responsible committed commands\
    \ change only permitted bank-state\n      fields.\n    status: planned_not_executed\n"
- id: EXEC_CLEANUP
  text: For PAGE_POLICY=open_page, final READ or WRITE retirement retains the serviced
    row. For PAGE_POLICY=close_page, retirement creates a separate cleanup reservation
    for the serviced bank; no new dispatch occurs until the required timing-legal
    PRE commits. Cleanup does not repeat retirement or response delivery.
  owners: *id065
  verification: "source: execution.rules.EXEC_CLEANUP\norigin: model_selected\nobligations:\n\
    \  V_EXEC_CLEANUP:\n    rules:\n    - EXEC_CLEANUP\n    scenario: Retire accesses\
    \ under both page policies and raise refresh during close-page\n      cleanup.\n\
    \    expected: Open-page retains rows; close-page reserves cleanup and blocks\
    \ dispatch\n      until PRE commits without duplicate retirement or response.\n\
    \    status: planned_not_executed\n"
- id: EXEC_RESPONSE
  text: 'At READ commit edge E, response storage captures the addressed pre-edge memory
    word and rsp_valid is asserted after E. The host samples that response at E+1.
    In the absence of replacement, rsp_valid clears after the delivery edge while
    rsp_rdata may retain its last value. A delivery and a new READ commit may share
    an edge: old response data is delivered before new response state replaces it.
    WRITE produces no response.'
  owners: *id066
  verification: "source: execution.rules.EXEC_RESPONSE\norigin: model_selected\nobligations:\n\
    \  V_EXEC_RESPONSE:\n    rules:\n    - EXEC_RESPONSE\n    scenario: Commit reads\
    \ on adjacent edges, read after writes, issue writes, and\n      reset during\
    \ a response pulse.\n    expected: Each read returns captured pre-edge data exactly\
    \ once at E+1, writes\n      return no response, and old data is delivered before\
    \ same-edge replacement.\n    status: planned_not_executed\n"
- id: EXEC_REFRESH
  text: Refresh deadlines are measured from the last sampled reset edge. The first
    due edge is E0+tREFI and later deadlines advance by tREFI independently of REF
    commit. Pending is sticky and coalesces later due edges. Once pending is visible,
    no new dispatch occurs; active service and required cleanup complete, then open
    banks PRE in ascending bank order, respecting timing. REF commits once after all
    banks are closed and all-bank tRP is satisfied. Commands are excluded at candidate
    edges strictly before REF-edge+tRFC; queued traffic remains retained and resumes
    after service when no pending refresh remains.
  owners: *id067
  verification: "source: execution.rules.EXEC_REFRESH\norigin: model_selected\nobligations:\n\
    \  V_EXEC_REFRESH:\n    rules:\n    - EXEC_REFRESH\n    scenario: Observe first\
    \ due from reset, delayed REF, coincident due/REF, multiple\n      open banks,\
    \ and post-tRFC restart.\n    expected: Deadlines do not drift, pending is sticky\
    \ and coalesced, preparation\n      ordering is ascending, REF is singular, and\
    \ exclusion ends exactly at E+tRFC.\n    status: planned_not_executed\n"
assumptions:
- 'A_CLOCK_CONTINUES: clk continues through reset and reset is sampled at at least
  one rising edge when state clearing is required.'
- 'A_HOST_STABILITY: The host holds txn_valid and all request payload fields stable
  during any cycle in which txn_valid is asserted and txn_ready is low.'
- 'A_HOST_RESPONSE_SAMPLING: The host samples every rsp_valid pulse; no response-ready
  or response-backpressure signal exists.'
- 'A_EVENTUAL_PROGRESS: Eventual completion requires future legal command opportunities
  and clock progress; no fixed host-visible latency bound is specified.'
- 'A_REFRESH_MODEL: The refresh behavior is a functional periodic pending/drain/service
  model and is not a claim of complete physical DDR4 refresh-debt behavior.'
limitations:
- Specification/IR validation does not execute behavioral obligations.
- This stage lowers supplied contracts; request-to-system-spec synthesis remains separate.
