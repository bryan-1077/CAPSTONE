    behavior:
      description: Implement the complete host_protocol contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: host_protocol
        owned_state: {}
        interfaces:
          txn_valid:
            direction: input
            type: shared.types.bit
            width: 1
          txn_is_write:
            direction: input
            type: shared.types.bit
            width: 1
          txn_addr:
            direction: input
            type: shared.types.host_address
            width: 4
          txn_wdata:
            direction: input
            type: shared.types.data
            width: 32
          txn_bank:
            direction: input
            type: shared.types.host_bank
            width: 2
          queue_ready:
            direction: input
            type: shared.types.bit
            width: 1
          probe_ready:
            direction: input
            type: shared.types.bit
            width: 1
          memory_rsp_valid:
            direction: input
            type: shared.types.bit
            width: 1
          memory_rsp_data:
            direction: input
            type: shared.types.data
            width: 32
          mapped_request:
            direction: output
            type: shared.types.request
            width: 51
          enqueue_valid:
            direction: output
            type: shared.types.bit
            width: 1
          txn_ready:
            direction: output
            type: shared.types.bit
            width: 1
          cmd_ready:
            direction: output
            type: shared.types.bit
            width: 1
          rsp_valid:
            direction: output
            type: shared.types.bit
            width: 1
          rsp_rdata:
            direction: output
            type: shared.types.data
            width: 32
        handshakes:
          admission: shared.events.admission occurs only from pre-edge txn_valid and
            txn_ready while reset is inactive. enqueue_valid represents txn_valid;
            queue_ready supplies admission backpressure.
          response: Pass the memory-owned registered response stage directly to rsp_valid
            and rsp_rdata without another response register.
          diagnostic: cmd_ready is probe_ready only. It does not affect txn_ready,
            enqueue_valid, request storage, dispatch, timing history, or reservation.
        reset: Immediately gate enqueue_valid, txn_ready, cmd_ready, and rsp_valid
          low while rst_n is low. rsp_rdata is zero while reset is asserted. This
          module owns no state.
        update_events: {}
        stalls: The mapped request is combinationally available from host payload
          fields. The host stability requirement applies while txn_valid is asserted
          and txn_ready is low.
        simultaneous_events:
          admission_and_response: Admission and response delivery are independent.
          reset_and_events: Reset wins and gates all visible handshake events.
        invariants:
        - system.rules.BASE_HOST
        - system.rules.BASE_ADDRESS
        - system.rules.BASE_RESET
        - system.rules.R1
        - system.rules.R9
        - system.rules.R10
        - system.rules.R11
        - system.rules.CONSTRAINT_1
        - system.rules.CONSTRAINT_2
        - system.rules.CONSTRAINT_8
        - system.rules.CONSTRAINT_9
        - system.rules.CONSTRAINT_10
        verification:
        - system.verification.V_BASE_HOST
        - system.verification.V_BASE_ADDRESS
        - system.verification.V_BASE_RESET
        - system.verification.V_R1
        - system.verification.V_R9
        - system.verification.V_R10
        - system.verification.V_R11
        - system.verification.V_CONSTRAINT_1
        - system.verification.V_CONSTRAINT_2
        - system.verification.V_CONSTRAINT_8
        - system.verification.V_CONSTRAINT_9
        - system.verification.V_CONSTRAINT_10
        combinational_dependencies: &id014
          mapped_request:
          - txn_bank
          - txn_addr
          - txn_is_write
          - txn_wdata
          enqueue_valid:
          - txn_valid
          txn_ready:
          - queue_ready
          cmd_ready:
          - probe_ready
          rsp_valid:
          - memory_rsp_valid
          rsp_rdata:
          - memory_rsp_data
        dependency_note: shared reset gating is implicit in every visible output.
      specification_context: &id015
        package_id: ddr4_controller_top_spec
        revision: draft_001
        package_fingerprint: d094f930480b800de15078a0db4116f987b18a011953299f8da677812232bafe
        parameters:
          DATA_WIDTH: 32
          HOST_ADDR_WIDTH: 4
          HOST_BANK_WIDTH: 2
          REQUEST_BANK_WIDTH: 2
          REQUEST_ROW_WIDTH: 10
          REQUEST_COLUMN_WIDTH: 6
          COMMAND_OPCODE_WIDTH: 3
          BANK_COUNT: 4
          WAITING_CAPACITY: 4
          ACTIVE_CAPACITY: 1
          PAGE_POLICY: open_page
          TFAW_ACT_LIMIT: 4
          READ_RESPONSE_LATENCY: 1
          MEMORY_WORDS_PER_BANK: 16
        types:
          bit:
            kind: unsigned
            width: 1
          data:
            kind: unsigned
            width: 32
          host_address:
            kind: unsigned
            width: 4
          host_bank:
            kind: unsigned
            width: 2
          bank:
            kind: unsigned
            width: 2
          row:
            kind: unsigned
            width: 10
          column:
            kind: unsigned
            width: 6
          opcode:
            kind: enum
            width: 3
            encodings:
              NOP: 0
              ACT: 1
              PRE: 2
              READ: 3
              WRITE: 4
              REF: 5
            reserved:
            - 6
            - 7
          request:
            kind: record
            packed_order: msb_to_lsb
            fields:
            - name: bank
              type: shared.types.bank
              width: 2
              msb: 50
              lsb: 49
            - name: row
              type: shared.types.row
              width: 10
              msb: 48
              lsb: 39
            - name: column
              type: shared.types.column
              width: 6
              msb: 38
              lsb: 33
            - name: is_write
              type: shared.types.bit
              width: 1
              msb: 32
              lsb: 32
            - name: wdata
              type: shared.types.data
              width: 32
              msb: 31
              lsb: 0
            width: 51
          command:
            kind: record
            packed_order: msb_to_lsb
            fields:
            - name: opcode
              type: shared.types.opcode
              width: 3
              msb: 52
              lsb: 50
            - name: bank
              type: shared.types.bank
              width: 2
              msb: 49
              lsb: 48
            - name: row
              type: shared.types.row
              width: 10
              msb: 47
              lsb: 38
            - name: column
              type: shared.types.column
              width: 6
              msb: 37
              lsb: 32
            - name: wdata
              type: shared.types.data
              width: 32
              msb: 31
              lsb: 0
            width: 53
          bank_rows:
            kind: array
            element_type: shared.types.row
            count: 4
            packed_order: ascending_index_from_lsb
            width: 40
            element_width: 10
            index_lsb: index * element_width
          bank_valid:
            kind: array
            element_type: shared.types.bit
            count: 4
            packed_order: ascending_index_from_lsb
            width: 4
            element_width: 1
            index_lsb: index * element_width
        clock_reset: &id083
          clock: clk
          edge: rising
          reset: rst_n
          active_level: 0
          priority: reset_before_all_events
          assertion_style: synchronous
          handshake_gating: Suppress all valid, ready, commit, dispatch, admission,
            response-delivery, and refresh event conditions while reset is asserted.
        events: &id084
          admission:
            condition: Pre-edge txn_valid is high, pre-edge txn_ready is high, and
              reset is inactive at the rising edge.
            effect: Capture exactly one complete mapped request into waiting storage.
          dispatch:
            condition: A previously stored FIFO head is selected, active storage is
              idle, cleanup is absent, refresh does not forbid dispatch, and reset
              is inactive at the rising edge.
            effect: Capture the complete pre-edge FIFO head into active-service storage
              and release exactly that waiting entry atomically.
          command_commit:
            condition: A non-NOP candidate is present, independently computed permission
              is true from registered history and bank state, and reset is inactive
              at the rising edge.
            effect: Commit at most one command and update only state assigned to that
              opcode.
          retirement:
            condition: shared.events.command_commit is READ or WRITE for the active
              request.
            effect: Retire exactly one active request; READ captures response state
              before active release and WRITE produces no response state.
          response_delivery:
            condition: rsp_valid is high when sampled at a rising edge and reset is
              inactive.
            effect: The host samples rsp_rdata; this event does not alter request
              capacity.
          refresh_due:
            condition: The periodic deadline is reached at a rising edge with reset
              inactive.
            effect: Set sticky refresh pending; later due events while pending or
              servicing coalesce.
          refresh_start:
            condition: shared.events.command_commit commits REF.
            effect: Acknowledge one pending refresh and begin tRFC command exclusion.
          refresh_end:
            condition: The candidate edge is at least tRFC cycles after a committed
              REF and reset is inactive.
            effect: End refresh command exclusion.
        timing_profile:
          selection: DDR4-3200
          unit: cycles
          values:
            tRCD: 22
            tRAS: 52
            tRP: 22
            tRRD: 6
            tFAW: 40
            tREFI: 12480
            tRFC: 560
        timing_rules:
          edge_convention: A trigger committed at edge E permits a blocked command
            at edge E+T, never earlier. tFAW counts earlier ACT commits whose age
            at the candidate edge is strictly less than the tFAW window. Reset creates
            invalid history and no synthetic timing delay.
          tRCD:
            trigger: ACT
            blocked:
            - READ
            - WRITE
            minimum: 22
            scope: same_bank
          tRAS:
            trigger: ACT
            blocked:
            - PRE
            minimum: 52
            scope: same_bank
          tRP:
            trigger: PRE
            blocked:
            - ACT
            - REF
            minimum: 22
            scope: same_bank_for_ACT_all_banks_for_REF
          tRRD:
            trigger: ACT
            blocked:
            - ACT
            minimum: 6
            scope: all_banks
          tFAW:
            trigger: ACT
            blocked:
            - ACT
            window: 40
            limit: 4
            scope: all_banks
          tRFC:
            trigger: REF
            blocked:
            - ACT
            - PRE
            - READ
            - WRITE
            - REF
            minimum: 560
            scope: all_banks
        system_rules: &id085
          R1:
            verification:
            - V_R1
            origin: request.R1
            statement: Implement global FIFO service in acceptance order, including
              same-address writes and reads. Admit on every rising-edge txn_valid
              && txn_ready, independently of command readiness.
            owners: &id023
            - host_protocol
          R2:
            verification:
            - V_R2
            origin: request.R2
            statement: Provide four waiting entries plus one separately stored active
              request. Dispatch only previously stored requests, capture the complete
              pre-edge head before releasing its slot, and permit full-queue simultaneous
              dispatch/admission including capacity one. No empty-queue bypass or
              same-edge active replacement at retirement.
            owners: &id024
            - waiting_queue
          R3:
            verification:
            - V_R3
            origin: request.R3
            statement: Use explicit NOP/ACT/PRE/READ/WRITE/REF command semantics,
              with NOP never committed and at most one command commit per edge. Sequence
              closed banks with ACT-access, row hits with access, and row conflicts
              with PRE-ACT-access. PRE/ACT never retire the active request. Keep blocked
              candidates stable through stalls and newly pending refresh.
            owners: &id025
            - command_engine
          R4:
            verification:
            - V_R4
            origin: request.R4
            statement: Keep separate owners for host mapping, waiting storage, scheduling,
              command sequencing, row state, timing, functional memory/responses,
              and refresh control. The top must contain structural connections only.
            owners: &id026
            - command_engine
          R5:
            verification:
            - V_R5
            origin: request.R5
            statement: Update bank state and timing history only from committed commands.
              Enforce tRCD, tRAS, tRP, tRRD, tFAW and tRFC using the selected project
              profile. A trigger at E permits the blocked command at E+T; tFAW counts
              earlier ACT commits with age strictly less than its window. Reset creates
              no synthetic timing history.
            owners: &id027
            - timing_enforcement
          R6:
            verification:
            - V_R6
            origin: request.R6
            statement: Preserve functional banked 32-bit memory and compact host address
              mapping. WRITE commit updates storage; READ commit at E captures pre-edge
              data and registers valid/data for host sampling at E+1, with no extra
              adapter response register. Responses survive active release, cleanup
              and refresh; writes produce no response.
            owners: &id028
            - memory_responses
          R7:
            verification:
            - V_R7
            origin: request.R7
            statement: Open-page retains rows. Support close-page as a configurable
              alternative, retaining a separate cleanup bank reservation after retirement
              until a legal PRE commits; block new dispatch during cleanup.
            owners: &id029
            - fifo_scheduler
          R8:
            verification:
            - V_R8
            origin: request.R8
            statement: Generate periodic refresh deadlines from the last sampled reset
              edge using tREFI. Coalesce missed deadlines into sticky pending; a due
              deadline wins over simultaneous REF acknowledgment. Drain active work
              and cleanup, PRE remaining open banks in ascending order, respect all-bank
              tRP, commit REF once, and exclude commands strictly before REF-edge+tRFC.
              Retain queued traffic and resume service afterward.
            owners: &id030
            - refresh_control
          R9:
            verification:
            - V_R9
            origin: request.R9
            statement: cmd_ready is reset-gated diagnostic readiness for the incoming
              request's first needed command, using independent row/timing probe queries
              while the engine is idle and cleanup/refresh permit. It is meaningful
              without txn_valid and must not admit, dispatch, bypass FIFO, mutate
              history or reserve storage.
            owners: &id031
            - host_protocol
          R10:
            verification:
            - V_R10
            origin: request.R10
            statement: Use synchronous active-low reset for state, with immediate
              valid/ready/event gating. Reset clears queued/active/cleanup work, row
              state, timing history, memory, responses and refresh state; it wins
              over every simultaneous event. The host holds payload while stalled
              and samples every response; no response backpressure is provided.
            owners: &id032
            - host_protocol
          R11:
            verification:
            - V_R11
            origin: request.R11
            statement: Generate architecture-specific module isolation and system
              verification intent with exact requirement IDs, independent scenarios/expected
              results, and declared port/event bindings. Export it alongside RTL for
              the external UVM/vector stage. Do not execute downstream verification
              or backend stages in this frontend flow.
            owners: &id033
            - host_protocol
          BASE_HOST:
            verification:
            - V_BASE_HOST
            origin: request.BASE_HOST
            statement: Preserve the existing host ports and widths listed in the baseline
              contract. Accept a request only on a rising clk edge with txn_valid
              && txn_ready. Hold payload while stalled. Consecutive accepted cycles
              with txn_valid held high are distinct requests. cmd_ready is execution/timing
              visibility, not the host acceptance handshake. Deassert txn_ready and
              rsp_valid during reset.
            owners: &id034
            - host_protocol
          BASE_ADDRESS:
            verification:
            - V_BASE_ADDRESS
            origin: request.BASE_ADDRESS
            statement: 'Preserve the simplified 4-bit txn_addr mapping: row=txn_addr[3:2],
              column=txn_addr[1:0], zero-extended into the internal 10-bit row and
              6-bit column fields. Preserve explicit txn_bank for multi-bank configurations;
              a single-bank configuration uses bank 0. Internal packed requests retain
              bank(2), row(10), column(6), write flag(1), write data(32).'
            owners: &id035
            - host_protocol
          BASE_QUEUE:
            verification:
            - V_BASE_QUEUE
            origin: request.BASE_QUEUE
            statement: 'Provide 4 WAITING request slots PLUS one separately stored
              active-service request: waiting plus active capacity is 5. The active
              request must not consume a waiting slot. Dispatch captures the complete
              pre-edge request in active registers and frees its waiting slot without
              retiring the transaction. A full queue may admit on the same edge as
              dispatch; retirement alone does not free waiting storage. Accepted request
              fields survive stalls and each accepted request is serviced exactly
              once within a reset-free epoch. Keep admission, dispatch, retirement
              and read response delivery distinct. Captured response storage consumes
              neither waiting nor active capacity.'
            owners: &id036
            - waiting_queue
          BASE_DATA:
            verification:
            - V_BASE_DATA
            origin: request.BASE_DATA
            statement: Provide functional 32-bit memory storage with 16 addresses
              per bank, bank isolation and reset-to-zero contents. Accepted writes
              update only their addressed location at service completion or a committed
              WRITE. Each accepted read produces exactly one one-cycle rsp_valid pulse
              with the stored rsp_rdata after read service/READ commit, using the
              existing one-cycle response stage. Writes produce no host response.
              Selection and stalled candidates cannot mutate memory; mere command
              output without storage and read responses is insufficient.
            owners: &id037
            - memory_responses
          BASE_TIMING:
            verification:
            - V_BASE_TIMING
            origin: request.BASE_TIMING
            statement: Retain existing tRCD, tRAS and tRP timing protection from the
              selected JEDEC profile. ACT-to-READ/WRITE must wait tRCD, ACT-to-PRE
              must respect tRAS, and PRE-to-next-ACT must respect tRP if explicit
              commands are used. Aggregate service may retain the existing protected
              timing envelope instead. Configured tRRD and tFAW gates must use accepted
              activation events, not host admissions or stalled proposals. Never treat
              existing basic timing as an unrequested future feature.
            owners: &id038
            - timing_enforcement
          BASE_SEQUENCE:
            verification:
            - V_BASE_SEQUENCE
            origin: request.BASE_SEQUENCE
            statement: Dispatch captures the complete selected request in separate
              active-service registers before freeing its waiting queue slot. Hold
              that active request and payload across setup PRE/ACT and timing stalls
              until its final READ/WRITE commits. Setup commands never retire the
              active request. Aggregate service also keeps active-service ownership
              through completion. Waiting-queue dequeue at dispatch is distinct from
              active-request retirement. Row state changes only on the responsible
              committed operation; uncommitted proposals cannot change state.
            owners: &id039
            - command_engine
          BASE_MODULARITY:
            verification:
            - V_BASE_MODULARITY
            origin: request.BASE_MODULARITY
            statement: Keep request storage, request selection, command sequencing,
              timing enforcement and functional memory in independently verifiable
              modules with explicit interfaces. No single controller core may own
              all these functions. Each mandatory role has distinct module owners
              with functional inter-module connections. Module names and further decomposition
              remain design choices.
            owners: &id040
            - command_engine
          BASE_LEGALITY:
            verification:
            - V_BASE_LEGALITY
            origin: request.BASE_LEGALITY
            statement: Compute command permission from registered timing/bank history
              and an independent candidate. An accepted ACT pulse is derived from
              candidate && permission; permission must not combinationally depend
              on that same accepted pulse. Scheduler selection/validity must be available
              independently of timing_ok; timing_ok may gate commit but must not create
              a selection-validity feedback loop. Declare accurate per-output combinational
              input dependencies.
            owners: &id041
            - timing_enforcement
          BASE_RESET:
            verification:
            - V_BASE_RESET
            origin: request.BASE_RESET
            statement: Use top-level clk and active-low rst_n. Reset clears pending
              requests, active service, row validity, memory and responses. Preserve
              reusable blocks with either synchronous or asynchronous active-low resets
              driven by the same rst_n; differing assertion styles do not require
              rebuilding otherwise reusable blocks. Do not change polarity without
              an explicit adapter.
            owners: &id042
            - host_protocol
          BASE_POLICY:
            verification:
            - V_BASE_POLICY
            origin: request.BASE_POLICY
            statement: Honor the requested scheduler policy fifo. Preserve page policy
              open_page. Open-page retains a serviced row; close-page closes it before
              subsequent bank use. Preserve request ownership through any setup sequence.
              Internal module decomposition and command latency may change while these
              observable contracts hold.
            owners: &id043
            - fifo_scheduler
          BASE_REFRESH:
            verification:
            - V_BASE_REFRESH
            origin: request.BASE_REFRESH
            statement: Retain periodic refresh requests using profile tREFI, refresh
              priority and request/acknowledgment handling without dropping queued
              traffic. Refresh must make progress and normal requests must resume.
              Existing refresh is simplified; full REF/tRFC servicing remains later
              feature work. If explicit REF is proposed, describe drain/row-state
              interaction and acknowledge once at commit.
            owners: &id044
            - refresh_control
          BASE_TRRD:
            verification:
            - V_BASE_TRRD
            origin: request.BASE_TRRD
            statement: tRRD is enabled; honor that setting and resolve enabled timing
              values from DDR4-3200.
            owners: &id045
            - timing_enforcement
          BASE_TFAW:
            verification:
            - V_BASE_TFAW
            origin: request.BASE_TFAW
            statement: tFAW is enabled; honor that setting and resolve enabled timing
              values from DDR4-3200.
            owners: &id046
            - timing_enforcement
          CONSTRAINT_1:
            verification:
            - V_CONSTRAINT_1
            origin: request.CONSTRAINT_1
            statement: Requested constraint /design_name = "ddr4_controller_top".
            owners: &id047
            - host_protocol
          CONSTRAINT_2:
            verification:
            - V_CONSTRAINT_2
            origin: request.CONSTRAINT_2
            statement: Requested constraint /design_type = "memory_controller".
            owners: &id048
            - host_protocol
          CONSTRAINT_3:
            verification:
            - V_CONSTRAINT_3
            origin: request.CONSTRAINT_3
            statement: Requested constraint /features/page_policy = "open_page".
            owners: &id049
            - fifo_scheduler
          CONSTRAINT_4:
            verification:
            - V_CONSTRAINT_4
            origin: request.CONSTRAINT_4
            statement: Requested constraint /features/refresh = true.
            owners: &id050
            - refresh_control
          CONSTRAINT_5:
            verification:
            - V_CONSTRAINT_5
            origin: request.CONSTRAINT_5
            statement: Requested constraint /features/scheduler = "fifo".
            owners: &id051
            - fifo_scheduler
          CONSTRAINT_6:
            verification:
            - V_CONSTRAINT_6
            origin: request.CONSTRAINT_6
            statement: Requested constraint /features/tFAW = true.
            owners: &id052
            - timing_enforcement
          CONSTRAINT_7:
            verification:
            - V_CONSTRAINT_7
            origin: request.CONSTRAINT_7
            statement: Requested constraint /features/tRRD = true.
            owners: &id053
            - timing_enforcement
          CONSTRAINT_8:
            verification:
            - V_CONSTRAINT_8
            origin: request.CONSTRAINT_8
            statement: Requested constraint /memory/protocol = "DDR4".
            owners: &id054
            - host_protocol
          CONSTRAINT_9:
            verification:
            - V_CONSTRAINT_9
            origin: request.CONSTRAINT_9
            statement: Requested constraint /memory/speed = "3200".
            owners: &id055
            - host_protocol
          CONSTRAINT_10:
            verification:
            - V_CONSTRAINT_10
            origin: request.CONSTRAINT_10
            statement: Requested constraint /microarchitecture/baseline = "current_controller".
            owners: &id056
            - host_protocol
          CONSTRAINT_11:
            verification:
            - V_CONSTRAINT_11
            origin: request.CONSTRAINT_11
            statement: Requested constraint /microarchitecture/waiting_capacity =
              4.
            owners: &id057
            - waiting_queue
          CONSTRAINT_12:
            verification:
            - V_CONSTRAINT_12
            origin: request.CONSTRAINT_12
            statement: Requested constraint /topology/banks = 4.
            owners: &id058
            - bank_state
          SYS_ORDERING:
            origin: model_selected
            statement: Acceptance order defines global FIFO order. Dispatch transfers
              only the oldest previously stored request. Physical row state, legality,
              cleanup, refresh, and timing may delay service but may not select a
              younger request ahead of the oldest waiting request.
            verification:
            - V_SYS_ORDERING
            owners: &id059
            - fifo_scheduler
          SYS_SIMULTANEOUS:
            origin: model_selected
            statement: At a reset edge, reset wins over admission, dispatch, command
              commit, retirement, response delivery, refresh due, and refresh acknowledgment.
              Without reset, a full waiting queue may admit and dispatch on the same
              edge using the pre-edge head and pre-edge incoming payload. Retirement
              does not authorize dispatch on its own edge. A refresh due coincident
              with REF commit leaves refresh pending set for a later service interval.
            verification:
            - V_SYS_SIMULTANEOUS
            owners: &id060
            - waiting_queue
          SYS_STORAGE_OWNERSHIP:
            origin: model_selected
            statement: Waiting storage, active-service storage, and captured response
              storage are logically distinct capacities. Active-service storage contains
              one complete dispatched request until final READ or WRITE commit. Captured
              response storage contains no request-capacity claim and survives active
              release, cleanup, and refresh service.
            verification:
            - V_SYS_STORAGE_OWNERSHIP
            owners: &id061
            - waiting_queue
        execution_rules: &id125
          EXEC_COMMANDS:
            origin: model_selected
            statement: Exactly one non-NOP command may commit at a rising edge. Closed-bank
              service requires ACT then READ or WRITE; matching open-row service requires
              READ or WRITE; conflicting open-row service requires PRE then ACT then
              READ or WRITE. PRE and ACT are setup commands and never retire active
              service. Candidate payload remains stable while blocked, including when
              refresh becomes pending.
            verification:
            - V_EXEC_COMMANDS
            owners: &id062
            - command_engine
          EXEC_PERMISSION:
            origin: model_selected
            statement: Candidate selection and validity are independently available
              before timing permission. Permission is computed from registered bank
              and timing history and the independent candidate. ACT acceptance equals
              ACT candidate and permission, but permission has no combinational dependency
              on the accepted ACT pulse or on same-edge committed command outputs.
            verification:
            - V_EXEC_PERMISSION
            owners: &id063
            - timing_enforcement
          EXEC_BANK_STATE:
            origin: model_selected
            statement: Only committed ACT sets the target bank valid and row, committed
              PRE clears the target bank validity, and committed REF leaves all banks
              closed after required preparation. READ and WRITE do not alter row state.
              Proposals, admissions, dispatch, timing probes, and stalled candidates
              do not alter row state.
            verification:
            - V_EXEC_BANK_STATE
            owners: &id064
            - bank_state
          EXEC_CLEANUP:
            origin: model_selected
            statement: For PAGE_POLICY=open_page, final READ or WRITE retirement retains
              the serviced row. For PAGE_POLICY=close_page, retirement creates a separate
              cleanup reservation for the serviced bank; no new dispatch occurs until
              the required timing-legal PRE commits. Cleanup does not repeat retirement
              or response delivery.
            verification:
            - V_EXEC_CLEANUP
            owners: &id065
            - command_engine
          EXEC_RESPONSE:
            origin: model_selected
            statement: 'At READ commit edge E, response storage captures the addressed
              pre-edge memory word and rsp_valid is asserted after E. The host samples
              that response at E+1. In the absence of replacement, rsp_valid clears
              after the delivery edge while rsp_rdata may retain its last value. A
              delivery and a new READ commit may share an edge: old response data
              is delivered before new response state replaces it. WRITE produces no
              response.'
            verification:
            - V_EXEC_RESPONSE
            owners: &id066
            - memory_responses
          EXEC_REFRESH:
            origin: model_selected
            statement: Refresh deadlines are measured from the last sampled reset
              edge. The first due edge is E0+tREFI and later deadlines advance by
              tREFI independently of REF commit. Pending is sticky and coalesces later
              due edges. Once pending is visible, no new dispatch occurs; active service
              and required cleanup complete, then open banks PRE in ascending bank
              order, respecting timing. REF commits once after all banks are closed
              and all-bank tRP is satisfied. Commands are excluded at candidate edges
              strictly before REF-edge+tRFC; queued traffic remains retained and resumes
              after service when no pending refresh remains.
            verification:
            - V_EXEC_REFRESH
            owners: &id067
            - refresh_control
