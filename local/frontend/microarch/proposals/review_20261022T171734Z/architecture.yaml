                - open_rows
            memory_responses:
              status: draft
              role: functional_memory_and_responses
              owned_state:
                words: Four isolated banks of sixteen 32-bit words.
                response: One registered response valid/data stage separate from waiting
                  and active capacity.
              interfaces:
                commit_valid:
                  direction: input
                  type: shared.types.bit
                commit_command:
                  direction: input
                  type: shared.types.command
                rsp_valid:
                  direction: output
                  type: shared.types.bit
                rsp_data:
                  direction: output
                  type: shared.types.data
              handshakes:
                commit: Observe broadcast shared.events.command_commit. Only committed
                  WRITE mutates storage; only committed READ captures response state.
                response: shared.events.response_delivery samples the registered response.
                  No response-ready or response backpressure exists.
              reset: Synchronously zero all words, response validity, and response
                data. Immediately gate rsp_valid low during reset.
              update_events:
                shared.events.command_commit: WRITE updates exactly its addressed
                  bank and compact address. READ captures the addressed pre-edge word
                  into response storage. Other commands do not mutate memory or response
                  state.
                shared.events.response_delivery: Clear response valid unless a simultaneous
                  committed READ replaces response state after old response delivery.
              stalls: Candidates, probes, selection, and noncommitted commands cannot
                mutate storage. Captured response state survives active release, cleanup,
                and refresh.
              simultaneous_events:
                response_delivery_and_READ: Deliver old response data, then capture
                  the new pre-edge read word for the next edge.
                response_delivery_and_WRITE: Deliver old response independently; WRITE
                  creates no response.
                reset_and_events: Reset wins.
              invariants:
              - system.rules.BASE_DATA
              - system.rules.R6
              - execution.rules.EXEC_RESPONSE
              verification:
              - system.verification.V_BASE_DATA
              - system.verification.V_R6
              - execution.verification.V_EXEC_RESPONSE
              combinational_dependencies:
                rsp_valid: []
                rsp_data: []
            refresh_control:
              status: draft
              role: refresh_control
              owned_state:
                deadline: Periodic deadline measured from the last sampled reset edge.
                pending: Sticky coalesced refresh request.
                service: Registered REF service exclusion state through tRFC.
              interfaces:
                commit_valid:
                  direction: input
                  type: shared.types.bit
                commit_command:
                  direction: input
                  type: shared.types.command
                refresh_pending:
                  direction: output
                  type: shared.types.bit
                refresh_busy:
                  direction: output
                  type: shared.types.bit
              handshakes:
                request: shared.events.refresh_due sets sticky pending and advances
                  the deadline by tREFI independently of REF commit.
                acknowledgment: shared.events.refresh_start, a committed REF, is the
                  sole acknowledgment and starts tRFC service exclusion.
              reset: Synchronously clear pending, service, and deadline state; rebase
                the first deadline at the sampled reset edge. Immediately gate outputs
                low during reset.
              update_events:
                shared.events.refresh_due: Set pending and advance periodic deadline.
                  A due event while pending or servicing coalesces.
                shared.events.refresh_start: Clear pending unless refresh_due also
                  occurs at the edge; start service exclusion.
                shared.events.refresh_end: End service exclusion while retaining any
                  independently pending refresh.
              stalls: Pending persists through active work, cleanup, timing stalls,
                and service. This module owns no waiting request storage.
              simultaneous_events:
                due_and_REF: Due wins pending update; REF starts service and one later
                  refresh remains pending.
                due_and_service_end: Service may end but pending remains set.
                reset_and_events: Reset wins.
              invariants:
              - system.rules.BASE_REFRESH
              - system.rules.R8
              - system.rules.CONSTRAINT_4
              - execution.rules.EXEC_REFRESH
              verification:
              - system.verification.V_BASE_REFRESH
              - system.verification.V_R8
              - system.verification.V_CONSTRAINT_4
              - execution.verification.V_EXEC_REFRESH
              combinational_dependencies:
                refresh_pending: []
                refresh_busy: []
