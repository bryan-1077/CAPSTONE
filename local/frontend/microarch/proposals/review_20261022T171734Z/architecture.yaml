    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: dispatch_valid
      direction: input
      width: 1
      description: shared.types.bit
    - name: dispatch_request
      direction: input
      width: 51
      description: shared.types.request
    - name: candidate_ok
