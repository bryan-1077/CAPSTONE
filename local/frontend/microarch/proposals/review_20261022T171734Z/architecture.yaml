      direction: input
      width: 40
      description: shared.types.bank_rows
    - name: refresh_pending
      direction: input
      width: 1
      description: shared.types.bit
    - name: refresh_busy
      direction: input
      width: 1
      description: shared.types.bit
    - name: incoming_request
      direction: input
      width: 51
      description: shared.types.request
    - name: dispatch_ready
      direction: output
      width: 1
      description: shared.types.bit
    - name: candidate_valid
      direction: output
      width: 1
      description: shared.types.bit
    - name: candidate_command
      direction: output
      width: 53
      description: shared.types.command
    - name: commit_valid
      direction: output
      width: 1
      description: shared.types.bit
    - name: commit_command
      direction: output
      width: 53
      description: shared.types.command
    - name: probe_valid
      direction: output
      width: 1
      description: shared.types.bit
    - name: probe_command
      direction: output
      width: 53
      description: shared.types.command
    - name: probe_ready
      direction: output
      width: 1
      description: shared.types.bit
    behavior:
      description: Implement the complete command_engine contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: command_sequencing
        owned_state:
          active_request: One complete dispatched shared.types.request retained until
            committed READ or WRITE.
          active_valid: Registered active-service ownership.
          candidate: Registered non-NOP command proposal and validity held unchanged
            while permission is false.
          cleanup: Optional close-page cleanup bank reservation retained after retirement
            until committed PRE.
          refresh_preparation: Registered ascending-bank preparation cursor and phase;
            it is distinct from refresh pending/service state.
        interfaces:
          dispatch_valid:
            direction: input
            type: shared.types.bit
            width: 1
          dispatch_request:
            direction: input
            type: shared.types.request
            width: 51
          candidate_ok:
            direction: input
            type: shared.types.bit
            width: 1
          probe_ok:
            direction: input
            type: shared.types.bit
            width: 1
          open_valid:
            direction: input
            type: shared.types.bank_valid
            width: 4
          open_rows:
            direction: input
            type: shared.types.bank_rows
            width: 40
          refresh_pending:
            direction: input
            type: shared.types.bit
            width: 1
          refresh_busy:
            direction: input
            type: shared.types.bit
            width: 1
          incoming_request:
            direction: input
            type: shared.types.request
            width: 51
          dispatch_ready:
            direction: output
            type: shared.types.bit
            width: 1
          candidate_valid:
            direction: output
            type: shared.types.bit
            width: 1
          candidate_command:
            direction: output
            type: shared.types.command
            width: 53
          commit_valid:
            direction: output
            type: shared.types.bit
            width: 1
          commit_command:
            direction: output
            type: shared.types.command
            width: 53
          probe_valid:
            direction: output
            type: shared.types.bit
            width: 1
          probe_command:
            direction: output
            type: shared.types.command
            width: 53
          probe_ready:
            direction: output
            type: shared.types.bit
            width: 1
        handshakes:
          dispatch: shared.events.dispatch captures the complete pre-edge dispatch_request
            before queue storage is released. Timing permission never gates dispatch.
          commit: shared.events.command_commit is candidate_valid and candidate_ok.
            commit_valid is never asserted for NOP.
          probe: Probe independently derives the incoming request first needed command
            while idle and permitted by cleanup/refresh state. It has no state-changing
            effect.
        reset: Synchronously clear active, candidate, cleanup, and preparation ownership.
          Immediately gate dispatch_ready, candidate_valid, commit_valid, probe_valid,
          and probe_ready low. Invalid command outputs are canonical NOP.
        update_events:
          shared.events.dispatch: Capture the complete pre-edge head into active storage
            and defer first candidate formation until a later edge.
          shared.events.command_commit: Committed PRE or ACT advances setup only.
            Committed READ or WRITE retires active ownership; close_page creates cleanup
            ownership and open_page retains row ownership. Committed REF completes
            refresh preparation.
          every_clock: When no blocked candidate exists, form a candidate from registered
            active, cleanup, or refresh-preparation ownership. Once refresh_pending
            is visible, prevent new dispatch, drain active and cleanup, precharge
            open banks in ascending order, then propose REF. No dispatch occurs while
            refresh_busy is high.
        stalls: A valid candidate and complete active payload remain unchanged while
          candidate_ok is low, including when refresh_pending becomes visible. New
          candidate formation occurs only after a prior candidate commits.
        simultaneous_events:
          refresh_due_and_final_access: The final access may commit; newly visible
            pending blocks subsequent dispatch and preparation begins later.
          refresh_due_and_REF: REF acknowledgment does not erase simultaneous due;
            refresh control retains pending.
          retirement_and_dispatch: dispatch_ready is low when active ownership exists
            before the edge; retirement cannot cause same-edge replacement.
          reset_and_events: Reset wins.
        invariants:
        - system.rules.BASE_SEQUENCE
        - system.rules.BASE_MODULARITY
        - system.rules.R3
        - system.rules.R4
        - execution.rules.EXEC_COMMANDS
        - execution.rules.EXEC_CLEANUP
        verification:
        - system.verification.V_BASE_SEQUENCE
        - system.verification.V_BASE_MODULARITY
        - system.verification.V_R3
        - system.verification.V_R4
        - execution.verification.V_EXEC_COMMANDS
        - execution.verification.V_EXEC_CLEANUP
        combinational_dependencies: &id018
          dispatch_ready:
          - refresh_pending
          - refresh_busy
          candidate_valid: []
          candidate_command: []
          commit_valid:
          - candidate_ok
          commit_command: []
          probe_valid:
          - incoming_request
          - open_valid
          - open_rows
          - refresh_pending
          - refresh_busy
          probe_command:
          - incoming_request
          - open_valid
          - open_rows
          probe_ready:
          - probe_ok
          - refresh_pending
          - refresh_busy
      specification_context: *id015
      active_ports:
      - candidate_command
      - candidate_ok
      - candidate_valid
      - commit_command
      - commit_valid
      - dispatch_ready
      - dispatch_request
      - dispatch_valid
      - incoming_request
      - open_rows
      - open_valid
      - probe_command
      - probe_ok
      - probe_ready
      - probe_valid
      - refresh_busy
      - refresh_pending
      verification_obligations:
        system.verification.V_BASE_SEQUENCE: &id102
          rules:
          - BASE_SEQUENCE
          scenario: Dispatch a complete request, change host inputs afterward, and
            stall each setup and final command.
          expected: Captured active payload survives until final commit; dispatch/dequeue
            and retirement remain distinct; only committed operations change row state.
          status: planned_not_executed
        system.verification.V_BASE_MODULARITY: &id103
          rules:
          - BASE_MODULARITY
          scenario: Review future decomposition contracts and declared functional
            interfaces.
          expected: Request storage, selection, sequencing, timing, and functional
            memory are independently verifiable and distinct.
          status: planned_not_executed
        system.verification.V_R3: &id088
          rules:
          - R3
          scenario: Service closed-bank, row-hit, and row-conflict reads and writes
            while timing-blocking each candidate and raising refresh pending.
          expected: Only NOP, ACT, PRE, READ, WRITE, and REF semantics are used; one
            command at most commits per edge; setup does not retire; blocked candidates
            remain stable.
          status: planned_not_executed
        system.verification.V_R4: &id089
          rules:
          - R4
          scenario: Inspect future architecture contracts and interface-level verification
            intent.
          expected: Required behavioral roles are independently contractable with
            structural top-level integration only; no single owner contract contains
            all required functions.
          status: planned_not_executed
        execution.verification.V_EXEC_COMMANDS: &id126
          rules:
          - EXEC_COMMANDS
          scenario: Run closed, hit, and conflict sequences with multi-cycle timing
            stalls and refresh pending transitions.
          expected: Committed trace is ACT-access, access, or PRE-ACT-access as applicable;
            setup never retires and no candidate changes while blocked.
          status: planned_not_executed
        execution.verification.V_EXEC_CLEANUP: &id129
          rules:
          - EXEC_CLEANUP
          scenario: Retire accesses under both page policies and raise refresh during
            close-page cleanup.
          expected: Open-page retains rows; close-page reserves cleanup and blocks
            dispatch until PRE commits without duplicate retirement or response.
          status: planned_not_executed
    invariants:
    - 'system.rules.BASE_SEQUENCE: Dispatch captures the complete selected request
      in separate active-service registers before freeing its waiting queue slot.
      Hold that active request and payload across setup PRE/ACT and timing stalls
      until its final READ/WRITE commits. Setup commands never retire the active request.
      Aggregate service also keeps active-service ownership through completion. Waiting-queue
      dequeue at dispatch is distinct from active-request retirement. Row state changes
      only on the responsible committed operation; uncommitted proposals cannot change
      state.'
    - 'system.rules.BASE_MODULARITY: Keep request storage, request selection, command
      sequencing, timing enforcement and functional memory in independently verifiable
      modules with explicit interfaces. No single controller core may own all these
      functions. Each mandatory role has distinct module owners with functional inter-module
      connections. Module names and further decomposition remain design choices.'
    - 'system.rules.R3: Use explicit NOP/ACT/PRE/READ/WRITE/REF command semantics,
      with NOP never committed and at most one command commit per edge. Sequence closed
      banks with ACT-access, row hits with access, and row conflicts with PRE-ACT-access.
      PRE/ACT never retire the active request. Keep blocked candidates stable through
      stalls and newly pending refresh.'
    - 'system.rules.R4: Keep separate owners for host mapping, waiting storage, scheduling,
      command sequencing, row state, timing, functional memory/responses, and refresh
      control. The top must contain structural connections only.'
    - 'execution.rules.EXEC_COMMANDS: Exactly one non-NOP command may commit at a
      rising edge. Closed-bank service requires ACT then READ or WRITE; matching open-row
      service requires READ or WRITE; conflicting open-row service requires PRE then
      ACT then READ or WRITE. PRE and ACT are setup commands and never retire active
      service. Candidate payload remains stable while blocked, including when refresh
      becomes pending.'
    - 'execution.rules.EXEC_CLEANUP: For PAGE_POLICY=open_page, final READ or WRITE
      retirement retains the serviced row. For PAGE_POLICY=close_page, retirement
      creates a separate cleanup reservation for the serviced bank; no new dispatch
      occurs until the required timing-legal PRE commits. Cleanup does not repeat
      retirement or response delivery.'
