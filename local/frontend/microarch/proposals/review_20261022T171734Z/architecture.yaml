    behavior:
      description: Implement the complete fifo_scheduler contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: request_selection
        owned_state: {}
        interfaces:
          head_valid:
            direction: input
            type: shared.types.bit
            width: 1
          head_request:
            direction: input
            type: shared.types.request
            width: 51
          dispatch_ready:
            direction: input
            type: shared.types.bit
            width: 1
          dispatch_valid:
