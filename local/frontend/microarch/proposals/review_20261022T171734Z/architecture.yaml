- instance: waiting_queue
  roles:
  - request_queue
  responsibility: request_storage
  spec:
    design_name: ddr4_controller_top_spec_waiting_queue
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: enqueue_request
      direction: input
      width: 51
      description: shared.types.request
    - name: enqueue_valid
      direction: input
      width: 1
      description: shared.types.bit
    - name: head_take
      direction: input
      width: 1
      description: shared.types.bit
    - name: enqueue_ready
      direction: output
      width: 1
      description: shared.types.bit
    - name: head_valid
      direction: output
      width: 1
      description: shared.types.bit
    - name: head_request
      direction: output
      width: 51
      description: shared.types.request
    behavior:
      description: Implement the complete waiting_queue contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: request_storage
        owned_state:
          entries: FIFO-ordered shared.types.request entries, with configurable capacity
            shared.parameters.WAITING_CAPACITY.
          occupancy: Registered count of waiting entries only; active and response
            storage are excluded.
        interfaces:
          enqueue_request:
            direction: input
            type: shared.types.request
            width: 51
          enqueue_valid:
            direction: input
            type: shared.types.bit
            width: 1
          head_take:
            direction: input
            type: shared.types.bit
            width: 1
          enqueue_ready:
            direction: output
            type: shared.types.bit
            width: 1
          head_valid:
            direction: output
            type: shared.types.bit
            width: 1
          head_request:
            direction: output
            type: shared.types.request
            width: 51
        handshakes:
          admission: Accept enqueue_request only on shared.events.admission.
          dispatch: Remove only the pre-edge head on shared.events.dispatch; head_take
            alone is not an event.
          readiness: enqueue_ready is true when pre-edge occupancy is below capacity
            or a valid pre-edge head dispatches on this edge.
        reset: Synchronously clear all waiting entries and occupancy; immediately
          gate enqueue_ready and head_valid low during reset. Invalid head_request
          is canonical zero.
        update_events:
          shared.events.admission: Append the complete pre-edge enqueue_request after
            all older waiting entries.
          shared.events.dispatch: Capture and remove only the pre-edge FIFO head.
            Simultaneous admission appends after that old head is removed.
        stalls: Stored entries and head_request remain stable until dispatch or reset.
          A tail admission cannot change a stalled head.
        simultaneous_events:
          full_enqueue_and_dispatch: The pre-edge head is removed and the incoming
            request becomes the newest entry; occupancy is unchanged, including capacity
            one.
          retirement_and_enqueue: Retirement does not change waiting occupancy or
            readiness.
          reset_and_events: Reset wins.
        invariants:
        - system.rules.BASE_QUEUE
        - system.rules.R2
        - system.rules.CONSTRAINT_11
        - system.rules.SYS_SIMULTANEOUS
        - system.rules.SYS_STORAGE_OWNERSHIP
        verification:
        - system.verification.V_BASE_QUEUE
        - system.verification.V_R2
        - system.verification.V_CONSTRAINT_11
        - system.verification.V_SYS_SIMULTANEOUS
        - system.verification.V_SYS_STORAGE_OWNERSHIP
        combinational_dependencies: &id016
          enqueue_ready:
          - head_take
          head_valid: []
          head_request: []
      specification_context: *id015
      active_ports:
      - enqueue_ready
      - enqueue_request
      - enqueue_valid
      - head_request
      - head_take
      - head_valid
      verification_obligations:
        system.verification.V_BASE_QUEUE: &id099
          rules:
          - BASE_QUEUE
          scenario: Fill waiting storage while one active request stalls, then perform
            dispatch/admission, retirement, and read response delivery independently.
          expected: Four waiting plus one active request are retained; dispatch frees
            waiting storage but not transaction ownership; response storage consumes
            neither capacity.
          status: planned_not_executed
        system.verification.V_R2: &id087
          rules:
          - R2
          scenario: Exercise empty, partial, and full waiting storage, including capacity
            one and simultaneous dispatch/admission.
          expected: Only pre-edge stored entries dispatch; the pre-edge head is captured
            before release; no bypass or retirement-edge active replacement occurs.
          status: planned_not_executed
        system.verification.V_CONSTRAINT_11: &id120
          rules:
          - CONSTRAINT_11
          scenario: Fill waiting storage under the selected configuration.
          expected: WAITING_CAPACITY is four.
          status: planned_not_executed
        system.verification.V_SYS_SIMULTANEOUS: &id123
          rules:
          - SYS_SIMULTANEOUS
          scenario: Align reset, full-queue admission/dispatch, retirement, refresh
            due, and REF commit in separate and combined trials.
          expected: Specified priority and same-edge outcomes occur with no lost request,
            duplicate request, or lost refresh due.
          status: planned_not_executed
        system.verification.V_SYS_STORAGE_OWNERSHIP: &id124
          rules:
          - SYS_STORAGE_OWNERSHIP
          scenario: Track waiting, active, and response occupancy through dispatch,
            retirement, cleanup, refresh, and response delivery.
          expected: The three storage categories remain capacity-independent as specified.
          status: planned_not_executed
    invariants:
    - 'system.rules.BASE_QUEUE: Provide 4 WAITING request slots PLUS one separately
      stored active-service request: waiting plus active capacity is 5. The active
      request must not consume a waiting slot. Dispatch captures the complete pre-edge
      request in active registers and frees its waiting slot without retiring the
      transaction. A full queue may admit on the same edge as dispatch; retirement
      alone does not free waiting storage. Accepted request fields survive stalls
      and each accepted request is serviced exactly once within a reset-free epoch.
      Keep admission, dispatch, retirement and read response delivery distinct. Captured
      response storage consumes neither waiting nor active capacity.'
    - 'system.rules.R2: Provide four waiting entries plus one separately stored active
      request. Dispatch only previously stored requests, capture the complete pre-edge
      head before releasing its slot, and permit full-queue simultaneous dispatch/admission
      including capacity one. No empty-queue bypass or same-edge active replacement
      at retirement.'
    - 'system.rules.CONSTRAINT_11: Requested constraint /microarchitecture/waiting_capacity
      = 4.'
    - 'system.rules.SYS_SIMULTANEOUS: At a reset edge, reset wins over admission,
      dispatch, command commit, retirement, response delivery, refresh due, and refresh
      acknowledgment. Without reset, a full waiting queue may admit and dispatch on
      the same edge using the pre-edge head and pre-edge incoming payload. Retirement
      does not authorize dispatch on its own edge. A refresh due coincident with REF
      commit leaves refresh pending set for a later service interval.'
    - 'system.rules.SYS_STORAGE_OWNERSHIP: Waiting storage, active-service storage,
      and captured response storage are logically distinct capacities. Active-service
      storage contains one complete dispatched request until final READ or WRITE commit.
      Captured response storage contains no request-capacity claim and survives active
      release, cleanup, and refresh service.'
    implementation_constraints:
    - Use the exact elaborated port widths and packed field offsets; no additional
      public ports.
    - Honor every contract handshake, reset, update event, stall and simultaneous-event
      rule.
    - Do not transfer owned state or responsibilities into another module or top-level
      wiring.
    - Implement the declared combinational dependencies accurately; internal registers
      and helper logic remain implementation choices.
    - Parameter values and timing values in specification_context are concrete for
      this build; do not substitute legacy defaults.
    - A conditionally omitted input has no signal in this build; apply its specified
      absent-port behavior.
    combinational_dependencies: *id016
