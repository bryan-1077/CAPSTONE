  owners: *id048
  verification: "source: system.rules.CONSTRAINT_2\norigin: request.CONSTRAINT_2\n\
    obligations:\n  V_CONSTRAINT_2:\n    rules:\n    - CONSTRAINT_2\n    scenario:\
    \ Inspect package metadata.\n    expected: Design type is memory_controller.\n\
    \    status: planned_not_executed\n"
- id: CONSTRAINT_3
  text: Requested constraint /features/page_policy = "open_page".
  owners: *id049
