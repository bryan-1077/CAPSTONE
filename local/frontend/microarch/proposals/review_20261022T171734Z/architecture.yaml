- instance: timing_enforcement
  roles:
  - timing
  responsibility: timing_enforcement
  spec:
    design_name: ddr4_controller_top_spec_timing_enforcement
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: candidate_valid
      direction: input
      width: 1
      description: shared.types.bit
    - name: candidate_command
      direction: input
      width: 53
      description: shared.types.command
    - name: probe_valid
      direction: input
      width: 1
      description: shared.types.bit
    - name: probe_command
      direction: input
      width: 53
      description: shared.types.command
    - name: open_valid
      direction: input
      width: 4
      description: shared.types.bank_valid
    - name: open_rows
      direction: input
      width: 40
      description: shared.types.bank_rows
    - name: commit_valid
      direction: input
      width: 1
      description: shared.types.bit
    - name: commit_command
      direction: input
      width: 53
      description: shared.types.command
    - name: candidate_ok
      direction: output
      width: 1
      description: shared.types.bit
    - name: probe_ok
      direction: output
      width: 1
      description: shared.types.bit
    behavior:
      description: Implement the complete timing_enforcement contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: timing_enforcement
        owned_state:
          bank_history: Registered ACT and PRE histories per bank.
          global_history: Registered ACT spacing history, up to four unexpired ACT
            timestamps for tFAW, and REF exclusion history.
        interfaces:
          candidate_valid:
            direction: input
            type: shared.types.bit
            width: 1
          candidate_command:
            direction: input
            type: shared.types.command
            width: 53
          probe_valid:
            direction: input
            type: shared.types.bit
            width: 1
          probe_command:
            direction: input
            type: shared.types.command
            width: 53
          open_valid:
            direction: input
            type: shared.types.bank_valid
            width: 4
          open_rows:
            direction: input
            type: shared.types.bank_rows
            width: 40
          commit_valid:
            direction: input
            type: shared.types.bit
            width: 1
          commit_command:
            direction: input
            type: shared.types.command
            width: 53
          candidate_ok:
            direction: output
            type: shared.types.bit
            width: 1
          probe_ok:
            direction: output
            type: shared.types.bit
            width: 1
        handshakes:
          permission: Evaluate candidate and probe independently from registered history,
            registered row state, and query command. Invalid, NOP, reserved, bank-illegal,
            or timing-illegal queries return false.
          history: Only shared.events.command_commit inserts ACT, PRE, or REF history.
            Permission has no combinational dependency on commit_valid or any accepted
            ACT pulse.
        reset: Synchronously invalidate all histories and immediately gate candidate_ok
          and probe_ok low during reset.
        update_events:
          every_clock: Age and expire histories using the locked edge convention while
            idle or stalled; elapsed time alone creates no history.
          shared.events.command_commit: Committed ACT updates tRCD, tRAS, tRRD, and
            tFAW histories; committed PRE updates tRP history; committed REF starts
            tRFC exclusion.
        stalls: Blocked proposals do not insert, refresh, or otherwise alter timing
          history.
        simultaneous_events:
          expiration_and_commit: Permission is evaluated against earlier registered
            history at the candidate edge; a committed trigger is inserted after that
            decision.
          probe_and_commit: Probe observes pre-edge history and is not changed by
            same-edge commit.
          reset_and_commit: Reset wins.
        invariants:
        - system.rules.BASE_TIMING
        - system.rules.BASE_LEGALITY
        - system.rules.BASE_TFAW
        - system.rules.BASE_TRRD
        - system.rules.R5
        - system.rules.CONSTRAINT_6
        - system.rules.CONSTRAINT_7
        - execution.rules.EXEC_PERMISSION
        verification:
        - system.verification.V_BASE_TIMING
        - system.verification.V_BASE_LEGALITY
        - system.verification.V_BASE_TFAW
        - system.verification.V_BASE_TRRD
        - system.verification.V_R5
        - system.verification.V_CONSTRAINT_6
        - system.verification.V_CONSTRAINT_7
        - execution.verification.V_EXEC_PERMISSION
        combinational_dependencies: &id020
          candidate_ok:
          - candidate_valid
          - candidate_command
          - open_valid
          - open_rows
          probe_ok:
          - probe_valid
          - probe_command
          - open_valid
          - open_rows
      specification_context: *id015
      active_ports:
      - candidate_command
      - candidate_ok
      - candidate_valid
      - commit_command
      - commit_valid
      - open_rows
      - open_valid
      - probe_command
      - probe_ok
      - probe_valid
      verification_obligations:
        system.verification.V_BASE_TIMING: &id101
          rules:
          - BASE_TIMING
          scenario: Exercise ACT-to-access, ACT-to-PRE, PRE-to-ACT, ACT spacing, and
            activation-window boundaries.
          expected: Basic timing remains enforced together with enabled tRRD and tFAW
            using activation commits rather than admissions or proposals.
          status: planned_not_executed
        system.verification.V_BASE_LEGALITY: &id104
          rules:
          - BASE_LEGALITY
          scenario: Independently vary candidate, registered history, selection validity,
            and timing permission.
          expected: Permission has no same-pulse acceptance feedback; timing may gate
            commit but cannot create selection-validity feedback; output dependencies
            are declarable from interface inputs.
          status: planned_not_executed
        system.verification.V_BASE_TFAW: &id109
          rules:
          - BASE_TFAW
          scenario: Inject four earlier ACT commits respecting tRRD and probe a fifth
            before and at expiration of the oldest tFAW history.
          expected: The fifth ACT is blocked while four earlier ACTs have age strictly
            below tFAW and is released when the oldest reaches the boundary subject
            to other constraints.
          status: planned_not_executed
        system.verification.V_BASE_TRRD: &id108
          rules:
          - BASE_TRRD
          scenario: Commit ACT then attempt another ACT before and at the selected
            tRRD boundary.
          expected: The later ACT is blocked before E+tRRD and may proceed at E+tRRD
            subject to all other permissions.
          status: planned_not_executed
        system.verification.V_R5: &id090
          rules:
          - R5
          scenario: Test each timing relation at E+T-1 and E+T, including reset, ACT
            bursts, and REF exclusion.
          expected: Only committed history changes timing and bank state; tRCD, tRAS,
            tRP, tRRD, tFAW, and tRFC use the selected profile and exact edge convention.
          status: planned_not_executed
        system.verification.V_CONSTRAINT_6: &id115
          rules:
          - CONSTRAINT_6
          scenario: Apply ACT history at the timing boundary.
          expected: tFAW gating is enabled using the selected-profile binding.
          status: planned_not_executed
        system.verification.V_CONSTRAINT_7: &id116
          rules:
          - CONSTRAINT_7
          scenario: Apply successive ACT candidates at the timing boundary.
          expected: tRRD gating is enabled using the selected-profile binding.
          status: planned_not_executed
        execution.verification.V_EXEC_PERMISSION: &id127
          rules:
          - EXEC_PERMISSION
          scenario: Probe permission with fixed registered history while varying candidate
            and compare against stalled and accepted ACT behavior.
          expected: Candidate validity remains independently observable; permission
            is history-based and acceptance feedback-free.
          status: planned_not_executed
    invariants:
    - 'system.rules.BASE_TIMING: Retain existing tRCD, tRAS and tRP timing protection
      from the selected JEDEC profile. ACT-to-READ/WRITE must wait tRCD, ACT-to-PRE
      must respect tRAS, and PRE-to-next-ACT must respect tRP if explicit commands
      are used. Aggregate service may retain the existing protected timing envelope
      instead. Configured tRRD and tFAW gates must use accepted activation events,
      not host admissions or stalled proposals. Never treat existing basic timing
      as an unrequested future feature.'
    - 'system.rules.BASE_LEGALITY: Compute command permission from registered timing/bank
      history and an independent candidate. An accepted ACT pulse is derived from
      candidate && permission; permission must not combinationally depend on that
      same accepted pulse. Scheduler selection/validity must be available independently
      of timing_ok; timing_ok may gate commit but must not create a selection-validity
      feedback loop. Declare accurate per-output combinational input dependencies.'
    - 'system.rules.BASE_TFAW: tFAW is enabled; honor that setting and resolve enabled
      timing values from DDR4-3200.'
    - 'system.rules.BASE_TRRD: tRRD is enabled; honor that setting and resolve enabled
      timing values from DDR4-3200.'
    - 'system.rules.R5: Update bank state and timing history only from committed commands.
      Enforce tRCD, tRAS, tRP, tRRD, tFAW and tRFC using the selected project profile.
      A trigger at E permits the blocked command at E+T; tFAW counts earlier ACT commits
      with age strictly less than its window. Reset creates no synthetic timing history.'
    - 'system.rules.CONSTRAINT_6: Requested constraint /features/tFAW = true.'
    - 'system.rules.CONSTRAINT_7: Requested constraint /features/tRRD = true.'
    - 'execution.rules.EXEC_PERMISSION: Candidate selection and validity are independently
      available before timing permission. Permission is computed from registered bank
      and timing history and the independent candidate. ACT acceptance equals ACT
      candidate and permission, but permission has no combinational dependency on
      the accepted ACT pulse or on same-edge committed command outputs.'
    implementation_constraints:
    - Use the exact elaborated port widths and packed field offsets; no additional
      public ports.
    - Honor every contract handshake, reset, update event, stall and simultaneous-event
      rule.
    - Do not transfer owned state or responsibilities into another module or top-level
      wiring.
    - Implement the declared combinational dependencies accurately; internal registers
      and helper logic remain implementation choices.
    - Parameter values and timing values in specification_context are concrete for
      this build; do not substitute legacy defaults.
    - A conditionally omitted input has no signal in this build; apply its specified
      absent-port behavior.
    combinational_dependencies: *id020
- instance: memory_responses
  roles:
  - memory
  responsibility: functional_memory_and_responses
  spec:
    design_name: ddr4_controller_top_spec_memory_responses
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: commit_valid
      direction: input
      width: 1
      description: shared.types.bit
    - name: commit_command
      direction: input
      width: 53
      description: shared.types.command
    - name: rsp_valid
      direction: output
      width: 1
      description: shared.types.bit
    - name: rsp_data
      direction: output
      width: 32
      description: shared.types.data
    behavior:
      description: Implement the complete memory_responses contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: functional_memory_and_responses
        owned_state:
          words: Four isolated banks of sixteen 32-bit words.
          response: One registered response valid/data stage separate from waiting
            and active capacity.
        interfaces:
          commit_valid:
            direction: input
            type: shared.types.bit
            width: 1
          commit_command:
            direction: input
            type: shared.types.command
            width: 53
          rsp_valid:
            direction: output
            type: shared.types.bit
            width: 1
          rsp_data:
            direction: output
            type: shared.types.data
            width: 32
        handshakes:
          commit: Observe broadcast shared.events.command_commit. Only committed WRITE
            mutates storage; only committed READ captures response state.
          response: shared.events.response_delivery samples the registered response.
            No response-ready or response backpressure exists.
        reset: Synchronously zero all words, response validity, and response data.
          Immediately gate rsp_valid low during reset.
        update_events:
          shared.events.command_commit: WRITE updates exactly its addressed bank and
            compact address. READ captures the addressed pre-edge word into response
            storage. Other commands do not mutate memory or response state.
          shared.events.response_delivery: Clear response valid unless a simultaneous
            committed READ replaces response state after old response delivery.
        stalls: Candidates, probes, selection, and noncommitted commands cannot mutate
          storage. Captured response state survives active release, cleanup, and refresh.
        simultaneous_events:
          response_delivery_and_READ: Deliver old response data, then capture the
            new pre-edge read word for the next edge.
          response_delivery_and_WRITE: Deliver old response independently; WRITE creates
            no response.
          reset_and_events: Reset wins.
        invariants:
        - system.rules.BASE_DATA
        - system.rules.R6
        - execution.rules.EXEC_RESPONSE
        verification:
        - system.verification.V_BASE_DATA
        - system.verification.V_R6
        - execution.verification.V_EXEC_RESPONSE
        combinational_dependencies: &id021
          rsp_valid: []
          rsp_data: []
      specification_context: *id015
      active_ports:
      - commit_command
      - commit_valid
      - rsp_data
      - rsp_valid
      verification_obligations:
        system.verification.V_BASE_DATA: &id100
          rules:
          - BASE_DATA
          scenario: Scoreboard bank-isolated writes and reads over all sixteen locations
            per bank and inject blocked proposals.
          expected: Reset data are zero; only committed writes update data; every
            committed read yields exactly one response; proposals do not mutate storage.
          status: planned_not_executed
        system.verification.V_R6: &id091
          rules:
          - R6
          scenario: Write distinct values to all compact addresses in multiple banks,
            read them, and reset during response visibility.
          expected: Only committed WRITE changes addressed banked storage; READ captures
            pre-edge data and produces one E+1 response; responses survive active
            release and refresh.
          status: planned_not_executed
        execution.verification.V_EXEC_RESPONSE: &id130
          rules:
          - EXEC_RESPONSE
          scenario: Commit reads on adjacent edges, read after writes, issue writes,
            and reset during a response pulse.
          expected: Each read returns captured pre-edge data exactly once at E+1,
            writes return no response, and old data is delivered before same-edge
            replacement.
          status: planned_not_executed
    invariants:
    - 'system.rules.BASE_DATA: Provide functional 32-bit memory storage with 16 addresses
      per bank, bank isolation and reset-to-zero contents. Accepted writes update
      only their addressed location at service completion or a committed WRITE. Each
      accepted read produces exactly one one-cycle rsp_valid pulse with the stored
      rsp_rdata after read service/READ commit, using the existing one-cycle response
      stage. Writes produce no host response. Selection and stalled candidates cannot
      mutate memory; mere command output without storage and read responses is insufficient.'
    - 'system.rules.R6: Preserve functional banked 32-bit memory and compact host
      address mapping. WRITE commit updates storage; READ commit at E captures pre-edge
      data and registers valid/data for host sampling at E+1, with no extra adapter
      response register. Responses survive active release, cleanup and refresh; writes
      produce no response.'
    - 'execution.rules.EXEC_RESPONSE: At READ commit edge E, response storage captures
      the addressed pre-edge memory word and rsp_valid is asserted after E. The host
      samples that response at E+1. In the absence of replacement, rsp_valid clears
      after the delivery edge while rsp_rdata may retain its last value. A delivery
      and a new READ commit may share an edge: old response data is delivered before
      new response state replaces it. WRITE produces no response.'
    implementation_constraints:
    - Use the exact elaborated port widths and packed field offsets; no additional
      public ports.
    - Honor every contract handshake, reset, update event, stall and simultaneous-event
      rule.
    - Do not transfer owned state or responsibilities into another module or top-level
      wiring.
    - Implement the declared combinational dependencies accurately; internal registers
      and helper logic remain implementation choices.
    - Parameter values and timing values in specification_context are concrete for
      this build; do not substitute legacy defaults.
    - A conditionally omitted input has no signal in this build; apply its specified
      absent-port behavior.
    combinational_dependencies: *id021
- instance: refresh_control
  roles:
  - refresh
  responsibility: refresh_control
  spec:
    design_name: ddr4_controller_top_spec_refresh_control
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: commit_valid
      direction: input
      width: 1
      description: shared.types.bit
    - name: commit_command
      direction: input
      width: 53
      description: shared.types.command
    - name: refresh_pending
      direction: output
      width: 1
      description: shared.types.bit
    - name: refresh_busy
      direction: output
      width: 1
      description: shared.types.bit
    behavior:
      description: Implement the complete refresh_control contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: refresh_control
        owned_state:
          deadline: Periodic deadline measured from the last sampled reset edge.
          pending: Sticky coalesced refresh request.
          service: Registered REF service exclusion state through tRFC.
        interfaces:
          commit_valid:
            direction: input
            type: shared.types.bit
            width: 1
          commit_command:
            direction: input
            type: shared.types.command
            width: 53
          refresh_pending:
            direction: output
            type: shared.types.bit
            width: 1
          refresh_busy:
            direction: output
            type: shared.types.bit
            width: 1
        handshakes:
          request: shared.events.refresh_due sets sticky pending and advances the
            deadline by tREFI independently of REF commit.
          acknowledgment: shared.events.refresh_start, a committed REF, is the sole
            acknowledgment and starts tRFC service exclusion.
        reset: Synchronously clear pending, service, and deadline state; rebase the
          first deadline at the sampled reset edge. Immediately gate outputs low during
          reset.
        update_events:
          shared.events.refresh_due: Set pending and advance periodic deadline. A
            due event while pending or servicing coalesces.
          shared.events.refresh_start: Clear pending unless refresh_due also occurs
            at the edge; start service exclusion.
          shared.events.refresh_end: End service exclusion while retaining any independently
            pending refresh.
        stalls: Pending persists through active work, cleanup, timing stalls, and
          service. This module owns no waiting request storage.
        simultaneous_events:
          due_and_REF: Due wins pending update; REF starts service and one later refresh
            remains pending.
          due_and_service_end: Service may end but pending remains set.
          reset_and_events: Reset wins.
        invariants:
        - system.rules.BASE_REFRESH
        - system.rules.R8
        - system.rules.CONSTRAINT_4
        - execution.rules.EXEC_REFRESH
        verification:
        - system.verification.V_BASE_REFRESH
        - system.verification.V_R8
        - system.verification.V_CONSTRAINT_4
        - execution.verification.V_EXEC_REFRESH
        combinational_dependencies: &id022
          refresh_pending: []
          refresh_busy: []
      specification_context: *id015
      active_ports:
      - commit_command
      - commit_valid
      - refresh_busy
      - refresh_pending
      verification_obligations:
        system.verification.V_BASE_REFRESH: &id107
          rules:
          - BASE_REFRESH
          scenario: Generate periodic due events under queued traffic and defer service
            through active work.
          expected: Refresh progresses without dropping traffic, acknowledges at REF
            commit, and normal requests resume.
          status: planned_not_executed
        system.verification.V_R8: &id093
          rules:
          - R8
          scenario: Create refresh due conditions while idle, active, cleanup-reserved,
            and during refresh service; leave multiple banks open.
          expected: Pending coalesces, due wins over simultaneous acknowledgment,
            active and cleanup drain before ascending PRE, REF commits once, tRFC
            exclusion holds, and queued traffic resumes.
          status: planned_not_executed
        system.verification.V_CONSTRAINT_4: &id113
          rules:
          - CONSTRAINT_4
          scenario: Inspect refresh behavior and profile bindings.
          expected: Periodic refresh behavior is included.
          status: planned_not_executed
        execution.verification.V_EXEC_REFRESH: &id131
          rules:
          - EXEC_REFRESH
          scenario: Observe first due from reset, delayed REF, coincident due/REF,
            multiple open banks, and post-tRFC restart.
          expected: Deadlines do not drift, pending is sticky and coalesced, preparation
            ordering is ascending, REF is singular, and exclusion ends exactly at
            E+tRFC.
          status: planned_not_executed
    invariants:
    - 'system.rules.BASE_REFRESH: Retain periodic refresh requests using profile tREFI,
      refresh priority and request/acknowledgment handling without dropping queued
      traffic. Refresh must make progress and normal requests must resume. Existing
      refresh is simplified; full REF/tRFC servicing remains later feature work. If
      explicit REF is proposed, describe drain/row-state interaction and acknowledge
      once at commit.'
    - 'system.rules.R8: Generate periodic refresh deadlines from the last sampled
      reset edge using tREFI. Coalesce missed deadlines into sticky pending; a due
      deadline wins over simultaneous REF acknowledgment. Drain active work and cleanup,
      PRE remaining open banks in ascending order, respect all-bank tRP, commit REF
      once, and exclude commands strictly before REF-edge+tRFC. Retain queued traffic
      and resume service afterward.'
    - 'system.rules.CONSTRAINT_4: Requested constraint /features/refresh = true.'
    - 'execution.rules.EXEC_REFRESH: Refresh deadlines are measured from the last
      sampled reset edge. The first due edge is E0+tREFI and later deadlines advance
      by tREFI independently of REF commit. Pending is sticky and coalesces later
      due edges. Once pending is visible, no new dispatch occurs; active service and
      required cleanup complete, then open banks PRE in ascending bank order, respecting
      timing. REF commits once after all banks are closed and all-bank tRP is satisfied.
      Commands are excluded at candidate edges strictly before REF-edge+tRFC; queued
      traffic remains retained and resumes after service when no pending refresh remains.'
    implementation_constraints:
    - Use the exact elaborated port widths and packed field offsets; no additional
      public ports.
    - Honor every contract handshake, reset, update event, stall and simultaneous-event
      rule.
    - Do not transfer owned state or responsibilities into another module or top-level
      wiring.
    - Implement the declared combinational dependencies accurately; internal registers
      and helper logic remain implementation choices.
    - Parameter values and timing values in specification_context are concrete for
      this build; do not substitute legacy defaults.
    - A conditionally omitted input has no signal in this build; apply its specified
      absent-port behavior.
    combinational_dependencies: *id022
