  - probe_command
  - probe_ok
  - probe_valid
  verification_obligations:
    system.verification.V_BASE_TIMING:
      rules:
      - BASE_TIMING
      scenario: Exercise ACT-to-access, ACT-to-PRE, PRE-to-ACT, ACT spacing, and activation-window
        boundaries.
      expected: Basic timing remains enforced together with enabled tRRD and tFAW
        using activation commits rather than admissions or proposals.
      status: planned_not_executed
    system.verification.V_BASE_LEGALITY:
      rules:
      - BASE_LEGALITY
      scenario: Independently vary candidate, registered history, selection validity,
        and timing permission.
      expected: Permission has no same-pulse acceptance feedback; timing may gate
        commit but cannot create selection-validity feedback; output dependencies
        are declarable from interface inputs.
      status: planned_not_executed
    system.verification.V_BASE_TFAW:
      rules:
      - BASE_TFAW
      scenario: Inject four earlier ACT commits respecting tRRD and probe a fifth
        before and at expiration of the oldest tFAW history.
      expected: The fifth ACT is blocked while four earlier ACTs have age strictly
        below tFAW and is released when the oldest reaches the boundary subject to
        other constraints.
      status: planned_not_executed
    system.verification.V_BASE_TRRD:
      rules:
      - BASE_TRRD
      scenario: Commit ACT then attempt another ACT before and at the selected tRRD
        boundary.
      expected: The later ACT is blocked before E+tRRD and may proceed at E+tRRD subject
        to all other permissions.
      status: planned_not_executed
    system.verification.V_R5:
      rules:
      - R5
      scenario: Test each timing relation at E+T-1 and E+T, including reset, ACT bursts,
        and REF exclusion.
      expected: Only committed history changes timing and bank state; tRCD, tRAS,
        tRP, tRRD, tFAW, and tRFC use the selected profile and exact edge convention.
      status: planned_not_executed
    system.verification.V_CONSTRAINT_6:
      rules:
      - CONSTRAINT_6
      scenario: Apply ACT history at the timing boundary.
      expected: tFAW gating is enabled using the selected-profile binding.
      status: planned_not_executed
    system.verification.V_CONSTRAINT_7:
      rules:
      - CONSTRAINT_7
      scenario: Apply successive ACT candidates at the timing boundary.
      expected: tRRD gating is enabled using the selected-profile binding.
      status: planned_not_executed
    execution.verification.V_EXEC_PERMISSION:
      rules:
      - EXEC_PERMISSION
      scenario: Probe permission with fixed registered history while varying candidate
        and compare against stalled and accepted ACT behavior.
      expected: Candidate validity remains independently observable; permission is
        history-based and acceptance feedback-free.
      status: planned_not_executed
