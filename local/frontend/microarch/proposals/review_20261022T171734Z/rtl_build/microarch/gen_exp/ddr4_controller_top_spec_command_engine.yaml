        origin: request.CONSTRAINT_5
        statement: Requested constraint /features/scheduler = "fifo".
        owners:
        - fifo_scheduler
      CONSTRAINT_6:
        verification:
        - V_CONSTRAINT_6
        origin: request.CONSTRAINT_6
        statement: Requested constraint /features/tFAW = true.
        owners:
        - timing_enforcement
      CONSTRAINT_7:
        verification:
        - V_CONSTRAINT_7
        origin: request.CONSTRAINT_7
        statement: Requested constraint /features/tRRD = true.
        owners:
        - timing_enforcement
      CONSTRAINT_8:
        verification:
        - V_CONSTRAINT_8
        origin: request.CONSTRAINT_8
        statement: Requested constraint /memory/protocol = "DDR4".
        owners:
        - host_protocol
      CONSTRAINT_9:
        verification:
        - V_CONSTRAINT_9
        origin: request.CONSTRAINT_9
        statement: Requested constraint /memory/speed = "3200".
        owners:
