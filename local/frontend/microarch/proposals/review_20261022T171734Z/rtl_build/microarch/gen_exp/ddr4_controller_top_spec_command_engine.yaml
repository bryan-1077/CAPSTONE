        - name: txn_wdata
          direction: input
          width: 32
        - name: txn_bank
          direction: input
          width: 2
        - name: txn_ready
          direction: output
          width: 1
        - name: cmd_ready
          direction: output
          width: 1
        - name: rsp_valid
          direction: output
          width: 1
        - name: rsp_rdata
          direction: output
          width: 32
        requirements:
        - *id001
