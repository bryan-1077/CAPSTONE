  verification_obligations:
    system.verification.V_BASE_SEQUENCE:
      rules:
      - BASE_SEQUENCE
      scenario: Dispatch a complete request, change host inputs afterward, and stall
        each setup and final command.
      expected: Captured active payload survives until final commit; dispatch/dequeue
        and retirement remain distinct; only committed operations change row state.
      status: planned_not_executed
    system.verification.V_BASE_MODULARITY:
      rules:
      - BASE_MODULARITY
      scenario: Review future decomposition contracts and declared functional interfaces.
      expected: Request storage, selection, sequencing, timing, and functional memory
        are independently verifiable and distinct.
      status: planned_not_executed
    system.verification.V_R3:
      rules:
      - R3
      scenario: Service closed-bank, row-hit, and row-conflict reads and writes while
        timing-blocking each candidate and raising refresh pending.
      expected: Only NOP, ACT, PRE, READ, WRITE, and REF semantics are used; one command
        at most commits per edge; setup does not retire; blocked candidates remain
        stable.
      status: planned_not_executed
    system.verification.V_R4:
      rules:
      - R4
      scenario: Inspect future architecture contracts and interface-level verification
        intent.
      expected: Required behavioral roles are independently contractable with structural
        top-level integration only; no single owner contract contains all required
        functions.
      status: planned_not_executed
    execution.verification.V_EXEC_COMMANDS:
      rules:
      - EXEC_COMMANDS
      scenario: Run closed, hit, and conflict sequences with multi-cycle timing stalls
        and refresh pending transitions.
      expected: Committed trace is ACT-access, access, or PRE-ACT-access as applicable;
        setup never retires and no candidate changes while blocked.
      status: planned_not_executed
    execution.verification.V_EXEC_CLEANUP:
      rules:
      - EXEC_CLEANUP
      scenario: Retire accesses under both page policies and raise refresh during
        close-page cleanup.
      expected: Open-page retains rows; close-page reserves cleanup and blocks dispatch
        until PRE commits without duplicate retirement or response.
      status: planned_not_executed
