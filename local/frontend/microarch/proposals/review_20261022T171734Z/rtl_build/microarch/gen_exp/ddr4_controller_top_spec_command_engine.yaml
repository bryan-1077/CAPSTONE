behavior:
  description: Implement the complete command_engine contract below. All structured
    contract and system context fields are normative. Internal representations and
    algorithms may vary within this boundary.
  contract:
    status: draft
    role: command_sequencing
    owned_state:
      active_request: One complete dispatched shared.types.request retained until
        committed READ or WRITE.
      active_valid: Registered active-service ownership.
      candidate: Registered non-NOP command proposal and validity held unchanged while
        permission is false.
      cleanup: Optional close-page cleanup bank reservation retained after retirement
        until committed PRE.
      refresh_preparation: Registered ascending-bank preparation cursor and phase;
        it is distinct from refresh pending/service state.
    interfaces:
      dispatch_valid:
        direction: input
        type: shared.types.bit
        width: 1
      dispatch_request:
        direction: input
        type: shared.types.request
        width: 51
      candidate_ok:
        direction: input
        type: shared.types.bit
        width: 1
      probe_ok:
        direction: input
        type: shared.types.bit
        width: 1
      open_valid:
        direction: input
        type: shared.types.bank_valid
        width: 4
      open_rows:
        direction: input
        type: shared.types.bank_rows
        width: 40
      refresh_pending:
        direction: input
        type: shared.types.bit
        width: 1
      refresh_busy:
        direction: input
        type: shared.types.bit
        width: 1
      incoming_request:
        direction: input
        type: shared.types.request
        width: 51
      dispatch_ready:
        direction: output
        type: shared.types.bit
        width: 1
      candidate_valid:
        direction: output
        type: shared.types.bit
        width: 1
      candidate_command:
        direction: output
        type: shared.types.command
        width: 53
      commit_valid:
        direction: output
        type: shared.types.bit
        width: 1
      commit_command:
        direction: output
        type: shared.types.command
        width: 53
      probe_valid:
        direction: output
        type: shared.types.bit
        width: 1
      probe_command:
        direction: output
        type: shared.types.command
        width: 53
      probe_ready:
        direction: output
        type: shared.types.bit
        width: 1
    handshakes:
      dispatch: shared.events.dispatch captures the complete pre-edge dispatch_request
        before queue storage is released. Timing permission never gates dispatch.
      commit: shared.events.command_commit is candidate_valid and candidate_ok. commit_valid
        is never asserted for NOP.
      probe: Probe independently derives the incoming request first needed command
        while idle and permitted by cleanup/refresh state. It has no state-changing
        effect.
    reset: Synchronously clear active, candidate, cleanup, and preparation ownership.
      Immediately gate dispatch_ready, candidate_valid, commit_valid, probe_valid,
      and probe_ready low. Invalid command outputs are canonical NOP.
    update_events:
      shared.events.dispatch: Capture the complete pre-edge head into active storage
        and defer first candidate formation until a later edge.
      shared.events.command_commit: Committed PRE or ACT advances setup only. Committed
        READ or WRITE retires active ownership; close_page creates cleanup ownership
        and open_page retains row ownership. Committed REF completes refresh preparation.
      every_clock: When no blocked candidate exists, form a candidate from registered
        active, cleanup, or refresh-preparation ownership. Once refresh_pending is
        visible, prevent new dispatch, drain active and cleanup, precharge open banks
        in ascending order, then propose REF. No dispatch occurs while refresh_busy
        is high.
    stalls: A valid candidate and complete active payload remain unchanged while candidate_ok
      is low, including when refresh_pending becomes visible. New candidate formation
      occurs only after a prior candidate commits.
    simultaneous_events:
      refresh_due_and_final_access: The final access may commit; newly visible pending
        blocks subsequent dispatch and preparation begins later.
      refresh_due_and_REF: REF acknowledgment does not erase simultaneous due; refresh
        control retains pending.
      retirement_and_dispatch: dispatch_ready is low when active ownership exists
        before the edge; retirement cannot cause same-edge replacement.
      reset_and_events: Reset wins.
    invariants:
    - system.rules.BASE_SEQUENCE
    - system.rules.BASE_MODULARITY
    - system.rules.R3
    - system.rules.R4
    - execution.rules.EXEC_COMMANDS
    - execution.rules.EXEC_CLEANUP
    verification:
    - system.verification.V_BASE_SEQUENCE
    - system.verification.V_BASE_MODULARITY
    - system.verification.V_R3
    - system.verification.V_R4
    - execution.verification.V_EXEC_COMMANDS
    - execution.verification.V_EXEC_CLEANUP
    combinational_dependencies: &id014
      dispatch_ready:
      - refresh_pending
      - refresh_busy
      candidate_valid: []
      candidate_command: []
      commit_valid:
      - candidate_ok
      commit_command: []
      probe_valid:
      - incoming_request
      - open_valid
      - open_rows
      - refresh_pending
      - refresh_busy
      probe_command:
      - incoming_request
      - open_valid
      - open_rows
      probe_ready:
      - probe_ok
      - refresh_pending
      - refresh_busy
  specification_context:
    package_id: ddr4_controller_top_spec
    revision: draft_001
    package_fingerprint: d094f930480b800de15078a0db4116f987b18a011953299f8da677812232bafe
    parameters:
      DATA_WIDTH: 32
      HOST_ADDR_WIDTH: 4
      HOST_BANK_WIDTH: 2
      REQUEST_BANK_WIDTH: 2
      REQUEST_ROW_WIDTH: 10
      REQUEST_COLUMN_WIDTH: 6
      COMMAND_OPCODE_WIDTH: 3
      BANK_COUNT: 4
      WAITING_CAPACITY: 4
      ACTIVE_CAPACITY: 1
      PAGE_POLICY: open_page
      TFAW_ACT_LIMIT: 4
      READ_RESPONSE_LATENCY: 1
      MEMORY_WORDS_PER_BANK: 16
    types:
      bit:
        kind: unsigned
        width: 1
      data:
        kind: unsigned
        width: 32
      host_address:
        kind: unsigned
        width: 4
      host_bank:
        kind: unsigned
        width: 2
      bank:
        kind: unsigned
        width: 2
      row:
        kind: unsigned
        width: 10
      column:
        kind: unsigned
        width: 6
      opcode:
        kind: enum
        width: 3
        encodings:
          NOP: 0
          ACT: 1
          PRE: 2
          READ: 3
          WRITE: 4
          REF: 5
        reserved:
        - 6
        - 7
      request:
        kind: record
        packed_order: msb_to_lsb
        fields:
        - name: bank
          type: shared.types.bank
          width: 2
          msb: 50
          lsb: 49
        - name: row
          type: shared.types.row
          width: 10
          msb: 48
          lsb: 39
        - name: column
          type: shared.types.column
          width: 6
          msb: 38
          lsb: 33
        - name: is_write
          type: shared.types.bit
          width: 1
          msb: 32
          lsb: 32
        - name: wdata
          type: shared.types.data
          width: 32
          msb: 31
          lsb: 0
        width: 51
      command:
        kind: record
        packed_order: msb_to_lsb
        fields:
        - name: opcode
          type: shared.types.opcode
          width: 3
          msb: 52
          lsb: 50
        - name: bank
          type: shared.types.bank
          width: 2
          msb: 49
          lsb: 48
        - name: row
          type: shared.types.row
          width: 10
          msb: 47
          lsb: 38
        - name: column
          type: shared.types.column
          width: 6
          msb: 37
          lsb: 32
        - name: wdata
          type: shared.types.data
          width: 32
          msb: 31
