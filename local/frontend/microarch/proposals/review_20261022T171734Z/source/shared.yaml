parameters:
  DATA_WIDTH:
    value: 32
  HOST_ADDR_WIDTH:
    value: 4
  HOST_BANK_WIDTH:
    value: 2
  REQUEST_BANK_WIDTH:
    value: 2
  REQUEST_ROW_WIDTH:
    value: 10
  REQUEST_COLUMN_WIDTH:
    value: 6
  COMMAND_OPCODE_WIDTH:
    value: 3
  BANK_COUNT:
    value: 4
    configurable: false
    allowed:
    - 1
    - 2
    - 4
  WAITING_CAPACITY:
    value: 4
    configurable: true
    minimum: 1
  ACTIVE_CAPACITY:
    value: 1
    configurable: false
  MEMORY_WORDS_PER_BANK:
    derive: 2**HOST_ADDR_WIDTH
  PAGE_POLICY:
    value: open_page
    configurable: true
    allowed:
    - open_page
    - close_page
  TFAW_ACT_LIMIT:
    value: 4
  READ_RESPONSE_LATENCY:
    value: 1
    configurable: false
    unit: cycles
    note: A READ committed at edge E captures response state after E for host sampling
      at E+1.
clock_reset:
  clock: clk
  edge: rising
  reset: rst_n
  active_level: 0
  priority: reset_before_all_events
  assertion_style: synchronous
  handshake_gating: Suppress all valid, ready, commit, dispatch, admission, response-delivery,
    and refresh event conditions while reset is asserted.
types:
  bit:
    kind: unsigned
    width: 1
  data:
    kind: unsigned
    width: shared.parameters.DATA_WIDTH
  host_address:
    kind: unsigned
    width: shared.parameters.HOST_ADDR_WIDTH
  host_bank:
    kind: unsigned
    width: shared.parameters.HOST_BANK_WIDTH
  bank:
    kind: unsigned
    width: shared.parameters.REQUEST_BANK_WIDTH
  row:
    kind: unsigned
    width: shared.parameters.REQUEST_ROW_WIDTH
  column:
    kind: unsigned
    width: shared.parameters.REQUEST_COLUMN_WIDTH
  opcode:
    kind: enum
    width: shared.parameters.COMMAND_OPCODE_WIDTH
    encodings:
      NOP: 0
      ACT: 1
      PRE: 2
      READ: 3
      WRITE: 4
      REF: 5
    reserved:
    - 6
    - 7
  request:
    kind: record
    packed_order: msb_to_lsb
    fields:
    - name: bank
      type: shared.types.bank
    - name: row
      type: shared.types.row
    - name: column
      type: shared.types.column
    - name: is_write
      type: shared.types.bit
    - name: wdata
      type: shared.types.data
  command:
    kind: record
    packed_order: msb_to_lsb
    fields:
    - name: opcode
      type: shared.types.opcode
    - name: bank
      type: shared.types.bank
    - name: row
      type: shared.types.row
    - name: column
      type: shared.types.column
    - name: wdata
      type: shared.types.data
  bank_rows:
    kind: array
    element_type: shared.types.row
    count: shared.parameters.BANK_COUNT
    packed_order: ascending_index_from_lsb
  bank_valid:
    kind: array
    element_type: shared.types.bit
    count: shared.parameters.BANK_COUNT
    packed_order: ascending_index_from_lsb
host_interface:
  clk:
    direction: input
    type: shared.types.bit
  rst_n:
    direction: input
    type: shared.types.bit
  txn_valid:
    direction: input
    type: shared.types.bit
  txn_is_write:
    direction: input
    type: shared.types.bit
  txn_addr:
    direction: input
    type: shared.types.host_address
  txn_wdata:
    direction: input
    type: shared.types.data
  txn_bank:
    direction: input
    type: shared.types.host_bank
  txn_ready:
    direction: output
    type: shared.types.bit
  cmd_ready:
    direction: output
    type: shared.types.bit
  rsp_valid:
    direction: output
    type: shared.types.bit
  rsp_rdata:
    direction: output
    type: shared.types.data
events:
  admission:
    condition: Pre-edge txn_valid is high, pre-edge txn_ready is high, and reset is
      inactive at the rising edge.
    effect: Capture exactly one complete mapped request into waiting storage.
  dispatch:
    condition: A previously stored FIFO head is selected, active storage is idle,
      cleanup is absent, refresh does not forbid dispatch, and reset is inactive at
      the rising edge.
    effect: Capture the complete pre-edge FIFO head into active-service storage and
      release exactly that waiting entry atomically.
  command_commit:
    condition: A non-NOP candidate is present, independently computed permission is
      true from registered history and bank state, and reset is inactive at the rising
      edge.
    effect: Commit at most one command and update only state assigned to that opcode.
  retirement:
    condition: shared.events.command_commit is READ or WRITE for the active request.
    effect: Retire exactly one active request; READ captures response state before
      active release and WRITE produces no response state.
  response_delivery:
    condition: rsp_valid is high when sampled at a rising edge and reset is inactive.
    effect: The host samples rsp_rdata; this event does not alter request capacity.
  refresh_due:
    condition: The periodic deadline is reached at a rising edge with reset inactive.
    effect: Set sticky refresh pending; later due events while pending or servicing
      coalesce.
  refresh_start:
    condition: shared.events.command_commit commits REF.
    effect: Acknowledge one pending refresh and begin tRFC command exclusion.
  refresh_end:
    condition: The candidate edge is at least tRFC cycles after a committed REF and
      reset is inactive.
    effect: End refresh command exclusion.
timing_profile:
  source: timing.yaml
  selection: DDR4-3200
  supported_profiles:
  - DDR4-3200
  unit: cycles
  bindings:
    tRCD: timing_cycles.tRCD
    tRAS: timing_cycles.tRAS
    tRP: timing_cycles.tRP
    tRRD: timing_cycles.tRRD
    tFAW: timing_cycles.tFAW
    tREFI: timing_cycles.tREFI
    tRFC: timing_cycles.tRFC1
  note: Bindings are resolved from the selected supplied timing-library profile.
timing_rules:
  edge_convention: A trigger committed at edge E permits a blocked command at edge
    E+T, never earlier. tFAW counts earlier ACT commits whose age at the candidate
    edge is strictly less than the tFAW window. Reset creates invalid history and
    no synthetic timing delay.
  tRCD:
    trigger: ACT
    blocked:
    - READ
    - WRITE
    minimum: shared.timing_profile.bindings.tRCD
    scope: same_bank
  tRAS:
    trigger: ACT
    blocked:
    - PRE
    minimum: shared.timing_profile.bindings.tRAS
    scope: same_bank
  tRP:
    trigger: PRE
    blocked:
    - ACT
    - REF
    minimum: shared.timing_profile.bindings.tRP
    scope: same_bank_for_ACT_all_banks_for_REF
  tRRD:
    trigger: ACT
    blocked:
    - ACT
    minimum: shared.timing_profile.bindings.tRRD
    scope: all_banks
  tFAW:
    trigger: ACT
    blocked:
    - ACT
    window: shared.timing_profile.bindings.tFAW
    limit: shared.parameters.TFAW_ACT_LIMIT
    scope: all_banks
  tRFC:
    trigger: REF
    blocked:
    - ACT
    - PRE
    - READ
    - WRITE
    - REF
    minimum: shared.timing_profile.bindings.tRFC
    scope: all_banks
