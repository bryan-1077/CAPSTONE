slice_id: system_behavior
rules:
  R1:
    verification:
    - V_R1
    origin: request.R1
    statement: Implement global FIFO service in acceptance order, including same-address
      writes and reads. Admit on every rising-edge txn_valid && txn_ready, independently
      of command readiness.
    owners:
    - host_protocol
  R2:
    verification:
    - V_R2
    origin: request.R2
    statement: Provide four waiting entries plus one separately stored active request.
      Dispatch only previously stored requests, capture the complete pre-edge head
      before releasing its slot, and permit full-queue simultaneous dispatch/admission
      including capacity one. No empty-queue bypass or same-edge active replacement
      at retirement.
    owners:
    - waiting_queue
  R3:
    verification:
    - V_R3
    origin: request.R3
    statement: Use explicit NOP/ACT/PRE/READ/WRITE/REF command semantics, with NOP
      never committed and at most one command commit per edge. Sequence closed banks
      with ACT-access, row hits with access, and row conflicts with PRE-ACT-access.
      PRE/ACT never retire the active request. Keep blocked candidates stable through
      stalls and newly pending refresh.
    owners:
    - command_engine
  R4:
    verification:
    - V_R4
    origin: request.R4
    statement: Keep separate owners for host mapping, waiting storage, scheduling,
      command sequencing, row state, timing, functional memory/responses, and refresh
      control. The top must contain structural connections only.
    owners:
    - command_engine
  R5:
    verification:
    - V_R5
    origin: request.R5
    statement: Update bank state and timing history only from committed commands.
      Enforce tRCD, tRAS, tRP, tRRD, tFAW and tRFC using the selected project profile.
      A trigger at E permits the blocked command at E+T; tFAW counts earlier ACT commits
      with age strictly less than its window. Reset creates no synthetic timing history.
    owners:
    - timing_enforcement
  R6:
    verification:
    - V_R6
    origin: request.R6
    statement: Preserve functional banked 32-bit memory and compact host address mapping.
      WRITE commit updates storage; READ commit at E captures pre-edge data and registers
      valid/data for host sampling at E+1, with no extra adapter response register.
      Responses survive active release, cleanup and refresh; writes produce no response.
    owners:
    - memory_responses
  R7:
    verification:
    - V_R7
    origin: request.R7
    statement: Open-page retains rows. Support close-page as a configurable alternative,
      retaining a separate cleanup bank reservation after retirement until a legal
      PRE commits; block new dispatch during cleanup.
    owners:
    - fifo_scheduler
  R8:
    verification:
    - V_R8
    origin: request.R8
    statement: Generate periodic refresh deadlines from the last sampled reset edge
      using tREFI. Coalesce missed deadlines into sticky pending; a due deadline wins
      over simultaneous REF acknowledgment. Drain active work and cleanup, PRE remaining
      open banks in ascending order, respect all-bank tRP, commit REF once, and exclude
      commands strictly before REF-edge+tRFC. Retain queued traffic and resume service
      afterward.
    owners:
    - refresh_control
  R9:
    verification:
    - V_R9
    origin: request.R9
    statement: cmd_ready is reset-gated diagnostic readiness for the incoming request's
      first needed command, using independent row/timing probe queries while the engine
      is idle and cleanup/refresh permit. It is meaningful without txn_valid and must
      not admit, dispatch, bypass FIFO, mutate history or reserve storage.
    owners:
    - host_protocol
  R10:
    verification:
    - V_R10
    origin: request.R10
    statement: Use synchronous active-low reset for state, with immediate valid/ready/event
      gating. Reset clears queued/active/cleanup work, row state, timing history,
      memory, responses and refresh state; it wins over every simultaneous event.
      The host holds payload while stalled and samples every response; no response
      backpressure is provided.
    owners:
    - host_protocol
  R11:
    verification:
    - V_R11
    origin: request.R11
    statement: Generate architecture-specific module isolation and system verification
      intent with exact requirement IDs, independent scenarios/expected results, and
      declared port/event bindings. Export it alongside RTL for the external UVM/vector
      stage. Do not execute downstream verification or backend stages in this frontend
      flow.
    owners:
    - host_protocol
  BASE_HOST:
    verification:
    - V_BASE_HOST
    origin: request.BASE_HOST
    statement: Preserve the existing host ports and widths listed in the baseline
      contract. Accept a request only on a rising clk edge with txn_valid && txn_ready.
      Hold payload while stalled. Consecutive accepted cycles with txn_valid held
      high are distinct requests. cmd_ready is execution/timing visibility, not the
      host acceptance handshake. Deassert txn_ready and rsp_valid during reset.
    owners:
    - host_protocol
  BASE_ADDRESS:
    verification:
    - V_BASE_ADDRESS
    origin: request.BASE_ADDRESS
    statement: 'Preserve the simplified 4-bit txn_addr mapping: row=txn_addr[3:2],
      column=txn_addr[1:0], zero-extended into the internal 10-bit row and 6-bit column
      fields. Preserve explicit txn_bank for multi-bank configurations; a single-bank
      configuration uses bank 0. Internal packed requests retain bank(2), row(10),
      column(6), write flag(1), write data(32).'
    owners:
    - host_protocol
  BASE_QUEUE:
    verification:
    - V_BASE_QUEUE
    origin: request.BASE_QUEUE
    statement: 'Provide 4 WAITING request slots PLUS one separately stored active-service
      request: waiting plus active capacity is 5. The active request must not consume
      a waiting slot. Dispatch captures the complete pre-edge request in active registers
      and frees its waiting slot without retiring the transaction. A full queue may
      admit on the same edge as dispatch; retirement alone does not free waiting storage.
      Accepted request fields survive stalls and each accepted request is serviced
      exactly once within a reset-free epoch. Keep admission, dispatch, retirement
      and read response delivery distinct. Captured response storage consumes neither
      waiting nor active capacity.'
    owners:
    - waiting_queue
  BASE_DATA:
    verification:
    - V_BASE_DATA
    origin: request.BASE_DATA
    statement: Provide functional 32-bit memory storage with 16 addresses per bank,
      bank isolation and reset-to-zero contents. Accepted writes update only their
      addressed location at service completion or a committed WRITE. Each accepted
      read produces exactly one one-cycle rsp_valid pulse with the stored rsp_rdata
      after read service/READ commit, using the existing one-cycle response stage.
      Writes produce no host response. Selection and stalled candidates cannot mutate
      memory; mere command output without storage and read responses is insufficient.
    owners:
    - memory_responses
  BASE_TIMING:
    verification:
    - V_BASE_TIMING
    origin: request.BASE_TIMING
    statement: Retain existing tRCD, tRAS and tRP timing protection from the selected
      JEDEC profile. ACT-to-READ/WRITE must wait tRCD, ACT-to-PRE must respect tRAS,
      and PRE-to-next-ACT must respect tRP if explicit commands are used. Aggregate
      service may retain the existing protected timing envelope instead. Configured
      tRRD and tFAW gates must use accepted activation events, not host admissions
      or stalled proposals. Never treat existing basic timing as an unrequested future
      feature.
    owners:
    - timing_enforcement
  BASE_SEQUENCE:
    verification:
    - V_BASE_SEQUENCE
    origin: request.BASE_SEQUENCE
    statement: Dispatch captures the complete selected request in separate active-service
      registers before freeing its waiting queue slot. Hold that active request and
      payload across setup PRE/ACT and timing stalls until its final READ/WRITE commits.
      Setup commands never retire the active request. Aggregate service also keeps
      active-service ownership through completion. Waiting-queue dequeue at dispatch
      is distinct from active-request retirement. Row state changes only on the responsible
      committed operation; uncommitted proposals cannot change state.
    owners:
    - command_engine
  BASE_MODULARITY:
    verification:
    - V_BASE_MODULARITY
    origin: request.BASE_MODULARITY
    statement: Keep request storage, request selection, command sequencing, timing
      enforcement and functional memory in independently verifiable modules with explicit
      interfaces. No single controller core may own all these functions. Each mandatory
      role has distinct module owners with functional inter-module connections. Module
      names and further decomposition remain design choices.
    owners:
    - command_engine
  BASE_LEGALITY:
    verification:
    - V_BASE_LEGALITY
    origin: request.BASE_LEGALITY
    statement: Compute command permission from registered timing/bank history and
      an independent candidate. An accepted ACT pulse is derived from candidate &&
      permission; permission must not combinationally depend on that same accepted
      pulse. Scheduler selection/validity must be available independently of timing_ok;
      timing_ok may gate commit but must not create a selection-validity feedback
      loop. Declare accurate per-output combinational input dependencies.
    owners:
    - timing_enforcement
  BASE_RESET:
    verification:
    - V_BASE_RESET
    origin: request.BASE_RESET
    statement: Use top-level clk and active-low rst_n. Reset clears pending requests,
      active service, row validity, memory and responses. Preserve reusable blocks
      with either synchronous or asynchronous active-low resets driven by the same
      rst_n; differing assertion styles do not require rebuilding otherwise reusable
      blocks. Do not change polarity without an explicit adapter.
    owners:
    - host_protocol
  BASE_POLICY:
    verification:
    - V_BASE_POLICY
    origin: request.BASE_POLICY
    statement: Honor the requested scheduler policy fifo. Preserve page policy open_page.
      Open-page retains a serviced row; close-page closes it before subsequent bank
      use. Preserve request ownership through any setup sequence. Internal module
      decomposition and command latency may change while these observable contracts
      hold.
    owners:
    - fifo_scheduler
  BASE_REFRESH:
    verification:
    - V_BASE_REFRESH
    origin: request.BASE_REFRESH
    statement: Retain periodic refresh requests using profile tREFI, refresh priority
      and request/acknowledgment handling without dropping queued traffic. Refresh
      must make progress and normal requests must resume. Existing refresh is simplified;
      full REF/tRFC servicing remains later feature work. If explicit REF is proposed,
      describe drain/row-state interaction and acknowledge once at commit.
    owners:
    - refresh_control
  BASE_TRRD:
    verification:
    - V_BASE_TRRD
    origin: request.BASE_TRRD
    statement: tRRD is enabled; honor that setting and resolve enabled timing values
      from DDR4-3200.
    owners:
    - timing_enforcement
  BASE_TFAW:
    verification:
    - V_BASE_TFAW
    origin: request.BASE_TFAW
    statement: tFAW is enabled; honor that setting and resolve enabled timing values
      from DDR4-3200.
    owners:
    - timing_enforcement
  CONSTRAINT_1:
    verification:
    - V_CONSTRAINT_1
    origin: request.CONSTRAINT_1
    statement: Requested constraint /design_name = "ddr4_controller_top".
    owners:
    - host_protocol
  CONSTRAINT_2:
    verification:
    - V_CONSTRAINT_2
    origin: request.CONSTRAINT_2
    statement: Requested constraint /design_type = "memory_controller".
    owners:
    - host_protocol
  CONSTRAINT_3:
    verification:
    - V_CONSTRAINT_3
    origin: request.CONSTRAINT_3
    statement: Requested constraint /features/page_policy = "open_page".
    owners:
    - fifo_scheduler
  CONSTRAINT_4:
    verification:
    - V_CONSTRAINT_4
    origin: request.CONSTRAINT_4
    statement: Requested constraint /features/refresh = true.
    owners:
    - refresh_control
  CONSTRAINT_5:
    verification:
    - V_CONSTRAINT_5
    origin: request.CONSTRAINT_5
    statement: Requested constraint /features/scheduler = "fifo".
    owners:
    - fifo_scheduler
  CONSTRAINT_6:
    verification:
    - V_CONSTRAINT_6
    origin: request.CONSTRAINT_6
    statement: Requested constraint /features/tFAW = true.
    owners:
    - timing_enforcement
  CONSTRAINT_7:
    verification:
    - V_CONSTRAINT_7
    origin: request.CONSTRAINT_7
    statement: Requested constraint /features/tRRD = true.
    owners:
    - timing_enforcement
  CONSTRAINT_8:
    verification:
    - V_CONSTRAINT_8
    origin: request.CONSTRAINT_8
    statement: Requested constraint /memory/protocol = "DDR4".
    owners:
    - host_protocol
  CONSTRAINT_9:
    verification:
    - V_CONSTRAINT_9
    origin: request.CONSTRAINT_9
    statement: Requested constraint /memory/speed = "3200".
    owners:
    - host_protocol
  CONSTRAINT_10:
    verification:
    - V_CONSTRAINT_10
    origin: request.CONSTRAINT_10
    statement: Requested constraint /microarchitecture/baseline = "current_controller".
    owners:
    - host_protocol
  CONSTRAINT_11:
    verification:
    - V_CONSTRAINT_11
    origin: request.CONSTRAINT_11
    statement: Requested constraint /microarchitecture/waiting_capacity = 4.
    owners:
    - waiting_queue
  CONSTRAINT_12:
    verification:
    - V_CONSTRAINT_12
    origin: request.CONSTRAINT_12
    statement: Requested constraint /topology/banks = 4.
    owners:
    - bank_state
  SYS_ORDERING:
    origin: model_selected
    statement: Acceptance order defines global FIFO order. Dispatch transfers only
      the oldest previously stored request. Physical row state, legality, cleanup,
      refresh, and timing may delay service but may not select a younger request ahead
      of the oldest waiting request.
    verification:
    - V_SYS_ORDERING
    owners:
    - fifo_scheduler
  SYS_SIMULTANEOUS:
    origin: model_selected
    statement: At a reset edge, reset wins over admission, dispatch, command commit,
      retirement, response delivery, refresh due, and refresh acknowledgment. Without
      reset, a full waiting queue may admit and dispatch on the same edge using the
      pre-edge head and pre-edge incoming payload. Retirement does not authorize dispatch
      on its own edge. A refresh due coincident with REF commit leaves refresh pending
      set for a later service interval.
    verification:
    - V_SYS_SIMULTANEOUS
    owners:
    - waiting_queue
  SYS_STORAGE_OWNERSHIP:
    origin: model_selected
    statement: Waiting storage, active-service storage, and captured response storage
      are logically distinct capacities. Active-service storage contains one complete
      dispatched request until final READ or WRITE commit. Captured response storage
      contains no request-capacity claim and survives active release, cleanup, and
      refresh service.
    verification:
    - V_SYS_STORAGE_OWNERSHIP
    owners:
    - waiting_queue
verification:
  V_R1:
    rules:
    - R1
    scenario: Apply consecutive valid requests, including same-address writes followed
      by reads, while command progress varies independently.
    expected: Each qualifying ready/valid edge admits one request; service and final
      completion remain in acceptance order; cmd_ready does not affect admission.
    status: planned_not_executed
  V_R2:
    rules:
    - R2
    scenario: Exercise empty, partial, and full waiting storage, including capacity
      one and simultaneous dispatch/admission.
    expected: Only pre-edge stored entries dispatch; the pre-edge head is captured
      before release; no bypass or retirement-edge active replacement occurs.
    status: planned_not_executed
  V_R3:
    rules:
    - R3
    scenario: Service closed-bank, row-hit, and row-conflict reads and writes while
      timing-blocking each candidate and raising refresh pending.
    expected: Only NOP, ACT, PRE, READ, WRITE, and REF semantics are used; one command
      at most commits per edge; setup does not retire; blocked candidates remain stable.
    status: planned_not_executed
  V_R4:
    rules:
    - R4
    scenario: Inspect future architecture contracts and interface-level verification
      intent.
    expected: Required behavioral roles are independently contractable with structural
      top-level integration only; no single owner contract contains all required functions.
    status: planned_not_executed
  V_R5:
    rules:
    - R5
    scenario: Test each timing relation at E+T-1 and E+T, including reset, ACT bursts,
      and REF exclusion.
    expected: Only committed history changes timing and bank state; tRCD, tRAS, tRP,
      tRRD, tFAW, and tRFC use the selected profile and exact edge convention.
    status: planned_not_executed
  V_R6:
    rules:
    - R6
    scenario: Write distinct values to all compact addresses in multiple banks, read
      them, and reset during response visibility.
    expected: Only committed WRITE changes addressed banked storage; READ captures
      pre-edge data and produces one E+1 response; responses survive active release
      and refresh.
    status: planned_not_executed
  V_R7:
    rules:
    - R7
    scenario: Run identical traffic under open_page and close_page parameter values.
    expected: Open-page retains serviced rows; close-page reserves cleanup until legal
      PRE and blocks dispatch during cleanup.
    status: planned_not_executed
  V_R8:
    rules:
    - R8
    scenario: Create refresh due conditions while idle, active, cleanup-reserved,
      and during refresh service; leave multiple banks open.
    expected: Pending coalesces, due wins over simultaneous acknowledgment, active
      and cleanup drain before ascending PRE, REF commits once, tRFC exclusion holds,
      and queued traffic resumes.
    status: planned_not_executed
  V_R9:
    rules:
    - R9
    scenario: Vary incoming address, row state, timing legality, queue fullness, idle/busy
      state, cleanup, refresh, and txn_valid.
    expected: cmd_ready reports only the defined first-command diagnostic probe and
      never changes admission, storage, dispatch, history, or reservations.
    status: planned_not_executed
  V_R10:
    rules:
    - R10
    scenario: Assert reset during queued, active, stalled, refresh, command-commit,
      and response conditions.
    expected: Reset immediately gates visible valid, ready, and events low and synchronously
      clears specified state at the sampled edge; no pre-reset work reappears.
    status: planned_not_executed
  V_R11:
    rules:
    - R11
    scenario: Review generated future verification intent against all rule IDs and
      declared host/event bindings.
    expected: Every request rule has reciprocal planned verification, declared independent
      scenarios, and expected outcomes; no downstream execution claim is made.
    status: planned_not_executed
  V_BASE_HOST:
    rules:
    - BASE_HOST
    scenario: Hold valid high across ready cycles and hold payload stable across stalls
      and reset.
    expected: Ports and widths match; each ready/valid edge is distinct; txn_ready
      and rsp_valid are low during reset; cmd_ready is not an acceptance handshake.
    status: planned_not_executed
  V_BASE_ADDRESS:
    rules:
    - BASE_ADDRESS
    scenario: Apply every 4-bit address and all four banks.
    expected: Rows and columns are zero-extended from the specified address slices;
      internal request fields retain bank, row, column, write flag, and data.
    status: planned_not_executed
  V_BASE_QUEUE:
    rules:
    - BASE_QUEUE
    scenario: Fill waiting storage while one active request stalls, then perform dispatch/admission,
      retirement, and read response delivery independently.
    expected: Four waiting plus one active request are retained; dispatch frees waiting
      storage but not transaction ownership; response storage consumes neither capacity.
    status: planned_not_executed
  V_BASE_DATA:
    rules:
    - BASE_DATA
    scenario: Scoreboard bank-isolated writes and reads over all sixteen locations
      per bank and inject blocked proposals.
    expected: Reset data are zero; only committed writes update data; every committed
      read yields exactly one response; proposals do not mutate storage.
    status: planned_not_executed
  V_BASE_TIMING:
    rules:
    - BASE_TIMING
    scenario: Exercise ACT-to-access, ACT-to-PRE, PRE-to-ACT, ACT spacing, and activation-window
      boundaries.
    expected: Basic timing remains enforced together with enabled tRRD and tFAW using
      activation commits rather than admissions or proposals.
    status: planned_not_executed
  V_BASE_SEQUENCE:
    rules:
    - BASE_SEQUENCE
    scenario: Dispatch a complete request, change host inputs afterward, and stall
      each setup and final command.
    expected: Captured active payload survives until final commit; dispatch/dequeue
      and retirement remain distinct; only committed operations change row state.
    status: planned_not_executed
  V_BASE_MODULARITY:
    rules:
    - BASE_MODULARITY
    scenario: Review future decomposition contracts and declared functional interfaces.
    expected: Request storage, selection, sequencing, timing, and functional memory
      are independently verifiable and distinct.
    status: planned_not_executed
  V_BASE_LEGALITY:
    rules:
    - BASE_LEGALITY
    scenario: Independently vary candidate, registered history, selection validity,
      and timing permission.
    expected: Permission has no same-pulse acceptance feedback; timing may gate commit
      but cannot create selection-validity feedback; output dependencies are declarable
      from interface inputs.
    status: planned_not_executed
  V_BASE_RESET:
    rules:
    - BASE_RESET
    scenario: Check top clock/reset polarity and reset behavior across all state categories.
    expected: clk/rst_n polarity is preserved, synchronous reset clears required state,
      and no polarity adapter is required.
    status: planned_not_executed
  V_BASE_POLICY:
    rules:
    - BASE_POLICY
    scenario: Compare row-retention and cleanup behavior under configured page-policy
      values.
    expected: The default is open_page; close_page behavior remains configurable without
      loss of request ownership.
    status: planned_not_executed
  V_BASE_REFRESH:
    rules:
    - BASE_REFRESH
    scenario: Generate periodic due events under queued traffic and defer service
      through active work.
    expected: Refresh progresses without dropping traffic, acknowledges at REF commit,
      and normal requests resume.
    status: planned_not_executed
  V_BASE_TRRD:
    rules:
    - BASE_TRRD
    scenario: Commit ACT then attempt another ACT before and at the selected tRRD
      boundary.
    expected: The later ACT is blocked before E+tRRD and may proceed at E+tRRD subject
      to all other permissions.
    status: planned_not_executed
  V_BASE_TFAW:
    rules:
    - BASE_TFAW
    scenario: Inject four earlier ACT commits respecting tRRD and probe a fifth before
      and at expiration of the oldest tFAW history.
    expected: The fifth ACT is blocked while four earlier ACTs have age strictly below
      tFAW and is released when the oldest reaches the boundary subject to other constraints.
    status: planned_not_executed
  V_CONSTRAINT_1:
    rules:
    - CONSTRAINT_1
    scenario: Inspect package metadata.
    expected: design_name is ddr4_controller_top.
    status: planned_not_executed
  V_CONSTRAINT_2:
    rules:
    - CONSTRAINT_2
    scenario: Inspect package metadata.
    expected: Design type is memory_controller.
    status: planned_not_executed
  V_CONSTRAINT_3:
    rules:
    - CONSTRAINT_3
    scenario: Inspect selected parameterization.
    expected: Default page policy is open_page.
    status: planned_not_executed
  V_CONSTRAINT_4:
    rules:
    - CONSTRAINT_4
    scenario: Inspect refresh behavior and profile bindings.
    expected: Periodic refresh behavior is included.
    status: planned_not_executed
  V_CONSTRAINT_5:
    rules:
    - CONSTRAINT_5
    scenario: Observe admission, dispatch, and service ordering under row-hit and
      row-miss traffic.
    expected: FIFO policy is retained independent of row-hit preference.
    status: planned_not_executed
  V_CONSTRAINT_6:
    rules:
    - CONSTRAINT_6
    scenario: Apply ACT history at the timing boundary.
    expected: tFAW gating is enabled using the selected-profile binding.
    status: planned_not_executed
  V_CONSTRAINT_7:
    rules:
    - CONSTRAINT_7
    scenario: Apply successive ACT candidates at the timing boundary.
    expected: tRRD gating is enabled using the selected-profile binding.
    status: planned_not_executed
  V_CONSTRAINT_8:
    rules:
    - CONSTRAINT_8
    scenario: Inspect timing profile selection and command vocabulary.
    expected: Protocol selection is DDR4.
    status: planned_not_executed
  V_CONSTRAINT_9:
    rules:
    - CONSTRAINT_9
    scenario: Inspect timing profile selection.
    expected: Selected profile is DDR4-3200.
    status: planned_not_executed
  V_CONSTRAINT_10:
    rules:
    - CONSTRAINT_10
    scenario: Inspect recorded baseline configuration.
    expected: Baseline is current_controller.
    status: planned_not_executed
  V_CONSTRAINT_11:
    rules:
    - CONSTRAINT_11
    scenario: Fill waiting storage under the selected configuration.
    expected: WAITING_CAPACITY is four.
    status: planned_not_executed
  V_CONSTRAINT_12:
    rules:
    - CONSTRAINT_12
    scenario: Access every selected bank.
    expected: BANK_COUNT is four.
    status: planned_not_executed
  V_SYS_ORDERING:
    rules:
    - SYS_ORDERING
    scenario: Place older row misses and conflicts ahead of newer row hits and vary
      timing stalls.
    expected: Dispatch and completion follow acceptance order despite different command
      setup costs.
    status: planned_not_executed
  V_SYS_SIMULTANEOUS:
    rules:
    - SYS_SIMULTANEOUS
    scenario: Align reset, full-queue admission/dispatch, retirement, refresh due,
      and REF commit in separate and combined trials.
    expected: Specified priority and same-edge outcomes occur with no lost request,
      duplicate request, or lost refresh due.
    status: planned_not_executed
  V_SYS_STORAGE_OWNERSHIP:
    rules:
    - SYS_STORAGE_OWNERSHIP
    scenario: Track waiting, active, and response occupancy through dispatch, retirement,
      cleanup, refresh, and response delivery.
    expected: The three storage categories remain capacity-independent as specified.
    status: planned_not_executed
