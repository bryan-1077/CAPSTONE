assumptions:
  A_CLOCK_CONTINUES:
    statement: clk continues through reset and reset is sampled at at least one rising
      edge when state clearing is required.
    status: documented
  A_HOST_STABILITY:
    statement: The host holds txn_valid and all request payload fields stable during
      any cycle in which txn_valid is asserted and txn_ready is low.
    status: documented
  A_HOST_RESPONSE_SAMPLING:
    statement: The host samples every rsp_valid pulse; no response-ready or response-backpressure
      signal exists.
    status: documented
  A_EVENTUAL_PROGRESS:
    statement: Eventual completion requires future legal command opportunities and
      clock progress; no fixed host-visible latency bound is specified.
    status: documented
  A_REFRESH_MODEL:
    statement: The refresh behavior is a functional periodic pending/drain/service
      model and is not a claim of complete physical DDR4 refresh-debt behavior.
    status: documented
