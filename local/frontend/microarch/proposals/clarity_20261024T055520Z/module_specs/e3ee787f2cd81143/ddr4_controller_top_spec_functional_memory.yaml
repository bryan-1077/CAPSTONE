design_name: ddr4_controller_top_spec_functional_memory
design_type: datapath
clock:
  name: clk
reset:
  name: rst_n
  active_low: true
  synchronous: true
ports:
- name: commit_valid
  direction: input
  width: 1
  description: shared.types.bit
- name: commit_command
  direction: input
  width: 53
  description: shared.types.command
- name: rsp_valid
  direction: output
  width: 1
  description: shared.types.bit
- name: rsp_data
  direction: output
  width: 32
  description: shared.types.data
behavior:
  description: Implement the complete functional_memory contract below. All structured
    contract and system context fields are normative. Internal representations and
    algorithms may vary within this boundary.
  contract:
    status: draft
    role: functional_memory_and_responses
    owned_state:
      words: Four banks of sixteen registered 32-bit words.
      response: One registered valid/data response stage independent of request capacity.
    interfaces:
      commit_valid:
        direction: input
        type: shared.types.bit
        width: 1
      commit_command:
        direction: input
        type: shared.types.command
        width: 53
      rsp_valid:
        direction: output
        type: shared.types.bit
        width: 1
      rsp_data:
        direction: output
        type: shared.types.data
        width: 32
    handshakes:
      commit: Committed WRITE updates only its word; committed READ captures pre-edge
        data.
      response: response_delivery samples pre-edge response. A simultaneous new READ
        replaces the response slot for the following edge.
    reset: Synchronously zero memory, response data, and response validity; immediately
      gate rsp_valid low.
    update_events:
      shared.events.command_commit: WRITE updates addressed storage and READ captures
        pre-edge data and asserts response validity.
      shared.events.response_delivery: Clear old validity unless simultaneous committed
        READ replaces it.
    stalls: No command-side or response-side backpressure exists.
    simultaneous_events:
      delivery_and_READ: Deliver old response and capture replacement.
      reset_and_events: Reset wins.
    invariants:
    - system.rules.BASE_DATA
    - system.rules.CONSTRAINT_12
    - system.rules.R6
    - execution.rules.EXEC_RESPONSE
    verification:
    - system.verification.V_MEMORY
    - system.verification.V_ADDRESS
    - execution.verification.X_RESPONSE
    combinational_dependencies: &id014
      rsp_valid: []
      rsp_data: []
  specification_context:
    package_id: ddr4_controller_top_spec
    revision: draft_001
    package_fingerprint: ea0e149468731c4749403581559fddbb02bbe1d572ad7949fb74f44cc6b1f2c6
    parameters:
      BANK_COUNT: 4
      WAITING_CAPACITY: 4
      ACTIVE_CAPACITY: 1
      PAGE_POLICY: open_page
      DATA_WIDTH: 32
      HOST_ADDR_WIDTH: 4
      REQUEST_BANK_WIDTH: 2
      REQUEST_ROW_WIDTH: 10
      REQUEST_COLUMN_WIDTH: 6
      COMMAND_OPCODE_WIDTH: 3
      READ_RESPONSE_LATENCY: 1
      TFAW_ACT_LIMIT: 4
      HOST_BANK_WIDTH: 2
      MEMORY_WORDS_PER_BANK: 16
    types:
      bit:
        kind: unsigned
        width: 1
      data:
        kind: unsigned
        width: 32
      host_address:
        kind: unsigned
        width: 4
      host_bank:
        kind: unsigned
        width: 2
      bank:
        kind: unsigned
        width: 2
      row:
        kind: unsigned
        width: 10
      column:
        kind: unsigned
        width: 6
      opcode:
        kind: enum
        width: 3
        encodings:
          NOP: 0
          ACT: 1
          PRE: 2
          READ: 3
          WRITE: 4
          REF: 5
        reserved:
        - 6
        - 7
      request:
        kind: record
        packed_order: msb_to_lsb
        fields:
        - name: bank
          type: shared.types.bank
          width: 2
          msb: 50
          lsb: 49
        - name: row
          type: shared.types.row
          width: 10
          msb: 48
          lsb: 39
        - name: column
          type: shared.types.column
          width: 6
          msb: 38
          lsb: 33
        - name: is_write
          type: shared.types.bit
          width: 1
          msb: 32
          lsb: 32
        - name: wdata
          type: shared.types.data
          width: 32
          msb: 31
          lsb: 0
        mapping:
          bank: Zero-extend txn_bank.
          row: Zero-extend txn_addr[3:2].
          column: Zero-extend txn_addr[1:0].
          is_write: txn_is_write.
          wdata: txn_wdata.
        legal_values: bank is less than BANK_COUNT; host-originated row[9:2] and column[5:2]
          are zero.
        width: 51
      command:
        kind: record
        packed_order: msb_to_lsb
        fields:
        - name: opcode
          type: shared.types.opcode
          width: 3
          msb: 52
          lsb: 50
        - name: bank
          type: shared.types.bank
          width: 2
          msb: 49
          lsb: 48
        - name: row
          type: shared.types.row
          width: 10
          msb: 47
          lsb: 38
        - name: column
          type: shared.types.column
          width: 6
          msb: 37
          lsb: 32
        - name: wdata
          type: shared.types.data
          width: 32
          msb: 31
          lsb: 0
        semantics:
          NOP: Canonical all-zero payload; never commits.
          ACT: Open bank at row; column and wdata are zero.
          PRE: Close bank; row, column, and wdata are zero.
          READ: Access matching open bank row and column; wdata is zero.
          WRITE: Access matching open bank row and column with wdata.
          REF: All-bank refresh; bank, row, column, and wdata are zero.
        width: 53
      bank_valid:
        kind: array
        element_type: shared.types.bit
        count: 4
        packed_order: ascending_index_from_lsb
        width: 4
        element_width: 1
        index_lsb: index * element_width
      bank_rows:
        kind: array
        element_type: shared.types.row
        count: 4
        packed_order: ascending_index_from_lsb
        width: 40
        element_width: 10
        index_lsb: index * element_width
    clock_reset:
      clock: clk
      edge: rising
      reset: rst_n
      active_level: 0
      priority: reset_before_all_events
      assertion_style: synchronous
      handshake_gating: Suppress all valid, ready, admission, dispatch, commit, response-delivery,
        and refresh events while rst_n is low.
    events:
      admission:
        condition: At a rising clk edge, rst_n is high and pre-edge txn_valid and
          txn_ready are high.
        effect: Capture one complete mapped request into waiting storage.
      dispatch:
        condition: At a rising clk edge, rst_n is high, active ownership is absent,
          cleanup and refresh service are absent, no candidate is outstanding, and
          a pre-edge FIFO head is selected.
        effect: Capture the complete pre-edge FIFO head into active ownership and
          release exactly that waiting entry.
      candidate_create:
        condition: At a rising clk edge, rst_n is high, active ownership exists, candidate
          storage is empty, refresh preparation or service is not selected, and no
          command commits on that edge.
        effect: Create a candidate from registered active ownership and registered
          bank state.
      command_commit:
        condition: At a rising clk edge, rst_n is high, candidate_valid and candidate_ok
          are high, and candidate_command is non-NOP and nonreserved.
        effect: Commit one command and update only state assigned to that committed
          opcode.
      retirement:
        condition: shared.events.command_commit commits READ or WRITE for the active
          request.
        effect: Retire one active request; READ captures response state before active
          release.
      response_delivery:
        condition: At a rising clk edge, rst_n is high and pre-edge rsp_valid is high.
        effect: The host samples pre-edge rsp_rdata.
      refresh_due:
        condition: At a rising clk edge, rst_n is high and the periodic deadline reaches
          that edge.
        effect: Set sticky refresh pending; simultaneous REF acknowledgment cannot
          clear newly due pending.
      refresh_start:
        condition: shared.events.command_commit commits REF.
        effect: Acknowledge one pending refresh and begin tRFC command exclusion.
      refresh_end:
        condition: At a rising clk edge, rst_n is high and the edge is at least tRFC
          cycles after committed REF.
        effect: End refresh command exclusion.
    timing_profile:
      selection: DDR4-3200
      unit: cycles
      values:
        tRCD: 22
        tRAS: 52
        tRP: 22
        tRRD: 6
        tFAW: 40
        tREFI: 12480
        tRFC: 560
    timing_rules:
      edge_convention: A trigger committed at edge E permits a blocked command at
        E+T when all other conditions hold. Reset creates no timing history. tFAW
        counts earlier ACT commits whose age at the candidate edge is strictly less
        than its window.
      tRCD:
        trigger: ACT
        blocked:
        - READ
        - WRITE
        minimum: 22
        scope: same_bank
      tRAS:
        trigger: ACT
        blocked:
        - PRE
        minimum: 52
        scope: same_bank
      tRP:
        trigger: PRE
        blocked:
        - ACT
        - REF
        minimum: 22
        scope: same_bank_for_ACT_all_banks_for_REF
      tRRD:
        trigger: ACT
        blocked:
        - ACT
        minimum: 6
        scope: all_banks
      tFAW:
        trigger: ACT
        blocked:
        - ACT
        window: 40
        limit: 4
        scope: all_banks
      tRFC:
        trigger: REF
        blocked:
        - ACT
        - PRE
        - READ
        - WRITE
        - REF
        minimum: 560
        scope: all_banks
    system_rules:
      R1:
        verification:
        - V_FIFO
        origin: request.R1
        statement: Implement global FIFO service in acceptance order, including same-address
          writes and reads. Admit on every rising-edge txn_valid && txn_ready, independently
          of command readiness.
        owners:
        - waiting_queue
      R2:
        verification:
        - V_CAPACITY
        origin: request.R2
        statement: Provide four waiting entries plus one separately stored active
          request. Dispatch only previously stored requests, capture the complete
          pre-edge head before releasing its slot, and permit full-queue simultaneous
          dispatch/admission including capacity one. No empty-queue bypass or same-edge
          active replacement at retirement.
        owners:
        - waiting_queue
      R3:
        verification:
        - V_SEQUENCE
        origin: request.R3
        statement: Use explicit NOP/ACT/PRE/READ/WRITE/REF command semantics, with
          NOP never committed and at most one command commit per edge. Sequence closed
          banks with ACT-access, row hits with access, and row conflicts with PRE-ACT-access.
          PRE/ACT never retire the active request. Keep blocked candidates stable
          through stalls and newly pending refresh.
        owners:
        - command_engine
      R4:
        verification:
        - V_ISOLATION
        origin: request.R4
        statement: Keep separate owners for host mapping, waiting storage, scheduling,
          command sequencing, row state, timing, functional memory/responses, and
          refresh control. The top must contain structural connections only.
        owners:
        - host_protocol
      R5:
        verification:
        - V_TIMING
        origin: request.R5
        statement: Update bank state and timing history only from committed commands.
          Enforce tRCD, tRAS, tRP, tRRD, tFAW and tRFC using the selected project
          profile. A trigger at E permits the blocked command at E+T; tFAW counts
          earlier ACT commits with age strictly less than its window. Reset creates
          no synthetic timing history.
        owners:
        - timing_enforcement
      R6:
        verification:
        - V_MEMORY
        origin: request.R6
        statement: Preserve functional banked 32-bit memory and compact host address
          mapping. WRITE commit updates storage; READ commit at E captures pre-edge
          data and registers valid/data for host sampling at E+1, with no extra adapter
          response register. Responses survive active release, cleanup and refresh;
          writes produce no response.
        owners:
        - functional_memory
      R7:
        verification:
        - V_PAGE
        origin: request.R7
        statement: Open-page retains rows. Support close-page as a configurable alternative,
          retaining a separate cleanup bank reservation after retirement until a legal
          PRE commits; block new dispatch during cleanup.
        owners:
        - command_engine
      R8:
        verification:
        - V_REFRESH
        origin: request.R8
        statement: Generate periodic refresh deadlines from the last sampled reset
          edge using tREFI. Coalesce missed deadlines into sticky pending; a due deadline
          wins over simultaneous REF acknowledgment. Drain active work and cleanup,
          PRE remaining open banks in ascending order, respect all-bank tRP, commit
          REF once, and exclude commands strictly before REF-edge+tRFC. Retain queued
          traffic and resume service afterward.
        owners:
        - refresh_control
      R9:
        verification:
        - V_DIAGNOSTIC
        origin: request.R9
        statement: cmd_ready is reset-gated diagnostic readiness for the incoming
          request's first needed command, using independent row/timing probe queries
          while the engine is idle and cleanup/refresh permit. It is meaningful without
          txn_valid and must not admit, dispatch, bypass FIFO, mutate history or reserve
          storage.
        owners:
        - host_protocol
      R10:
        verification:
        - V_RESET
        origin: request.R10
        statement: Use synchronous active-low reset for state, with immediate valid/ready/event
          gating. Reset clears queued/active/cleanup work, row state, timing history,
          memory, responses and refresh state; it wins over every simultaneous event.
          The host holds payload while stalled and samples every response; no response
          backpressure is provided.
        owners:
        - host_protocol
      R11:
        verification:
        - V_EXPORT
        origin: request.R11
        statement: Generate architecture-specific module isolation and system verification
          intent with exact requirement IDs, independent scenarios/expected results,
          and declared port/event bindings. Export it alongside RTL for the external
          UVM/vector stage. Do not execute downstream verification or backend stages
          in this frontend flow.
        owners:
        - host_protocol
      R12:
        verification:
        - V_CANDIDATE
        origin: request.R12
        statement: Explicitly distinguish initial command candidate creation from
          replacement. Dispatch captures the request without forming a candidate on
          that edge. When the candidate slot is empty, form the first candidate on
          a later edge from registered ownership and current bank state. Hold a blocked
          candidate unchanged. Commit clears its slot; a following candidate is formed
          only on a later edge using updated bank state, never by same-edge replacement.
          Reset wins; an outstanding candidate holds or commits before other progress.
          With no candidate, drain active service, then cleanup, then pending refresh
          preparation. Refresh service blocks dispatch and new candidate formation.
          Internal state encoding remains an implementation choice.
        owners:
        - command_engine
      R13:
        verification:
        - V_PAYLOAD
        origin: request.R13
        statement: Define payload behavior independently of valid gating. candidate_command
          is canonical zero NOP when candidate_valid is low. commit_command mirrors
          candidate_command even when candidate_ok is low; permission gates commit_valid
          only, and consumers sample payload only on commit_valid. probe_command remains
          the combinational first-command query from the incoming request and bank
          state even when probe_valid is low; idle, cleanup and refresh restrictions
          gate probe validity/readiness, not its payload. Reset forces all command
          payloads to zero NOP. Combinational dependencies must include any current-cycle
          input used to gate payload, not just its valid signal.
        owners:
        - command_engine
      BASE_HOST:
        verification:
        - V_HOST
        - V_RESET
        origin: request.BASE_HOST
        statement: Preserve the existing host ports and widths listed in the baseline
          contract. Accept a request only on a rising clk edge with txn_valid && txn_ready.
          Hold payload while stalled. Consecutive accepted cycles with txn_valid held
          high are distinct requests. cmd_ready is execution/timing visibility, not
          the host acceptance handshake. Deassert txn_ready and rsp_valid during reset.
        owners:
        - host_protocol
      BASE_ADDRESS:
        verification:
        - V_ADDRESS
        origin: request.BASE_ADDRESS
        statement: 'Preserve the simplified 4-bit txn_addr mapping: row=txn_addr[3:2],
          column=txn_addr[1:0], zero-extended into the internal 10-bit row and 6-bit
          column fields. Preserve explicit txn_bank for multi-bank configurations;
          a single-bank configuration uses bank 0. Internal packed requests retain
          bank(2), row(10), column(6), write flag(1), write data(32).'
        owners:
        - host_protocol
      BASE_QUEUE:
        verification:
        - V_CAPACITY
        - V_EXACTLY_ONCE
        origin: request.BASE_QUEUE
        statement: 'Provide 4 WAITING request slots PLUS one separately stored active-service
          request: waiting plus active capacity is 5. The active request must not
          consume a waiting slot. Dispatch captures the complete pre-edge request
          in active registers and frees its waiting slot without retiring the transaction.
          A full queue may admit on the same edge as dispatch; retirement alone does
          not free waiting storage. Accepted request fields survive stalls and each
          accepted request is serviced exactly once within a reset-free epoch. Keep
          admission, dispatch, retirement and read response delivery distinct. Captured
          response storage consumes neither waiting nor active capacity.'
        owners:
        - waiting_queue
      BASE_DATA:
        verification:
        - V_MEMORY
        origin: request.BASE_DATA
        statement: Provide functional 32-bit memory storage with 16 addresses per
          bank, bank isolation and reset-to-zero contents. Accepted writes update
          only their addressed location at service completion or a committed WRITE.
          Each accepted read produces exactly one one-cycle rsp_valid pulse with the
          stored rsp_rdata after read service/READ commit, using the existing one-cycle
          response stage. Writes produce no host response. Selection and stalled candidates
          cannot mutate memory; mere command output without storage and read responses
          is insufficient.
        owners:
        - functional_memory
      BASE_TIMING:
        verification:
        - V_TIMING
        origin: request.BASE_TIMING
        statement: Retain existing tRCD, tRAS and tRP timing protection from the selected
          JEDEC profile. ACT-to-READ/WRITE must wait tRCD, ACT-to-PRE must respect
          tRAS, and PRE-to-next-ACT must respect tRP if explicit commands are used.
          Aggregate service may retain the existing protected timing envelope instead.
          Configured tRRD and tFAW gates must use accepted activation events, not
          host admissions or stalled proposals. Never treat existing basic timing
          as an unrequested future feature.
        owners:
        - timing_enforcement
      BASE_SEQUENCE:
        verification:
        - V_SEQUENCE
        - V_CANDIDATE
        origin: request.BASE_SEQUENCE
        statement: Dispatch captures the complete selected request in separate active-service
          registers before freeing its waiting queue slot. Hold that active request
          and payload across setup PRE/ACT and timing stalls until its final READ/WRITE
          commits. Setup commands never retire the active request. Aggregate service
          also keeps active-service ownership through completion. Waiting-queue dequeue
          at dispatch is distinct from active-request retirement. Row state changes
          only on the responsible committed operation; uncommitted proposals cannot
          change state.
        owners:
        - command_engine
      BASE_MODULARITY:
        verification:
        - V_ISOLATION
        origin: request.BASE_MODULARITY
        statement: Keep request storage, request selection, command sequencing, timing
          enforcement and functional memory in independently verifiable modules with
          explicit interfaces. No single controller core may own all these functions.
          Each mandatory role has distinct module owners with functional inter-module
          connections. Module names and further decomposition remain design choices.
        owners:
        - host_protocol
      BASE_LEGALITY:
        verification:
        - V_TIMING
        origin: request.BASE_LEGALITY
        statement: Compute command permission from registered timing/bank history
          and an independent candidate. An accepted ACT pulse is derived from candidate
          && permission; permission must not combinationally depend on that same accepted
          pulse. Scheduler selection/validity must be available independently of timing_ok;
          timing_ok may gate commit but must not create a selection-validity feedback
          loop. Declare accurate per-output combinational input dependencies.
        owners:
        - timing_enforcement
      BASE_RESET:
        verification:
        - V_RESET
        origin: request.BASE_RESET
        statement: Use top-level clk and active-low rst_n. Reset clears pending requests,
          active service, row validity, memory and responses. Preserve reusable blocks
          with either synchronous or asynchronous active-low resets driven by the
          same rst_n; differing assertion styles do not require rebuilding otherwise
          reusable blocks. Do not change polarity without an explicit adapter.
        owners:
        - host_protocol
      BASE_POLICY:
        verification:
        - V_FIFO
        - V_PAGE
        origin: request.BASE_POLICY
        statement: Honor the requested scheduler policy fifo. Preserve page policy
          open_page. Open-page retains a serviced row; close-page closes it before
          subsequent bank use. Preserve request ownership through any setup sequence.
          Internal module decomposition and command latency may change while these
          observable contracts hold.
        owners:
        - fifo_scheduler
      BASE_REFRESH:
        verification:
        - V_REFRESH
        origin: request.BASE_REFRESH
        statement: Retain periodic refresh requests using profile tREFI, refresh priority
          and request/acknowledgment handling without dropping queued traffic. Refresh
          must make progress and normal requests must resume. Existing refresh is
          simplified; full REF/tRFC servicing remains later feature work. If explicit
          REF is proposed, describe drain/row-state interaction and acknowledge once
          at commit.
        owners:
        - refresh_control
      BASE_TRRD:
        verification:
        - V_TIMING
        origin: request.BASE_TRRD
        statement: tRRD is enabled; honor that setting and resolve enabled timing
          values from DDR4-3200.
        owners:
        - timing_enforcement
      BASE_TFAW:
        verification:
        - V_TIMING
        origin: request.BASE_TFAW
        statement: tFAW is enabled; honor that setting and resolve enabled timing
          values from DDR4-3200.
        owners:
        - timing_enforcement
      CONSTRAINT_1:
        verification:
        - V_IDENTITY
        origin: request.CONSTRAINT_1
        statement: Requested constraint /design_name = "ddr4_controller_top".
        owners:
        - host_protocol
      CONSTRAINT_2:
        verification:
        - V_IDENTITY
        origin: request.CONSTRAINT_2
        statement: Requested constraint /design_type = "memory_controller".
        owners:
        - host_protocol
      CONSTRAINT_3:
        verification:
        - V_CONFIGURATION
        origin: request.CONSTRAINT_3
        statement: Requested constraint /features/page_policy = "open_page".
        owners:
        - command_engine
      CONSTRAINT_4:
        verification:
        - V_CONFIGURATION
        origin: request.CONSTRAINT_4
        statement: Requested constraint /features/refresh = true.
        owners:
        - refresh_control
      CONSTRAINT_5:
        verification:
        - V_CONFIGURATION
        origin: request.CONSTRAINT_5
        statement: Requested constraint /features/scheduler = "fifo".
        owners:
        - fifo_scheduler
      CONSTRAINT_6:
        verification:
        - V_CONFIGURATION
        origin: request.CONSTRAINT_6
        statement: Requested constraint /features/tFAW = true.
        owners:
        - timing_enforcement
      CONSTRAINT_7:
        verification:
        - V_CONFIGURATION
        origin: request.CONSTRAINT_7
        statement: Requested constraint /features/tRRD = true.
        owners:
        - timing_enforcement
      CONSTRAINT_8:
        verification:
        - V_CONFIGURATION
        origin: request.CONSTRAINT_8
        statement: Requested constraint /memory/protocol = "DDR4".
        owners:
        - timing_enforcement
      CONSTRAINT_9:
        verification:
        - V_CONFIGURATION
        origin: request.CONSTRAINT_9
        statement: Requested constraint /memory/speed = "3200".
        owners:
        - timing_enforcement
      CONSTRAINT_10:
        verification:
        - V_CONFIGURATION
        origin: request.CONSTRAINT_10
        statement: Requested constraint /microarchitecture/baseline = "current_controller".
        owners:
        - command_engine
      CONSTRAINT_11:
        verification:
        - V_CAPACITY
        origin: request.CONSTRAINT_11
        statement: Requested constraint /microarchitecture/waiting_capacity = 4.
        owners:
        - waiting_queue
      CONSTRAINT_12:
        verification:
        - V_ADDRESS
        - V_MEMORY
        origin: request.CONSTRAINT_12
        statement: Requested constraint /topology/banks = 4.
        owners:
        - functional_memory
      SYS_SIMULTANEOUS:
        origin: model_selected
        statement: Reset wins over every event. With reset inactive, admission may
          coincide with command commit. Full waiting storage may admit on a dispatch
          edge using the pre-edge head for dispatch and the incoming request for the
          tail. Dispatch and retirement do not coincide because active ownership remains
          occupied through retirement. A refresh due coincident with REF commit leaves
          pending asserted.
        verification:
        - V_CAPACITY
        - V_REFRESH
        - V_RESET
        owners:
        - waiting_queue
      SYS_STORAGE:
        origin: model_selected
        statement: Waiting storage holds admitted undispatched requests, active storage
          holds one dispatched unretired request, and response storage holds one captured
          read response. These capacities are independent. Dispatch release is not
          retirement.
        verification:
        - V_CAPACITY
        - V_EXACTLY_ONCE
        - V_MEMORY
        owners:
        - waiting_queue
    execution_rules:
      EXEC_COMMIT:
        origin: model_selected
        statement: candidate_command is the canonical proposal. commit_command mirrors
          it even when candidate_ok is low. commit_valid requires reset inactive,
          valid candidate, permission, and non-NOP nonreserved opcode. At most one
          command commits per edge and all consumers sample the same payload only
          on commit_valid.
        verification:
        - X_COMMIT
        owners:
        - command_engine
      EXEC_BANK_STATE:
        origin: model_selected
        statement: Only committed ACT opens and records its bank row, committed PRE
          closes its bank, and committed REF clears all rows after preparation. READ
          and WRITE retain open rows. Probes, proposals, admissions, dispatches, and
          stalls do not alter row state.
        verification:
        - X_BANK
        owners:
        - bank_state
      EXEC_RESPONSE:
        origin: model_selected
        statement: 'READ commit at E captures pre-edge memory data and registers rsp_valid
          and rsp_rdata for host sampling at E+1. Delivery and a new READ may share
          an edge: the host samples the old response before replacement. Writes produce
          no response.'
        verification:
        - X_RESPONSE
        owners:
        - functional_memory
      EXEC_REFRESH:
        origin: model_selected
        statement: The first deadline is the last reset-sampled edge plus tREFI; later
          deadlines advance by tREFI independently of REF. Pending is sticky. Pending
          blocks dispatch and candidate creation after outstanding candidate or active
          work resolves, drains cleanup, closes remaining open banks in ascending
          order, waits all-bank tRP, commits REF once, and excludes commands strictly
          before REF-edge+tRFC.
        verification:
        - X_REFRESH
        owners:
        - refresh_control
      EXEC_CLEANUP:
        origin: model_selected
        statement: Open-page creates no cleanup reservation after retirement. Close-page
          reserves the serviced bank until legal PRE commit, blocks dispatch, and
          does not duplicate retirement or response. Refresh preparation waits for
          cleanup.
        verification:
        - X_CLEANUP
        owners:
        - command_engine
      EXEC_PAYLOAD:
        origin: model_selected
        statement: candidate_command is zero NOP when candidate_valid is low. A blocked
          valid candidate remains unchanged. probe_command is the combinational first-command
          query from incoming mapped request and registered bank state even when probe
          validity is low. Reset forces all command payloads to zero NOP.
        verification:
        - X_PAYLOAD
        owners:
        - command_engine
      EXEC_PERMISSION:
        origin: model_selected
        statement: Permission uses registered timing history, registered bank state,
          independent candidate, and selected bindings. ACT requires closed bank;
          READ/WRITE require matching open row; PRE requires open bank; REF requires
          all banks closed and all-bank tRP. Permission does not depend on same-edge
          commit or updates.
        verification:
        - X_PERMISSION
        owners:
        - timing_enforcement
      EXEC_READY:
        origin: model_selected
        statement: txn_ready reflects only waiting admission capacity including same-edge
          dispatch release. cmd_ready is reset-gated diagnostic first-command readiness
          using independent row and timing probes while idle and permitted by cleanup
          and refresh state. Neither diagnostic alters state.
        verification:
        - X_READY
        owners:
        - command_engine
    decisions:
      D_FIFO:
        origin: requested_constraint
        status: recorded
        value: global_acceptance_order
        reason: Accepted requests are serviced in FIFO acceptance order.
      D_CAPACITY:
        origin: requested_constraint
        status: recorded
        value: four_waiting_plus_one_active
        reason: Waiting and active capacities are distinct.
      D_COMMANDS:
        origin: requested_constraint
        status: recorded
        value: explicit_NOP_ACT_PRE_READ_WRITE_REF
        reason: Explicit command semantics and commit gating are required.
      D_PAGE_POLICY:
        origin: requested_constraint
        status: recorded
        value: open_page_default_with_close_page_option
        reason: Open-page is requested while close-page is a configurable alternative.
      D_REFRESH:
        origin: requested_constraint
        status: recorded
        value: sticky_periodic_pending_drain_close_then_ref
        reason: Refresh deadlines coalesce and service drains work before REF.
      D_RESET:
        origin: requested_constraint
        status: recorded
        value: synchronous_active_low_state_reset_with_immediate_event_gating
        reason: State reset is synchronous and all externally visible events are immediately
          gated.
      D_RESPONSE:
        origin: requested_constraint
        status: recorded
        value: read_commit_E_host_sampling_E_plus_1
        reason: READ captures pre-edge data and provides the requested one-cycle response
          stage.
    assumptions:
      A_CLOCK:
        statement: clk continues to provide rising edges while rst_n is low so synchronous
          reset state clearing can occur.
        status: documented
      A_HOST_STALL:
        statement: The host holds txn_valid and all transaction payload fields stable
          while txn_valid is high and txn_ready is low.
        status: documented
      A_RESPONSE:
        statement: The host samples every rsp_valid pulse because no response-backpressure
          interface is provided.
        status: documented
      A_PROGRESS:
        statement: Service progress requires reset to remain inactive and timing and
          refresh intervals to elapse; no bounded transaction latency is asserted.
        status: documented
      A_PROFILE:
        statement: The selected timing library supplies the declared DDR4-3200 timing
          paths.
        status: requires_review
    request:
      constraints:
        design_name: ddr4_controller_top
        design_type: memory_controller
        memory:
          protocol: DDR4
          speed: '3200'
        topology:
          banks: 4
        features:
          scheduler: fifo
          page_policy: open_page
          refresh: true
          tRRD: true
          tFAW: true
        microarchitecture:
          baseline: current_controller
          waiting_capacity: 4
      requirements:
      - id: R1
        text: Implement global FIFO service in acceptance order, including same-address
          writes and reads. Admit on every rising-edge txn_valid && txn_ready, independently
          of command readiness.
      - id: R2
        text: Provide four waiting entries plus one separately stored active request.
          Dispatch only previously stored requests, capture the complete pre-edge
          head before releasing its slot, and permit full-queue simultaneous dispatch/admission
          including capacity one. No empty-queue bypass or same-edge active replacement
          at retirement.
      - id: R3
        text: Use explicit NOP/ACT/PRE/READ/WRITE/REF command semantics, with NOP
          never committed and at most one command commit per edge. Sequence closed
          banks with ACT-access, row hits with access, and row conflicts with PRE-ACT-access.
          PRE/ACT never retire the active request. Keep blocked candidates stable
          through stalls and newly pending refresh.
      - id: R4
        text: Keep separate owners for host mapping, waiting storage, scheduling,
          command sequencing, row state, timing, functional memory/responses, and
          refresh control. The top must contain structural connections only.
      - id: R5
        text: Update bank state and timing history only from committed commands. Enforce
          tRCD, tRAS, tRP, tRRD, tFAW and tRFC using the selected project profile.
          A trigger at E permits the blocked command at E+T; tFAW counts earlier ACT
          commits with age strictly less than its window. Reset creates no synthetic
          timing history.
      - id: R6
        text: Preserve functional banked 32-bit memory and compact host address mapping.
          WRITE commit updates storage; READ commit at E captures pre-edge data and
          registers valid/data for host sampling at E+1, with no extra adapter response
          register. Responses survive active release, cleanup and refresh; writes
          produce no response.
      - id: R7
        text: Open-page retains rows. Support close-page as a configurable alternative,
          retaining a separate cleanup bank reservation after retirement until a legal
          PRE commits; block new dispatch during cleanup.
      - id: R8
        text: Generate periodic refresh deadlines from the last sampled reset edge
          using tREFI. Coalesce missed deadlines into sticky pending; a due deadline
          wins over simultaneous REF acknowledgment. Drain active work and cleanup,
          PRE remaining open banks in ascending order, respect all-bank tRP, commit
          REF once, and exclude commands strictly before REF-edge+tRFC. Retain queued
          traffic and resume service afterward.
      - id: R9
        text: cmd_ready is reset-gated diagnostic readiness for the incoming request's
          first needed command, using independent row/timing probe queries while the
          engine is idle and cleanup/refresh permit. It is meaningful without txn_valid
          and must not admit, dispatch, bypass FIFO, mutate history or reserve storage.
      - id: R10
        text: Use synchronous active-low reset for state, with immediate valid/ready/event
          gating. Reset clears queued/active/cleanup work, row state, timing history,
          memory, responses and refresh state; it wins over every simultaneous event.
          The host holds payload while stalled and samples every response; no response
          backpressure is provided.
      - id: R11
        text: Generate architecture-specific module isolation and system verification
          intent with exact requirement IDs, independent scenarios/expected results,
          and declared port/event bindings. Export it alongside RTL for the external
          UVM/vector stage. Do not execute downstream verification or backend stages
          in this frontend flow.
      - id: R12
        text: Explicitly distinguish initial command candidate creation from replacement.
          Dispatch captures the request without forming a candidate on that edge.
          When the candidate slot is empty, form the first candidate on a later edge
          from registered ownership and current bank state. Hold a blocked candidate
          unchanged. Commit clears its slot; a following candidate is formed only
          on a later edge using updated bank state, never by same-edge replacement.
          Reset wins; an outstanding candidate holds or commits before other progress.
          With no candidate, drain active service, then cleanup, then pending refresh
          preparation. Refresh service blocks dispatch and new candidate formation.
          Internal state encoding remains an implementation choice.
      - id: R13
        text: Define payload behavior independently of valid gating. candidate_command
          is canonical zero NOP when candidate_valid is low. commit_command mirrors
          candidate_command even when candidate_ok is low; permission gates commit_valid
          only, and consumers sample payload only on commit_valid. probe_command remains
          the combinational first-command query from the incoming request and bank
          state even when probe_valid is low; idle, cleanup and refresh restrictions
          gate probe validity/readiness, not its payload. Reset forces all command
          payloads to zero NOP. Combinational dependencies must include any current-cycle
          input used to gate payload, not just its valid signal.
      - &id001
        id: BASE_HOST
        text: Preserve the existing host ports and widths listed in the baseline contract.
          Accept a request only on a rising clk edge with txn_valid && txn_ready.
          Hold payload while stalled. Consecutive accepted cycles with txn_valid held
          high are distinct requests. cmd_ready is execution/timing visibility, not
          the host acceptance handshake. Deassert txn_ready and rsp_valid during reset.
      - &id002
        id: BASE_ADDRESS
        text: 'Preserve the simplified 4-bit txn_addr mapping: row=txn_addr[3:2],
          column=txn_addr[1:0], zero-extended into the internal 10-bit row and 6-bit
          column fields. Preserve explicit txn_bank for multi-bank configurations;
          a single-bank configuration uses bank 0. Internal packed requests retain
          bank(2), row(10), column(6), write flag(1), write data(32).'
      - &id003
        id: BASE_QUEUE
        text: 'Provide 4 WAITING request slots PLUS one separately stored active-service
          request: waiting plus active capacity is 5. The active request must not
          consume a waiting slot. Dispatch captures the complete pre-edge request
          in active registers and frees its waiting slot without retiring the transaction.
          A full queue may admit on the same edge as dispatch; retirement alone does
          not free waiting storage. Accepted request fields survive stalls and each
          accepted request is serviced exactly once within a reset-free epoch. Keep
          admission, dispatch, retirement and read response delivery distinct. Captured
          response storage consumes neither waiting nor active capacity.'
      - &id004
        id: BASE_DATA
        text: Provide functional 32-bit memory storage with 16 addresses per bank,
          bank isolation and reset-to-zero contents. Accepted writes update only their
          addressed location at service completion or a committed WRITE. Each accepted
          read produces exactly one one-cycle rsp_valid pulse with the stored rsp_rdata
          after read service/READ commit, using the existing one-cycle response stage.
          Writes produce no host response. Selection and stalled candidates cannot
          mutate memory; mere command output without storage and read responses is
          insufficient.
      - &id005
        id: BASE_TIMING
        text: Retain existing tRCD, tRAS and tRP timing protection from the selected
          JEDEC profile. ACT-to-READ/WRITE must wait tRCD, ACT-to-PRE must respect
          tRAS, and PRE-to-next-ACT must respect tRP if explicit commands are used.
          Aggregate service may retain the existing protected timing envelope instead.
          Configured tRRD and tFAW gates must use accepted activation events, not
          host admissions or stalled proposals. Never treat existing basic timing
          as an unrequested future feature.
      - &id006
        id: BASE_SEQUENCE
        text: Dispatch captures the complete selected request in separate active-service
          registers before freeing its waiting queue slot. Hold that active request
          and payload across setup PRE/ACT and timing stalls until its final READ/WRITE
          commits. Setup commands never retire the active request. Aggregate service
          also keeps active-service ownership through completion. Waiting-queue dequeue
          at dispatch is distinct from active-request retirement. Row state changes
          only on the responsible committed operation; uncommitted proposals cannot
          change state.
      - &id007
        id: BASE_MODULARITY
        text: Keep request storage, request selection, command sequencing, timing
          enforcement and functional memory in independently verifiable modules with
          explicit interfaces. No single controller core may own all these functions.
          Each mandatory role has distinct module owners with functional inter-module
          connections. Module names and further decomposition remain design choices.
      - &id008
        id: BASE_LEGALITY
        text: Compute command permission from registered timing/bank history and an
          independent candidate. An accepted ACT pulse is derived from candidate &&
          permission; permission must not combinationally depend on that same accepted
          pulse. Scheduler selection/validity must be available independently of timing_ok;
          timing_ok may gate commit but must not create a selection-validity feedback
          loop. Declare accurate per-output combinational input dependencies.
      - &id009
        id: BASE_RESET
        text: Use top-level clk and active-low rst_n. Reset clears pending requests,
          active service, row validity, memory and responses. Preserve reusable blocks
          with either synchronous or asynchronous active-low resets driven by the
          same rst_n; differing assertion styles do not require rebuilding otherwise
          reusable blocks. Do not change polarity without an explicit adapter.
      - &id010
        id: BASE_POLICY
        text: Honor the requested scheduler policy fifo. Preserve page policy open_page.
          Open-page retains a serviced row; close-page closes it before subsequent
          bank use. Preserve request ownership through any setup sequence. Internal
          module decomposition and command latency may change while these observable
          contracts hold.
      - &id011
        id: BASE_REFRESH
        text: Retain periodic refresh requests using profile tREFI, refresh priority
          and request/acknowledgment handling without dropping queued traffic. Refresh
          must make progress and normal requests must resume. Existing refresh is
          simplified; full REF/tRFC servicing remains later feature work. If explicit
          REF is proposed, describe drain/row-state interaction and acknowledge once
          at commit.
      - &id012
        id: BASE_TRRD
        text: tRRD is enabled; honor that setting and resolve enabled timing values
          from DDR4-3200.
      - &id013
        id: BASE_TFAW
        text: tFAW is enabled; honor that setting and resolve enabled timing values
          from DDR4-3200.
      - id: CONSTRAINT_1
        text: Requested constraint /design_name = "ddr4_controller_top".
      - id: CONSTRAINT_2
        text: Requested constraint /design_type = "memory_controller".
      - id: CONSTRAINT_3
        text: Requested constraint /features/page_policy = "open_page".
      - id: CONSTRAINT_4
        text: Requested constraint /features/refresh = true.
      - id: CONSTRAINT_5
        text: Requested constraint /features/scheduler = "fifo".
      - id: CONSTRAINT_6
        text: Requested constraint /features/tFAW = true.
      - id: CONSTRAINT_7
        text: Requested constraint /features/tRRD = true.
      - id: CONSTRAINT_8
        text: Requested constraint /memory/protocol = "DDR4".
      - id: CONSTRAINT_9
        text: Requested constraint /memory/speed = "3200".
      - id: CONSTRAINT_10
        text: Requested constraint /microarchitecture/baseline = "current_controller".
      - id: CONSTRAINT_11
        text: Requested constraint /microarchitecture/waiting_capacity = 4.
      - id: CONSTRAINT_12
        text: Requested constraint /topology/banks = 4.
      baseline_contract:
        id: current_controller_v2
        design_name: ddr4_controller_top
        profile: DDR4-3200
        config:
          design_name: ddr4_controller_top
          design_type: memory_controller
          memory:
            protocol: DDR4
            speed: '3200'
          topology:
            banks: 4
          features:
            scheduler: fifo
            page_policy: open_page
            refresh: true
            tRRD: true
            tFAW: true
          microarchitecture:
            baseline: current_controller
            waiting_capacity: 4
        host_ports:
        - name: clk
          direction: input
          width: 1
        - name: rst_n
          direction: input
          width: 1
        - name: txn_valid
          direction: input
          width: 1
        - name: txn_is_write
          direction: input
          width: 1
        - name: txn_addr
          direction: input
          width: 4
        - name: txn_wdata
          direction: input
          width: 32
        - name: txn_bank
          direction: input
          width: 2
        - name: txn_ready
          direction: output
          width: 1
        - name: cmd_ready
          direction: output
          width: 1
        - name: rsp_valid
          direction: output
          width: 1
        - name: rsp_rdata
          direction: output
          width: 32
        requirements:
        - *id001
        - *id002
        - *id003
        - *id004
        - *id005
        - *id006
        - *id007
        - *id008
        - *id009
        - *id010
        - *id011
        - *id012
        - *id013
      design_kind: memory_controller
  active_ports:
  - commit_command
  - commit_valid
  - rsp_data
  - rsp_valid
  verification_obligations:
    system.verification.V_MEMORY:
      rules:
      - R6
      - BASE_DATA
      - CONSTRAINT_12
      - SYS_STORAGE
      scenario: Write and read every compact address in every bank, overlap response
        delivery with later reads, and reset during response visibility.
      expected: WRITE updates only its addressed word; READ captures pre-edge data
        and yields one E+1 response; banks isolate; reset zeros memory and cancels
        validity.
      status: planned_not_executed
    system.verification.V_ADDRESS:
      rules:
      - BASE_ADDRESS
      - CONSTRAINT_12
      scenario: Exercise all addresses and banks.
      expected: row, column, bank, widths, and packed request fields follow the declared
        compact mapping.
      status: planned_not_executed
    execution.verification.X_RESPONSE:
      rules:
      - EXEC_RESPONSE
      scenario: Commit consecutive reads, overlap delivery with a new READ, issue
        writes, and reset during response visibility.
      expected: Each READ yields exactly one E+1 sampled response with pre-edge data;
        writes yield none.
      status: planned_not_executed
invariants:
- 'system.rules.BASE_DATA: Provide functional 32-bit memory storage with 16 addresses
  per bank, bank isolation and reset-to-zero contents. Accepted writes update only
  their addressed location at service completion or a committed WRITE. Each accepted
  read produces exactly one one-cycle rsp_valid pulse with the stored rsp_rdata after
  read service/READ commit, using the existing one-cycle response stage. Writes produce
  no host response. Selection and stalled candidates cannot mutate memory; mere command
  output without storage and read responses is insufficient.'
- 'system.rules.CONSTRAINT_12: Requested constraint /topology/banks = 4.'
- 'system.rules.R6: Preserve functional banked 32-bit memory and compact host address
  mapping. WRITE commit updates storage; READ commit at E captures pre-edge data and
  registers valid/data for host sampling at E+1, with no extra adapter response register.
  Responses survive active release, cleanup and refresh; writes produce no response.'
- 'execution.rules.EXEC_RESPONSE: READ commit at E captures pre-edge memory data and
  registers rsp_valid and rsp_rdata for host sampling at E+1. Delivery and a new READ
  may share an edge: the host samples the old response before replacement. Writes
  produce no response.'
implementation_constraints:
- Use the exact elaborated port widths and packed field offsets; no additional public
  ports.
- Honor every contract handshake, reset, update event, stall and simultaneous-event
  rule.
- Do not transfer owned state or responsibilities into another module or top-level
  wiring.
- Implement the declared combinational dependencies accurately; internal registers
  and helper logic remain implementation choices.
- Parameter values and timing values in specification_context are concrete for this
  build; do not substitute legacy defaults.
- A conditionally omitted input has no signal in this build; apply its specified absent-port
  behavior.
