      design_kind: memory_controller
  active_ports:
  - enq_ready
  - enq_request
  - enq_valid
  - head_request
  - head_take
  - head_valid
  verification_obligations:
    execution.verification.X_READY:
      scenario: Vary occupancy, dispatch opportunity, incoming command type, row/timing
        state, txn_valid, cleanup, refresh, and reset.
      expected: txn_ready tracks admission capacity only and cmd_ready is side-effect-free
        diagnostic readiness.
      status: planned_not_executed
      rules:
      - EXEC_READY
    system.verification.V_CAPACITY:
      scenario: Fill waiting storage, stall active service, dispatch at full occupancy,
        admit concurrently with dispatch, and retire with queued work.
      expected: Four waiting entries and one active request coexist; full waiting
        storage admits on dispatch; retirement alone does not free waiting storage;
        no empty-queue bypass occurs.
      status: planned_not_executed
      rules:
      - BASE_QUEUE
      - CONSTRAINT_11
      - R2
      - SYS_SIMULTANEOUS
      - SYS_STORAGE
    system.verification.V_CONFIGURATION:
      scenario: Inspect parameters, profile selection, timing bindings, and recorded
        decisions.
      expected: Open-page default, refresh, FIFO, tFAW, tRRD, DDR4-3200, current_controller
        baseline, and four-bank topology are recorded.
      status: planned_not_executed
      rules:
      - CONSTRAINT_10
      - CONSTRAINT_3
      - CONSTRAINT_4
      - CONSTRAINT_5
      - CONSTRAINT_6
      - CONSTRAINT_7
      - CONSTRAINT_8
      - CONSTRAINT_9
    system.verification.V_EXACTLY_ONCE:
      scenario: Apply long timing stalls, refresh delays, repeated queue reuse, and
        mixed traffic in a reset-free epoch.
      expected: Each admitted request is dispatched and serviced once with no loss,
        duplication, or premature retirement.
      status: planned_not_executed
      rules:
      - BASE_QUEUE
      - SYS_STORAGE
    system.verification.V_EXPORT:
      scenario: Inspect this package before downstream UVM/vector use.
      expected: Requirement IDs, scenarios, expected outcomes, declared interfaces,
        and declared events are present; no downstream execution or backend completion
        is claimed.
      status: planned_not_executed
      rules:
      - R11
    system.verification.V_FIFO:
      scenario: Accept mixed read/write traffic including same-address write/read
        pairs, row hits, misses, and timing stalls.
      expected: Dispatch and retirement follow acceptance order exactly; command readiness
        does not control admission; younger requests never bypass older requests.
      status: planned_not_executed
      rules:
      - BASE_POLICY
      - R1
    system.verification.V_HOST:
      scenario: Hold valid and payload through stalls and across consecutive ready
        cycles.
      expected: Only valid-and-ready rising edges admit requests; consecutive qualifying
        edges are distinct; cmd_ready never substitutes for txn_ready.
      status: planned_not_executed
      rules:
      - BASE_HOST
    system.verification.V_IDENTITY:
      scenario: Inspect package metadata.
      expected: The design name is ddr4_controller_top and design kind is memory_controller.
      status: planned_not_executed
      rules:
      - CONSTRAINT_1
      - CONSTRAINT_2
    system.verification.V_ISOLATION:
      scenario: Review future architecture export against required functional responsibilities.
      expected: Distinct independently verifiable functional responsibilities and
        a structural-only top are declared without selecting an architecture here.
      status: planned_not_executed
      rules:
      - BASE_MODULARITY
      - R4
    system.verification.V_MEMORY:
      scenario: Write and read every compact address in every bank, overlap response
        delivery with later reads, and reset during response visibility.
      expected: WRITE updates only its addressed word; READ captures pre-edge data
        and yields one E+1 response; banks isolate; reset zeros memory and cancels
        validity.
      status: planned_not_executed
      rules:
      - BASE_DATA
      - CONSTRAINT_12
      - R6
      - SYS_STORAGE
    system.verification.V_PAGE:
      scenario: Run equivalent traffic under both page-policy values, create a close-page
        cleanup reservation, and assert refresh during cleanup.
      expected: Open-page retains rows. Close-page retirement creates a separate cleanup
        reservation, blocks dispatch, creates exactly one legal PRE candidate after
        retirement, and releases the reservation only when that PRE commits. Refresh
        preparation begins only after cleanup completes.
