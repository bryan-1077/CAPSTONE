      - SYS_SIMULTANEOUS
invariants:
- 'execution.rules.EXEC_READY: txn_ready reflects only waiting admission capacity
  including same-edge dispatch release. cmd_ready is reset-gated diagnostic first-command
  readiness using independent row and timing probes while idle and permitted by cleanup
  and refresh state. Neither diagnostic alters state.'
- 'system.rules.BASE_HOST: Preserve the existing host ports and widths listed in the
  baseline contract. Accept a request only on a rising clk edge with txn_valid &&
  txn_ready. Hold payload while stalled. Consecutive accepted cycles with txn_valid
  held high are distinct requests. cmd_ready is execution/timing visibility, not the
  host acceptance handshake. Deassert txn_ready and rsp_valid during reset.'
- 'system.rules.BASE_MODULARITY: Keep request storage, request selection, command
  sequencing, timing enforcement and functional memory in independently verifiable
  modules with explicit interfaces. No single controller core may own all these functions.
  Each mandatory role has distinct module owners with functional inter-module connections.
  Module names and further decomposition remain design choices.'
- 'system.rules.BASE_QUEUE: Provide 4 WAITING request slots PLUS one separately stored
  active-service request: waiting plus active capacity is 5. The active request must
  not consume a waiting slot. Dispatch captures the complete pre-edge request in active
  registers and frees its waiting slot without retiring the transaction. A full queue
  may admit on the same edge as dispatch; retirement alone does not free waiting storage.
  Accepted request fields survive stalls and each accepted request is serviced exactly
  once within a reset-free epoch. Keep admission, dispatch, retirement and read response
  delivery distinct. Captured response storage consumes neither waiting nor active
  capacity.'
- 'system.rules.BASE_RESET: Use top-level clk and active-low rst_n. Reset clears pending
  requests, active service, row validity, memory and responses. Preserve reusable
  blocks with either synchronous or asynchronous active-low resets driven by the same
  rst_n; differing assertion styles do not require rebuilding otherwise reusable blocks.
  Do not change polarity without an explicit adapter.'
