binding_version: 1
sampling:
  phase: pre_edge
  reset_gates_events: true
events:
  admission:
    status: bound
    when:
      all:
      - endpoint: top.txn_valid
        equals: 1
      - endpoint: top.txn_ready
        equals: 1
    payload:
      request:
        endpoint: host_adapter.incoming_request
  dispatch:
    status: bound
    when:
      all:
      - endpoint: fifo_scheduler.dispatch_valid
        equals: 1
      - endpoint: command_engine.dispatch_ready
        equals: 1
    payload:
      request:
        endpoint: fifo_scheduler.dispatch_request
  command_commit:
    status: bound
    when:
      endpoint: command_engine.commit_valid
      equals: 1
    payload:
      command:
        endpoint: command_engine.commit_command
  retirement:
    status: bound
    when:
      all:
      - endpoint: command_engine.commit_valid
        equals: 1
      - any:
        - endpoint: command_engine.commit_command
          field: opcode
          equals: READ
        - endpoint: command_engine.commit_command
          field: opcode
          equals: WRITE
    payload:
      command:
        endpoint: command_engine.commit_command
  response_delivery:
    status: bound
    when:
      endpoint: top.rsp_valid
      equals: 1
    payload:
      data:
        endpoint: top.rsp_rdata
  refresh_start:
    status: bound
    when:
      all:
      - endpoint: command_engine.commit_valid
        equals: 1
      - endpoint: command_engine.commit_command
        field: opcode
        equals: REF
    payload:
      command:
        endpoint: command_engine.commit_command
  refresh_due:
    status: unbound
    reason: Deadline state is internal. Independent checks derive tREFI deadlines
      from reset epochs and observe refresh_pending transitions and REF acknowledgments.
  refresh_end:
    status: unbound
    reason: No service-end pulse is externally exposed. Independent checks derive
      tRFC completion and observe refresh_busy.
  candidate_create:
    status: unbound
    reason: Candidate creation is internal registered ownership. Checks observe candidate
      payload and valid behavior across dispatch, commit, and stalls.
  cleanup_candidate_create:
    status: unbound
    reason: Cleanup control creation is internal. Checks infer it from committed retirement,
      candidate behavior, row state, and dispatch inhibition.
  refresh_candidate_create:
    status: unbound
    reason: Refresh preparation creation is internal. Checks infer ordered PRE and
      REF candidates from pending state and committed command traces.
observations:
  host_ready:
    endpoint: top.txn_ready
  cmd_ready:
    endpoint: top.cmd_ready
  incoming_request:
    endpoint: host_adapter.incoming_request
  dispatch_ready:
    endpoint: command_engine.dispatch_ready
  candidate_valid:
    endpoint: command_engine.candidate_valid
  candidate_command:
    endpoint: command_engine.candidate_command
  candidate_ok:
    endpoint: timing_enforcer.candidate_ok
  probe_valid:
    endpoint: command_engine.probe_valid
  probe_command:
    endpoint: command_engine.probe_command
  probe_ok:
    endpoint: timing_enforcer.probe_ok
  open_valid:
    endpoint: row_state.open_valid
  open_rows:
    endpoint: row_state.open_rows
  refresh_pending:
    endpoint: refresh_control.refresh_pending
  refresh_busy:
    endpoint: refresh_control.refresh_busy
checks:
  system.verification.V_ADDRESS:
    scope: both
    events:
    - admission
    observations:
    - incoming_request
    note: Check compact host address mapping and request field packing independently.
  system.verification.V_CANDIDATE:
    scope: both
    events:
    - dispatch
    - command_commit
    observations:
    - candidate_valid
    - candidate_command
    - candidate_ok
    - refresh_pending
    note: Check later-edge creation, blocked hold, commit clear, no same-edge replacement,
      and control priority.
  system.verification.V_CAPACITY:
    scope: both
    events:
    - admission
    - dispatch
    - retirement
    observations:
    - host_ready
    - dispatch_ready
    note: Reconstruct waiting occupancy from event history and verify separate active
      capacity.
  system.verification.V_CONFIGURATION:
    scope: system
    events:
    - command_commit
    observations:
    - refresh_pending
    - refresh_busy
    note: Inspect selected configuration, profile bindings, and declared policy behavior.
  system.verification.V_DIAGNOSTIC:
    scope: both
    events:
    - admission
    - dispatch
    - command_commit
    observations:
    - cmd_ready
    - probe_valid
    - probe_command
    - probe_ok
    - candidate_valid
    - refresh_pending
    - refresh_busy
    note: Verify diagnostic readiness is idle-only, side-effect-free, and meaningful
      without txn_valid.
  system.verification.V_EXACTLY_ONCE:
    scope: system
    events:
    - admission
    - dispatch
    - retirement
    observations: []
    note: Compare admitted, dispatched, and retired request sequences within reset-free
      epochs.
  system.verification.V_EXPORT:
    scope: system
    events:
    - admission
    observations: []
    note: Inspect declared requirement IDs, scenarios, events, interfaces, and planned
      status without claiming execution.
  system.verification.V_FIFO:
    scope: both
    events:
    - admission
    - dispatch
    - retirement
    observations: []
    note: Compare accepted and dispatched complete payload ordering.
  system.verification.V_HOST:
    scope: both
    events:
    - admission
    observations:
    - host_ready
    - cmd_ready
    - incoming_request
    note: Check valid-ready admission and distinction between txn_ready and cmd_ready.
  system.verification.V_IDENTITY:
    scope: system
    events:
    - admission
    observations: []
    note: Inspect declared design identity and kind.
  system.verification.V_ISOLATION:
    scope: system
    events:
    - dispatch
    - command_commit
    observations: []
    note: Inspect distinct functional owners and structural-only integration.
  system.verification.V_MEMORY:
    scope: both
    events:
    - command_commit
    - response_delivery
    observations: []
    note: Maintain independent banked-memory reference contents and response expectations.
  system.verification.V_PAGE:
    scope: both
    events:
    - retirement
    - command_commit
    - dispatch
    observations:
    - open_valid
    - open_rows
    - candidate_valid
    - candidate_command
    - dispatch_ready
    - refresh_pending
    note: Check open-page retention and close-page cleanup reservation behavior.
  system.verification.V_PAYLOAD:
    scope: both
    events:
    - command_commit
    observations:
    - candidate_valid
    - candidate_command
    - candidate_ok
    - probe_valid
    - probe_command
    note: Check canonical invalid NOP payload, commit mirroring, held blocked payload,
      and independent probe payload.
  system.verification.V_REFRESH:
    scope: both
    events:
    - command_commit
    - dispatch
    - retirement
    - refresh_start
    observations:
    - refresh_pending
    - refresh_busy
    - candidate_valid
    - candidate_command
    - dispatch_ready
    - open_valid
    note: Check pending dispatch inhibition, drain, ordered preparation, REF, tRFC
      exclusion, and resumption.
  system.verification.V_RESET:
    scope: both
    events:
    - admission
    - dispatch
    - command_commit
    - response_delivery
    observations:
    - host_ready
    - cmd_ready
    - candidate_valid
    - open_valid
    - refresh_pending
    - refresh_busy
    note: Assert reset across visible conditions and verify gating and cancellation.
  system.verification.V_SEQUENCE:
    scope: both
    events:
    - dispatch
    - command_commit
    - retirement
    observations:
    - candidate_command
    - candidate_valid
    - open_valid
    - open_rows
    note: Independently predict ACT/access and PRE/ACT/access sequences.
  system.verification.V_TIMING:
    scope: both
    events:
    - command_commit
    observations:
    - candidate_valid
    - candidate_command
    - candidate_ok
    - probe_valid
    - probe_command
    - probe_ok
    - open_valid
    - open_rows
    note: Check profile timing boundaries, committed-history-only updates, tRRD, and
      tFAW.
  execution.verification.X_BANK:
    scope: both
    events:
    - command_commit
    observations:
    - open_valid
    - open_rows
    note: Compare architectural row state only against committed ACT, PRE, and REF
      operations.
  execution.verification.X_CLEANUP:
    scope: both
    events:
    - retirement
    - command_commit
    - dispatch
    observations:
    - candidate_valid
    - candidate_command
    - dispatch_ready
    - refresh_pending
    note: Check distinct close-page cleanup PRE lifecycle and refresh wait.
  execution.verification.X_COMMIT:
    scope: both
    events:
    - command_commit
    observations:
    - candidate_valid
    - candidate_command
    - candidate_ok
    note: Check legal one-command commit and absence of effects from noncommits.
  execution.verification.X_CONTROL:
    scope: both
    events:
    - retirement
    - command_commit
    - dispatch
    observations:
    - candidate_valid
    - candidate_command
    - refresh_pending
    - dispatch_ready
    - open_valid
    note: Check cleanup and refresh control creation independently of active ownership.
  execution.verification.X_PAYLOAD:
    scope: both
    events:
    - command_commit
    observations:
    - candidate_valid
    - candidate_command
    - candidate_ok
    - probe_valid
    - probe_command
    note: Check reset and invalid payload behavior and permission-independent commit
      payload.
  execution.verification.X_PERMISSION:
    scope: both
    events:
    - command_commit
    observations:
    - candidate_valid
    - candidate_command
    - candidate_ok
    - open_valid
    - open_rows
    note: Check pre-edge legality and exact timing eligibility boundaries.
  execution.verification.X_READY:
    scope: both
    events:
    - admission
    - dispatch
    - command_commit
    observations:
    - host_ready
    - cmd_ready
    - probe_valid
    - probe_command
    - probe_ok
    - candidate_valid
    - refresh_pending
    - refresh_busy
    note: Check admission capacity versus side-effect-free engine-idle diagnostic
      readiness.
  execution.verification.X_REFRESH:
    scope: both
    events:
    - command_commit
    - dispatch
    - retirement
    - refresh_start
    observations:
    - refresh_pending
    - refresh_busy
    - candidate_valid
    - candidate_command
    - dispatch_ready
    - open_valid
    note: Independently derive deadlines and verify drain, coalescing, REF, and exclusion.
  execution.verification.X_RESPONSE:
    scope: both
    events:
    - command_commit
    - response_delivery
    observations: []
    note: Check one-cycle read response visibility, pre-edge read data, and no write
      response.
