specification_version: 1
package_id: ddr4_controller_top_spec
design_name: ddr4_controller_top
revision: draft_003
status: draft_for_review
scope:
  plan: current_controller_v2 request elaboration
  milestone: system_behavior_specification
  covered:
  - host_interface
  - request_lifecycle
  - fifo_service
  - command_semantics
  - timing_protection
  - banked_memory
  - responses
  - page_policy
  - refresh
  - reset
  - verification_intent
  pending: []
verification_strategy:
  status: planned_not_executed
  configurations:
    parameters:
      PAGE_POLICY:
      - open_page
      - close_page
      WAITING_CAPACITY:
      - 1
      - 4
    profiles:
    - DDR4-3200
  module_checks: Future downstream checks shall independently verify host mapping,
    waiting storage, FIFO selection, candidate lifecycle, command permission, row
    state, timing history, functional memory and responses, refresh control, cleanup
    control, and host diagnostics through declared interfaces.
  system_scenario: Apply directed and randomized host traffic with independent FIFO,
    command-trace, timing, memory, response, refresh, reset, cleanup, and diagnostic
    scoreboards.
  system_evidence: Planned evidence includes per-rule assertions, directed vectors,
    randomized traces, commit-edge monitors, timing-boundary checks, reset checks,
    simultaneous-event checks, and configuration coverage.
decisions:
  D_CAPACITY:
    origin: requested_constraint
    status: recorded
    value: four_waiting_plus_one_active
    reason: Waiting and active capacities are distinct.
  D_COMMANDS:
    origin: requested_constraint
    status: recorded
    value: explicit_NOP_ACT_PRE_READ_WRITE_REF
    reason: Explicit command semantics and commit gating are required.
  D_CONTROL_CANDIDATES:
    origin: model_selected
    status: recorded
    value: separate_active_cleanup_and_refresh_control_candidate_creation
    reason: Cleanup and refresh preparation require legal PRE and REF candidates after
      active request retirement or without active ownership.
  D_FIFO:
    origin: requested_constraint
    status: recorded
    value: global_acceptance_order
    reason: Accepted requests are serviced in FIFO acceptance order.
  D_PAGE_POLICY:
    origin: requested_constraint
    status: recorded
    value: open_page_default_with_close_page_option
    reason: Open-page is requested while close-page is a configurable alternative.
  D_REFRESH:
    origin: requested_constraint
    status: recorded
    value: sticky_periodic_pending_drain_close_then_ref
    reason: Refresh deadlines coalesce and service drains work before REF.
  D_RESET:
    origin: requested_constraint
    status: recorded
    value: synchronous_active_low_state_reset_with_immediate_event_gating
    reason: State reset is synchronous and visible events are immediately gated.
  D_RESPONSE:
    origin: requested_constraint
    status: recorded
    value: read_commit_E_host_sampling_E_plus_1
    reason: READ captures pre-edge data and provides the requested one-cycle response
      stage.
assumptions:
  A_CLOCK:
    statement: clk continues to provide rising edges while rst_n is low so synchronous
      reset state clearing can occur.
    status: documented
  A_HOST_STALL:
    statement: The host holds txn_valid and all transaction payload fields stable
      while txn_valid is high and txn_ready is low.
    status: documented
  A_PROFILE:
    statement: The selected timing library supplies the declared DDR4-3200 timing
      paths.
    status: requires_review
  A_PROGRESS:
    statement: Service progress requires reset to remain inactive and timing and refresh
      intervals to elapse; no bounded transaction latency is asserted.
    status: documented
  A_RESPONSE:
    statement: The host samples every rsp_valid pulse because no response-backpressure
      interface is provided.
    status: documented
open_questions:
  Q_PROFILE_PROVENANCE:
    blocks: design_review
    question: The authoritative provenance and acceptance of the selected DDR4-3200
      timing-library source requires external review before RTL generation; planned
      timing-boundary checks cannot establish library correctness.
  Q_RTL_APPROVAL:
    blocks: rtl_generation
    question: Approval of this exact draft package is required before RTL generation
      or downstream implementation export.
