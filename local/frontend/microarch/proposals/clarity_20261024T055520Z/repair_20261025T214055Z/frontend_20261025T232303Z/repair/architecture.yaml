    invariants:
    - 'execution.rules.EXEC_COMMIT: candidate_command is the canonical proposal. commit_command
      mirrors it even when candidate_ok is low. commit_valid requires reset inactive,
      valid candidate, permission, and non-NOP nonreserved opcode. At most one command
      commits per edge and all consumers sample the same payload only on commit_valid.'
    - 'execution.rules.EXEC_RESPONSE: READ commit at E captures pre-edge memory data
      and registers rsp_valid and rsp_rdata for host sampling at E+1. Delivery and
      a new READ may share an edge: the host samples the old response before replacement.
      Writes produce no response.'
    - 'system.rules.BASE_ADDRESS: Preserve the simplified 4-bit txn_addr mapping:
      row=txn_addr[3:2], column=txn_addr[1:0], zero-extended into the internal 10-bit
      row and 6-bit column fields. Preserve explicit txn_bank for multi-bank configurations;
      a single-bank configuration uses bank 0. Internal packed requests retain bank(2),
      row(10), column(6), write flag(1), write data(32).'
    - 'system.rules.BASE_DATA: Provide functional 32-bit memory storage with 16 addresses
      per bank, bank isolation and reset-to-zero contents. Accepted writes update
      only their addressed location at service completion or a committed WRITE. Each
      accepted read produces exactly one one-cycle rsp_valid pulse with the stored
      rsp_rdata after read service/READ commit, using the existing one-cycle response
      stage. Writes produce no host response. Selection and stalled candidates cannot
      mutate memory; mere command output without storage and read responses is insufficient.'
    - 'system.rules.BASE_MODULARITY: Keep request storage, request selection, command
      sequencing, timing enforcement and functional memory in independently verifiable
      modules with explicit interfaces. No single controller core may own all these
      functions. Each mandatory role has distinct module owners with functional inter-module
      connections. Module names and further decomposition remain design choices.'
    - 'system.rules.BASE_RESET: Use top-level clk and active-low rst_n. Reset clears
      pending requests, active service, row validity, memory and responses. Preserve
      reusable blocks with either synchronous or asynchronous active-low resets driven
      by the same rst_n; differing assertion styles do not require rebuilding otherwise
      reusable blocks. Do not change polarity without an explicit adapter.'
    - 'system.rules.CONSTRAINT_12: Requested constraint /topology/banks = 4.'
    - 'system.rules.R10: Use synchronous active-low reset for state, with immediate
      valid/ready/event gating. Reset clears queued/active/cleanup work, row state,
      timing history, memory, responses and refresh state; it wins over every simultaneous
      event. The host holds payload while stalled and samples every response; no response
      backpressure is provided.'
    - 'system.rules.R11: Generate architecture-specific module isolation and system
      verification intent with exact requirement IDs, independent scenarios/expected
      results, and declared port/event bindings. Export it alongside RTL for the external
      UVM/vector stage. Do not execute downstream verification or backend stages in
      this frontend flow.'
    - 'system.rules.R4: Keep separate owners for host mapping, waiting storage, scheduling,
      command sequencing, row state, timing, functional memory/responses, and refresh
      control. The top must contain structural connections only.'
    - 'system.rules.R6: Preserve functional banked 32-bit memory and compact host
      address mapping. WRITE commit updates storage; READ commit at E captures pre-edge
      data and registers valid/data for host sampling at E+1, with no extra adapter
      response register. Responses survive active release, cleanup and refresh; writes
      produce no response.'
    - 'system.rules.SYS_SIMULTANEOUS: Reset wins over every event. With reset inactive,
      admission may coincide with command commit. Full waiting storage may admit on
      a dispatch edge using the pre-edge head for dispatch and the incoming request
      for the tail. Dispatch and retirement do not coincide because active ownership
      remains occupied through retirement. A refresh due coincident with REF commit
      leaves pending asserted.'
    - 'system.rules.SYS_STORAGE: Waiting storage holds admitted undispatched requests,
      active storage holds one dispatched unretired request, cleanup reservation holds
      only a retired close-page bank awaiting its PRE, candidate storage holds exactly
      one uncommitted command proposal, and response storage holds one captured read
      response. These capacities are independent. Dispatch release is not retirement.'
    implementation_constraints:
    - Use the exact elaborated port widths and packed field offsets; no additional
      public ports.
    - Honor every contract handshake, reset, update event, stall and simultaneous-event
      rule.
    - Do not transfer owned state or responsibilities into another module or top-level
      wiring.
    - Implement the declared combinational dependencies accurately; internal registers
      and helper logic remain implementation choices.
    - Parameter values and timing values in specification_context are concrete for
      this build; do not substitute legacy defaults.
    - A conditionally omitted input has no signal in this build; apply its specified
      absent-port behavior.
    combinational_dependencies: *id045
- instance: refresh_control
  roles:
  - refresh
  responsibility: refresh_control
  spec:
    design_name: ddr4_controller_top_spec_refresh_control
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: commit_command
      direction: input
      width: 53
      description: shared.types.command
    - name: commit_valid
      direction: input
      width: 1
      description: shared.types.bit
    - name: refresh_pending
      direction: output
      width: 1
      description: shared.types.bit
    - name: refresh_busy
      direction: output
      width: 1
      description: shared.types.bit
    behavior:
      description: Implement the complete refresh_control contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: refresh_control
        owned_state:
          deadline: Periodic deadline relative to the last reset-sampled edge.
          pending: Sticky coalesced refresh request.
          service: Registered REF service exclusion interval.
        interfaces:
          commit_command:
            direction: input
            type: shared.types.command
            width: 53
          commit_valid:
            direction: input
            type: shared.types.bit
            width: 1
          refresh_pending:
            direction: output
            type: shared.types.bit
            width: 1
          refresh_busy:
            direction: output
            type: shared.types.bit
            width: 1
        handshakes:
          request: refresh_pending is level-sensitive and remains asserted until REF
            acknowledgment unless a simultaneous deadline reasserts it.
          acknowledgment: shared.events.refresh_start, a committed REF, is the sole
            acknowledgment path.
        reset: Synchronously clear deadline, pending, and service state; rebase the
          first deadline from the reset-sampled edge. Gate outputs low while reset
          is asserted.
        update_events:
          shared.events.refresh_due: Set pending and advance the periodic deadline
            by tREFI.
          shared.events.refresh_start: Start tRFC service and clear pending unless
            refresh_due occurs on the same edge.
          shared.events.refresh_end: End service exclusion while retaining independently
            accumulated pending.
        stalls: Deadlines advance through active work, cleanup, timing stalls, and
          refresh service. No request storage is owned.
        simultaneous_events:
          due_and_REF: Due wins pending update; REF starts exactly one service interval.
          due_and_service_end: Service ends but newly or previously pending refresh
            remains asserted.
          reset_and_events: Reset wins.
        combinational_dependencies: &id046
          refresh_pending: []
          refresh_busy: []
        invariants:
        - execution.rules.EXEC_COMMIT
        - execution.rules.EXEC_CONTROL_CREATION
        - execution.rules.EXEC_REFRESH
        - system.rules.BASE_MODULARITY
        - system.rules.BASE_REFRESH
        - system.rules.BASE_RESET
        - system.rules.CONSTRAINT_4
        - system.rules.CONSTRAINT_8
        - system.rules.R10
        - system.rules.R11
        - system.rules.R4
        - system.rules.R8
        - system.rules.SYS_SIMULTANEOUS
        verification:
        - execution.verification.X_COMMIT
        - execution.verification.X_CONTROL
        - execution.verification.X_REFRESH
        - system.verification.V_CAPACITY
        - system.verification.V_CONFIGURATION
        - system.verification.V_EXPORT
        - system.verification.V_ISOLATION
        - system.verification.V_REFRESH
        - system.verification.V_RESET
      specification_context: *id015
      active_ports:
      - commit_command
      - commit_valid
      - refresh_busy
      - refresh_pending
      verification_obligations:
        execution.verification.X_COMMIT: *id033
        execution.verification.X_CONTROL: *id034
        execution.verification.X_REFRESH: *id035
        system.verification.V_CAPACITY: *id022
        system.verification.V_CONFIGURATION: *id023
        system.verification.V_EXPORT: *id017
        system.verification.V_ISOLATION: *id018
        system.verification.V_REFRESH: *id029
        system.verification.V_RESET: *id020
    invariants:
    - 'execution.rules.EXEC_COMMIT: candidate_command is the canonical proposal. commit_command
      mirrors it even when candidate_ok is low. commit_valid requires reset inactive,
      valid candidate, permission, and non-NOP nonreserved opcode. At most one command
      commits per edge and all consumers sample the same payload only on commit_valid.'
    - 'execution.rules.EXEC_CONTROL_CREATION: A cleanup reservation creates PRE control
      work independently of active ownership. Refresh pending creates successive PRE
      control work for the lowest-index open bank and then REF control work when all
      banks are closed, independently of active ownership. While refresh pending is
      asserted, dispatch is inhibited. Control candidates are created only on later
      edges when the candidate slot is empty, hold while blocked, clear on commit,
      and do not receive same-edge replacement.'
    - 'execution.rules.EXEC_REFRESH: The first deadline is the last reset-sampled
      edge plus tREFI; later deadlines advance by tREFI independently of REF. Pending
      is sticky. Pending immediately prevents dispatch, waits for already owned active
      work and cleanup completion, creates ordered refresh-preparation PRE candidates
      until all banks are closed, waits all-bank tRP, creates and commits one REF
      candidate, and excludes commands strictly before REF-edge+tRFC.'
    - 'system.rules.BASE_MODULARITY: Keep request storage, request selection, command
      sequencing, timing enforcement and functional memory in independently verifiable
      modules with explicit interfaces. No single controller core may own all these
      functions. Each mandatory role has distinct module owners with functional inter-module
      connections. Module names and further decomposition remain design choices.'
    - 'system.rules.BASE_REFRESH: Retain periodic refresh requests using profile tREFI,
      refresh priority and request/acknowledgment handling without dropping queued
      traffic. Refresh must make progress and normal requests must resume. Existing
      refresh is simplified; full REF/tRFC servicing remains later feature work. If
      explicit REF is proposed, describe drain/row-state interaction and acknowledge
      once at commit.'
    - 'system.rules.BASE_RESET: Use top-level clk and active-low rst_n. Reset clears
      pending requests, active service, row validity, memory and responses. Preserve
      reusable blocks with either synchronous or asynchronous active-low resets driven
      by the same rst_n; differing assertion styles do not require rebuilding otherwise
      reusable blocks. Do not change polarity without an explicit adapter.'
    - 'system.rules.CONSTRAINT_4: Requested constraint /features/refresh = true.'
    - 'system.rules.CONSTRAINT_8: Requested constraint /memory/protocol = "DDR4".'
    - 'system.rules.R10: Use synchronous active-low reset for state, with immediate
      valid/ready/event gating. Reset clears queued/active/cleanup work, row state,
      timing history, memory, responses and refresh state; it wins over every simultaneous
      event. The host holds payload while stalled and samples every response; no response
      backpressure is provided.'
    - 'system.rules.R11: Generate architecture-specific module isolation and system
      verification intent with exact requirement IDs, independent scenarios/expected
      results, and declared port/event bindings. Export it alongside RTL for the external
      UVM/vector stage. Do not execute downstream verification or backend stages in
      this frontend flow.'
    - 'system.rules.R4: Keep separate owners for host mapping, waiting storage, scheduling,
      command sequencing, row state, timing, functional memory/responses, and refresh
      control. The top must contain structural connections only.'
    - 'system.rules.R8: Generate periodic refresh deadlines from the last sampled
      reset edge using tREFI. Coalesce missed deadlines into sticky pending; a due
      deadline wins over simultaneous REF acknowledgment. Drain active work and cleanup,
      PRE remaining open banks in ascending order, respect all-bank tRP, commit REF
      once, and exclude commands strictly before REF-edge+tRFC. Retain queued traffic
      and resume service afterward.'
    - 'system.rules.SYS_SIMULTANEOUS: Reset wins over every event. With reset inactive,
      admission may coincide with command commit. Full waiting storage may admit on
      a dispatch edge using the pre-edge head for dispatch and the incoming request
      for the tail. Dispatch and retirement do not coincide because active ownership
      remains occupied through retirement. A refresh due coincident with REF commit
      leaves pending asserted.'
    implementation_constraints:
    - Use the exact elaborated port widths and packed field offsets; no additional
      public ports.
    - Honor every contract handshake, reset, update event, stall and simultaneous-event
      rule.
    - Do not transfer owned state or responsibilities into another module or top-level
      wiring.
    - Implement the declared combinational dependencies accurately; internal registers
      and helper logic remain implementation choices.
    - Parameter values and timing values in specification_context are concrete for
      this build; do not substitute legacy defaults.
    - A conditionally omitted input has no signal in this build; apply its specified
      absent-port behavior.
