            not duplicated in ordinary connections.
        verification:
          binding_version: 1
          sampling:
            phase: pre_edge
            reset_gates_events: true
          events:
            admission:
              status: bound
              when:
                all:
                - endpoint: top.txn_valid
                  equals: 1
                - endpoint: top.txn_ready
                  equals: 1
              payload:
                request:
                  endpoint: host_adapter.incoming_request
            dispatch:
              status: bound
              when:
                all:
                - endpoint: fifo_scheduler.dispatch_valid
                  equals: 1
