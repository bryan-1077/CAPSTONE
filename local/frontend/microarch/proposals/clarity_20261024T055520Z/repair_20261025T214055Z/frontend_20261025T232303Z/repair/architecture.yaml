            command_engine:
              status: draft
              role: command_sequencing
              owned_state:
                active_request: One dispatched complete request retained through final
                  READ or WRITE commit.
                candidate: Registered valid bit and shared.types.command proposal.
                cleanup_reservation: Optional retired close-page bank awaiting its
                  committed PRE.
                refresh_preparation: Registered control ownership for ascending-bank
                  PRE preparation and REF creation.
              interfaces:
                dispatch_request:
                  direction: input
                  type: shared.types.request
                dispatch_valid:
                  direction: input
                  type: shared.types.bit
                dispatch_ready:
                  direction: output
                  type: shared.types.bit
                incoming_request:
                  direction: input
                  type: shared.types.request
                open_rows:
                  direction: input
                  type: shared.types.bank_rows
                open_valid:
                  direction: input
                  type: shared.types.bank_valid
                refresh_pending:
                  direction: input
                  type: shared.types.bit
                refresh_busy:
                  direction: input
                  type: shared.types.bit
                candidate_ok:
                  direction: input
                  type: shared.types.bit
                probe_ok:
                  direction: input
                  type: shared.types.bit
                candidate_command:
                  direction: output
                  type: shared.types.command
                candidate_valid:
                  direction: output
                  type: shared.types.bit
                commit_command:
                  direction: output
                  type: shared.types.command
                commit_valid:
                  direction: output
                  type: shared.types.bit
                probe_command:
                  direction: output
                  type: shared.types.command
                probe_valid:
                  direction: output
                  type: shared.types.bit
                execution_ready:
                  direction: output
                  type: shared.types.bit
              handshakes:
                dispatch: Accept exactly one FIFO head only when registered active
                  ownership, candidate storage, cleanup reservation, refresh preparation,
                  pending refresh, and refresh service are absent. Pending refresh
                  always inhibits dispatch before refresh-preparation control work.
                commit: candidate_command is canonical. commit_command mirrors it.
                  commit_valid requires reset inactive, candidate_valid, candidate_ok,
                  and a non-NOP nonreserved opcode.
                probe: 'probe_command is the independently computed first command
                  for incoming_request and registered row state regardless of probe_valid.
                  probe_valid and execution_ready are asserted only when registered
                  engine-idle conditions hold: no active request, no candidate, no
                  cleanup reservation, no refresh preparation, no pending refresh,
                  and no refresh service. Thus diagnostic readiness cannot assert
                  during active service, candidate occupancy, cleanup, or refresh
                  control.'
              reset: Synchronously clear active, candidate, cleanup, and refresh-preparation
                ownership. While reset is low, suppress dispatch_ready, candidate_valid,
                commit_valid, probe_valid, and execution_ready. Drive candidate_command,
                commit_command, and probe_command to zero NOP.
              update_events:
                shared.events.dispatch: Capture dispatch_request into active ownership
                  only; do not create a candidate on the dispatch edge.
                shared.events.command_commit: Clear the committed candidate. ACT and
                  PRE retain active ownership; READ or WRITE retires active ownership
                  and creates close-page cleanup reservation when selected. Cleanup
                  PRE clears cleanup reservation. REF completes refresh preparation.
                every_clock: 'When no candidate exists, create only one later candidate
                  according to locked priority: active service first, then cleanup
                  PRE, then pending-refresh preparation PRE for the lowest-index open
                  bank or REF when all banks are closed. No creation occurs on a commit
                  edge and no same-edge replacement occurs.'
              stalls: A blocked valid candidate and active request remain unchanged.
                No dispatch occurs during pending refresh, refresh preparation, refresh
                service, cleanup, or active ownership.
              simultaneous_events:
                reset_and_events: Reset wins.
                candidate_and_other_progress: An outstanding candidate holds or commits
                  before nonreset progress.
                refresh_pending_and_dispatch: Pre-edge refresh_pending inhibits dispatch;
                  refresh preparation is selected instead only on a later eligible
                  candidate-creation edge.
                due_and_REF: A simultaneous due condition leaves refresh pending asserted
                  after REF acknowledgment.
                retirement_and_dispatch: Dispatch is not permitted because active
                  ownership existed before the edge.
              combinational_dependencies:
                dispatch_ready:
                - dispatch_valid
                - refresh_pending
                - refresh_busy
                candidate_command: []
                candidate_valid: []
                commit_command: []
                commit_valid:
                - candidate_ok
                probe_command:
                - incoming_request
                - open_rows
                - open_valid
                probe_valid:
                - refresh_pending
                - refresh_busy
                execution_ready:
                - probe_ok
                - refresh_pending
                - refresh_busy
              dependency_note: candidate_valid, probe_valid, execution_ready, and
                dispatch_ready additionally depend on registered engine ownership
                described in owned_state; registered-state terms add no current-cycle
                input dependencies.
