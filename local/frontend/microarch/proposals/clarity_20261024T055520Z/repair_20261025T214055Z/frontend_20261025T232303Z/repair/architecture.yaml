                shared.events.dispatch: Remove exactly the pre-edge head after its
                  payload is captured by active ownership.
              stalls: Stored entries and head payload remain stable until dispatch
                or reset. Tail admission cannot alter a stalled head.
              simultaneous_events:
                enqueue_and_dispatch: Read old head, remove it, then append the admitted
                  request. Occupancy is unchanged, including at full capacity and
                  capacity one.
                enqueue_when_empty: Append only; no dispatch occurs because pre-edge
                  head_valid is low.
                reset_and_events: Reset wins.
                take_when_empty: head_take alone does not remove storage.
              combinational_dependencies:
