            history; PRE updates bank PRE history; REF starts global tRFC history.
        stalls: Elapsed time advances but no candidate or probe causes insertion.
        simultaneous_events:
          expiration_and_commit: Permission observes pre-edge histories. Expiration
            and insertion are applied after permission evaluation.
          probe_and_commit: Probe evaluates pre-edge history and row state only.
          reset_and_commit: Reset wins.
