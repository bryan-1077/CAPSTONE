    behavior:
      description: Implement the complete host_adapter contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: host_protocol
        owned_state: {}
        interfaces:
          txn_valid:
            direction: input
            type: shared.types.bit
            width: 1
          txn_ready:
            direction: output
            type: shared.types.bit
            width: 1
          txn_is_write:
            direction: input
            type: shared.types.bit
            width: 1
          txn_addr:
            direction: input
            type: shared.types.host_address
            width: 4
          txn_wdata:
            direction: input
            type: shared.types.data
            width: 32
          txn_bank:
            direction: input
            type: shared.types.host_bank
            width: 2
          cmd_ready:
            direction: output
            type: shared.types.bit
            width: 1
          queue_ready:
            direction: input
            type: shared.types.bit
            width: 1
          incoming_request:
            direction: output
            type: shared.types.request
            width: 51
          enqueue_valid:
            direction: output
            type: shared.types.bit
            width: 1
          execution_ready:
            direction: input
            type: shared.types.bit
            width: 1
          memory_rsp_valid:
            direction: input
            type: shared.types.bit
            width: 1
          memory_rsp_data:
            direction: input
            type: shared.types.data
            width: 32
          rsp_valid:
            direction: output
            type: shared.types.bit
            width: 1
          rsp_rdata:
            direction: output
            type: shared.types.data
            width: 32
        handshakes:
          admission: shared.events.admission occurs only when pre-edge txn_valid and
            txn_ready are high. txn_ready mirrors queue_ready with reset gating; cmd_ready
            is independent of admission.
          response: memory_rsp_valid and memory_rsp_data are passed to the host without
            an additional response stage. shared.events.response_delivery is the pre-edge
            host sampling of rsp_valid.
        reset: While rst_n is low, gate txn_ready, cmd_ready, enqueue_valid, and rsp_valid
          low and drive rsp_rdata to zero. No state is owned.
        update_events: {}
        stalls: The host retains transaction fields while txn_valid is high and txn_ready
          is low. The adapter does not suppress consecutive qualifying admissions.
        simultaneous_events:
          admission_and_response: Admission and response delivery are independent.
          reset_and_events: Reset suppresses all visible events.
        combinational_dependencies: &id014
          txn_ready:
          - queue_ready
          incoming_request:
          - txn_bank
          - txn_addr
          - txn_is_write
          - txn_wdata
          enqueue_valid:
          - txn_valid
          cmd_ready:
          - execution_ready
          rsp_valid:
          - memory_rsp_valid
          rsp_rdata:
          - memory_rsp_data
        invariants:
        - execution.rules.EXEC_READY
        - execution.rules.EXEC_RESPONSE
        - system.rules.BASE_ADDRESS
        - system.rules.BASE_DATA
        - system.rules.BASE_HOST
