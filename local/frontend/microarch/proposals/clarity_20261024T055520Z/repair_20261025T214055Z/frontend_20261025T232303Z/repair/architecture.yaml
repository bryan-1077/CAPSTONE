          - BASE_DATA
          - CONSTRAINT_12
          - R6
          - SYS_STORAGE
        system.verification.V_RESET: &id020
          scenario: Assert reset during every defined event and visible response condition.
          expected: Events and valid/ready outputs are gated while reset is low; reset
            clears specified state and defeats simultaneous nonreset actions.
          status: planned_not_executed
          rules:
          - BASE_HOST
          - BASE_RESET
          - R10
          - SYS_SIMULTANEOUS
    invariants:
    - 'execution.rules.EXEC_READY: txn_ready reflects only waiting admission capacity
      including same-edge dispatch release. cmd_ready is reset-gated diagnostic first-command
      readiness only while the engine is idle: active ownership is absent, candidate
      storage is empty, no cleanup reservation exists, and refresh is neither pending
      nor in service. It uses independent row and timing probes, remains meaningful
      without txn_valid, and neither diagnostic alters state.'
    - 'execution.rules.EXEC_RESPONSE: READ commit at E captures pre-edge memory data
      and registers rsp_valid and rsp_rdata for host sampling at E+1. Delivery and
      a new READ may share an edge: the host samples the old response before replacement.
      Writes produce no response.'
    - 'system.rules.BASE_ADDRESS: Preserve the simplified 4-bit txn_addr mapping:
      row=txn_addr[3:2], column=txn_addr[1:0], zero-extended into the internal 10-bit
      row and 6-bit column fields. Preserve explicit txn_bank for multi-bank configurations;
      a single-bank configuration uses bank 0. Internal packed requests retain bank(2),
      row(10), column(6), write flag(1), write data(32).'
    - 'system.rules.BASE_DATA: Provide functional 32-bit memory storage with 16 addresses
      per bank, bank isolation and reset-to-zero contents. Accepted writes update
      only their addressed location at service completion or a committed WRITE. Each
      accepted read produces exactly one one-cycle rsp_valid pulse with the stored
      rsp_rdata after read service/READ commit, using the existing one-cycle response
      stage. Writes produce no host response. Selection and stalled candidates cannot
      mutate memory; mere command output without storage and read responses is insufficient.'
    - 'system.rules.BASE_HOST: Preserve the existing host ports and widths listed
      in the baseline contract. Accept a request only on a rising clk edge with txn_valid
      && txn_ready. Hold payload while stalled. Consecutive accepted cycles with txn_valid
      held high are distinct requests. cmd_ready is execution/timing visibility, not
      the host acceptance handshake. Deassert txn_ready and rsp_valid during reset.'
    - 'system.rules.BASE_MODULARITY: Keep request storage, request selection, command
      sequencing, timing enforcement and functional memory in independently verifiable
      modules with explicit interfaces. No single controller core may own all these
      functions. Each mandatory role has distinct module owners with functional inter-module
      connections. Module names and further decomposition remain design choices.'
    - 'system.rules.BASE_RESET: Use top-level clk and active-low rst_n. Reset clears
      pending requests, active service, row validity, memory and responses. Preserve
      reusable blocks with either synchronous or asynchronous active-low resets driven
      by the same rst_n; differing assertion styles do not require rebuilding otherwise
      reusable blocks. Do not change polarity without an explicit adapter.'
    - 'system.rules.CONSTRAINT_1: Requested constraint /design_name = "ddr4_controller_top".'
    - 'system.rules.CONSTRAINT_12: Requested constraint /topology/banks = 4.'
    - 'system.rules.CONSTRAINT_2: Requested constraint /design_type = "memory_controller".'
    - 'system.rules.R10: Use synchronous active-low reset for state, with immediate
      valid/ready/event gating. Reset clears queued/active/cleanup work, row state,
      timing history, memory, responses and refresh state; it wins over every simultaneous
      event. The host holds payload while stalled and samples every response; no response
      backpressure is provided.'
    - 'system.rules.R11: Generate architecture-specific module isolation and system
      verification intent with exact requirement IDs, independent scenarios/expected
      results, and declared port/event bindings. Export it alongside RTL for the external
      UVM/vector stage. Do not execute downstream verification or backend stages in
      this frontend flow.'
    - 'system.rules.R4: Keep separate owners for host mapping, waiting storage, scheduling,
      command sequencing, row state, timing, functional memory/responses, and refresh
      control. The top must contain structural connections only.'
    - 'system.rules.R6: Preserve functional banked 32-bit memory and compact host
      address mapping. WRITE commit updates storage; READ commit at E captures pre-edge
      data and registers valid/data for host sampling at E+1, with no extra adapter
      response register. Responses survive active release, cleanup and refresh; writes
      produce no response.'
    - 'system.rules.R9: cmd_ready is reset-gated diagnostic readiness for the incoming
      request''s first needed command, using independent row/timing probe queries
      while the engine is idle and cleanup/refresh permit. It is meaningful without
      txn_valid and must not admit, dispatch, bypass FIFO, mutate history or reserve
      storage.'
    implementation_constraints:
    - Use the exact elaborated port widths and packed field offsets; no additional
      public ports.
    - Honor every contract handshake, reset, update event, stall and simultaneous-event
      rule.
    - Do not transfer owned state or responsibilities into another module or top-level
      wiring.
    - Implement the declared combinational dependencies accurately; internal registers
      and helper logic remain implementation choices.
    - Parameter values and timing values in specification_context are concrete for
      this build; do not substitute legacy defaults.
    - A conditionally omitted input has no signal in this build; apply its specified
      absent-port behavior.
    combinational_dependencies: *id014
- instance: waiting_queue
  roles:
  - request_queue
  responsibility: request_storage
  spec:
    design_name: ddr4_controller_top_spec_waiting_queue
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: enqueue_request
      direction: input
      width: 51
      description: shared.types.request
    - name: enqueue_valid
      direction: input
      width: 1
      description: shared.types.bit
    - name: enqueue_ready
      direction: output
      width: 1
      description: shared.types.bit
    - name: head_request
      direction: output
      width: 51
      description: shared.types.request
    - name: head_valid
      direction: output
      width: 1
      description: shared.types.bit
    - name: head_take
      direction: input
      width: 1
      description: shared.types.bit
    behavior:
      description: Implement the complete waiting_queue contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: request_storage
        owned_state:
          entries: Ordered waiting requests with capacity shared.parameters.WAITING_CAPACITY.
          occupancy: Registered count of admitted and undispatched requests.
        interfaces:
          enqueue_request:
            direction: input
            type: shared.types.request
            width: 51
          enqueue_valid:
            direction: input
            type: shared.types.bit
            width: 1
          enqueue_ready:
            direction: output
            type: shared.types.bit
            width: 1
          head_request:
            direction: output
            type: shared.types.request
            width: 51
          head_valid:
            direction: output
            type: shared.types.bit
            width: 1
          head_take:
            direction: input
            type: shared.types.bit
            width: 1
        handshakes:
          admission: Accept enqueue_request when enqueue_valid and enqueue_ready are
            high.
          dispatch: A pre-edge valid head is removed only when head_take is high.
            Dispatch uses the pre-edge head payload.
        reset: Synchronously clear occupancy and stored entries. Gate enqueue_ready
          and head_valid low during reset and drive invalid head_request to zero.
        update_events:
          shared.events.admission: Append the complete captured request after older
            entries.
          shared.events.dispatch: Remove exactly the pre-edge head after its payload
            is captured by active ownership.
        stalls: Stored entries and head payload remain stable until dispatch or reset.
          Tail admission cannot alter a stalled head.
        simultaneous_events:
          enqueue_and_dispatch: Read old head, remove it, then append the admitted
            request. Occupancy is unchanged, including at full capacity and capacity
            one.
          enqueue_when_empty: Append only; no dispatch occurs because pre-edge head_valid
            is low.
          reset_and_events: Reset wins.
          take_when_empty: head_take alone does not remove storage.
        combinational_dependencies: &id021
          enqueue_ready:
          - head_take
          head_request: []
          head_valid: []
        invariants:
        - execution.rules.EXEC_READY
        - system.rules.BASE_MODULARITY
        - system.rules.BASE_QUEUE
        - system.rules.BASE_RESET
        - system.rules.CONSTRAINT_11
        - system.rules.CONSTRAINT_5
        - system.rules.R1
        - system.rules.R10
        - system.rules.R11
        - system.rules.R2
        - system.rules.R4
        - system.rules.SYS_SIMULTANEOUS
        - system.rules.SYS_STORAGE
        verification:
        - execution.verification.X_READY
        - system.verification.V_CAPACITY
        - system.verification.V_CONFIGURATION
        - system.verification.V_EXACTLY_ONCE
        - system.verification.V_EXPORT
        - system.verification.V_FIFO
        - system.verification.V_ISOLATION
        - system.verification.V_MEMORY
        - system.verification.V_PAGE
        - system.verification.V_REFRESH
        - system.verification.V_RESET
      specification_context: *id015
      active_ports:
      - enqueue_ready
      - enqueue_request
      - enqueue_valid
      - head_request
      - head_take
      - head_valid
      verification_obligations:
        execution.verification.X_READY: *id016
        system.verification.V_CAPACITY: &id022
          scenario: Fill waiting storage, stall active service, dispatch at full occupancy,
            admit concurrently with dispatch, and retire with queued work.
          expected: Four waiting entries and one active request coexist; full waiting
            storage admits on dispatch; retirement alone does not free waiting storage;
            no empty-queue bypass occurs.
          status: planned_not_executed
          rules:
          - BASE_QUEUE
          - CONSTRAINT_11
          - R2
          - SYS_SIMULTANEOUS
          - SYS_STORAGE
        system.verification.V_CONFIGURATION: &id023
          scenario: Inspect parameters, profile selection, timing bindings, and recorded
            decisions.
          expected: Open-page default, refresh, FIFO, tFAW, tRRD, DDR4-3200, current_controller
            baseline, and four-bank topology are recorded.
          status: planned_not_executed
          rules:
          - CONSTRAINT_10
          - CONSTRAINT_3
          - CONSTRAINT_4
          - CONSTRAINT_5
          - CONSTRAINT_6
          - CONSTRAINT_7
          - CONSTRAINT_8
          - CONSTRAINT_9
        system.verification.V_EXACTLY_ONCE: &id024
          scenario: Apply long timing stalls, refresh delays, repeated queue reuse,
            and mixed traffic in a reset-free epoch.
          expected: Each admitted request is dispatched and serviced once with no
            loss, duplication, or premature retirement.
          status: planned_not_executed
          rules:
          - BASE_QUEUE
          - SYS_STORAGE
        system.verification.V_EXPORT: *id017
        system.verification.V_FIFO: &id025
          scenario: Accept mixed read/write traffic including same-address write/read
            pairs, row hits, misses, and timing stalls.
          expected: Dispatch and retirement follow acceptance order exactly; command
            readiness does not control admission; younger requests never bypass older
            requests.
          status: planned_not_executed
          rules:
          - BASE_POLICY
          - R1
        system.verification.V_ISOLATION: *id018
        system.verification.V_MEMORY: *id019
        system.verification.V_PAGE: &id026
          scenario: Run equivalent traffic under both page-policy values, create a
            close-page cleanup reservation, and assert refresh during cleanup.
          expected: Open-page retains rows. Close-page retirement creates a separate
            cleanup reservation, blocks dispatch, creates exactly one legal PRE candidate
            after retirement, and releases the reservation only when that PRE commits.
            Refresh preparation begins only after cleanup completes.
          status: planned_not_executed
          rules:
          - BASE_POLICY
          - R7
          - SYS_CONTROL_PRIORITY
          - SYS_STORAGE
        system.verification.V_REFRESH: &id029
          scenario: Cause deadlines while idle, active, candidate-blocked, cleanup-active,
            during preparation PRE commits, and during REF acknowledgment.
          expected: Deadlines coalesce; pending refresh inhibits dispatch; active
            and cleanup drain; remaining banks close in ascending order through refresh-preparation
            PRE candidates; REF occurs after all-bank tRP; due with REF leaves pending;
            traffic resumes after tRFC.
          status: planned_not_executed
          rules:
          - BASE_REFRESH
          - R8
          - SYS_CONTROL_PRIORITY
          - SYS_SIMULTANEOUS
        system.verification.V_RESET: *id020
    invariants:
    - 'execution.rules.EXEC_READY: txn_ready reflects only waiting admission capacity
