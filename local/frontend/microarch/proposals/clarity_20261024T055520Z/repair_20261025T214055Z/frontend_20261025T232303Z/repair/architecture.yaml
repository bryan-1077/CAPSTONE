                equals: 1
              payload:
                command:
                  endpoint: command_engine.commit_command
            retirement:
              status: bound
              when:
                all:
                - endpoint: command_engine.commit_valid
                  equals: 1
                - any:
                  - endpoint: command_engine.commit_command
                    field: opcode
                    equals: READ
                  - endpoint: command_engine.commit_command
                    field: opcode
                    equals: WRITE
              payload:
                command:
                  endpoint: command_engine.commit_command
            response_delivery:
              status: bound
              when:
                endpoint: top.rsp_valid
                equals: 1
              payload:
                data:
                  endpoint: top.rsp_rdata
            refresh_start:
              status: bound
              when:
                all:
                - endpoint: command_engine.commit_valid
                  equals: 1
                - endpoint: command_engine.commit_command
                  field: opcode
                  equals: REF
              payload:
                command:
                  endpoint: command_engine.commit_command
            refresh_due:
              status: unbound
              reason: Deadline state is internal. Independent checks derive tREFI
                deadlines from reset epochs and observe refresh_pending transitions
                and REF acknowledgments.
            refresh_end:
              status: unbound
              reason: No service-end pulse is externally exposed. Independent checks
                derive tRFC completion and observe refresh_busy.
            candidate_create:
              status: unbound
              reason: Candidate creation is internal registered ownership. Checks
                observe candidate payload and valid behavior across dispatch, commit,
                and stalls.
            cleanup_candidate_create:
              status: unbound
              reason: Cleanup control creation is internal. Checks infer it from committed
                retirement, candidate behavior, row state, and dispatch inhibition.
            refresh_candidate_create:
              status: unbound
              reason: Refresh preparation creation is internal. Checks infer ordered
                PRE and REF candidates from pending state and committed command traces.
          observations:
            host_ready:
              endpoint: top.txn_ready
            cmd_ready:
              endpoint: top.cmd_ready
            incoming_request:
              endpoint: host_adapter.incoming_request
            dispatch_ready:
              endpoint: command_engine.dispatch_ready
            candidate_valid:
              endpoint: command_engine.candidate_valid
            candidate_command:
              endpoint: command_engine.candidate_command
            candidate_ok:
              endpoint: timing_enforcer.candidate_ok
            probe_valid:
              endpoint: command_engine.probe_valid
            probe_command:
              endpoint: command_engine.probe_command
            probe_ok:
              endpoint: timing_enforcer.probe_ok
            open_valid:
              endpoint: row_state.open_valid
            open_rows:
              endpoint: row_state.open_rows
            refresh_pending:
              endpoint: refresh_control.refresh_pending
            refresh_busy:
              endpoint: refresh_control.refresh_busy
          checks:
            system.verification.V_ADDRESS:
              scope: both
              events:
              - admission
              observations:
              - incoming_request
              note: Check compact host address mapping and request field packing independently.
            system.verification.V_CANDIDATE:
              scope: both
              events:
              - dispatch
              - command_commit
              observations:
              - candidate_valid
              - candidate_command
              - candidate_ok
              - refresh_pending
              note: Check later-edge creation, blocked hold, commit clear, no same-edge
                replacement, and control priority.
            system.verification.V_CAPACITY:
              scope: both
              events:
              - admission
              - dispatch
              - retirement
              observations:
              - host_ready
              - dispatch_ready
              note: Reconstruct waiting occupancy from event history and verify separate
                active capacity.
            system.verification.V_CONFIGURATION:
              scope: system
              events:
              - command_commit
              observations:
              - refresh_pending
              - refresh_busy
              note: Inspect selected configuration, profile bindings, and declared
                policy behavior.
            system.verification.V_DIAGNOSTIC:
              scope: both
              events:
              - admission
              - dispatch
              - command_commit
              observations:
              - cmd_ready
              - probe_valid
              - probe_command
              - probe_ok
              - candidate_valid
              - refresh_pending
              - refresh_busy
              note: Verify diagnostic readiness is idle-only, side-effect-free, and
                meaningful without txn_valid.
            system.verification.V_EXACTLY_ONCE:
              scope: system
              events:
              - admission
              - dispatch
              - retirement
              observations: []
              note: Compare admitted, dispatched, and retired request sequences within
                reset-free epochs.
            system.verification.V_EXPORT:
              scope: system
              events:
              - admission
              observations: []
              note: Inspect declared requirement IDs, scenarios, events, interfaces,
                and planned status without claiming execution.
            system.verification.V_FIFO:
              scope: both
              events:
              - admission
              - dispatch
              - retirement
              observations: []
              note: Compare accepted and dispatched complete payload ordering.
            system.verification.V_HOST:
              scope: both
              events:
              - admission
              observations:
              - host_ready
              - cmd_ready
              - incoming_request
              note: Check valid-ready admission and distinction between txn_ready
                and cmd_ready.
            system.verification.V_IDENTITY:
              scope: system
              events:
              - admission
              observations: []
              note: Inspect declared design identity and kind.
            system.verification.V_ISOLATION:
              scope: system
              events:
              - dispatch
              - command_commit
              observations: []
              note: Inspect distinct functional owners and structural-only integration.
            system.verification.V_MEMORY:
              scope: both
              events:
              - command_commit
              - response_delivery
              observations: []
              note: Maintain independent banked-memory reference contents and response
                expectations.
            system.verification.V_PAGE:
              scope: both
              events:
              - retirement
              - command_commit
              - dispatch
              observations:
              - open_valid
              - open_rows
              - candidate_valid
              - candidate_command
              - dispatch_ready
              - refresh_pending
              note: Check open-page retention and close-page cleanup reservation behavior.
            system.verification.V_PAYLOAD:
              scope: both
              events:
              - command_commit
              observations:
              - candidate_valid
              - candidate_command
              - candidate_ok
              - probe_valid
              - probe_command
              note: Check canonical invalid NOP payload, commit mirroring, held blocked
                payload, and independent probe payload.
            system.verification.V_REFRESH:
              scope: both
              events:
              - command_commit
              - dispatch
              - retirement
              - refresh_start
              observations:
              - refresh_pending
              - refresh_busy
              - candidate_valid
              - candidate_command
              - dispatch_ready
              - open_valid
              note: Check pending dispatch inhibition, drain, ordered preparation,
                REF, tRFC exclusion, and resumption.
            system.verification.V_RESET:
              scope: both
              events:
              - admission
              - dispatch
              - command_commit
              - response_delivery
              observations:
              - host_ready
              - cmd_ready
              - candidate_valid
              - open_valid
              - refresh_pending
              - refresh_busy
              note: Assert reset across visible conditions and verify gating and cancellation.
            system.verification.V_SEQUENCE:
              scope: both
              events:
              - dispatch
              - command_commit
              - retirement
              observations:
              - candidate_command
              - candidate_valid
              - open_valid
              - open_rows
              note: Independently predict ACT/access and PRE/ACT/access sequences.
            system.verification.V_TIMING:
              scope: both
              events:
              - command_commit
              observations:
              - candidate_valid
              - candidate_command
              - candidate_ok
              - probe_valid
              - probe_command
              - probe_ok
              - open_valid
              - open_rows
              note: Check profile timing boundaries, committed-history-only updates,
                tRRD, and tFAW.
            execution.verification.X_BANK:
              scope: both
              events:
              - command_commit
              observations:
              - open_valid
              - open_rows
              note: Compare architectural row state only against committed ACT, PRE,
                and REF operations.
            execution.verification.X_CLEANUP:
              scope: both
              events:
              - retirement
              - command_commit
              - dispatch
              observations:
              - candidate_valid
              - candidate_command
              - dispatch_ready
              - refresh_pending
              note: Check distinct close-page cleanup PRE lifecycle and refresh wait.
            execution.verification.X_COMMIT:
              scope: both
              events:
              - command_commit
              observations:
              - candidate_valid
              - candidate_command
              - candidate_ok
              note: Check legal one-command commit and absence of effects from noncommits.
            execution.verification.X_CONTROL:
              scope: both
              events:
              - retirement
              - command_commit
              - dispatch
              observations:
              - candidate_valid
              - candidate_command
              - refresh_pending
              - dispatch_ready
              - open_valid
              note: Check cleanup and refresh control creation independently of active
                ownership.
            execution.verification.X_PAYLOAD:
              scope: both
              events:
              - command_commit
              observations:
              - candidate_valid
              - candidate_command
              - candidate_ok
              - probe_valid
              - probe_command
              note: Check reset and invalid payload behavior and permission-independent
                commit payload.
            execution.verification.X_PERMISSION:
              scope: both
              events:
              - command_commit
              observations:
              - candidate_valid
              - candidate_command
              - candidate_ok
              - open_valid
              - open_rows
              note: Check pre-edge legality and exact timing eligibility boundaries.
            execution.verification.X_READY:
              scope: both
              events:
              - admission
              - dispatch
              - command_commit
              observations:
              - host_ready
              - cmd_ready
              - probe_valid
              - probe_command
              - probe_ok
              - candidate_valid
              - refresh_pending
              - refresh_busy
              note: Check admission capacity versus side-effect-free engine-idle diagnostic
                readiness.
            execution.verification.X_REFRESH:
              scope: both
              events:
              - command_commit
              - dispatch
              - retirement
              - refresh_start
              observations:
              - refresh_pending
              - refresh_busy
              - candidate_valid
              - candidate_command
              - dispatch_ready
              - open_valid
              note: Independently derive deadlines and verify drain, coalescing, REF,
                and exclusion.
            execution.verification.X_RESPONSE:
              scope: both
              events:
              - command_commit
              - response_delivery
              observations: []
              note: Check one-cycle read response visibility, pre-edge read data,
                and no write response.
      timing_library:
        DDR4-2400:
          clock_frequency_mhz: 1200
          tck_ns: 0.833
          timing_ns:
            tRCD: 13.75
            tRP: 13.75
            tRAS: 32.0
            tRC: 45.75
            tRRD: 3.333
            tFAW: 25.0
            tRFC1: 350.0
            tREFI: 7800.0
          timing_cycles:
            tRCD: 17
            tRP: 17
            tRAS: 39
            tRC: 55
            tRRD: 4
            tFAW: 30
            tRFC1: 420
            tREFI: 9360
          cas_latency_options:
          - 17
        DDR4-3200:
          clock_frequency_mhz: 1600
          tck_ns: 0.625
          timing_ns:
            tRCD: 13.75
            tRP: 13.75
            tRAS: 32.0
            tRC: 45.75
            tRRD: 3.333
            tFAW: 25.0
            tRFC1: 350.0
            tREFI: 7800.0
          timing_cycles:
            tRCD: 22
            tRP: 22
            tRAS: 52
            tRC: 74
            tRRD: 6
            tFAW: 40
            tRFC1: 560
            tREFI: 12480
          cas_latency_options:
          - 22
      overrides: {}
      profile: DDR4-3200
design_kind: memory_controller
baseline_contract:
  id: current_controller_v2
  design_name: ddr4_controller_top
  profile: DDR4-3200
  config:
    design_name: ddr4_controller_top
    design_type: memory_controller
    memory:
      protocol: DDR4
      speed: '3200'
    topology:
      banks: 4
    features:
      scheduler: fifo
      page_policy: open_page
      refresh: true
      tRRD: true
      tFAW: true
    microarchitecture:
      baseline: current_controller
      waiting_capacity: 4
  host_ports:
  - name: clk
    direction: input
    width: 1
  - name: rst_n
    direction: input
    width: 1
  - name: txn_valid
    direction: input
    width: 1
  - name: txn_is_write
    direction: input
    width: 1
  - name: txn_addr
    direction: input
    width: 4
  - name: txn_wdata
    direction: input
    width: 32
  - name: txn_bank
    direction: input
    width: 2
  - name: txn_ready
    direction: output
    width: 1
  - name: cmd_ready
    direction: output
    width: 1
  - name: rsp_valid
    direction: output
    width: 1
  - name: rsp_rdata
    direction: output
    width: 32
  requirements:
  - id: BASE_HOST
    text: Preserve the existing host ports and widths listed in the baseline contract.
      Accept a request only on a rising clk edge with txn_valid && txn_ready. Hold
      payload while stalled. Consecutive accepted cycles with txn_valid held high
      are distinct requests. cmd_ready is execution/timing visibility, not the host
      acceptance handshake. Deassert txn_ready and rsp_valid during reset.
  - id: BASE_ADDRESS
    text: 'Preserve the simplified 4-bit txn_addr mapping: row=txn_addr[3:2], column=txn_addr[1:0],
      zero-extended into the internal 10-bit row and 6-bit column fields. Preserve
      explicit txn_bank for multi-bank configurations; a single-bank configuration
      uses bank 0. Internal packed requests retain bank(2), row(10), column(6), write
      flag(1), write data(32).'
  - id: BASE_QUEUE
    text: 'Provide 4 WAITING request slots PLUS one separately stored active-service
      request: waiting plus active capacity is 5. The active request must not consume
      a waiting slot. Dispatch captures the complete pre-edge request in active registers
      and frees its waiting slot without retiring the transaction. A full queue may
      admit on the same edge as dispatch; retirement alone does not free waiting storage.
      Accepted request fields survive stalls and each accepted request is serviced
      exactly once within a reset-free epoch. Keep admission, dispatch, retirement
      and read response delivery distinct. Captured response storage consumes neither
      waiting nor active capacity.'
  - id: BASE_DATA
    text: Provide functional 32-bit memory storage with 16 addresses per bank, bank
      isolation and reset-to-zero contents. Accepted writes update only their addressed
      location at service completion or a committed WRITE. Each accepted read produces
      exactly one one-cycle rsp_valid pulse with the stored rsp_rdata after read service/READ
      commit, using the existing one-cycle response stage. Writes produce no host
      response. Selection and stalled candidates cannot mutate memory; mere command
      output without storage and read responses is insufficient.
  - id: BASE_TIMING
    text: Retain existing tRCD, tRAS and tRP timing protection from the selected JEDEC
      profile. ACT-to-READ/WRITE must wait tRCD, ACT-to-PRE must respect tRAS, and
      PRE-to-next-ACT must respect tRP if explicit commands are used. Aggregate service
      may retain the existing protected timing envelope instead. Configured tRRD and
      tFAW gates must use accepted activation events, not host admissions or stalled
      proposals. Never treat existing basic timing as an unrequested future feature.
  - id: BASE_SEQUENCE
    text: Dispatch captures the complete selected request in separate active-service
      registers before freeing its waiting queue slot. Hold that active request and
      payload across setup PRE/ACT and timing stalls until its final READ/WRITE commits.
      Setup commands never retire the active request. Aggregate service also keeps
      active-service ownership through completion. Waiting-queue dequeue at dispatch
      is distinct from active-request retirement. Row state changes only on the responsible
      committed operation; uncommitted proposals cannot change state.
  - id: BASE_MODULARITY
    text: Keep request storage, request selection, command sequencing, timing enforcement
      and functional memory in independently verifiable modules with explicit interfaces.
      No single controller core may own all these functions. Each mandatory role has
      distinct module owners with functional inter-module connections. Module names
      and further decomposition remain design choices.
  - id: BASE_LEGALITY
    text: Compute command permission from registered timing/bank history and an independent
      candidate. An accepted ACT pulse is derived from candidate && permission; permission
      must not combinationally depend on that same accepted pulse. Scheduler selection/validity
      must be available independently of timing_ok; timing_ok may gate commit but
      must not create a selection-validity feedback loop. Declare accurate per-output
      combinational input dependencies.
  - id: BASE_RESET
    text: Use top-level clk and active-low rst_n. Reset clears pending requests, active
      service, row validity, memory and responses. Preserve reusable blocks with either
      synchronous or asynchronous active-low resets driven by the same rst_n; differing
      assertion styles do not require rebuilding otherwise reusable blocks. Do not
      change polarity without an explicit adapter.
  - id: BASE_POLICY
    text: Honor the requested scheduler policy fifo. Preserve page policy open_page.
      Open-page retains a serviced row; close-page closes it before subsequent bank
      use. Preserve request ownership through any setup sequence. Internal module
      decomposition and command latency may change while these observable contracts
      hold.
  - id: BASE_REFRESH
    text: Retain periodic refresh requests using profile tREFI, refresh priority and
      request/acknowledgment handling without dropping queued traffic. Refresh must
      make progress and normal requests must resume. Existing refresh is simplified;
      full REF/tRFC servicing remains later feature work. If explicit REF is proposed,
      describe drain/row-state interaction and acknowledge once at commit.
  - id: BASE_TRRD
    text: tRRD is enabled; honor that setting and resolve enabled timing values from
      DDR4-3200.
  - id: BASE_TFAW
    text: tFAW is enabled; honor that setting and resolve enabled timing values from
      DDR4-3200.
