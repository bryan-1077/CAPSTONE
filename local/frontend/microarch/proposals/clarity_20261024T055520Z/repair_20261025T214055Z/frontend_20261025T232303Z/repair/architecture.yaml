      width: 40
      description: shared.types.bank_rows
    - name: open_valid
      direction: output
      width: 4
      description: shared.types.bank_valid
    behavior:
      description: Implement the complete row_state contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: bank_state
        owned_state:
          rows: Per-bank registered row values and validity bits.
        interfaces:
          commit_command:
            direction: input
            type: shared.types.command
            width: 53
          commit_valid:
            direction: input
            type: shared.types.bit
            width: 1
          open_rows:
            direction: output
            type: shared.types.bank_rows
            width: 40
          open_valid:
            direction: output
            type: shared.types.bank_valid
            width: 4
        handshakes:
          commit: Sample the common committed command only when commit_valid is high.
        reset: Synchronously clear row values and validity. Gate open_valid low while
          reset is asserted.
        update_events:
          shared.events.command_commit: Committed ACT opens and records its bank row,
            PRE closes its bank, and REF clears every bank. READ and WRITE retain
            rows.
        stalls: Retain all row state unless a responsible command commits.
        simultaneous_events:
          reset_and_commit: Reset wins.
          different_bank_updates: Only one command commits per edge; REF is the only
            all-bank update.
        combinational_dependencies: &id040
          open_rows: []
          open_valid: []
        invariants:
        - execution.rules.EXEC_BANK_STATE
        - execution.rules.EXEC_CLEANUP
        - execution.rules.EXEC_COMMIT
        - execution.rules.EXEC_CONTROL_CREATION
