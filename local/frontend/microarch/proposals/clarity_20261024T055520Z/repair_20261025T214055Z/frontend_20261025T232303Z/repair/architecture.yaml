  responsibility: bank_state
  spec:
    design_name: ddr4_controller_top_spec_row_state
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: commit_command
      direction: input
      width: 53
      description: shared.types.command
    - name: commit_valid
      direction: input
      width: 1
      description: shared.types.bit
    - name: open_rows
