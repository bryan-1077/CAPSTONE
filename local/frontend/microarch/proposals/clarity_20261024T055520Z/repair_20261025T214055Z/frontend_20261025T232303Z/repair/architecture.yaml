            plus the independent query. Invalid, NOP, reserved, row-illegal, and timing-illegal
            queries are denied.
          history: Only shared.events.command_commit inserts ACT, PRE, or REF history.
            Probes and stalled candidates never alter history.
        reset: Synchronously clear all history-valid state and gate permission outputs
          low while reset is asserted.
        update_events:
