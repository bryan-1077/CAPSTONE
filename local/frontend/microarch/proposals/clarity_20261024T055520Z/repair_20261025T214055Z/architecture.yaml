                  direction: input
                  type: shared.types.request
                cleanup_active:
                  direction: output
                  type: shared.types.bit
              handshakes:
                dispatch: shared.events.dispatch captures dispatch_request only when
                  active, candidate, cleanup, refresh preparation, and refresh service
                  are absent.
                candidate: candidate_command is the canonical registered proposal.
                  commit_command mirrors it even when permission is low. commit_valid
                  requires a valid non-NOP, nonreserved candidate and candidate_ok.
                probe: probe_command is the combinational first-command query from
                  incoming_request and registered row state. probe_valid and execution_ready
                  are diagnostic gates only and do not alter probe payload or state.
                cleanup_observation: cleanup_active is a verification-only registered
                  indication of the cleanup reservation. It has no functional sink.
              reset: Clear active, candidate, cleanup, and refresh-preparation ownership.
                Gate dispatch_ready, candidate_valid, commit_valid, probe_valid, execution_ready,
                and cleanup_active low while rst_n is low. candidate_command, commit_command,
                and probe_command are canonical zero NOP while reset is low; candidate
                and commit payloads are zero NOP whenever candidate_valid is low.
              update_events:
                shared.events.dispatch: Capture the complete pre-edge FIFO request
                  into active ownership. Do not create a candidate on this edge.
                shared.events.candidate_create: When active ownership exists and the
                  candidate slot is empty, create the first active-service command
                  on a later edge from registered active ownership and registered
                  row state.
                shared.events.cleanup_candidate_create: When close-page cleanup is
                  reserved, active ownership is absent, and the candidate slot is
                  empty, create one later PRE candidate for the reserved bank.
                shared.events.refresh_candidate_create: When refresh is pending with
                  no active or cleanup ownership and no candidate, create one later
                  PRE for the lowest-index open bank or REF when all banks are closed.
                shared.events.command_commit: Clear the candidate slot. PRE and ACT
                  advance active sequencing without retirement. READ or WRITE retires
                  active ownership; close-page retirement creates cleanup ownership.
                  A cleanup PRE commit clears cleanup ownership. REF completes one
                  refresh preparation acknowledgement.
              stalls: A blocked valid candidate and its payload remain unchanged until
                commit or reset. No same-edge candidate replacement occurs after commit.
                Pending refresh blocks future dispatch after active work resolves.
              simultaneous_events:
                reset_and_events: Reset wins.
                candidate_and_other_progress: An outstanding candidate holds or commits
                  before dispatch or another candidate source is considered.
                creation_priority: With an empty candidate slot, active-service creation
                  precedes cleanup creation, cleanup creation precedes refresh-preparation
                  creation, and dispatch is allowed only when none applies.
                retirement_and_dispatch: Dispatch cannot replace active ownership
                  on the retirement edge.
                due_and_REF: Refresh pending remains asserted when due coincides with
                  REF commit.
