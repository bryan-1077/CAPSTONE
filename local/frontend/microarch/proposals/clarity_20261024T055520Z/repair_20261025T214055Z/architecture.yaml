    \ declared\n      compact mapping.\n    status: planned_not_executed\n    rules:\n\
    \    - BASE_ADDRESS\n    - CONSTRAINT_12\n"
- id: BASE_QUEUE
  text: 'Provide 4 WAITING request slots PLUS one separately stored active-service
    request: waiting plus active capacity is 5. The active request must not consume
    a waiting slot. Dispatch captures the complete pre-edge request in active registers
    and frees its waiting slot without retiring the transaction. A full queue may
    admit on the same edge as dispatch; retirement alone does not free waiting storage.
    Accepted request fields survive stalls and each accepted request is serviced exactly
    once within a reset-free epoch. Keep admission, dispatch, retirement and read
    response delivery distinct. Captured response storage consumes neither waiting
    nor active capacity.'
  owners: *id065
  verification: "source: system.rules.BASE_QUEUE\norigin: request.BASE_QUEUE\nobligations:\n\
    \  V_CAPACITY:\n    scenario: Fill waiting storage, stall active service, dispatch\
    \ at full occupancy,\n      admit concurrently with dispatch, and retire with\
    \ queued work.\n    expected: Four waiting entries and one active request coexist;\
    \ full waiting storage\n      admits on dispatch; retirement alone does not free\
    \ waiting storage; no empty-queue\n      bypass occurs.\n    status: planned_not_executed\n\
    \    rules:\n    - BASE_QUEUE\n    - CONSTRAINT_11\n    - R2\n    - SYS_SIMULTANEOUS\n\
    \    - SYS_STORAGE\n  V_EXACTLY_ONCE:\n    scenario: Apply long timing stalls,\
    \ refresh delays, repeated queue reuse, and\n      mixed traffic in a reset-free\
    \ epoch.\n    expected: Each admitted request is dispatched and serviced once\
    \ with no loss,\n      duplication, or premature retirement.\n    status: planned_not_executed\n\
    \    rules:\n    - BASE_QUEUE\n    - SYS_STORAGE\n"
- id: BASE_DATA
  text: Provide functional 32-bit memory storage with 16 addresses per bank, bank
    isolation and reset-to-zero contents. Accepted writes update only their addressed
    location at service completion or a committed WRITE. Each accepted read produces
    exactly one one-cycle rsp_valid pulse with the stored rsp_rdata after read service/READ
    commit, using the existing one-cycle response stage. Writes produce no host response.
    Selection and stalled candidates cannot mutate memory; mere command output without
    storage and read responses is insufficient.
  owners: *id066
  verification: "source: system.rules.BASE_DATA\norigin: request.BASE_DATA\nobligations:\n\
    \  V_MEMORY:\n    scenario: Write and read every compact address in every bank,\
    \ overlap response\n      delivery with later reads, and reset during response\
    \ visibility.\n    expected: WRITE updates only its addressed word; READ captures\
    \ pre-edge data and\n      yields one E+1 response; banks isolate; reset zeros\
    \ memory and cancels validity.\n    status: planned_not_executed\n    rules:\n\
    \    - BASE_DATA\n    - CONSTRAINT_12\n    - R6\n    - SYS_STORAGE\n"
