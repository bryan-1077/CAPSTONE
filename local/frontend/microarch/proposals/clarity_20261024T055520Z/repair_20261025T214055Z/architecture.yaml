                  type: shared.types.bit
              handshakes:
                request: pending is level-sensitive and remains asserted until one
                  REF acknowledgement unless a simultaneous due occurs.
                acknowledgement: shared.events.refresh_start is the only acknowledgement
                  and is the committed REF event.
              reset: Clear deadline, pending, and service state synchronously and
                rebase the next deadline from the reset-sampled edge. Gate outputs
                low while rst_n is low.
              update_events:
                shared.events.refresh_due: Set pending and advance the periodic deadline
                  by tREFI.
                shared.events.refresh_start: Start tRFC exclusion and clear pending
                  unless refresh_due occurs on the same edge.
                shared.events.refresh_end: End the registered tRFC exclusion interval
                  while preserving separately accumulated pending.
              stalls: Deadlines continue to advance and pending persists during active
                work, candidate stalls, cleanup, and service exclusion.
              simultaneous_events:
                due_and_REF: Due wins pending update; REF still begins one service
                  interval.
                due_and_service_end: End service while retaining newly due pending.
                reset_and_events: Reset wins.
              combinational_dependencies:
                pending: []
                service_busy: []
              invariants:
              - execution.rules.EXEC_COMMIT
              - execution.rules.EXEC_CONTROL_CREATION
              - execution.rules.EXEC_REFRESH
              - system.rules.BASE_REFRESH
              - system.rules.BASE_RESET
              - system.rules.CONSTRAINT_10
              - system.rules.CONSTRAINT_2
              - system.rules.CONSTRAINT_4
              - system.rules.R10
              - system.rules.R11
              - system.rules.R4
              - system.rules.R8
              - system.rules.SYS_SIMULTANEOUS
              verification:
              - execution.verification.X_COMMIT
              - execution.verification.X_CONTROL
              - execution.verification.X_REFRESH
              - system.verification.V_CAPACITY
              - system.verification.V_CONFIGURATION
              - system.verification.V_EXPORT
              - system.verification.V_IDENTITY
              - system.verification.V_ISOLATION
              - system.verification.V_REFRESH
              - system.verification.V_RESET
