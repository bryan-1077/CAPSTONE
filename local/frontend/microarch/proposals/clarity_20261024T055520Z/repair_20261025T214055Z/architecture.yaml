              status: draft
              role: command_sequencing
              owned_state:
                active: Validity and complete shared.types.request captured only by
                  shared.events.dispatch and retained until READ or WRITE retirement.
                candidate: Registered candidate validity and shared.types.command
                  payload.
                cleanup: Close-page cleanup reservation for one retired serviced bank.
                refresh_preparation: Control-work phase and ascending-bank preparation
                  selection derived from refresh pending and registered row state.
              interfaces:
                dispatch_valid:
                  direction: input
                  type: shared.types.bit
                dispatch_request:
