                admission: shared.events.admission occurs only when txn_valid and
                  txn_ready are both sampled high before a rising edge. enq_valid
                  mirrors txn_valid, txn_ready mirrors enq_ready, and enq_request
                  maps the complete host payload using shared.types.request.mapping.
                response: Pass the registered memory response directly to rsp_valid
                  and rsp_rdata; rsp_valid has no host ready acknowledgement.
                diagnostic: cmd_ready mirrors reset-gated execution_ready and is not
                  an admission or storage handshake.
              reset: While rst_n is low, gate txn_ready, cmd_ready, enq_valid, rsp_valid,
                and all visible handshake events low. Drive rsp_rdata to zero. This
                contract owns no state.
