    behavior:
      description: Implement the complete host_adapter contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: host_protocol
        owned_state: {}
        interfaces:
          txn_valid:
            direction: input
            type: shared.types.bit
            width: 1
          txn_ready:
            direction: output
            type: shared.types.bit
            width: 1
          txn_addr:
            direction: input
            type: shared.types.host_address
            width: 4
          txn_bank:
            direction: input
            type: shared.types.host_bank
            width: 2
          txn_is_write:
            direction: input
            type: shared.types.bit
            width: 1
          txn_wdata:
            direction: input
            type: shared.types.data
            width: 32
          cmd_ready:
            direction: output
            type: shared.types.bit
            width: 1
          execution_ready:
            direction: input
            type: shared.types.bit
            width: 1
          enq_valid:
            direction: output
            type: shared.types.bit
            width: 1
          enq_ready:
            direction: input
            type: shared.types.bit
            width: 1
          enq_request:
            direction: output
            type: shared.types.request
            width: 51
          memory_rsp_valid:
            direction: input
            type: shared.types.bit
            width: 1
          memory_rsp_data:
            direction: input
            type: shared.types.data
            width: 32
          rsp_valid:
            direction: output
            type: shared.types.bit
            width: 1
          rsp_rdata:
            direction: output
            type: shared.types.data
            width: 32
        handshakes:
          admission: shared.events.admission occurs only when txn_valid and txn_ready
            are both sampled high before a rising edge. enq_valid mirrors txn_valid,
            txn_ready mirrors enq_ready, and enq_request maps the complete host payload
            using shared.types.request.mapping.
          response: Pass the registered memory response directly to rsp_valid and
            rsp_rdata; rsp_valid has no host ready acknowledgement.
          diagnostic: cmd_ready mirrors reset-gated execution_ready and is not an
            admission or storage handshake.
        reset: While rst_n is low, gate txn_ready, cmd_ready, enq_valid, rsp_valid,
          and all visible handshake events low. Drive rsp_rdata to zero. This contract
          owns no state.
        update_events: {}
        stalls: The host retains txn_valid and transaction payload while txn_ready
          is low. No adapter state can drop or duplicate a qualifying admission.
        simultaneous_events:
          admission_and_response: Admission and response delivery are independent.
          reset_and_events: Reset suppresses both events.
        combinational_dependencies: &id014
          txn_ready:
          - enq_ready
          cmd_ready:
          - execution_ready
          enq_valid:
          - txn_valid
          enq_request:
          - txn_addr
          - txn_bank
          - txn_is_write
          - txn_wdata
          rsp_valid:
          - memory_rsp_valid
          rsp_rdata:
          - memory_rsp_data
        invariants:
        - execution.rules.EXEC_READY
        - execution.rules.EXEC_RESPONSE
        - system.rules.BASE_ADDRESS
        - system.rules.BASE_HOST
        - system.rules.BASE_MODULARITY
        - system.rules.BASE_RESET
        - system.rules.CONSTRAINT_1
        - system.rules.CONSTRAINT_10
        - system.rules.CONSTRAINT_12
        - system.rules.CONSTRAINT_2
        - system.rules.R1
        - system.rules.R10
        - system.rules.R11
        - system.rules.R4
        - system.rules.R6
        - system.rules.R9
        verification:
        - execution.verification.X_READY
        - execution.verification.X_RESPONSE
        - system.verification.V_ADDRESS
        - system.verification.V_CONFIGURATION
        - system.verification.V_DIAGNOSTIC
        - system.verification.V_EXPORT
        - system.verification.V_FIFO
        - system.verification.V_HOST
        - system.verification.V_IDENTITY
        - system.verification.V_ISOLATION
        - system.verification.V_MEMORY
        - system.verification.V_RESET
      specification_context: &id015
        package_id: ddr4_controller_top_spec
        revision: draft_002
        package_fingerprint: ed582f2fbac5bf2f4896ed71e0b4dd7f10252520571ae5469403c2129f1ac335
        parameters:
          ACTIVE_CAPACITY: 1
          BANK_COUNT: 4
          COMMAND_OPCODE_WIDTH: 3
          DATA_WIDTH: 32
          HOST_ADDR_WIDTH: 4
          PAGE_POLICY: open_page
          READ_RESPONSE_LATENCY: 1
          REQUEST_BANK_WIDTH: 2
          REQUEST_COLUMN_WIDTH: 6
          REQUEST_ROW_WIDTH: 10
          TFAW_ACT_LIMIT: 4
          WAITING_CAPACITY: 4
          HOST_BANK_WIDTH: 2
          MEMORY_WORDS_PER_BANK: 16
        types:
          bit:
            kind: unsigned
            width: 1
          data:
            kind: unsigned
            width: 32
          host_address:
            kind: unsigned
            width: 4
          host_bank:
            kind: unsigned
            width: 2
          bank:
            kind: unsigned
            width: 2
          row:
            kind: unsigned
            width: 10
          column:
            kind: unsigned
            width: 6
          opcode:
            kind: enum
            width: 3
            encodings:
              NOP: 0
              ACT: 1
              PRE: 2
              READ: 3
              WRITE: 4
              REF: 5
            reserved:
            - 6
            - 7
          command:
            kind: record
            packed_order: msb_to_lsb
            fields:
            - name: opcode
              type: shared.types.opcode
              width: 3
              msb: 52
              lsb: 50
            - name: bank
              type: shared.types.bank
              width: 2
              msb: 49
              lsb: 48
            - name: row
              type: shared.types.row
              width: 10
              msb: 47
              lsb: 38
            - name: column
              type: shared.types.column
              width: 6
              msb: 37
              lsb: 32
            - name: wdata
              type: shared.types.data
              width: 32
              msb: 31
              lsb: 0
            semantics:
              NOP: Canonical all-zero payload; never commits.
              ACT: Open bank at row; column and wdata are zero.
              PRE: Close bank; row, column, and wdata are zero.
              READ: Access matching open bank row and column; wdata is zero.
              WRITE: Access matching open bank row and column with wdata.
              REF: All-bank refresh; bank, row, column, and wdata are zero.
            width: 53
          request:
            kind: record
            packed_order: msb_to_lsb
            fields:
            - name: bank
              type: shared.types.bank
              width: 2
              msb: 50
              lsb: 49
            - name: row
              type: shared.types.row
              width: 10
              msb: 48
              lsb: 39
            - name: column
              type: shared.types.column
              width: 6
              msb: 38
              lsb: 33
            - name: is_write
              type: shared.types.bit
              width: 1
              msb: 32
              lsb: 32
            - name: wdata
              type: shared.types.data
              width: 32
              msb: 31
              lsb: 0
            mapping:
              bank: Zero-extend txn_bank.
              row: Zero-extend txn_addr[3:2].
              column: Zero-extend txn_addr[1:0].
              is_write: txn_is_write.
              wdata: txn_wdata.
            legal_values: bank is less than BANK_COUNT; host-originated row[9:2] and
              column[5:2] are zero.
            width: 51
          bank_rows:
            kind: array
            element_type: shared.types.row
            count: 4
            packed_order: ascending_index_from_lsb
            width: 40
            element_width: 10
            index_lsb: index * element_width
          bank_valid:
            kind: array
            element_type: shared.types.bit
            count: 4
            packed_order: ascending_index_from_lsb
            width: 4
            element_width: 1
            index_lsb: index * element_width
        clock_reset: &id115
          clock: clk
          edge: rising
          reset: rst_n
          active_level: 0
          priority: reset_before_all_events
          assertion_style: synchronous
          handshake_gating: Suppress all valid, ready, admission, dispatch, candidate-creation,
            commit, response-delivery, and refresh events while rst_n is low.
        events: &id116
          admission:
            condition: At a rising clk edge, rst_n is high and pre-edge txn_valid
              and txn_ready are high.
            effect: Capture one complete mapped request into waiting storage.
          dispatch:
            condition: At a rising clk edge, rst_n is high, active ownership is absent,
              cleanup reservation is absent, refresh preparation or service is absent,
              candidate storage is empty, and a pre-edge FIFO head is selected.
            effect: Capture the complete pre-edge FIFO head into active ownership
              and release exactly that waiting entry.
          candidate_create:
            condition: At a rising clk edge, rst_n is high, active ownership exists,
              candidate storage is empty, cleanup reservation and refresh preparation
              or service are absent, and no command commits on that edge.
            effect: Create the first active-request candidate from registered active
              ownership and registered bank state.
          cleanup_candidate_create:
            condition: At a rising clk edge, rst_n is high, PAGE_POLICY is close_page,
              active ownership is absent, a cleanup reservation exists, candidate
              storage is empty, refresh preparation or service is absent, and no command
              commits on that edge.
            effect: Create a PRE candidate for the reserved cleanup bank from registered
              bank state. This candidate is not an active-request candidate.
          refresh_candidate_create:
            condition: At a rising clk edge, rst_n is high, refresh pending is asserted,
              active ownership and cleanup reservation are absent, candidate storage
              is empty, refresh service is not in tRFC exclusion, and no command commits
              on that edge.
            effect: 'Create exactly one refresh-preparation candidate from registered
              bank state: PRE for the lowest-index open bank, or REF when all banks
              are closed.'
          command_commit:
            condition: At a rising clk edge, rst_n is high, candidate_valid and candidate_ok
              are high, and candidate_command is non-NOP and nonreserved.
            effect: Commit one command and update only state assigned to that committed
              opcode. Commit clears the candidate slot; no candidate is replaced on
              the same edge.
          retirement:
            condition: shared.events.command_commit commits READ or WRITE for the
              active request.
            effect: Retire one active request; READ captures response state before
              active release. Under close_page, retirement creates a cleanup reservation
              for the serviced bank.
          refresh_due:
            condition: At a rising clk edge, rst_n is high and the periodic deadline
              reaches that edge.
            effect: Set sticky refresh pending. A simultaneous REF acknowledgment
              cannot clear newly due pending.
          refresh_start:
            condition: shared.events.command_commit commits REF.
            effect: Acknowledge one pending refresh and begin tRFC command exclusion.
          refresh_end:
            condition: At a rising clk edge, rst_n is high and the edge is at least
              tRFC cycles after committed REF.
            effect: End refresh command exclusion.
          response_delivery:
            condition: At a rising clk edge, rst_n is high and pre-edge rsp_valid
              is high.
            effect: The host samples pre-edge rsp_rdata.
        timing_profile:
          selection: DDR4-3200
          unit: cycles
          values:
            tRCD: 22
            tRAS: 52
            tRP: 22
            tRRD: 6
            tFAW: 40
            tREFI: 12480
            tRFC: 560
        timing_rules:
          edge_convention: A trigger committed at edge E permits a blocked command
            at E+T when all other conditions hold. Reset creates no timing history.
            tFAW counts earlier ACT commits whose age at the candidate edge is strictly
            less than its window.
          tRCD:
            trigger: ACT
            blocked:
            - READ
            - WRITE
            minimum: 22
            scope: same_bank
          tRAS:
            trigger: ACT
            blocked:
            - PRE
            minimum: 52
            scope: same_bank
          tRP:
            trigger: PRE
            blocked:
            - ACT
            - REF
            minimum: 22
            scope: same_bank_for_ACT_all_banks_for_REF
          tRRD:
            trigger: ACT
            blocked:
            - ACT
            minimum: 6
            scope: all_banks
          tFAW:
            trigger: ACT
            blocked:
            - ACT
            window: 40
            limit: 4
            scope: all_banks
          tRFC:
            trigger: REF
            blocked:
            - ACT
            - PRE
            - READ
            - WRITE
            - REF
            minimum: 560
            scope: all_banks
        system_rules: &id117
          R1:
            verification:
            - V_FIFO
            origin: request.R1
            statement: Implement global FIFO service in acceptance order, including
              same-address writes and reads. Admit on every rising-edge txn_valid
              && txn_ready, independently of command readiness.
            owners: &id050
            - host_adapter
            - waiting_queue
            - fifo_scheduler
            - command_engine
          R2:
            verification:
            - V_CAPACITY
            origin: request.R2
            statement: Provide four waiting entries plus one separately stored active
              request. Dispatch only previously stored requests, capture the complete
              pre-edge head before releasing its slot, and permit full-queue simultaneous
              dispatch/admission including capacity one. No empty-queue bypass or
              same-edge active replacement at retirement.
            owners: &id051
            - waiting_queue
            - fifo_scheduler
            - command_engine
          R3:
            verification:
            - V_SEQUENCE
            origin: request.R3
            statement: Use explicit NOP/ACT/PRE/READ/WRITE/REF command semantics,
              with NOP never committed and at most one command commit per edge. Sequence
              closed banks with ACT-access, row hits with access, and row conflicts
              with PRE-ACT-access. PRE/ACT never retire the active request. Keep blocked
              candidates stable through stalls and newly pending refresh.
            owners: &id052
            - command_engine
            - row_state
          R4:
            verification:
            - V_ISOLATION
            origin: request.R4
            statement: Keep separate owners for host mapping, waiting storage, scheduling,
              command sequencing, row state, timing, functional memory/responses,
              and refresh control. The top must contain structural connections only.
            owners: &id053
            - host_adapter
            - waiting_queue
            - fifo_scheduler
            - command_engine
            - row_state
            - timing
            - memory
            - refresh
          R5:
            verification:
            - V_TIMING
            origin: request.R5
            statement: Update bank state and timing history only from committed commands.
              Enforce tRCD, tRAS, tRP, tRRD, tFAW and tRFC using the selected project
              profile. A trigger at E permits the blocked command at E+T; tFAW counts
              earlier ACT commits with age strictly less than its window. Reset creates
              no synthetic timing history.
            owners: &id054
            - timing
            - row_state
          R6:
            verification:
            - V_MEMORY
            origin: request.R6
            statement: Preserve functional banked 32-bit memory and compact host address
              mapping. WRITE commit updates storage; READ commit at E captures pre-edge
              data and registers valid/data for host sampling at E+1, with no extra
              adapter response register. Responses survive active release, cleanup
              and refresh; writes produce no response.
            owners: &id055
            - memory
            - host_adapter
          R7:
            verification:
            - V_PAGE
            origin: request.R7
            statement: Open-page retains rows. Support close-page as a configurable
              alternative, retaining a separate cleanup bank reservation after retirement
              until a legal PRE commits; block new dispatch during cleanup.
            owners: &id056
            - command_engine
            - row_state
          R8:
            verification:
            - V_REFRESH
            origin: request.R8
            statement: Generate periodic refresh deadlines from the last sampled reset
              edge using tREFI. Coalesce missed deadlines into sticky pending; a due
              deadline wins over simultaneous REF acknowledgment. Drain active work
              and cleanup, PRE remaining open banks in ascending order, respect all-bank
              tRP, commit REF once, and exclude commands strictly before REF-edge+tRFC.
              Retain queued traffic and resume service afterward.
            owners: &id057
            - refresh
            - command_engine
            - timing
            - row_state
          R9:
            verification:
            - V_DIAGNOSTIC
            origin: request.R9
            statement: cmd_ready is reset-gated diagnostic readiness for the incoming
              request's first needed command, using independent row/timing probe queries
              while the engine is idle and cleanup/refresh permit. It is meaningful
              without txn_valid and must not admit, dispatch, bypass FIFO, mutate
              history or reserve storage.
            owners: &id058
            - host_adapter
            - command_engine
            - timing
          R10:
            verification:
            - V_RESET
            origin: request.R10
            statement: Use synchronous active-low reset for state, with immediate
              valid/ready/event gating. Reset clears queued/active/cleanup work, row
              state, timing history, memory, responses and refresh state; it wins
              over every simultaneous event. The host holds payload while stalled
              and samples every response; no response backpressure is provided.
            owners: &id059
            - host_adapter
            - waiting_queue
            - fifo_scheduler
            - command_engine
            - row_state
            - timing
            - memory
            - refresh
          R11:
            verification:
            - V_EXPORT
            origin: request.R11
            statement: Generate architecture-specific module isolation and system
              verification intent with exact requirement IDs, independent scenarios/expected
              results, and declared port/event bindings. Export it alongside RTL for
              the external UVM/vector stage. Do not execute downstream verification
              or backend stages in this frontend flow.
            owners: &id060
            - host_adapter
            - waiting_queue
            - fifo_scheduler
            - command_engine
            - row_state
            - timing
            - memory
            - refresh
          R12:
            verification:
            - V_CANDIDATE
            origin: request.R12
            statement: Explicitly distinguish initial command candidate creation from
              replacement. Dispatch captures the request without forming a candidate
              on that edge. When the candidate slot is empty, form the first candidate
              on a later edge from registered ownership and current bank state. Hold
              a blocked candidate unchanged. Commit clears its slot; a following candidate
              is formed only on a later edge using updated bank state, never by same-edge
              replacement. Reset wins; an outstanding candidate holds or commits before
              other progress. With no candidate, drain active service, then cleanup,
              then pending refresh preparation. Refresh service blocks dispatch and
              new candidate formation. Internal state encoding remains an implementation
              choice.
            owners: &id061
            - command_engine
          R13:
            verification:
            - V_PAYLOAD
            origin: request.R13
            statement: Define payload behavior independently of valid gating. candidate_command
              is canonical zero NOP when candidate_valid is low. commit_command mirrors
              candidate_command even when candidate_ok is low; permission gates commit_valid
              only, and consumers sample payload only on commit_valid. probe_command
              remains the combinational first-command query from the incoming request
              and bank state even when probe_valid is low; idle, cleanup and refresh
              restrictions gate probe validity/readiness, not its payload. Reset forces
              all command payloads to zero NOP. Combinational dependencies must include
              any current-cycle input used to gate payload, not just its valid signal.
            owners: &id062
            - command_engine
            - timing
          BASE_HOST:
            verification:
            - V_HOST
            - V_RESET
            origin: request.BASE_HOST
            statement: Preserve the existing host ports and widths listed in the baseline
              contract. Accept a request only on a rising clk edge with txn_valid
              && txn_ready. Hold payload while stalled. Consecutive accepted cycles
              with txn_valid held high are distinct requests. cmd_ready is execution/timing
              visibility, not the host acceptance handshake. Deassert txn_ready and
              rsp_valid during reset.
            owners: &id063
            - host_adapter
            - waiting_queue
          BASE_ADDRESS:
            verification:
            - V_ADDRESS
            origin: request.BASE_ADDRESS
            statement: 'Preserve the simplified 4-bit txn_addr mapping: row=txn_addr[3:2],
              column=txn_addr[1:0], zero-extended into the internal 10-bit row and
              6-bit column fields. Preserve explicit txn_bank for multi-bank configurations;
              a single-bank configuration uses bank 0. Internal packed requests retain
              bank(2), row(10), column(6), write flag(1), write data(32).'
            owners: &id064
            - host_adapter
            - command_engine
            - memory
          BASE_QUEUE:
            verification:
            - V_CAPACITY
            - V_EXACTLY_ONCE
            origin: request.BASE_QUEUE
            statement: 'Provide 4 WAITING request slots PLUS one separately stored
              active-service request: waiting plus active capacity is 5. The active
              request must not consume a waiting slot. Dispatch captures the complete
              pre-edge request in active registers and frees its waiting slot without
              retiring the transaction. A full queue may admit on the same edge as
              dispatch; retirement alone does not free waiting storage. Accepted request
              fields survive stalls and each accepted request is serviced exactly
              once within a reset-free epoch. Keep admission, dispatch, retirement
              and read response delivery distinct. Captured response storage consumes
              neither waiting nor active capacity.'
            owners: &id065
            - waiting_queue
            - fifo_scheduler
            - command_engine
          BASE_DATA:
            verification:
            - V_MEMORY
            origin: request.BASE_DATA
            statement: Provide functional 32-bit memory storage with 16 addresses
              per bank, bank isolation and reset-to-zero contents. Accepted writes
              update only their addressed location at service completion or a committed
              WRITE. Each accepted read produces exactly one one-cycle rsp_valid pulse
              with the stored rsp_rdata after read service/READ commit, using the
              existing one-cycle response stage. Writes produce no host response.
              Selection and stalled candidates cannot mutate memory; mere command
              output without storage and read responses is insufficient.
            owners: &id066
            - memory
          BASE_TIMING:
            verification:
            - V_TIMING
            origin: request.BASE_TIMING
            statement: Retain existing tRCD, tRAS and tRP timing protection from the
              selected JEDEC profile. ACT-to-READ/WRITE must wait tRCD, ACT-to-PRE
              must respect tRAS, and PRE-to-next-ACT must respect tRP if explicit
              commands are used. Aggregate service may retain the existing protected
              timing envelope instead. Configured tRRD and tFAW gates must use accepted
              activation events, not host admissions or stalled proposals. Never treat
              existing basic timing as an unrequested future feature.
            owners: &id067
            - timing
          BASE_SEQUENCE:
            verification:
            - V_SEQUENCE
            - V_CANDIDATE
            origin: request.BASE_SEQUENCE
            statement: Dispatch captures the complete selected request in separate
              active-service registers before freeing its waiting queue slot. Hold
              that active request and payload across setup PRE/ACT and timing stalls
              until its final READ/WRITE commits. Setup commands never retire the
              active request. Aggregate service also keeps active-service ownership
              through completion. Waiting-queue dequeue at dispatch is distinct from
              active-request retirement. Row state changes only on the responsible
              committed operation; uncommitted proposals cannot change state.
            owners: &id068
            - command_engine
            - row_state
          BASE_MODULARITY:
            verification:
            - V_ISOLATION
            origin: request.BASE_MODULARITY
            statement: Keep request storage, request selection, command sequencing,
              timing enforcement and functional memory in independently verifiable
              modules with explicit interfaces. No single controller core may own
              all these functions. Each mandatory role has distinct module owners
              with functional inter-module connections. Module names and further decomposition
              remain design choices.
            owners: &id069
            - host_adapter
            - waiting_queue
            - fifo_scheduler
            - command_engine
            - timing
            - memory
          BASE_LEGALITY:
            verification:
            - V_TIMING
            origin: request.BASE_LEGALITY
            statement: Compute command permission from registered timing/bank history
              and an independent candidate. An accepted ACT pulse is derived from
              candidate && permission; permission must not combinationally depend
              on that same accepted pulse. Scheduler selection/validity must be available
              independently of timing_ok; timing_ok may gate commit but must not create
              a selection-validity feedback loop. Declare accurate per-output combinational
              input dependencies.
            owners: &id070
            - command_engine
            - timing
          BASE_RESET:
            verification:
            - V_RESET
            origin: request.BASE_RESET
            statement: Use top-level clk and active-low rst_n. Reset clears pending
              requests, active service, row validity, memory and responses. Preserve
              reusable blocks with either synchronous or asynchronous active-low resets
              driven by the same rst_n; differing assertion styles do not require
              rebuilding otherwise reusable blocks. Do not change polarity without
              an explicit adapter.
            owners: &id071
            - host_adapter
            - waiting_queue
            - fifo_scheduler
            - command_engine
            - row_state
            - timing
            - memory
            - refresh
          BASE_POLICY:
            verification:
            - V_FIFO
            - V_PAGE
            origin: request.BASE_POLICY
            statement: Honor the requested scheduler policy fifo. Preserve page policy
              open_page. Open-page retains a serviced row; close-page closes it before
              subsequent bank use. Preserve request ownership through any setup sequence.
              Internal module decomposition and command latency may change while these
              observable contracts hold.
            owners: &id072
            - fifo_scheduler
            - command_engine
            - row_state
          BASE_REFRESH:
            verification:
            - V_REFRESH
            origin: request.BASE_REFRESH
            statement: Retain periodic refresh requests using profile tREFI, refresh
              priority and request/acknowledgment handling without dropping queued
              traffic. Refresh must make progress and normal requests must resume.
              Existing refresh is simplified; full REF/tRFC servicing remains later
              feature work. If explicit REF is proposed, describe drain/row-state
              interaction and acknowledge once at commit.
            owners: &id073
            - refresh
            - command_engine
            - timing
            - row_state
          BASE_TRRD:
            verification:
            - V_TIMING
            origin: request.BASE_TRRD
            statement: tRRD is enabled; honor that setting and resolve enabled timing
              values from DDR4-3200.
            owners: &id074
            - timing
          BASE_TFAW:
