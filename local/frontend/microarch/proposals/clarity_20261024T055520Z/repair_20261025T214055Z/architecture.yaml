              status: draft
              role: request_storage
              owned_state:
                entries: Ordered admitted shared.types.request entries, bounded by
                  shared.parameters.WAITING_CAPACITY.
                occupancy: Registered count of entries awaiting dispatch.
              interfaces:
                enq_valid:
                  direction: input
                  type: shared.types.bit
                enq_ready:
                  direction: output
                  type: shared.types.bit
                enq_request:
                  direction: input
                  type: shared.types.request
                head_valid:
                  direction: output
                  type: shared.types.bit
                head_request:
                  direction: output
                  type: shared.types.request
                head_take:
                  direction: input
                  type: shared.types.bit
              handshakes:
                admission: shared.events.admission appends the complete pre-edge enq_request
                  after all existing entries.
                dispatch: shared.events.dispatch removes only the pre-edge head when
                  head_valid and head_take are high.
                capacity: enq_ready is true when occupancy is below capacity or a
                  valid head is removed on the same edge.
              reset: At a reset-sampled rising edge clear all entries and occupancy.
                While rst_n is low, enq_ready and head_valid are low and head_request
                is canonical zero.
              update_events:
                shared.events.admission: Append the accepted request after all older
                  entries.
                shared.events.dispatch: Remove the pre-edge head only; head_take without
                  a valid head has no effect.
              stalls: A valid head and its complete payload remain stable until dispatch
                or reset. Tail admissions do not modify the stalled head.
              simultaneous_events:
                admission_and_dispatch: Capture and remove the old head, then append
                  the admitted request. Occupancy is unchanged, including at full
                  occupancy and capacity one.
                admission_when_empty: Append only; no dispatch occurs because the
                  pre-edge head is invalid.
                reset_and_events: Reset wins.
