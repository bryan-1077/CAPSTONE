    - 'system.rules.BASE_RESET: Use top-level clk and active-low rst_n. Reset clears
      pending requests, active service, row validity, memory and responses. Preserve
      reusable blocks with either synchronous or asynchronous active-low resets driven
      by the same rst_n; differing assertion styles do not require rebuilding otherwise
      reusable blocks. Do not change polarity without an explicit adapter.'
    - 'system.rules.CONSTRAINT_10: Requested constraint /microarchitecture/baseline
      = "current_controller".'
    - 'system.rules.CONSTRAINT_2: Requested constraint /design_type = "memory_controller".'
    - 'system.rules.CONSTRAINT_5: Requested constraint /features/scheduler = "fifo".'
    - 'system.rules.R1: Implement global FIFO service in acceptance order, including
      same-address writes and reads. Admit on every rising-edge txn_valid && txn_ready,
      independently of command readiness.'
    - 'system.rules.R10: Use synchronous active-low reset for state, with immediate
      valid/ready/event gating. Reset clears queued/active/cleanup work, row state,
      timing history, memory, responses and refresh state; it wins over every simultaneous
      event. The host holds payload while stalled and samples every response; no response
      backpressure is provided.'
    - 'system.rules.R11: Generate architecture-specific module isolation and system
      verification intent with exact requirement IDs, independent scenarios/expected
      results, and declared port/event bindings. Export it alongside RTL for the external
      UVM/vector stage. Do not execute downstream verification or backend stages in
      this frontend flow.'
    - 'system.rules.R2: Provide four waiting entries plus one separately stored active
      request. Dispatch only previously stored requests, capture the complete pre-edge
      head before releasing its slot, and permit full-queue simultaneous dispatch/admission
      including capacity one. No empty-queue bypass or same-edge active replacement
      at retirement.'
    - 'system.rules.R4: Keep separate owners for host mapping, waiting storage, scheduling,
      command sequencing, row state, timing, functional memory/responses, and refresh
      control. The top must contain structural connections only.'
    implementation_constraints:
    - Use the exact elaborated port widths and packed field offsets; no additional
      public ports.
    - Honor every contract handshake, reset, update event, stall and simultaneous-event
      rule.
    - Do not transfer owned state or responsibilities into another module or top-level
      wiring.
    - Implement the declared combinational dependencies accurately; internal registers
      and helper logic remain implementation choices.
    - Parameter values and timing values in specification_context are concrete for
      this build; do not substitute legacy defaults.
    - A conditionally omitted input has no signal in this build; apply its specified
      absent-port behavior.
    combinational_dependencies: *id029
- instance: command_engine
  roles:
  - command_engine
  responsibility: command_sequencing
  spec:
    design_name: ddr4_controller_top_spec_command_engine
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: dispatch_valid
      direction: input
      width: 1
      description: shared.types.bit
    - name: dispatch_request
      direction: input
      width: 51
      description: shared.types.request
    - name: dispatch_ready
      direction: output
      width: 1
      description: shared.types.bit
    - name: open_valid
      direction: input
      width: 4
      description: shared.types.bank_valid
    - name: open_rows
      direction: input
      width: 40
      description: shared.types.bank_rows
    - name: refresh_pending
      direction: input
      width: 1
      description: shared.types.bit
    - name: refresh_busy
      direction: input
      width: 1
      description: shared.types.bit
    - name: candidate_valid
      direction: output
      width: 1
      description: shared.types.bit
    - name: candidate_command
      direction: output
      width: 53
      description: shared.types.command
    - name: candidate_ok
      direction: input
      width: 1
      description: shared.types.bit
    - name: commit_valid
      direction: output
      width: 1
      description: shared.types.bit
    - name: commit_command
      direction: output
      width: 53
      description: shared.types.command
    - name: probe_valid
      direction: output
      width: 1
      description: shared.types.bit
    - name: probe_command
      direction: output
      width: 53
      description: shared.types.command
    - name: probe_ok
      direction: input
      width: 1
      description: shared.types.bit
    - name: execution_ready
      direction: output
      width: 1
      description: shared.types.bit
    - name: incoming_request
      direction: input
      width: 51
      description: shared.types.request
    - name: cleanup_active
      direction: output
      width: 1
      description: shared.types.bit
    behavior:
      description: Implement the complete command_engine contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: command_sequencing
        owned_state:
          active: Validity and complete shared.types.request captured only by shared.events.dispatch
            and retained until READ or WRITE retirement.
          candidate: Registered candidate validity and shared.types.command payload.
          cleanup: Close-page cleanup reservation for one retired serviced bank.
          refresh_preparation: Control-work phase and ascending-bank preparation selection
            derived from refresh pending and registered row state.
        interfaces:
          dispatch_valid:
            direction: input
            type: shared.types.bit
            width: 1
          dispatch_request:
            direction: input
            type: shared.types.request
            width: 51
          dispatch_ready:
            direction: output
            type: shared.types.bit
            width: 1
          open_valid:
            direction: input
            type: shared.types.bank_valid
            width: 4
          open_rows:
            direction: input
            type: shared.types.bank_rows
            width: 40
          refresh_pending:
            direction: input
            type: shared.types.bit
            width: 1
          refresh_busy:
            direction: input
            type: shared.types.bit
            width: 1
          candidate_valid:
            direction: output
            type: shared.types.bit
            width: 1
          candidate_command:
            direction: output
            type: shared.types.command
            width: 53
          candidate_ok:
            direction: input
            type: shared.types.bit
            width: 1
          commit_valid:
            direction: output
            type: shared.types.bit
            width: 1
          commit_command:
            direction: output
            type: shared.types.command
            width: 53
          probe_valid:
            direction: output
            type: shared.types.bit
            width: 1
          probe_command:
            direction: output
            type: shared.types.command
            width: 53
          probe_ok:
            direction: input
            type: shared.types.bit
            width: 1
          execution_ready:
            direction: output
            type: shared.types.bit
            width: 1
          incoming_request:
            direction: input
            type: shared.types.request
            width: 51
          cleanup_active:
            direction: output
            type: shared.types.bit
            width: 1
        handshakes:
          dispatch: shared.events.dispatch captures dispatch_request only when active,
            candidate, cleanup, refresh preparation, and refresh service are absent.
          candidate: candidate_command is the canonical registered proposal. commit_command
            mirrors it even when permission is low. commit_valid requires a valid
            non-NOP, nonreserved candidate and candidate_ok.
          probe: probe_command is the combinational first-command query from incoming_request
            and registered row state. probe_valid and execution_ready are diagnostic
            gates only and do not alter probe payload or state.
          cleanup_observation: cleanup_active is a verification-only registered indication
            of the cleanup reservation. It has no functional sink.
        reset: Clear active, candidate, cleanup, and refresh-preparation ownership.
          Gate dispatch_ready, candidate_valid, commit_valid, probe_valid, execution_ready,
          and cleanup_active low while rst_n is low. candidate_command, commit_command,
          and probe_command are canonical zero NOP while reset is low; candidate and
          commit payloads are zero NOP whenever candidate_valid is low.
        update_events:
          shared.events.dispatch: Capture the complete pre-edge FIFO request into
            active ownership. Do not create a candidate on this edge.
          shared.events.candidate_create: When active ownership exists and the candidate
            slot is empty, create the first active-service command on a later edge
            from registered active ownership and registered row state.
          shared.events.cleanup_candidate_create: When close-page cleanup is reserved,
            active ownership is absent, and the candidate slot is empty, create one
            later PRE candidate for the reserved bank.
          shared.events.refresh_candidate_create: When refresh is pending with no
            active or cleanup ownership and no candidate, create one later PRE for
            the lowest-index open bank or REF when all banks are closed.
          shared.events.command_commit: Clear the candidate slot. PRE and ACT advance
            active sequencing without retirement. READ or WRITE retires active ownership;
            close-page retirement creates cleanup ownership. A cleanup PRE commit
            clears cleanup ownership. REF completes one refresh preparation acknowledgement.
        stalls: A blocked valid candidate and its payload remain unchanged until commit
          or reset. No same-edge candidate replacement occurs after commit. Pending
          refresh blocks future dispatch after active work resolves.
        simultaneous_events:
          reset_and_events: Reset wins.
          candidate_and_other_progress: An outstanding candidate holds or commits
            before dispatch or another candidate source is considered.
          creation_priority: With an empty candidate slot, active-service creation
            precedes cleanup creation, cleanup creation precedes refresh-preparation
            creation, and dispatch is allowed only when none applies.
          retirement_and_dispatch: Dispatch cannot replace active ownership on the
            retirement edge.
          due_and_REF: Refresh pending remains asserted when due coincides with REF
            commit.
        combinational_dependencies: &id033
          dispatch_ready:
          - refresh_pending
          - refresh_busy
          candidate_valid: []
          candidate_command: []
          commit_valid:
          - candidate_ok
          commit_command: []
          probe_valid:
          - refresh_pending
          - refresh_busy
          probe_command:
          - incoming_request
          - open_valid
          - open_rows
          execution_ready:
          - probe_ok
          - refresh_pending
          - refresh_busy
          cleanup_active: []
        invariants:
        - execution.rules.EXEC_BANK_STATE
        - execution.rules.EXEC_CLEANUP
        - execution.rules.EXEC_COMMIT
        - execution.rules.EXEC_CONTROL_CREATION
        - execution.rules.EXEC_PAYLOAD
        - execution.rules.EXEC_READY
        - execution.rules.EXEC_REFRESH
        - system.rules.BASE_ADDRESS
        - system.rules.BASE_LEGALITY
        - system.rules.BASE_MODULARITY
        - system.rules.BASE_POLICY
        - system.rules.BASE_QUEUE
        - system.rules.BASE_REFRESH
        - system.rules.BASE_RESET
        - system.rules.BASE_SEQUENCE
        - system.rules.CONSTRAINT_10
        - system.rules.CONSTRAINT_2
        - system.rules.CONSTRAINT_3
        - system.rules.CONSTRAINT_4
        - system.rules.R1
        - system.rules.R10
        - system.rules.R11
        - system.rules.R12
        - system.rules.R13
        - system.rules.R2
        - system.rules.R3
        - system.rules.R4
        - system.rules.R7
        - system.rules.R8
        - system.rules.R9
        - system.rules.SYS_CONTROL_PRIORITY
        - system.rules.SYS_SIMULTANEOUS
        - system.rules.SYS_STORAGE
        verification:
        - execution.verification.X_BANK
        - execution.verification.X_CLEANUP
        - execution.verification.X_COMMIT
        - execution.verification.X_CONTROL
        - execution.verification.X_PAYLOAD
        - execution.verification.X_READY
        - execution.verification.X_REFRESH
        - system.verification.V_ADDRESS
        - system.verification.V_CANDIDATE
        - system.verification.V_CAPACITY
        - system.verification.V_CONFIGURATION
        - system.verification.V_DIAGNOSTIC
        - system.verification.V_EXACTLY_ONCE
        - system.verification.V_EXPORT
        - system.verification.V_FIFO
        - system.verification.V_IDENTITY
        - system.verification.V_ISOLATION
        - system.verification.V_MEMORY
        - system.verification.V_PAGE
        - system.verification.V_PAYLOAD
        - system.verification.V_REFRESH
        - system.verification.V_RESET
        - system.verification.V_SEQUENCE
        - system.verification.V_TIMING
      specification_context: *id015
      active_ports:
      - candidate_command
      - candidate_ok
      - candidate_valid
      - cleanup_active
      - commit_command
      - commit_valid
      - dispatch_ready
      - dispatch_request
      - dispatch_valid
      - execution_ready
      - incoming_request
      - open_rows
      - open_valid
      - probe_command
      - probe_ok
      - probe_valid
      - refresh_busy
      - refresh_pending
      verification_obligations:
        execution.verification.X_BANK: &id034
          scenario: Commit ACT, PRE, READ, WRITE, and REF across banks and compare
            with stalled proposals.
          expected: Only responsible committed operations alter row state.
          status: planned_not_executed
          rules:
          - EXEC_BANK_STATE
        execution.verification.X_CLEANUP: &id035
          scenario: Retire accesses under both page-policy values, retain cleanup
            through a timing-blocked PRE, and assert refresh during cleanup.
          expected: Open-page retains rows; close-page exposes a distinct cleanup
            reservation, blocks dispatch, produces one later legal cleanup PRE candidate,
            commits that PRE once, and only then permits refresh preparation.
          status: planned_not_executed
          rules:
          - EXEC_CLEANUP
        execution.verification.X_COMMIT: &id036
          scenario: Present legal commands, NOP, reserved opcodes, blocked candidates,
            and simultaneous admissions.
          expected: Only permitted legal candidates commit once per edge and noncommits
            have no commit effects.
          status: planned_not_executed
          rules:
          - EXEC_COMMIT
        execution.verification.X_CONTROL: &id037
          scenario: Retire close-page work without active ownership, then initiate
            refresh with multiple open banks and no active ownership.
          expected: Cleanup and refresh preparation create independently distinguishable
            PRE or REF candidates after active retirement or with no active request;
            each candidate holds when blocked and is not replaced on its commit edge.
          status: planned_not_executed
          rules:
          - EXEC_CONTROL_CREATION
        execution.verification.X_PAYLOAD: &id043
          scenario: Observe candidate, commit, probe, and probe-valid values while
            validity, permission, probe gating, refresh, cleanup, and reset vary.
          expected: Invalid and reset candidate payloads are zero NOP, blocked candidate
            payload holds, commit payload mirrors candidate independent of permission,
            and probe payload remains independently defined when probe validity is
            low.
          status: planned_not_executed
          rules:
          - EXEC_PAYLOAD
        execution.verification.X_READY: *id016
        execution.verification.X_REFRESH: &id038
          scenario: Run deadlines through active, stalled candidate, cleanup, multiple
            open banks, ordered preparation, tRFC exclusion, and due/REF coincidence.
          expected: Pending coalesces without traffic loss; close order is ascending;
            no command commits early after REF; service resumes afterward.
          status: planned_not_executed
          rules:
          - EXEC_REFRESH
        system.verification.V_ADDRESS: *id030
        system.verification.V_CANDIDATE: &id039
          scenario: Dispatch, create, stall, commit, and attempt same-edge replacement;
            repeat with cleanup reserved and with refresh pending.
          expected: Dispatch creates no candidate; blocked candidates hold; commit
            clears the slot; later creation uses updated state; active, cleanup, and
            refresh-preparation candidates follow the declared priority and never
            replace on the commit edge.
          status: planned_not_executed
          rules:
          - BASE_SEQUENCE
          - R12
          - SYS_CONTROL_PRIORITY
        system.verification.V_CAPACITY: *id026
        system.verification.V_CONFIGURATION: *id017
        system.verification.V_DIAGNOSTIC: *id031
        system.verification.V_EXACTLY_ONCE: *id027
        system.verification.V_EXPORT: *id018
        system.verification.V_FIFO: *id019
        system.verification.V_IDENTITY: *id021
        system.verification.V_ISOLATION: *id022
        system.verification.V_MEMORY: *id023
        system.verification.V_PAGE: *id028
        system.verification.V_PAYLOAD: &id045
          scenario: Vary candidate valid, permission, probe valid, idle restrictions,
            cleanup, refresh restrictions, and reset independently.
          expected: Invalid candidate and reset command payloads are zero NOP; commit
            payload mirrors candidate; probe payload remains independently defined
            when probe validity is low.
          status: planned_not_executed
          rules:
          - R13
        system.verification.V_REFRESH: *id032
        system.verification.V_RESET: *id024
        system.verification.V_SEQUENCE: &id040
          scenario: Service closed-bank, row-hit, and row-conflict requests while
            candidates stall.
          expected: Closed banks use ACT then access, hits use access, conflicts use
            PRE then ACT then access, and setup commands do not retire active work.
          status: planned_not_executed
          rules:
          - BASE_SEQUENCE
          - R3
        system.verification.V_TIMING: &id041
          scenario: Test trigger and blocked commands at E+T-1 and E+T, including
            global ACT spacing and four prior ACTs.
          expected: Only committed commands update history; permission is independent
            of its own acceptance; no command commits early; exact boundaries are
            eligible when other conditions hold.
          status: planned_not_executed
          rules:
          - BASE_LEGALITY
          - BASE_TFAW
          - BASE_TIMING
          - BASE_TRRD
          - R5
    invariants:
    - 'execution.rules.EXEC_BANK_STATE: Only committed ACT opens and records its bank
      row, committed PRE closes its bank, and committed REF clears all rows after
      preparation. READ and WRITE retain open rows. Probes, proposals, admissions,
      dispatches, and stalls do not alter row state.'
    - 'execution.rules.EXEC_CLEANUP: Open-page creates no cleanup reservation after
      retirement. Close-page retirement creates one cleanup reservation for the serviced
      bank. While reserved, dispatch is blocked. With no active candidate, a cleanup
      PRE candidate is created on a later edge, remains stable until permitted, commits
      once when legal, and then clears the reservation. Refresh preparation waits
      for the cleanup reservation to clear.'
    - 'execution.rules.EXEC_COMMIT: candidate_command is the canonical proposal. commit_command
      mirrors it even when candidate_ok is low. commit_valid requires reset inactive,
      valid candidate, permission, and non-NOP nonreserved opcode. At most one command
      commits per edge and all consumers sample the same payload only on commit_valid.'
    - 'execution.rules.EXEC_CONTROL_CREATION: A cleanup reservation creates PRE control
      work independently of active ownership. Refresh pending creates successive PRE
      control work for the lowest-index open bank and then REF control work when all
      banks are closed, independently of active ownership. Control candidates are
      created only on later edges when the candidate slot is empty, hold while blocked,
      clear on commit, and do not receive same-edge replacement.'
    - 'execution.rules.EXEC_PAYLOAD: candidate_command is zero NOP when candidate_valid
      is low. A blocked valid candidate remains unchanged. probe_command is the combinational
      first-command query from incoming mapped request and registered bank state even
      when probe validity is low. Reset forces all command payloads to zero NOP.'
    - 'execution.rules.EXEC_READY: txn_ready reflects only waiting admission capacity
      including same-edge dispatch release. cmd_ready is reset-gated diagnostic first-command
      readiness using independent row and timing probes while idle and permitted by
      cleanup and refresh state. Neither diagnostic alters state.'
    - 'execution.rules.EXEC_REFRESH: The first deadline is the last reset-sampled
      edge plus tREFI; later deadlines advance by tREFI independently of REF. Pending
      is sticky. Pending blocks dispatch after active work resolves, waits for cleanup
      completion, creates ordered refresh-preparation PRE candidates until all banks
      are closed, waits all-bank tRP, creates and commits one REF candidate, and excludes
      commands strictly before REF-edge+tRFC.'
    - 'system.rules.BASE_ADDRESS: Preserve the simplified 4-bit txn_addr mapping:
      row=txn_addr[3:2], column=txn_addr[1:0], zero-extended into the internal 10-bit
      row and 6-bit column fields. Preserve explicit txn_bank for multi-bank configurations;
      a single-bank configuration uses bank 0. Internal packed requests retain bank(2),
      row(10), column(6), write flag(1), write data(32).'
    - 'system.rules.BASE_LEGALITY: Compute command permission from registered timing/bank
      history and an independent candidate. An accepted ACT pulse is derived from
      candidate && permission; permission must not combinationally depend on that
      same accepted pulse. Scheduler selection/validity must be available independently
      of timing_ok; timing_ok may gate commit but must not create a selection-validity
      feedback loop. Declare accurate per-output combinational input dependencies.'
    - 'system.rules.BASE_MODULARITY: Keep request storage, request selection, command
      sequencing, timing enforcement and functional memory in independently verifiable
      modules with explicit interfaces. No single controller core may own all these
      functions. Each mandatory role has distinct module owners with functional inter-module
      connections. Module names and further decomposition remain design choices.'
    - 'system.rules.BASE_POLICY: Honor the requested scheduler policy fifo. Preserve
      page policy open_page. Open-page retains a serviced row; close-page closes it
      before subsequent bank use. Preserve request ownership through any setup sequence.
      Internal module decomposition and command latency may change while these observable
      contracts hold.'
    - 'system.rules.BASE_QUEUE: Provide 4 WAITING request slots PLUS one separately
      stored active-service request: waiting plus active capacity is 5. The active
      request must not consume a waiting slot. Dispatch captures the complete pre-edge
      request in active registers and frees its waiting slot without retiring the
      transaction. A full queue may admit on the same edge as dispatch; retirement
      alone does not free waiting storage. Accepted request fields survive stalls
      and each accepted request is serviced exactly once within a reset-free epoch.
      Keep admission, dispatch, retirement and read response delivery distinct. Captured
      response storage consumes neither waiting nor active capacity.'
    - 'system.rules.BASE_REFRESH: Retain periodic refresh requests using profile tREFI,
      refresh priority and request/acknowledgment handling without dropping queued
      traffic. Refresh must make progress and normal requests must resume. Existing
      refresh is simplified; full REF/tRFC servicing remains later feature work. If
      explicit REF is proposed, describe drain/row-state interaction and acknowledge
      once at commit.'
    - 'system.rules.BASE_RESET: Use top-level clk and active-low rst_n. Reset clears
      pending requests, active service, row validity, memory and responses. Preserve
      reusable blocks with either synchronous or asynchronous active-low resets driven
      by the same rst_n; differing assertion styles do not require rebuilding otherwise
      reusable blocks. Do not change polarity without an explicit adapter.'
    - 'system.rules.BASE_SEQUENCE: Dispatch captures the complete selected request
      in separate active-service registers before freeing its waiting queue slot.
      Hold that active request and payload across setup PRE/ACT and timing stalls
      until its final READ/WRITE commits. Setup commands never retire the active request.
      Aggregate service also keeps active-service ownership through completion. Waiting-queue
      dequeue at dispatch is distinct from active-request retirement. Row state changes
      only on the responsible committed operation; uncommitted proposals cannot change
      state.'
    - 'system.rules.CONSTRAINT_10: Requested constraint /microarchitecture/baseline
      = "current_controller".'
    - 'system.rules.CONSTRAINT_2: Requested constraint /design_type = "memory_controller".'
    - 'system.rules.CONSTRAINT_3: Requested constraint /features/page_policy = "open_page".'
    - 'system.rules.CONSTRAINT_4: Requested constraint /features/refresh = true.'
    - 'system.rules.R1: Implement global FIFO service in acceptance order, including
      same-address writes and reads. Admit on every rising-edge txn_valid && txn_ready,
      independently of command readiness.'
    - 'system.rules.R10: Use synchronous active-low reset for state, with immediate
      valid/ready/event gating. Reset clears queued/active/cleanup work, row state,
      timing history, memory, responses and refresh state; it wins over every simultaneous
      event. The host holds payload while stalled and samples every response; no response
      backpressure is provided.'
    - 'system.rules.R11: Generate architecture-specific module isolation and system
      verification intent with exact requirement IDs, independent scenarios/expected
      results, and declared port/event bindings. Export it alongside RTL for the external
      UVM/vector stage. Do not execute downstream verification or backend stages in
      this frontend flow.'
    - 'system.rules.R12: Explicitly distinguish initial command candidate creation
      from replacement. Dispatch captures the request without forming a candidate
      on that edge. When the candidate slot is empty, form the first candidate on
      a later edge from registered ownership and current bank state. Hold a blocked
      candidate unchanged. Commit clears its slot; a following candidate is formed
      only on a later edge using updated bank state, never by same-edge replacement.
      Reset wins; an outstanding candidate holds or commits before other progress.
      With no candidate, drain active service, then cleanup, then pending refresh
      preparation. Refresh service blocks dispatch and new candidate formation. Internal
      state encoding remains an implementation choice.'
    - 'system.rules.R13: Define payload behavior independently of valid gating. candidate_command
      is canonical zero NOP when candidate_valid is low. commit_command mirrors candidate_command
      even when candidate_ok is low; permission gates commit_valid only, and consumers
      sample payload only on commit_valid. probe_command remains the combinational
      first-command query from the incoming request and bank state even when probe_valid
      is low; idle, cleanup and refresh restrictions gate probe validity/readiness,
      not its payload. Reset forces all command payloads to zero NOP. Combinational
      dependencies must include any current-cycle input used to gate payload, not
      just its valid signal.'
    - 'system.rules.R2: Provide four waiting entries plus one separately stored active
      request. Dispatch only previously stored requests, capture the complete pre-edge
      head before releasing its slot, and permit full-queue simultaneous dispatch/admission
      including capacity one. No empty-queue bypass or same-edge active replacement
      at retirement.'
    - 'system.rules.R3: Use explicit NOP/ACT/PRE/READ/WRITE/REF command semantics,
      with NOP never committed and at most one command commit per edge. Sequence closed
      banks with ACT-access, row hits with access, and row conflicts with PRE-ACT-access.
      PRE/ACT never retire the active request. Keep blocked candidates stable through
      stalls and newly pending refresh.'
    - 'system.rules.R4: Keep separate owners for host mapping, waiting storage, scheduling,
      command sequencing, row state, timing, functional memory/responses, and refresh
      control. The top must contain structural connections only.'
    - 'system.rules.R7: Open-page retains rows. Support close-page as a configurable
      alternative, retaining a separate cleanup bank reservation after retirement
      until a legal PRE commits; block new dispatch during cleanup.'
    - 'system.rules.R8: Generate periodic refresh deadlines from the last sampled
      reset edge using tREFI. Coalesce missed deadlines into sticky pending; a due
      deadline wins over simultaneous REF acknowledgment. Drain active work and cleanup,
      PRE remaining open banks in ascending order, respect all-bank tRP, commit REF
      once, and exclude commands strictly before REF-edge+tRFC. Retain queued traffic
      and resume service afterward.'
    - 'system.rules.R9: cmd_ready is reset-gated diagnostic readiness for the incoming
      request''s first needed command, using independent row/timing probe queries
      while the engine is idle and cleanup/refresh permit. It is meaningful without
      txn_valid and must not admit, dispatch, bypass FIFO, mutate history or reserve
      storage.'
    - 'system.rules.SYS_CONTROL_PRIORITY: With reset inactive, an outstanding candidate
      holds or commits before other nonreset progress. When candidate storage is empty,
      active-request candidate creation has priority over cleanup candidate creation,
      cleanup candidate creation has priority over refresh-preparation candidate creation,
      and dispatch is permitted only when none of those control conditions applies.
      A candidate created from cleanup or refresh preparation follows the same hold,
      permission, commit, and no-same-edge-replacement rules as an active-request
      candidate.'
    - 'system.rules.SYS_SIMULTANEOUS: Reset wins over every event. With reset inactive,
      admission may coincide with command commit. Full waiting storage may admit on
      a dispatch edge using the pre-edge head for dispatch and the incoming request
      for the tail. Dispatch and retirement do not coincide because active ownership
      remains occupied through retirement. A refresh due coincident with REF commit
      leaves pending asserted.'
    - 'system.rules.SYS_STORAGE: Waiting storage holds admitted undispatched requests,
      active storage holds one dispatched unretired request, cleanup reservation holds
      only a retired close-page bank awaiting its PRE, candidate storage holds exactly
      one uncommitted command proposal, and response storage holds one captured read
      response. These capacities are independent. Dispatch release is not retirement.'
    implementation_constraints:
    - Use the exact elaborated port widths and packed field offsets; no additional
      public ports.
    - Honor every contract handshake, reset, update event, stall and simultaneous-event
      rule.
    - Do not transfer owned state or responsibilities into another module or top-level
      wiring.
    - Implement the declared combinational dependencies accurately; internal registers
      and helper logic remain implementation choices.
    - Parameter values and timing values in specification_context are concrete for
      this build; do not substitute legacy defaults.
    - A conditionally omitted input has no signal in this build; apply its specified
      absent-port behavior.
    combinational_dependencies: *id033
