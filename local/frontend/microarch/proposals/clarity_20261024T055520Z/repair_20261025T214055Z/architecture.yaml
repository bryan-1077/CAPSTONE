- id: SYS_SIMULTANEOUS
  text: Reset wins over every event. With reset inactive, admission may coincide with
    command commit. Full waiting storage may admit on a dispatch edge using the pre-edge
    head for dispatch and the incoming request for the tail. Dispatch and retirement
    do not coincide because active ownership remains occupied through retirement.
    A refresh due coincident with REF commit leaves pending asserted.
  owners: *id088
  verification: "source: system.rules.SYS_SIMULTANEOUS\norigin: model_selected\nobligations:\n\
    \  V_CAPACITY:\n    scenario: Fill waiting storage, stall active service, dispatch\
    \ at full occupancy,\n      admit concurrently with dispatch, and retire with\
    \ queued work.\n    expected: Four waiting entries and one active request coexist;\
    \ full waiting storage\n      admits on dispatch; retirement alone does not free\
    \ waiting storage; no empty-queue\n      bypass occurs.\n    status: planned_not_executed\n\
    \    rules:\n    - BASE_QUEUE\n    - CONSTRAINT_11\n    - R2\n    - SYS_SIMULTANEOUS\n\
    \    - SYS_STORAGE\n  V_REFRESH:\n    scenario: Cause deadlines while idle, active,\
    \ candidate-blocked, cleanup-active,\n      during preparation PRE commits, and\
    \ during REF acknowledgment.\n    expected: Deadlines coalesce; active and cleanup\
    \ drain; remaining banks close\n      in ascending order through refresh-preparation\
    \ PRE candidates; REF occurs after\n      all-bank tRP; due with REF leaves pending;\
    \ traffic resumes after tRFC.\n    status: planned_not_executed\n    rules:\n\
    \    - BASE_REFRESH\n    - R8\n    - SYS_CONTROL_PRIORITY\n    - SYS_SIMULTANEOUS\n\
    \  V_RESET:\n    scenario: Assert reset during every defined event and visible\
    \ response condition.\n    expected: Events and valid/ready outputs are gated\
    \ while reset is low; reset clears\n      specified state and defeats simultaneous\
    \ nonreset actions.\n    status: planned_not_executed\n    rules:\n    - BASE_HOST\n\
    \    - BASE_RESET\n    - R10\n    - SYS_SIMULTANEOUS\n"
- id: SYS_STORAGE
  text: Waiting storage holds admitted undispatched requests, active storage holds
    one dispatched unretired request, cleanup reservation holds only a retired close-page
    bank awaiting its PRE, candidate storage holds exactly one uncommitted command
    proposal, and response storage holds one captured read response. These capacities
    are independent. Dispatch release is not retirement.
  owners: *id089
  verification: "source: system.rules.SYS_STORAGE\norigin: model_selected\nobligations:\n\
    \  V_CAPACITY:\n    scenario: Fill waiting storage, stall active service, dispatch\
    \ at full occupancy,\n      admit concurrently with dispatch, and retire with\
    \ queued work.\n    expected: Four waiting entries and one active request coexist;\
    \ full waiting storage\n      admits on dispatch; retirement alone does not free\
    \ waiting storage; no empty-queue\n      bypass occurs.\n    status: planned_not_executed\n\
    \    rules:\n    - BASE_QUEUE\n    - CONSTRAINT_11\n    - R2\n    - SYS_SIMULTANEOUS\n\
    \    - SYS_STORAGE\n  V_EXACTLY_ONCE:\n    scenario: Apply long timing stalls,\
    \ refresh delays, repeated queue reuse, and\n      mixed traffic in a reset-free\
    \ epoch.\n    expected: Each admitted request is dispatched and serviced once\
    \ with no loss,\n      duplication, or premature retirement.\n    status: planned_not_executed\n\
    \    rules:\n    - BASE_QUEUE\n    - SYS_STORAGE\n  V_PAGE:\n    scenario: Run\
    \ equivalent traffic under both page-policy values, create a close-page\n    \
    \  cleanup reservation, and assert refresh during cleanup.\n    expected: Open-page\
    \ retains rows. Close-page retirement creates a separate cleanup\n      reservation,\
    \ blocks dispatch, creates exactly one legal PRE candidate after\n      retirement,\
    \ and releases the reservation only when that PRE commits. Refresh\n      preparation\
    \ begins only after cleanup completes.\n    status: planned_not_executed\n   \
    \ rules:\n    - BASE_POLICY\n    - R7\n    - SYS_CONTROL_PRIORITY\n    - SYS_STORAGE\n\
    \  V_MEMORY:\n    scenario: Write and read every compact address in every bank,\
    \ overlap response\n      delivery with later reads, and reset during response\
    \ visibility.\n    expected: WRITE updates only its addressed word; READ captures\
    \ pre-edge data and\n      yields one E+1 response; banks isolate; reset zeros\
    \ memory and cancels validity.\n    status: planned_not_executed\n    rules:\n\
    \    - BASE_DATA\n    - CONSTRAINT_12\n    - R6\n    - SYS_STORAGE\n"
- id: SYS_CONTROL_PRIORITY
  text: With reset inactive, an outstanding candidate holds or commits before other
    nonreset progress. When candidate storage is empty, active-request candidate creation
    has priority over cleanup candidate creation, cleanup candidate creation has priority
    over refresh-preparation candidate creation, and dispatch is permitted only when
    none of those control conditions applies. A candidate created from cleanup or
    refresh preparation follows the same hold, permission, commit, and no-same-edge-replacement
    rules as an active-request candidate.
  owners: *id090
  verification: "source: system.rules.SYS_CONTROL_PRIORITY\norigin: model_selected\n\
    obligations:\n  V_CANDIDATE:\n    scenario: Dispatch, create, stall, commit, and\
    \ attempt same-edge replacement;\n      repeat with cleanup reserved and with\
    \ refresh pending.\n    expected: Dispatch creates no candidate; blocked candidates\
    \ hold; commit clears\n      the slot; later creation uses updated state; active,\
    \ cleanup, and refresh-preparation\n      candidates follow the declared priority\
    \ and never replace on the commit edge.\n    status: planned_not_executed\n  \
    \  rules:\n    - BASE_SEQUENCE\n    - R12\n    - SYS_CONTROL_PRIORITY\n  V_PAGE:\n\
    \    scenario: Run equivalent traffic under both page-policy values, create a\
    \ close-page\n      cleanup reservation, and assert refresh during cleanup.\n\
    \    expected: Open-page retains rows. Close-page retirement creates a separate\
    \ cleanup\n      reservation, blocks dispatch, creates exactly one legal PRE candidate\
    \ after\n      retirement, and releases the reservation only when that PRE commits.\
    \ Refresh\n      preparation begins only after cleanup completes.\n    status:\
    \ planned_not_executed\n    rules:\n    - BASE_POLICY\n    - R7\n    - SYS_CONTROL_PRIORITY\n\
    \    - SYS_STORAGE\n  V_REFRESH:\n    scenario: Cause deadlines while idle, active,\
    \ candidate-blocked, cleanup-active,\n      during preparation PRE commits, and\
    \ during REF acknowledgment.\n    expected: Deadlines coalesce; active and cleanup\
    \ drain; remaining banks close\n      in ascending order through refresh-preparation\
    \ PRE candidates; REF occurs after\n      all-bank tRP; due with REF leaves pending;\
    \ traffic resumes after tRFC.\n    status: planned_not_executed\n    rules:\n\
    \    - BASE_REFRESH\n    - R8\n    - SYS_CONTROL_PRIORITY\n    - SYS_SIMULTANEOUS\n"
- id: EXEC_BANK_STATE
  text: Only committed ACT opens and records its bank row, committed PRE closes its
    bank, and committed REF clears all rows after preparation. READ and WRITE retain
    open rows. Probes, proposals, admissions, dispatches, and stalls do not alter
    row state.
  owners: *id091
  verification: "source: execution.rules.EXEC_BANK_STATE\norigin: model_selected\n\
    obligations:\n  X_BANK:\n    scenario: Commit ACT, PRE, READ, WRITE, and REF across\
    \ banks and compare with\n      stalled proposals.\n    expected: Only responsible\
    \ committed operations alter row state.\n    status: planned_not_executed\n  \
    \  rules:\n    - EXEC_BANK_STATE\n"
- id: EXEC_CLEANUP
  text: Open-page creates no cleanup reservation after retirement. Close-page retirement
    creates one cleanup reservation for the serviced bank. While reserved, dispatch
    is blocked. With no active candidate, a cleanup PRE candidate is created on a
    later edge, remains stable until permitted, commits once when legal, and then
    clears the reservation. Refresh preparation waits for the cleanup reservation
    to clear.
  owners: *id092
  verification: "source: execution.rules.EXEC_CLEANUP\norigin: model_selected\nobligations:\n\
    \  X_CLEANUP:\n    scenario: Retire accesses under both page-policy values, retain\
    \ cleanup through\n      a timing-blocked PRE, and assert refresh during cleanup.\n\
    \    expected: Open-page retains rows; close-page exposes a distinct cleanup reservation,\n\
    \      blocks dispatch, produces one later legal cleanup PRE candidate, commits\
    \ that\n      PRE once, and only then permits refresh preparation.\n    status:\
    \ planned_not_executed\n    rules:\n    - EXEC_CLEANUP\n"
- id: EXEC_COMMIT
  text: candidate_command is the canonical proposal. commit_command mirrors it even
    when candidate_ok is low. commit_valid requires reset inactive, valid candidate,
    permission, and non-NOP nonreserved opcode. At most one command commits per edge
    and all consumers sample the same payload only on commit_valid.
  owners: *id093
  verification: "source: execution.rules.EXEC_COMMIT\norigin: model_selected\nobligations:\n\
    \  X_COMMIT:\n    scenario: Present legal commands, NOP, reserved opcodes, blocked\
    \ candidates, and\n      simultaneous admissions.\n    expected: Only permitted\
    \ legal candidates commit once per edge and noncommits\n      have no commit effects.\n\
    \    status: planned_not_executed\n    rules:\n    - EXEC_COMMIT\n"
- id: EXEC_CONTROL_CREATION
  text: A cleanup reservation creates PRE control work independently of active ownership.
    Refresh pending creates successive PRE control work for the lowest-index open
    bank and then REF control work when all banks are closed, independently of active
    ownership. Control candidates are created only on later edges when the candidate
    slot is empty, hold while blocked, clear on commit, and do not receive same-edge
    replacement.
  owners: *id094
  verification: "source: execution.rules.EXEC_CONTROL_CREATION\norigin: model_selected\n\
    obligations:\n  X_CONTROL:\n    scenario: Retire close-page work without active\
    \ ownership, then initiate refresh\n      with multiple open banks and no active\
    \ ownership.\n    expected: Cleanup and refresh preparation create independently\
    \ distinguishable\n      PRE or REF candidates after active retirement or with\
    \ no active request; each\n      candidate holds when blocked and is not replaced\
    \ on its commit edge.\n    status: planned_not_executed\n    rules:\n    - EXEC_CONTROL_CREATION\n"
- id: EXEC_PAYLOAD
  text: candidate_command is zero NOP when candidate_valid is low. A blocked valid
    candidate remains unchanged. probe_command is the combinational first-command
    query from incoming mapped request and registered bank state even when probe validity
    is low. Reset forces all command payloads to zero NOP.
  owners: *id095
  verification: "source: execution.rules.EXEC_PAYLOAD\norigin: model_selected\nobligations:\n\
    \  X_PAYLOAD:\n    scenario: Observe candidate, commit, probe, and probe-valid\
    \ values while validity,\n      permission, probe gating, refresh, cleanup, and\
    \ reset vary.\n    expected: Invalid and reset candidate payloads are zero NOP,\
    \ blocked candidate\n      payload holds, commit payload mirrors candidate independent\
    \ of permission, and\n      probe payload remains independently defined when probe\
    \ validity is low.\n    status: planned_not_executed\n    rules:\n    - EXEC_PAYLOAD\n"
- id: EXEC_PERMISSION
  text: Permission uses registered timing history, registered bank state, independent
    candidate, and selected bindings. ACT requires closed bank; READ and WRITE require
    matching open row; PRE requires open bank; REF requires all banks closed and all-bank
    tRP. Permission does not depend on same-edge commit or updates.
  owners: *id096
  verification: "source: execution.rules.EXEC_PERMISSION\norigin: model_selected\n\
    obligations:\n  X_PERMISSION:\n    scenario: Test every trigger/block pair one\
    \ cycle before and at its exact timing\n      bound.\n    expected: Permission\
    \ derives only from pre-edge registered state and becomes eligible\n      only\
    \ at declared boundaries.\n    status: planned_not_executed\n    rules:\n    -\
    \ EXEC_PERMISSION\n"
- id: EXEC_READY
  text: txn_ready reflects only waiting admission capacity including same-edge dispatch
    release. cmd_ready is reset-gated diagnostic first-command readiness using independent
    row and timing probes while idle and permitted by cleanup and refresh state. Neither
    diagnostic alters state.
  owners: *id097
  verification: "source: execution.rules.EXEC_READY\norigin: model_selected\nobligations:\n\
    \  X_READY:\n    scenario: Vary occupancy, dispatch opportunity, incoming command\
    \ type, row/timing\n      state, txn_valid, cleanup, refresh, and reset.\n   \
    \ expected: txn_ready tracks admission capacity only and cmd_ready is side-effect-free\n\
    \      diagnostic readiness.\n    status: planned_not_executed\n    rules:\n \
    \   - EXEC_READY\n"
- id: EXEC_REFRESH
  text: The first deadline is the last reset-sampled edge plus tREFI; later deadlines
    advance by tREFI independently of REF. Pending is sticky. Pending blocks dispatch
    after active work resolves, waits for cleanup completion, creates ordered refresh-preparation
    PRE candidates until all banks are closed, waits all-bank tRP, creates and commits
    one REF candidate, and excludes commands strictly before REF-edge+tRFC.
  owners: *id098
  verification: "source: execution.rules.EXEC_REFRESH\norigin: model_selected\nobligations:\n\
    \  X_REFRESH:\n    scenario: Run deadlines through active, stalled candidate,\
    \ cleanup, multiple open\n      banks, ordered preparation, tRFC exclusion, and\
    \ due/REF coincidence.\n    expected: Pending coalesces without traffic loss;\
    \ close order is ascending; no\n      command commits early after REF; service\
    \ resumes afterward.\n    status: planned_not_executed\n    rules:\n    - EXEC_REFRESH\n"
- id: EXEC_RESPONSE
  text: 'READ commit at E captures pre-edge memory data and registers rsp_valid and
    rsp_rdata for host sampling at E+1. Delivery and a new READ may share an edge:
    the host samples the old response before replacement. Writes produce no response.'
  owners: *id099
  verification: "source: execution.rules.EXEC_RESPONSE\norigin: model_selected\nobligations:\n\
    \  X_RESPONSE:\n    scenario: Commit consecutive reads, overlap delivery with\
    \ a new READ, issue writes,\n      and reset during response visibility.\n   \
    \ expected: Each READ yields exactly one E+1 sampled response with pre-edge data;\n\
    \      writes yield none.\n    status: planned_not_executed\n    rules:\n    -\
    \ EXEC_RESPONSE\n"
assumptions:
- 'A_CLOCK: clk continues to provide rising edges while rst_n is low so synchronous
  reset state clearing can occur.'
- 'A_HOST_STALL: The host holds txn_valid and all transaction payload fields stable
  while txn_valid is high and txn_ready is low.'
- 'A_PROFILE: The selected timing library supplies the declared DDR4-3200 timing paths.'
- 'A_PROGRESS: Service progress requires reset to remain inactive and timing and refresh
  intervals to elapse; no bounded transaction latency is asserted.'
- 'A_RESPONSE: The host samples every rsp_valid pulse because no response-backpressure
  interface is provided.'
limitations:
- Specification/IR validation does not execute behavioral obligations.
- This stage lowers supplied contracts; request-to-system-spec synthesis remains separate.
