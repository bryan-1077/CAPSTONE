requirements:
- id: R1
  text: Implement global FIFO service in acceptance order, including same-address
    writes and reads. Admit on every rising-edge txn_valid && txn_ready, independently
    of command readiness.
  owners: *id030
  verification: "source: system.rules.R1\norigin: request.R1\nobligations:\n  V_FIFO:\n\
    \    rules:\n    - R1\n    - BASE_POLICY\n    scenario: Accept mixed read/write\
    \ traffic including same-address write/read pairs,\n      row hits, misses, and\
    \ timing stalls.\n    expected: Dispatch and retirement follow acceptance order\
    \ exactly; command readiness\n      does not control admission; younger requests\
    \ never bypass older requests.\n    status: planned_not_executed\n"
- id: R2
  text: Provide four waiting entries plus one separately stored active request. Dispatch
    only previously stored requests, capture the complete pre-edge head before releasing
    its slot, and permit full-queue simultaneous dispatch/admission including capacity
    one. No empty-queue bypass or same-edge active replacement at retirement.
  owners: *id031
  verification: "source: system.rules.R2\norigin: request.R2\nobligations:\n  V_CAPACITY:\n\
    \    rules:\n    - R2\n    - BASE_QUEUE\n    - CONSTRAINT_11\n    - SYS_SIMULTANEOUS\n\
    \    - SYS_STORAGE\n    scenario: Fill waiting storage, stall active service,\
    \ dispatch at full occupancy,\n      admit concurrently with dispatch, and retire\
    \ with queued work.\n    expected: Four waiting entries and one active request\
    \ coexist; full waiting storage\n      admits on dispatch; retirement alone does\
    \ not free waiting storage; no empty-queue\n      bypass occurs.\n    status:\
    \ planned_not_executed\n"
- id: R3
  text: Use explicit NOP/ACT/PRE/READ/WRITE/REF command semantics, with NOP never
    committed and at most one command commit per edge. Sequence closed banks with
    ACT-access, row hits with access, and row conflicts with PRE-ACT-access. PRE/ACT
    never retire the active request. Keep blocked candidates stable through stalls
    and newly pending refresh.
  owners: *id032
  verification: "source: system.rules.R3\norigin: request.R3\nobligations:\n  V_SEQUENCE:\n\
    \    rules:\n    - R3\n    - BASE_SEQUENCE\n    scenario: Service closed-bank,\
    \ row-hit, and row-conflict requests while candidates\n      stall.\n    expected:\
    \ Closed banks use ACT then access, hits use access, conflicts use PRE\n     \
    \ then ACT then access, and setup commands do not retire active work.\n    status:\
    \ planned_not_executed\n"
- id: R4
  text: Keep separate owners for host mapping, waiting storage, scheduling, command
    sequencing, row state, timing, functional memory/responses, and refresh control.
    The top must contain structural connections only.
  owners: *id033
  verification: "source: system.rules.R4\norigin: request.R4\nobligations:\n  V_ISOLATION:\n\
    \    rules:\n    - R4\n    - BASE_MODULARITY\n    scenario: Review future architecture\
    \ export against required functional responsibilities.\n    expected: Distinct\
    \ independently verifiable functional responsibilities and a\n      structural-only\
    \ top are declared without selecting an architecture here.\n    status: planned_not_executed\n"
- id: R5
  text: Update bank state and timing history only from committed commands. Enforce
    tRCD, tRAS, tRP, tRRD, tFAW and tRFC using the selected project profile. A trigger
    at E permits the blocked command at E+T; tFAW counts earlier ACT commits with
    age strictly less than its window. Reset creates no synthetic timing history.
  owners: *id034
  verification: "source: system.rules.R5\norigin: request.R5\nobligations:\n  V_TIMING:\n\
    \    rules:\n    - R5\n    - BASE_TIMING\n    - BASE_LEGALITY\n    - BASE_TRRD\n\
    \    - BASE_TFAW\n    scenario: Test trigger and blocked commands at E+T-1 and\
    \ E+T, including global\n      ACT spacing and four prior ACTs.\n    expected:\
    \ Only committed commands update history; permission is independent of\n     \
    \ its own acceptance; no command commits early; exact boundaries are eligible\n\
    \      when other conditions hold.\n    status: planned_not_executed\n"
- id: R6
  text: Preserve functional banked 32-bit memory and compact host address mapping.
    WRITE commit updates storage; READ commit at E captures pre-edge data and registers
    valid/data for host sampling at E+1, with no extra adapter response register.
    Responses survive active release, cleanup and refresh; writes produce no response.
  owners: *id035
  verification: "source: system.rules.R6\norigin: request.R6\nobligations:\n  V_MEMORY:\n\
    \    rules:\n    - R6\n    - BASE_DATA\n    - CONSTRAINT_12\n    - SYS_STORAGE\n\
    \    scenario: Write and read every compact address in every bank, overlap response\n\
    \      delivery with later reads, and reset during response visibility.\n    expected:\
    \ WRITE updates only its addressed word; READ captures pre-edge data and\n   \
    \   yields one E+1 response; banks isolate; reset zeros memory and cancels validity.\n\
    \    status: planned_not_executed\n"
- id: R7
  text: Open-page retains rows. Support close-page as a configurable alternative,
    retaining a separate cleanup bank reservation after retirement until a legal PRE
    commits; block new dispatch during cleanup.
  owners: *id036
  verification: "source: system.rules.R7\norigin: request.R7\nobligations:\n  V_PAGE:\n\
    \    rules:\n    - R7\n    - BASE_POLICY\n    scenario: Run equivalent traffic\
    \ under both page-policy values and assert refresh\n      during close-page cleanup.\n\
    \    expected: Open-page retains rows; close-page reserves cleanup until legal\
    \ PRE,\n      blocks dispatch during cleanup, and does not duplicate retirement\
    \ or response.\n    status: planned_not_executed\n"
- id: R8
  text: Generate periodic refresh deadlines from the last sampled reset edge using
    tREFI. Coalesce missed deadlines into sticky pending; a due deadline wins over
    simultaneous REF acknowledgment. Drain active work and cleanup, PRE remaining
    open banks in ascending order, respect all-bank tRP, commit REF once, and exclude
    commands strictly before REF-edge+tRFC. Retain queued traffic and resume service
    afterward.
  owners: *id037
  verification: "source: system.rules.R8\norigin: request.R8\nobligations:\n  V_REFRESH:\n\
    \    rules:\n    - R8\n    - BASE_REFRESH\n    - SYS_SIMULTANEOUS\n    scenario:\
    \ Cause deadlines while idle, active, candidate-blocked, cleanup-active,\n   \
    \   and during REF acknowledgment.\n    expected: Deadlines coalesce; active and\
    \ cleanup drain; banks close ascending;\n      REF occurs after all-bank tRP;\
    \ due with REF leaves pending; traffic resumes\n      after tRFC.\n    status:\
    \ planned_not_executed\n"
- id: R9
  text: cmd_ready is reset-gated diagnostic readiness for the incoming request's first
    needed command, using independent row/timing probe queries while the engine is
    idle and cleanup/refresh permit. It is meaningful without txn_valid and must not
    admit, dispatch, bypass FIFO, mutate history or reserve storage.
  owners: *id038
  verification: "source: system.rules.R9\norigin: request.R9\nobligations:\n  V_DIAGNOSTIC:\n\
    \    rules:\n    - R9\n    scenario: Vary incoming request, row state, timing,\
    \ txn_valid, engine busy state,\n      cleanup, refresh, reset, and queue occupancy.\n\
    \    expected: cmd_ready is reset-gated first-command diagnostic readiness, meaningful\n\
    \      without txn_valid, and has no admission, dispatch, storage, history, or\
    \ commit\n      side effect.\n    status: planned_not_executed\n"
- id: R10
  text: Use synchronous active-low reset for state, with immediate valid/ready/event
    gating. Reset clears queued/active/cleanup work, row state, timing history, memory,
    responses and refresh state; it wins over every simultaneous event. The host holds
    payload while stalled and samples every response; no response backpressure is
    provided.
  owners: *id039
  verification: "source: system.rules.R10\norigin: request.R10\nobligations:\n  V_RESET:\n\
    \    rules:\n    - R10\n    - BASE_HOST\n    - BASE_RESET\n    - SYS_SIMULTANEOUS\n\
    \    scenario: Assert reset during every defined event and visible response condition.\n\
    \    expected: Events and valid/ready outputs are gated while reset is low; reset\
    \ clears\n      specified state and defeats simultaneous nonreset actions.\n \
    \   status: planned_not_executed\n"
- id: R11
  text: Generate architecture-specific module isolation and system verification intent
    with exact requirement IDs, independent scenarios/expected results, and declared
    port/event bindings. Export it alongside RTL for the external UVM/vector stage.
    Do not execute downstream verification or backend stages in this frontend flow.
  owners: *id040
  verification: "source: system.rules.R11\norigin: request.R11\nobligations:\n  V_EXPORT:\n\
    \    rules:\n    - R11\n    scenario: Inspect this package before downstream UVM/vector\
    \ use.\n    expected: Requirement IDs, scenarios, expected outcomes, and declared\
    \ interfaces/events\n      are present; no downstream execution or backend completion\
    \ is claimed.\n    status: planned_not_executed\n"
- id: R12
  text: Explicitly distinguish initial command candidate creation from replacement.
    Dispatch captures the request without forming a candidate on that edge. When the
    candidate slot is empty, form the first candidate on a later edge from registered
    ownership and current bank state. Hold a blocked candidate unchanged. Commit clears
    its slot; a following candidate is formed only on a later edge using updated bank
    state, never by same-edge replacement. Reset wins; an outstanding candidate holds
    or commits before other progress. With no candidate, drain active service, then
    cleanup, then pending refresh preparation. Refresh service blocks dispatch and
    new candidate formation. Internal state encoding remains an implementation choice.
  owners: *id041
  verification: "source: system.rules.R12\norigin: request.R12\nobligations:\n  V_CANDIDATE:\n\
    \    rules:\n    - R12\n    - BASE_SEQUENCE\n    scenario: Dispatch, create, stall,\
    \ commit, and attempt same-edge replacement;\n      repeat when refresh becomes\
    \ pending.\n    expected: Dispatch creates no candidate; blocked candidates hold;\
    \ commit clears\n      the slot; later creation uses updated state; refresh blocks\
    \ new creation.\n    status: planned_not_executed\n"
- id: R13
  text: Define payload behavior independently of valid gating. candidate_command is
    canonical zero NOP when candidate_valid is low. commit_command mirrors candidate_command
    even when candidate_ok is low; permission gates commit_valid only, and consumers
    sample payload only on commit_valid. probe_command remains the combinational first-command
    query from the incoming request and bank state even when probe_valid is low; idle,
    cleanup and refresh restrictions gate probe validity/readiness, not its payload.
    Reset forces all command payloads to zero NOP. Combinational dependencies must
    include any current-cycle input used to gate payload, not just its valid signal.
  owners: *id042
  verification: "source: system.rules.R13\norigin: request.R13\nobligations:\n  V_PAYLOAD:\n\
    \    rules:\n    - R13\n    scenario: Vary candidate valid, permission, probe\
    \ valid, idle restrictions, refresh\n      restrictions, and reset independently.\n\
    \    expected: Invalid candidate and reset command payloads are zero NOP; commit\
    \ payload\n      mirrors candidate; probe payload remains independently defined.\n\
    \    status: planned_not_executed\n"
- id: BASE_HOST
  text: Preserve the existing host ports and widths listed in the baseline contract.
    Accept a request only on a rising clk edge with txn_valid && txn_ready. Hold payload
    while stalled. Consecutive accepted cycles with txn_valid held high are distinct
    requests. cmd_ready is execution/timing visibility, not the host acceptance handshake.
    Deassert txn_ready and rsp_valid during reset.
  owners: *id043
  verification: "source: system.rules.BASE_HOST\norigin: request.BASE_HOST\nobligations:\n\
    \  V_HOST:\n    rules:\n    - BASE_HOST\n    scenario: Hold valid and payload\
    \ through stalls and across consecutive ready cycles.\n    expected: Only valid-and-ready\
    \ rising edges admit requests; consecutive qualifying\n      edges are distinct;\
    \ cmd_ready never substitutes for txn_ready.\n    status: planned_not_executed\n\
    \  V_RESET:\n    rules:\n    - R10\n    - BASE_HOST\n    - BASE_RESET\n    - SYS_SIMULTANEOUS\n\
    \    scenario: Assert reset during every defined event and visible response condition.\n\
    \    expected: Events and valid/ready outputs are gated while reset is low; reset\
    \ clears\n      specified state and defeats simultaneous nonreset actions.\n \
    \   status: planned_not_executed\n"
- id: BASE_ADDRESS
  text: 'Preserve the simplified 4-bit txn_addr mapping: row=txn_addr[3:2], column=txn_addr[1:0],
    zero-extended into the internal 10-bit row and 6-bit column fields. Preserve explicit
    txn_bank for multi-bank configurations; a single-bank configuration uses bank
    0. Internal packed requests retain bank(2), row(10), column(6), write flag(1),
    write data(32).'
  owners: *id044
  verification: "source: system.rules.BASE_ADDRESS\norigin: request.BASE_ADDRESS\n\
    obligations:\n  V_ADDRESS:\n    rules:\n    - BASE_ADDRESS\n    - CONSTRAINT_12\n\
    \    scenario: Exercise all addresses and banks.\n    expected: row, column, bank,\
    \ widths, and packed request fields follow the declared\n      compact mapping.\n\
    \    status: planned_not_executed\n"
- id: BASE_QUEUE
  text: 'Provide 4 WAITING request slots PLUS one separately stored active-service
    request: waiting plus active capacity is 5. The active request must not consume
    a waiting slot. Dispatch captures the complete pre-edge request in active registers
    and frees its waiting slot without retiring the transaction. A full queue may
    admit on the same edge as dispatch; retirement alone does not free waiting storage.
    Accepted request fields survive stalls and each accepted request is serviced exactly
    once within a reset-free epoch. Keep admission, dispatch, retirement and read
    response delivery distinct. Captured response storage consumes neither waiting
    nor active capacity.'
  owners: *id045
  verification: "source: system.rules.BASE_QUEUE\norigin: request.BASE_QUEUE\nobligations:\n\
    \  V_CAPACITY:\n    rules:\n    - R2\n    - BASE_QUEUE\n    - CONSTRAINT_11\n\
    \    - SYS_SIMULTANEOUS\n    - SYS_STORAGE\n    scenario: Fill waiting storage,\
    \ stall active service, dispatch at full occupancy,\n      admit concurrently\
    \ with dispatch, and retire with queued work.\n    expected: Four waiting entries\
    \ and one active request coexist; full waiting storage\n      admits on dispatch;\
    \ retirement alone does not free waiting storage; no empty-queue\n      bypass\
    \ occurs.\n    status: planned_not_executed\n  V_EXACTLY_ONCE:\n    rules:\n \
    \   - BASE_QUEUE\n    - SYS_STORAGE\n    scenario: Apply long timing stalls, refresh\
    \ delays, repeated queue reuse, and\n      mixed traffic in a reset-free epoch.\n\
    \    expected: Each admitted request is dispatched and serviced once with no loss,\n\
    \      duplication, or premature retirement.\n    status: planned_not_executed\n"
- id: BASE_DATA
  text: Provide functional 32-bit memory storage with 16 addresses per bank, bank
    isolation and reset-to-zero contents. Accepted writes update only their addressed
    location at service completion or a committed WRITE. Each accepted read produces
    exactly one one-cycle rsp_valid pulse with the stored rsp_rdata after read service/READ
    commit, using the existing one-cycle response stage. Writes produce no host response.
    Selection and stalled candidates cannot mutate memory; mere command output without
    storage and read responses is insufficient.
  owners: *id046
  verification: "source: system.rules.BASE_DATA\norigin: request.BASE_DATA\nobligations:\n\
    \  V_MEMORY:\n    rules:\n    - R6\n    - BASE_DATA\n    - CONSTRAINT_12\n   \
    \ - SYS_STORAGE\n    scenario: Write and read every compact address in every bank,\
    \ overlap response\n      delivery with later reads, and reset during response\
    \ visibility.\n    expected: WRITE updates only its addressed word; READ captures\
    \ pre-edge data and\n      yields one E+1 response; banks isolate; reset zeros\
    \ memory and cancels validity.\n    status: planned_not_executed\n"
- id: BASE_TIMING
  text: Retain existing tRCD, tRAS and tRP timing protection from the selected JEDEC
    profile. ACT-to-READ/WRITE must wait tRCD, ACT-to-PRE must respect tRAS, and PRE-to-next-ACT
    must respect tRP if explicit commands are used. Aggregate service may retain the
    existing protected timing envelope instead. Configured tRRD and tFAW gates must
    use accepted activation events, not host admissions or stalled proposals. Never
    treat existing basic timing as an unrequested future feature.
  owners: *id047
  verification: "source: system.rules.BASE_TIMING\norigin: request.BASE_TIMING\nobligations:\n\
    \  V_TIMING:\n    rules:\n    - R5\n    - BASE_TIMING\n    - BASE_LEGALITY\n \
    \   - BASE_TRRD\n    - BASE_TFAW\n    scenario: Test trigger and blocked commands\
    \ at E+T-1 and E+T, including global\n      ACT spacing and four prior ACTs.\n\
    \    expected: Only committed commands update history; permission is independent\
    \ of\n      its own acceptance; no command commits early; exact boundaries are\
    \ eligible\n      when other conditions hold.\n    status: planned_not_executed\n"
- id: BASE_SEQUENCE
  text: Dispatch captures the complete selected request in separate active-service
    registers before freeing its waiting queue slot. Hold that active request and
    payload across setup PRE/ACT and timing stalls until its final READ/WRITE commits.
    Setup commands never retire the active request. Aggregate service also keeps active-service
    ownership through completion. Waiting-queue dequeue at dispatch is distinct from
    active-request retirement. Row state changes only on the responsible committed
    operation; uncommitted proposals cannot change state.
  owners: *id048
  verification: "source: system.rules.BASE_SEQUENCE\norigin: request.BASE_SEQUENCE\n\
    obligations:\n  V_SEQUENCE:\n    rules:\n    - R3\n    - BASE_SEQUENCE\n    scenario:\
    \ Service closed-bank, row-hit, and row-conflict requests while candidates\n \
    \     stall.\n    expected: Closed banks use ACT then access, hits use access,\
    \ conflicts use PRE\n      then ACT then access, and setup commands do not retire\
    \ active work.\n    status: planned_not_executed\n  V_CANDIDATE:\n    rules:\n\
    \    - R12\n    - BASE_SEQUENCE\n    scenario: Dispatch, create, stall, commit,\
    \ and attempt same-edge replacement;\n      repeat when refresh becomes pending.\n\
    \    expected: Dispatch creates no candidate; blocked candidates hold; commit\
    \ clears\n      the slot; later creation uses updated state; refresh blocks new\
    \ creation.\n    status: planned_not_executed\n"
- id: BASE_MODULARITY
  text: Keep request storage, request selection, command sequencing, timing enforcement
    and functional memory in independently verifiable modules with explicit interfaces.
    No single controller core may own all these functions. Each mandatory role has
    distinct module owners with functional inter-module connections. Module names
    and further decomposition remain design choices.
  owners: *id049
  verification: "source: system.rules.BASE_MODULARITY\norigin: request.BASE_MODULARITY\n\
    obligations:\n  V_ISOLATION:\n    rules:\n    - R4\n    - BASE_MODULARITY\n  \
    \  scenario: Review future architecture export against required functional responsibilities.\n\
    \    expected: Distinct independently verifiable functional responsibilities and\
    \ a\n      structural-only top are declared without selecting an architecture\
    \ here.\n    status: planned_not_executed\n"
- id: BASE_LEGALITY
  text: Compute command permission from registered timing/bank history and an independent
    candidate. An accepted ACT pulse is derived from candidate && permission; permission
    must not combinationally depend on that same accepted pulse. Scheduler selection/validity
    must be available independently of timing_ok; timing_ok may gate commit but must
    not create a selection-validity feedback loop. Declare accurate per-output combinational
    input dependencies.
  owners: *id050
  verification: "source: system.rules.BASE_LEGALITY\norigin: request.BASE_LEGALITY\n\
    obligations:\n  V_TIMING:\n    rules:\n    - R5\n    - BASE_TIMING\n    - BASE_LEGALITY\n\
    \    - BASE_TRRD\n    - BASE_TFAW\n    scenario: Test trigger and blocked commands\
    \ at E+T-1 and E+T, including global\n      ACT spacing and four prior ACTs.\n\
    \    expected: Only committed commands update history; permission is independent\
    \ of\n      its own acceptance; no command commits early; exact boundaries are\
    \ eligible\n      when other conditions hold.\n    status: planned_not_executed\n"
- id: BASE_RESET
  text: Use top-level clk and active-low rst_n. Reset clears pending requests, active
    service, row validity, memory and responses. Preserve reusable blocks with either
    synchronous or asynchronous active-low resets driven by the same rst_n; differing
    assertion styles do not require rebuilding otherwise reusable blocks. Do not change
    polarity without an explicit adapter.
  owners: *id051
  verification: "source: system.rules.BASE_RESET\norigin: request.BASE_RESET\nobligations:\n\
    \  V_RESET:\n    rules:\n    - R10\n    - BASE_HOST\n    - BASE_RESET\n    - SYS_SIMULTANEOUS\n\
    \    scenario: Assert reset during every defined event and visible response condition.\n\
    \    expected: Events and valid/ready outputs are gated while reset is low; reset\
    \ clears\n      specified state and defeats simultaneous nonreset actions.\n \
    \   status: planned_not_executed\n"
- id: BASE_POLICY
  text: Honor the requested scheduler policy fifo. Preserve page policy open_page.
    Open-page retains a serviced row; close-page closes it before subsequent bank
    use. Preserve request ownership through any setup sequence. Internal module decomposition
    and command latency may change while these observable contracts hold.
  owners: *id052
  verification: "source: system.rules.BASE_POLICY\norigin: request.BASE_POLICY\nobligations:\n\
    \  V_FIFO:\n    rules:\n    - R1\n    - BASE_POLICY\n    scenario: Accept mixed\
    \ read/write traffic including same-address write/read pairs,\n      row hits,\
    \ misses, and timing stalls.\n    expected: Dispatch and retirement follow acceptance\
    \ order exactly; command readiness\n      does not control admission; younger\
    \ requests never bypass older requests.\n    status: planned_not_executed\n  V_PAGE:\n\
    \    rules:\n    - R7\n    - BASE_POLICY\n    scenario: Run equivalent traffic\
    \ under both page-policy values and assert refresh\n      during close-page cleanup.\n\
    \    expected: Open-page retains rows; close-page reserves cleanup until legal\
    \ PRE,\n      blocks dispatch during cleanup, and does not duplicate retirement\
    \ or response.\n    status: planned_not_executed\n"
- id: BASE_REFRESH
  text: Retain periodic refresh requests using profile tREFI, refresh priority and
    request/acknowledgment handling without dropping queued traffic. Refresh must
    make progress and normal requests must resume. Existing refresh is simplified;
    full REF/tRFC servicing remains later feature work. If explicit REF is proposed,
    describe drain/row-state interaction and acknowledge once at commit.
  owners: *id053
  verification: "source: system.rules.BASE_REFRESH\norigin: request.BASE_REFRESH\n\
    obligations:\n  V_REFRESH:\n    rules:\n    - R8\n    - BASE_REFRESH\n    - SYS_SIMULTANEOUS\n\
    \    scenario: Cause deadlines while idle, active, candidate-blocked, cleanup-active,\n\
    \      and during REF acknowledgment.\n    expected: Deadlines coalesce; active\
    \ and cleanup drain; banks close ascending;\n      REF occurs after all-bank tRP;\
    \ due with REF leaves pending; traffic resumes\n      after tRFC.\n    status:\
    \ planned_not_executed\n"
- id: BASE_TRRD
  text: tRRD is enabled; honor that setting and resolve enabled timing values from
    DDR4-3200.
  owners: *id054
  verification: "source: system.rules.BASE_TRRD\norigin: request.BASE_TRRD\nobligations:\n\
    \  V_TIMING:\n    rules:\n    - R5\n    - BASE_TIMING\n    - BASE_LEGALITY\n \
    \   - BASE_TRRD\n    - BASE_TFAW\n    scenario: Test trigger and blocked commands\
    \ at E+T-1 and E+T, including global\n      ACT spacing and four prior ACTs.\n\
    \    expected: Only committed commands update history; permission is independent\
    \ of\n      its own acceptance; no command commits early; exact boundaries are\
    \ eligible\n      when other conditions hold.\n    status: planned_not_executed\n"
- id: BASE_TFAW
  text: tFAW is enabled; honor that setting and resolve enabled timing values from
    DDR4-3200.
  owners: *id055
