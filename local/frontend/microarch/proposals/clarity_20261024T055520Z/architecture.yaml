- id: SYS_SIMULTANEOUS
  text: Reset wins over every event. With reset inactive, admission may coincide with
    command commit. Full waiting storage may admit on a dispatch edge using the pre-edge
    head for dispatch and the incoming request for the tail. Dispatch and retirement
    do not coincide because active ownership remains occupied through retirement.
    A refresh due coincident with REF commit leaves pending asserted.
  owners: *id068
  verification: "source: system.rules.SYS_SIMULTANEOUS\norigin: model_selected\nobligations:\n\
    \  V_CAPACITY:\n    rules:\n    - R2\n    - BASE_QUEUE\n    - CONSTRAINT_11\n\
    \    - SYS_SIMULTANEOUS\n    - SYS_STORAGE\n    scenario: Fill waiting storage,\
    \ stall active service, dispatch at full occupancy,\n      admit concurrently\
    \ with dispatch, and retire with queued work.\n    expected: Four waiting entries\
    \ and one active request coexist; full waiting storage\n      admits on dispatch;\
    \ retirement alone does not free waiting storage; no empty-queue\n      bypass\
    \ occurs.\n    status: planned_not_executed\n  V_REFRESH:\n    rules:\n    - R8\n\
    \    - BASE_REFRESH\n    - SYS_SIMULTANEOUS\n    scenario: Cause deadlines while\
    \ idle, active, candidate-blocked, cleanup-active,\n      and during REF acknowledgment.\n\
    \    expected: Deadlines coalesce; active and cleanup drain; banks close ascending;\n\
    \      REF occurs after all-bank tRP; due with REF leaves pending; traffic resumes\n\
    \      after tRFC.\n    status: planned_not_executed\n  V_RESET:\n    rules:\n\
    \    - R10\n    - BASE_HOST\n    - BASE_RESET\n    - SYS_SIMULTANEOUS\n    scenario:\
    \ Assert reset during every defined event and visible response condition.\n  \
    \  expected: Events and valid/ready outputs are gated while reset is low; reset\
    \ clears\n      specified state and defeats simultaneous nonreset actions.\n \
    \   status: planned_not_executed\n"
