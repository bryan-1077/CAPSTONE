          SYS_SIMULTANEOUS:
            origin: model_selected
            statement: Reset wins over every event. With reset inactive, admission
              may coincide with command commit. Full waiting storage may admit on
              a dispatch edge using the pre-edge head for dispatch and the incoming
              request for the tail. Dispatch and retirement do not coincide because
              active ownership remains occupied through retirement. A refresh due
              coincident with REF commit leaves pending asserted.
            verification:
            - V_CAPACITY
            - V_REFRESH
            - V_RESET
            owners: &id068
            - waiting_queue
          SYS_STORAGE:
            origin: model_selected
            statement: Waiting storage holds admitted undispatched requests, active
              storage holds one dispatched unretired request, and response storage
              holds one captured read response. These capacities are independent.
              Dispatch release is not retirement.
            verification:
            - V_CAPACITY
            - V_EXACTLY_ONCE
            - V_MEMORY
            owners: &id069
            - waiting_queue
        execution_rules: &id107
          EXEC_COMMIT:
            origin: model_selected
            statement: candidate_command is the canonical proposal. commit_command
              mirrors it even when candidate_ok is low. commit_valid requires reset
              inactive, valid candidate, permission, and non-NOP nonreserved opcode.
              At most one command commits per edge and all consumers sample the same
              payload only on commit_valid.
            verification:
            - X_COMMIT
            owners: &id070
            - command_engine
          EXEC_BANK_STATE:
            origin: model_selected
            statement: Only committed ACT opens and records its bank row, committed
              PRE closes its bank, and committed REF clears all rows after preparation.
              READ and WRITE retain open rows. Probes, proposals, admissions, dispatches,
              and stalls do not alter row state.
            verification:
            - X_BANK
            owners: &id071
            - bank_state
          EXEC_RESPONSE:
            origin: model_selected
            statement: 'READ commit at E captures pre-edge memory data and registers
              rsp_valid and rsp_rdata for host sampling at E+1. Delivery and a new
              READ may share an edge: the host samples the old response before replacement.
              Writes produce no response.'
            verification:
            - X_RESPONSE
            owners: &id072
            - functional_memory
          EXEC_REFRESH:
            origin: model_selected
            statement: The first deadline is the last reset-sampled edge plus tREFI;
              later deadlines advance by tREFI independently of REF. Pending is sticky.
              Pending blocks dispatch and candidate creation after outstanding candidate
              or active work resolves, drains cleanup, closes remaining open banks
              in ascending order, waits all-bank tRP, commits REF once, and excludes
              commands strictly before REF-edge+tRFC.
            verification:
            - X_REFRESH
            owners: &id073
            - refresh_control
          EXEC_CLEANUP:
            origin: model_selected
            statement: Open-page creates no cleanup reservation after retirement.
              Close-page reserves the serviced bank until legal PRE commit, blocks
              dispatch, and does not duplicate retirement or response. Refresh preparation
              waits for cleanup.
            verification:
            - X_CLEANUP
            owners: &id074
            - command_engine
          EXEC_PAYLOAD:
            origin: model_selected
            statement: candidate_command is zero NOP when candidate_valid is low.
              A blocked valid candidate remains unchanged. probe_command is the combinational
              first-command query from incoming mapped request and registered bank
              state even when probe validity is low. Reset forces all command payloads
              to zero NOP.
            verification:
            - X_PAYLOAD
            owners: &id075
            - command_engine
          EXEC_PERMISSION:
            origin: model_selected
            statement: Permission uses registered timing history, registered bank
              state, independent candidate, and selected bindings. ACT requires closed
              bank; READ/WRITE require matching open row; PRE requires open bank;
              REF requires all banks closed and all-bank tRP. Permission does not
              depend on same-edge commit or updates.
            verification:
            - X_PERMISSION
            owners: &id076
            - timing_enforcement
          EXEC_READY:
            origin: model_selected
            statement: txn_ready reflects only waiting admission capacity including
              same-edge dispatch release. cmd_ready is reset-gated diagnostic first-command
              readiness using independent row and timing probes while idle and permitted
              by cleanup and refresh state. Neither diagnostic alters state.
            verification:
            - X_READY
            owners: &id077
            - command_engine
        decisions: &id078
          D_FIFO:
            origin: requested_constraint
            status: recorded
            value: global_acceptance_order
            reason: Accepted requests are serviced in FIFO acceptance order.
          D_CAPACITY:
            origin: requested_constraint
            status: recorded
            value: four_waiting_plus_one_active
            reason: Waiting and active capacities are distinct.
          D_COMMANDS:
            origin: requested_constraint
            status: recorded
            value: explicit_NOP_ACT_PRE_READ_WRITE_REF
            reason: Explicit command semantics and commit gating are required.
          D_PAGE_POLICY:
            origin: requested_constraint
            status: recorded
            value: open_page_default_with_close_page_option
            reason: Open-page is requested while close-page is a configurable alternative.
          D_REFRESH:
            origin: requested_constraint
            status: recorded
            value: sticky_periodic_pending_drain_close_then_ref
            reason: Refresh deadlines coalesce and service drains work before REF.
          D_RESET:
            origin: requested_constraint
            status: recorded
            value: synchronous_active_low_state_reset_with_immediate_event_gating
            reason: State reset is synchronous and all externally visible events are
              immediately gated.
          D_RESPONSE:
            origin: requested_constraint
            status: recorded
            value: read_commit_E_host_sampling_E_plus_1
            reason: READ captures pre-edge data and provides the requested one-cycle
              response stage.
        assumptions: &id079
          A_CLOCK:
            statement: clk continues to provide rising edges while rst_n is low so
              synchronous reset state clearing can occur.
            status: documented
          A_HOST_STALL:
            statement: The host holds txn_valid and all transaction payload fields
              stable while txn_valid is high and txn_ready is low.
            status: documented
          A_RESPONSE:
            statement: The host samples every rsp_valid pulse because no response-backpressure
              interface is provided.
            status: documented
          A_PROGRESS:
            statement: Service progress requires reset to remain inactive and timing
              and refresh intervals to elapse; no bounded transaction latency is asserted.
            status: documented
          A_PROFILE:
            statement: The selected timing library supplies the declared DDR4-3200
              timing paths.
            status: requires_review
        request:
          constraints:
            design_name: ddr4_controller_top
            design_type: memory_controller
            memory:
              protocol: DDR4
              speed: '3200'
            topology:
              banks: 4
            features:
              scheduler: fifo
              page_policy: open_page
              refresh: true
              tRRD: true
              tFAW: true
            microarchitecture:
              baseline: current_controller
              waiting_capacity: 4
          requirements:
          - id: R1
            text: Implement global FIFO service in acceptance order, including same-address
              writes and reads. Admit on every rising-edge txn_valid && txn_ready,
              independently of command readiness.
          - id: R2
            text: Provide four waiting entries plus one separately stored active request.
              Dispatch only previously stored requests, capture the complete pre-edge
              head before releasing its slot, and permit full-queue simultaneous dispatch/admission
              including capacity one. No empty-queue bypass or same-edge active replacement
              at retirement.
          - id: R3
            text: Use explicit NOP/ACT/PRE/READ/WRITE/REF command semantics, with
              NOP never committed and at most one command commit per edge. Sequence
              closed banks with ACT-access, row hits with access, and row conflicts
              with PRE-ACT-access. PRE/ACT never retire the active request. Keep blocked
              candidates stable through stalls and newly pending refresh.
          - id: R4
            text: Keep separate owners for host mapping, waiting storage, scheduling,
              command sequencing, row state, timing, functional memory/responses,
              and refresh control. The top must contain structural connections only.
          - id: R5
            text: Update bank state and timing history only from committed commands.
              Enforce tRCD, tRAS, tRP, tRRD, tFAW and tRFC using the selected project
              profile. A trigger at E permits the blocked command at E+T; tFAW counts
              earlier ACT commits with age strictly less than its window. Reset creates
              no synthetic timing history.
          - id: R6
            text: Preserve functional banked 32-bit memory and compact host address
              mapping. WRITE commit updates storage; READ commit at E captures pre-edge
              data and registers valid/data for host sampling at E+1, with no extra
              adapter response register. Responses survive active release, cleanup
              and refresh; writes produce no response.
          - id: R7
            text: Open-page retains rows. Support close-page as a configurable alternative,
              retaining a separate cleanup bank reservation after retirement until
              a legal PRE commits; block new dispatch during cleanup.
          - id: R8
            text: Generate periodic refresh deadlines from the last sampled reset
              edge using tREFI. Coalesce missed deadlines into sticky pending; a due
              deadline wins over simultaneous REF acknowledgment. Drain active work
              and cleanup, PRE remaining open banks in ascending order, respect all-bank
              tRP, commit REF once, and exclude commands strictly before REF-edge+tRFC.
              Retain queued traffic and resume service afterward.
          - id: R9
            text: cmd_ready is reset-gated diagnostic readiness for the incoming request's
              first needed command, using independent row/timing probe queries while
              the engine is idle and cleanup/refresh permit. It is meaningful without
              txn_valid and must not admit, dispatch, bypass FIFO, mutate history
              or reserve storage.
          - id: R10
            text: Use synchronous active-low reset for state, with immediate valid/ready/event
              gating. Reset clears queued/active/cleanup work, row state, timing history,
              memory, responses and refresh state; it wins over every simultaneous
              event. The host holds payload while stalled and samples every response;
              no response backpressure is provided.
          - id: R11
            text: Generate architecture-specific module isolation and system verification
              intent with exact requirement IDs, independent scenarios/expected results,
              and declared port/event bindings. Export it alongside RTL for the external
              UVM/vector stage. Do not execute downstream verification or backend
              stages in this frontend flow.
          - id: R12
            text: Explicitly distinguish initial command candidate creation from replacement.
              Dispatch captures the request without forming a candidate on that edge.
              When the candidate slot is empty, form the first candidate on a later
              edge from registered ownership and current bank state. Hold a blocked
              candidate unchanged. Commit clears its slot; a following candidate is
              formed only on a later edge using updated bank state, never by same-edge
              replacement. Reset wins; an outstanding candidate holds or commits before
              other progress. With no candidate, drain active service, then cleanup,
              then pending refresh preparation. Refresh service blocks dispatch and
              new candidate formation. Internal state encoding remains an implementation
              choice.
          - id: R13
            text: Define payload behavior independently of valid gating. candidate_command
              is canonical zero NOP when candidate_valid is low. commit_command mirrors
              candidate_command even when candidate_ok is low; permission gates commit_valid
              only, and consumers sample payload only on commit_valid. probe_command
              remains the combinational first-command query from the incoming request
              and bank state even when probe_valid is low; idle, cleanup and refresh
              restrictions gate probe validity/readiness, not its payload. Reset forces
              all command payloads to zero NOP. Combinational dependencies must include
              any current-cycle input used to gate payload, not just its valid signal.
          - &id001
            id: BASE_HOST
            text: Preserve the existing host ports and widths listed in the baseline
              contract. Accept a request only on a rising clk edge with txn_valid
              && txn_ready. Hold payload while stalled. Consecutive accepted cycles
              with txn_valid held high are distinct requests. cmd_ready is execution/timing
              visibility, not the host acceptance handshake. Deassert txn_ready and
              rsp_valid during reset.
          - &id002
            id: BASE_ADDRESS
            text: 'Preserve the simplified 4-bit txn_addr mapping: row=txn_addr[3:2],
              column=txn_addr[1:0], zero-extended into the internal 10-bit row and
              6-bit column fields. Preserve explicit txn_bank for multi-bank configurations;
              a single-bank configuration uses bank 0. Internal packed requests retain
              bank(2), row(10), column(6), write flag(1), write data(32).'
          - &id003
            id: BASE_QUEUE
            text: 'Provide 4 WAITING request slots PLUS one separately stored active-service
              request: waiting plus active capacity is 5. The active request must
              not consume a waiting slot. Dispatch captures the complete pre-edge
              request in active registers and frees its waiting slot without retiring
              the transaction. A full queue may admit on the same edge as dispatch;
              retirement alone does not free waiting storage. Accepted request fields
              survive stalls and each accepted request is serviced exactly once within
              a reset-free epoch. Keep admission, dispatch, retirement and read response
              delivery distinct. Captured response storage consumes neither waiting
              nor active capacity.'
          - &id004
            id: BASE_DATA
            text: Provide functional 32-bit memory storage with 16 addresses per bank,
              bank isolation and reset-to-zero contents. Accepted writes update only
              their addressed location at service completion or a committed WRITE.
              Each accepted read produces exactly one one-cycle rsp_valid pulse with
              the stored rsp_rdata after read service/READ commit, using the existing
              one-cycle response stage. Writes produce no host response. Selection
              and stalled candidates cannot mutate memory; mere command output without
              storage and read responses is insufficient.
          - &id005
            id: BASE_TIMING
            text: Retain existing tRCD, tRAS and tRP timing protection from the selected
              JEDEC profile. ACT-to-READ/WRITE must wait tRCD, ACT-to-PRE must respect
              tRAS, and PRE-to-next-ACT must respect tRP if explicit commands are
              used. Aggregate service may retain the existing protected timing envelope
              instead. Configured tRRD and tFAW gates must use accepted activation
              events, not host admissions or stalled proposals. Never treat existing
              basic timing as an unrequested future feature.
          - &id006
            id: BASE_SEQUENCE
            text: Dispatch captures the complete selected request in separate active-service
              registers before freeing its waiting queue slot. Hold that active request
              and payload across setup PRE/ACT and timing stalls until its final READ/WRITE
              commits. Setup commands never retire the active request. Aggregate service
              also keeps active-service ownership through completion. Waiting-queue
              dequeue at dispatch is distinct from active-request retirement. Row
              state changes only on the responsible committed operation; uncommitted
              proposals cannot change state.
          - &id007
            id: BASE_MODULARITY
            text: Keep request storage, request selection, command sequencing, timing
              enforcement and functional memory in independently verifiable modules
              with explicit interfaces. No single controller core may own all these
              functions. Each mandatory role has distinct module owners with functional
              inter-module connections. Module names and further decomposition remain
              design choices.
          - &id008
            id: BASE_LEGALITY
            text: Compute command permission from registered timing/bank history and
              an independent candidate. An accepted ACT pulse is derived from candidate
              && permission; permission must not combinationally depend on that same
              accepted pulse. Scheduler selection/validity must be available independently
              of timing_ok; timing_ok may gate commit but must not create a selection-validity
              feedback loop. Declare accurate per-output combinational input dependencies.
          - &id009
            id: BASE_RESET
            text: Use top-level clk and active-low rst_n. Reset clears pending requests,
              active service, row validity, memory and responses. Preserve reusable
              blocks with either synchronous or asynchronous active-low resets driven
              by the same rst_n; differing assertion styles do not require rebuilding
              otherwise reusable blocks. Do not change polarity without an explicit
              adapter.
          - &id010
            id: BASE_POLICY
            text: Honor the requested scheduler policy fifo. Preserve page policy
              open_page. Open-page retains a serviced row; close-page closes it before
              subsequent bank use. Preserve request ownership through any setup sequence.
              Internal module decomposition and command latency may change while these
              observable contracts hold.
          - &id011
            id: BASE_REFRESH
            text: Retain periodic refresh requests using profile tREFI, refresh priority
              and request/acknowledgment handling without dropping queued traffic.
              Refresh must make progress and normal requests must resume. Existing
              refresh is simplified; full REF/tRFC servicing remains later feature
              work. If explicit REF is proposed, describe drain/row-state interaction
              and acknowledge once at commit.
          - &id012
            id: BASE_TRRD
            text: tRRD is enabled; honor that setting and resolve enabled timing values
              from DDR4-3200.
          - &id013
            id: BASE_TFAW
            text: tFAW is enabled; honor that setting and resolve enabled timing values
              from DDR4-3200.
          - id: CONSTRAINT_1
            text: Requested constraint /design_name = "ddr4_controller_top".
          - id: CONSTRAINT_2
            text: Requested constraint /design_type = "memory_controller".
          - id: CONSTRAINT_3
            text: Requested constraint /features/page_policy = "open_page".
          - id: CONSTRAINT_4
            text: Requested constraint /features/refresh = true.
          - id: CONSTRAINT_5
            text: Requested constraint /features/scheduler = "fifo".
          - id: CONSTRAINT_6
            text: Requested constraint /features/tFAW = true.
          - id: CONSTRAINT_7
            text: Requested constraint /features/tRRD = true.
          - id: CONSTRAINT_8
            text: Requested constraint /memory/protocol = "DDR4".
          - id: CONSTRAINT_9
            text: Requested constraint /memory/speed = "3200".
          - id: CONSTRAINT_10
            text: Requested constraint /microarchitecture/baseline = "current_controller".
          - id: CONSTRAINT_11
            text: Requested constraint /microarchitecture/waiting_capacity = 4.
          - id: CONSTRAINT_12
            text: Requested constraint /topology/banks = 4.
          baseline_contract:
            id: current_controller_v2
            design_name: ddr4_controller_top
            profile: DDR4-3200
            config:
              design_name: ddr4_controller_top
              design_type: memory_controller
              memory:
                protocol: DDR4
                speed: '3200'
              topology:
                banks: 4
              features:
                scheduler: fifo
                page_policy: open_page
                refresh: true
                tRRD: true
                tFAW: true
              microarchitecture:
                baseline: current_controller
                waiting_capacity: 4
            host_ports:
            - name: clk
              direction: input
              width: 1
            - name: rst_n
              direction: input
              width: 1
            - name: txn_valid
              direction: input
              width: 1
            - name: txn_is_write
              direction: input
              width: 1
            - name: txn_addr
              direction: input
              width: 4
            - name: txn_wdata
              direction: input
              width: 32
            - name: txn_bank
              direction: input
              width: 2
            - name: txn_ready
              direction: output
              width: 1
            - name: cmd_ready
              direction: output
              width: 1
            - name: rsp_valid
              direction: output
              width: 1
            - name: rsp_rdata
              direction: output
              width: 32
            requirements:
            - *id001
            - *id002
            - *id003
            - *id004
            - *id005
            - *id006
            - *id007
            - *id008
            - *id009
            - *id010
            - *id011
            - *id012
            - *id013
          design_kind: memory_controller
      active_ports:
      - cmd_ready
      - enq_request
      - enq_valid
      - memory_rsp_data
      - memory_rsp_valid
      - probe_ready
      - probe_request
      - queue_ready
      - rsp_rdata
      - rsp_valid
      - txn_addr
      - txn_bank
      - txn_is_write
      - txn_ready
      - txn_valid
      - txn_wdata
      verification_obligations:
        system.verification.V_ADDRESS: &id026
          rules:
          - BASE_ADDRESS
          - CONSTRAINT_12
          scenario: Exercise all addresses and banks.
          expected: row, column, bank, widths, and packed request fields follow the
            declared compact mapping.
          status: planned_not_executed
        system.verification.V_HOST: &id097
          rules:
          - BASE_HOST
          scenario: Hold valid and payload through stalls and across consecutive ready
            cycles.
          expected: Only valid-and-ready rising edges admit requests; consecutive
            qualifying edges are distinct; cmd_ready never substitutes for txn_ready.
          status: planned_not_executed
        system.verification.V_ISOLATION: &id104
          rules:
          - R4
          - BASE_MODULARITY
          scenario: Review future architecture export against required functional
            responsibilities.
          expected: Distinct independently verifiable functional responsibilities
            and a structural-only top are declared without selecting an architecture
            here.
          status: planned_not_executed
        system.verification.V_RESET: &id016
          rules:
          - R10
          - BASE_HOST
          - BASE_RESET
          - SYS_SIMULTANEOUS
          scenario: Assert reset during every defined event and visible response condition.
          expected: Events and valid/ready outputs are gated while reset is low; reset
            clears specified state and defeats simultaneous nonreset actions.
          status: planned_not_executed
        system.verification.V_IDENTITY: &id096
          rules:
          - CONSTRAINT_1
          - CONSTRAINT_2
          scenario: Inspect package metadata.
          expected: The design name is ddr4_controller_top and design kind is memory_controller.
          status: planned_not_executed
        system.verification.V_DIAGNOSTIC: &id103
          rules:
          - R9
          scenario: Vary incoming request, row state, timing, txn_valid, engine busy
            state, cleanup, refresh, reset, and queue occupancy.
          expected: cmd_ready is reset-gated first-command diagnostic readiness, meaningful
            without txn_valid, and has no admission, dispatch, storage, history, or
            commit side effect.
          status: planned_not_executed
        system.verification.V_EXPORT: &id106
          rules:
          - R11
          scenario: Inspect this package before downstream UVM/vector use.
          expected: Requirement IDs, scenarios, expected outcomes, and declared interfaces/events
            are present; no downstream execution or backend completion is claimed.
          status: planned_not_executed
