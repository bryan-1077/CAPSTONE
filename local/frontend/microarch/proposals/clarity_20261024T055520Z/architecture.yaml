- instance: functional_memory
  roles:
  - memory
  responsibility: functional_memory_and_responses
  spec:
    design_name: ddr4_controller_top_spec_functional_memory
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: commit_valid
      direction: input
      width: 1
      description: shared.types.bit
    - name: commit_command
      direction: input
      width: 53
      description: shared.types.command
    - name: rsp_valid
      direction: output
      width: 1
      description: shared.types.bit
    - name: rsp_data
      direction: output
      width: 32
      description: shared.types.data
    behavior:
      description: Implement the complete functional_memory contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: functional_memory_and_responses
        owned_state:
          words: Four banks of sixteen registered 32-bit words.
          response: One registered valid/data response stage independent of request
            capacity.
        interfaces:
          commit_valid:
            direction: input
            type: shared.types.bit
            width: 1
          commit_command:
            direction: input
            type: shared.types.command
            width: 53
          rsp_valid:
            direction: output
            type: shared.types.bit
            width: 1
          rsp_data:
            direction: output
            type: shared.types.data
            width: 32
        handshakes:
          commit: Committed WRITE updates only its word; committed READ captures pre-edge
            data.
          response: response_delivery samples pre-edge response. A simultaneous new
            READ replaces the response slot for the following edge.
        reset: Synchronously zero memory, response data, and response validity; immediately
          gate rsp_valid low.
        update_events:
          shared.events.command_commit: WRITE updates addressed storage and READ captures
            pre-edge data and asserts response validity.
          shared.events.response_delivery: Clear old validity unless simultaneous
            committed READ replaces it.
        stalls: No command-side or response-side backpressure exists.
        simultaneous_events:
          delivery_and_READ: Deliver old response and capture replacement.
          reset_and_events: Reset wins.
        invariants:
        - system.rules.BASE_DATA
        - system.rules.CONSTRAINT_12
        - system.rules.R6
        - execution.rules.EXEC_RESPONSE
        verification:
        - system.verification.V_MEMORY
        - system.verification.V_ADDRESS
        - execution.verification.X_RESPONSE
        combinational_dependencies: &id027
          rsp_valid: []
          rsp_data: []
      specification_context: *id015
      active_ports:
      - commit_command
      - commit_valid
      - rsp_data
      - rsp_valid
      verification_obligations:
        system.verification.V_MEMORY: *id025
        system.verification.V_ADDRESS: *id026
        execution.verification.X_RESPONSE: &id110
          rules:
          - EXEC_RESPONSE
          scenario: Commit consecutive reads, overlap delivery with a new READ, issue
            writes, and reset during response visibility.
          expected: Each READ yields exactly one E+1 sampled response with pre-edge
            data; writes yield none.
          status: planned_not_executed
    invariants:
    - 'system.rules.BASE_DATA: Provide functional 32-bit memory storage with 16 addresses
      per bank, bank isolation and reset-to-zero contents. Accepted writes update
      only their addressed location at service completion or a committed WRITE. Each
      accepted read produces exactly one one-cycle rsp_valid pulse with the stored
      rsp_rdata after read service/READ commit, using the existing one-cycle response
      stage. Writes produce no host response. Selection and stalled candidates cannot
      mutate memory; mere command output without storage and read responses is insufficient.'
    - 'system.rules.CONSTRAINT_12: Requested constraint /topology/banks = 4.'
    - 'system.rules.R6: Preserve functional banked 32-bit memory and compact host
      address mapping. WRITE commit updates storage; READ commit at E captures pre-edge
      data and registers valid/data for host sampling at E+1, with no extra adapter
      response register. Responses survive active release, cleanup and refresh; writes
      produce no response.'
    - 'execution.rules.EXEC_RESPONSE: READ commit at E captures pre-edge memory data
      and registers rsp_valid and rsp_rdata for host sampling at E+1. Delivery and
      a new READ may share an edge: the host samples the old response before replacement.
      Writes produce no response.'
    implementation_constraints:
    - Use the exact elaborated port widths and packed field offsets; no additional
      public ports.
    - Honor every contract handshake, reset, update event, stall and simultaneous-event
      rule.
    - Do not transfer owned state or responsibilities into another module or top-level
      wiring.
    - Implement the declared combinational dependencies accurately; internal registers
      and helper logic remain implementation choices.
    - Parameter values and timing values in specification_context are concrete for
      this build; do not substitute legacy defaults.
    - A conditionally omitted input has no signal in this build; apply its specified
      absent-port behavior.
    combinational_dependencies: *id027
- instance: refresh_control
  roles:
  - refresh
  responsibility: refresh_control
  spec:
    design_name: ddr4_controller_top_spec_refresh_control
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: commit_valid
      direction: input
      width: 1
      description: shared.types.bit
    - name: commit_command
      direction: input
      width: 53
      description: shared.types.command
    - name: refresh_pending
      direction: output
      width: 1
      description: shared.types.bit
    - name: refresh_busy
      direction: output
      width: 1
      description: shared.types.bit
    behavior:
      description: Implement the complete refresh_control contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: refresh_control
        owned_state:
          deadline: Periodic deadline rebased from reset-sampled edge using tREFI.
          pending: Sticky coalesced refresh request.
          service: Committed REF exclusion interval using tRFC.
        interfaces:
          commit_valid:
            direction: input
            type: shared.types.bit
            width: 1
          commit_command:
            direction: input
            type: shared.types.command
            width: 53
          refresh_pending:
            direction: output
            type: shared.types.bit
            width: 1
          refresh_busy:
            direction: output
            type: shared.types.bit
            width: 1
        handshakes:
          request: refresh_due sets sticky pending; command sequencing drains work
            and cleanup before REF preparation.
          acknowledgment: Committed REF acknowledges one pending request and begins
            exclusion.
        reset: Synchronously clear deadline, pending, and service state and rebase
          schedule; immediately gate refresh outputs low.
        update_events:
          shared.events.refresh_due: Set pending and advance deadline by tREFI.
          shared.events.refresh_start: Clear pending unless due coincides, then start
            tRFC exclusion.
          shared.events.refresh_end: End exclusion while retaining independently accumulated
            pending refresh.
        stalls: Pending persists through active work, candidate stalls, cleanup, and
          exclusion.
        simultaneous_events:
          due_and_REF: Due wins and pending remains asserted.
          reset_and_events: Reset wins.
        invariants:
        - system.rules.BASE_REFRESH
        - system.rules.CONSTRAINT_4
        - system.rules.R8
        - execution.rules.EXEC_REFRESH
        verification:
        - system.verification.V_REFRESH
        - system.verification.V_CONFIGURATION
        - execution.verification.X_REFRESH
        combinational_dependencies: &id029
          refresh_pending: []
          refresh_busy: []
      specification_context: *id015
      active_ports:
      - commit_command
      - commit_valid
      - refresh_busy
      - refresh_pending
      verification_obligations:
        system.verification.V_REFRESH: *id028
        system.verification.V_CONFIGURATION: *id020
        execution.verification.X_REFRESH: &id111
          rules:
          - EXEC_REFRESH
          scenario: Run deadlines through active, stalled candidate, cleanup, multiple
            open banks, tRFC exclusion, and due/REF coincidence.
          expected: Pending coalesces without traffic loss; close order is ascending;
            no command commits early after REF; service resumes afterward.
          status: planned_not_executed
    invariants:
    - 'system.rules.BASE_REFRESH: Retain periodic refresh requests using profile tREFI,
      refresh priority and request/acknowledgment handling without dropping queued
      traffic. Refresh must make progress and normal requests must resume. Existing
      refresh is simplified; full REF/tRFC servicing remains later feature work. If
      explicit REF is proposed, describe drain/row-state interaction and acknowledge
      once at commit.'
    - 'system.rules.CONSTRAINT_4: Requested constraint /features/refresh = true.'
    - 'system.rules.R8: Generate periodic refresh deadlines from the last sampled
      reset edge using tREFI. Coalesce missed deadlines into sticky pending; a due
      deadline wins over simultaneous REF acknowledgment. Drain active work and cleanup,
      PRE remaining open banks in ascending order, respect all-bank tRP, commit REF
      once, and exclude commands strictly before REF-edge+tRFC. Retain queued traffic
      and resume service afterward.'
    - 'execution.rules.EXEC_REFRESH: The first deadline is the last reset-sampled
      edge plus tREFI; later deadlines advance by tREFI independently of REF. Pending
      is sticky. Pending blocks dispatch and candidate creation after outstanding
      candidate or active work resolves, drains cleanup, closes remaining open banks
      in ascending order, waits all-bank tRP, commits REF once, and excludes commands
      strictly before REF-edge+tRFC.'
    implementation_constraints:
    - Use the exact elaborated port widths and packed field offsets; no additional
      public ports.
    - Honor every contract handshake, reset, update event, stall and simultaneous-event
      rule.
    - Do not transfer owned state or responsibilities into another module or top-level
      wiring.
    - Implement the declared combinational dependencies accurately; internal registers
      and helper logic remain implementation choices.
    - Parameter values and timing values in specification_context are concrete for
      this build; do not substitute legacy defaults.
    - A conditionally omitted input has no signal in this build; apply its specified
      absent-port behavior.
    combinational_dependencies: *id029
