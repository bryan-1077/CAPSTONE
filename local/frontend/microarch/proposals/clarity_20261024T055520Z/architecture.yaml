design_kind: memory_controller
baseline_contract:
  id: current_controller_v2
  design_name: ddr4_controller_top
  profile: DDR4-3200
  config:
    design_name: ddr4_controller_top
    design_type: memory_controller
    memory:
      protocol: DDR4
      speed: '3200'
    topology:
      banks: 4
    features:
      scheduler: fifo
      page_policy: open_page
      refresh: true
      tRRD: true
      tFAW: true
    microarchitecture:
      baseline: current_controller
      waiting_capacity: 4
  host_ports:
  - name: clk
    direction: input
    width: 1
  - name: rst_n
    direction: input
    width: 1
  - name: txn_valid
    direction: input
    width: 1
  - name: txn_is_write
    direction: input
    width: 1
  - name: txn_addr
    direction: input
    width: 4
  - name: txn_wdata
    direction: input
    width: 32
  - name: txn_bank
    direction: input
    width: 2
  - name: txn_ready
    direction: output
    width: 1
  - name: cmd_ready
    direction: output
    width: 1
  - name: rsp_valid
    direction: output
    width: 1
  - name: rsp_rdata
    direction: output
    width: 32
  requirements:
  - id: BASE_HOST
    text: Preserve the existing host ports and widths listed in the baseline contract.
      Accept a request only on a rising clk edge with txn_valid && txn_ready. Hold
      payload while stalled. Consecutive accepted cycles with txn_valid held high
      are distinct requests. cmd_ready is execution/timing visibility, not the host
      acceptance handshake. Deassert txn_ready and rsp_valid during reset.
  - id: BASE_ADDRESS
    text: 'Preserve the simplified 4-bit txn_addr mapping: row=txn_addr[3:2], column=txn_addr[1:0],
      zero-extended into the internal 10-bit row and 6-bit column fields. Preserve
      explicit txn_bank for multi-bank configurations; a single-bank configuration
      uses bank 0. Internal packed requests retain bank(2), row(10), column(6), write
      flag(1), write data(32).'
  - id: BASE_QUEUE
    text: 'Provide 4 WAITING request slots PLUS one separately stored active-service
      request: waiting plus active capacity is 5. The active request must not consume
      a waiting slot. Dispatch captures the complete pre-edge request in active registers
      and frees its waiting slot without retiring the transaction. A full queue may
      admit on the same edge as dispatch; retirement alone does not free waiting storage.
      Accepted request fields survive stalls and each accepted request is serviced
      exactly once within a reset-free epoch. Keep admission, dispatch, retirement
      and read response delivery distinct. Captured response storage consumes neither
      waiting nor active capacity.'
  - id: BASE_DATA
    text: Provide functional 32-bit memory storage with 16 addresses per bank, bank
      isolation and reset-to-zero contents. Accepted writes update only their addressed
      location at service completion or a committed WRITE. Each accepted read produces
      exactly one one-cycle rsp_valid pulse with the stored rsp_rdata after read service/READ
      commit, using the existing one-cycle response stage. Writes produce no host
      response. Selection and stalled candidates cannot mutate memory; mere command
      output without storage and read responses is insufficient.
  - id: BASE_TIMING
    text: Retain existing tRCD, tRAS and tRP timing protection from the selected JEDEC
      profile. ACT-to-READ/WRITE must wait tRCD, ACT-to-PRE must respect tRAS, and
      PRE-to-next-ACT must respect tRP if explicit commands are used. Aggregate service
      may retain the existing protected timing envelope instead. Configured tRRD and
      tFAW gates must use accepted activation events, not host admissions or stalled
      proposals. Never treat existing basic timing as an unrequested future feature.
  - id: BASE_SEQUENCE
    text: Dispatch captures the complete selected request in separate active-service
      registers before freeing its waiting queue slot. Hold that active request and
      payload across setup PRE/ACT and timing stalls until its final READ/WRITE commits.
      Setup commands never retire the active request. Aggregate service also keeps
      active-service ownership through completion. Waiting-queue dequeue at dispatch
      is distinct from active-request retirement. Row state changes only on the responsible
      committed operation; uncommitted proposals cannot change state.
  - id: BASE_MODULARITY
    text: Keep request storage, request selection, command sequencing, timing enforcement
      and functional memory in independently verifiable modules with explicit interfaces.
      No single controller core may own all these functions. Each mandatory role has
      distinct module owners with functional inter-module connections. Module names
      and further decomposition remain design choices.
  - id: BASE_LEGALITY
    text: Compute command permission from registered timing/bank history and an independent
      candidate. An accepted ACT pulse is derived from candidate && permission; permission
      must not combinationally depend on that same accepted pulse. Scheduler selection/validity
      must be available independently of timing_ok; timing_ok may gate commit but
      must not create a selection-validity feedback loop. Declare accurate per-output
      combinational input dependencies.
  - id: BASE_RESET
    text: Use top-level clk and active-low rst_n. Reset clears pending requests, active
      service, row validity, memory and responses. Preserve reusable blocks with either
      synchronous or asynchronous active-low resets driven by the same rst_n; differing
      assertion styles do not require rebuilding otherwise reusable blocks. Do not
      change polarity without an explicit adapter.
  - id: BASE_POLICY
    text: Honor the requested scheduler policy fifo. Preserve page policy open_page.
      Open-page retains a serviced row; close-page closes it before subsequent bank
      use. Preserve request ownership through any setup sequence. Internal module
      decomposition and command latency may change while these observable contracts
      hold.
  - id: BASE_REFRESH
    text: Retain periodic refresh requests using profile tREFI, refresh priority and
      request/acknowledgment handling without dropping queued traffic. Refresh must
      make progress and normal requests must resume. Existing refresh is simplified;
      full REF/tRFC servicing remains later feature work. If explicit REF is proposed,
      describe drain/row-state interaction and acknowledge once at commit.
  - id: BASE_TRRD
    text: tRRD is enabled; honor that setting and resolve enabled timing values from
      DDR4-3200.
  - id: BASE_TFAW
    text: tFAW is enabled; honor that setting and resolve enabled timing values from
      DDR4-3200.
