    behavior:
      description: Implement the complete bank_state contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: bank_state
        owned_state:
          rows: Registered row for each bank.
          valid: Registered open-row validity for each bank.
        interfaces:
          commit_valid:
            direction: input
            type: shared.types.bit
            width: 1
          commit_command:
