- instance: waiting_queue
  roles:
  - request_queue
  responsibility: request_storage
  spec:
    design_name: ddr4_controller_top_spec_waiting_queue
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: enq_valid
      direction: input
      width: 1
      description: shared.types.bit
    - name: enq_request
      direction: input
      width: 51
      description: shared.types.request
    - name: head_take
      direction: input
      width: 1
      description: shared.types.bit
    - name: enq_ready
      direction: output
      width: 1
      description: shared.types.bit
    - name: head_valid
      direction: output
      width: 1
      description: shared.types.bit
    - name: head_request
      direction: output
      width: 51
      description: shared.types.request
    behavior:
      description: Implement the complete waiting_queue contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: request_storage
        owned_state:
          occupancy: Registered count of admitted undispatched requests.
          entries: FIFO storage of shared.parameters.WAITING_CAPACITY complete requests.
        interfaces:
          enq_valid:
            direction: input
            type: shared.types.bit
            width: 1
          enq_request:
            direction: input
            type: shared.types.request
            width: 51
          head_take:
            direction: input
            type: shared.types.bit
            width: 1
          enq_ready:
            direction: output
            type: shared.types.bit
            width: 1
          head_valid:
            direction: output
            type: shared.types.bit
            width: 1
          head_request:
            direction: output
            type: shared.types.request
            width: 51
        handshakes:
          admission: Append exactly one request only on shared.events.admission.
          dispatch_release: Remove exactly the complete pre-edge FIFO head on shared.events.dispatch.
          capacity: enq_ready is true for nonfull storage or same-edge pre-edge head
            release.
        reset: Synchronously clear occupancy and entries. Immediately gate enq_ready
          and head_valid low; invalid head_request is canonical zero request.
        update_events:
          shared.events.admission: Append after every older entry.
          shared.events.dispatch: Release only the pre-edge head after its complete
            payload is available to dispatch.
        stalls: Entries and head payload remain stable until dispatch or reset.
        simultaneous_events:
          admission_and_dispatch: Use pre-edge head, remove it, then append the admitted
            request; this supports full-queue and capacity-one turnover.
          retirement_and_admission: Retirement alone releases no waiting entry.
          reset_and_events: Reset wins.
        invariants:
        - system.rules.BASE_QUEUE
        - system.rules.CONSTRAINT_11
        - system.rules.R1
        - system.rules.R2
        - system.rules.SYS_SIMULTANEOUS
        - system.rules.SYS_STORAGE
        verification:
        - system.verification.V_CAPACITY
        - system.verification.V_EXACTLY_ONCE
        - system.verification.V_FIFO
        - system.verification.V_REFRESH
        - system.verification.V_RESET
        - system.verification.V_MEMORY
        combinational_dependencies: &id017
          enq_ready:
          - head_take
          head_valid: []
          head_request: []
        dependency_note: Registered occupancy and head contents have no current-cycle
          input dependency.
      specification_context: *id015
      active_ports:
      - enq_ready
      - enq_request
      - enq_valid
      - head_request
      - head_take
      - head_valid
      verification_obligations:
        system.verification.V_CAPACITY: &id098
          rules:
          - R2
          - BASE_QUEUE
          - CONSTRAINT_11
          - SYS_SIMULTANEOUS
          - SYS_STORAGE
          scenario: Fill waiting storage, stall active service, dispatch at full occupancy,
            admit concurrently with dispatch, and retire with queued work.
          expected: Four waiting entries and one active request coexist; full waiting
            storage admits on dispatch; retirement alone does not free waiting storage;
            no empty-queue bypass occurs.
          status: planned_not_executed
        system.verification.V_EXACTLY_ONCE: &id099
          rules:
          - BASE_QUEUE
          - SYS_STORAGE
          scenario: Apply long timing stalls, refresh delays, repeated queue reuse,
            and mixed traffic in a reset-free epoch.
          expected: Each admitted request is dispatched and serviced once with no
            loss, duplication, or premature retirement.
          status: planned_not_executed
        system.verification.V_FIFO: &id018
          rules:
          - R1
          - BASE_POLICY
          scenario: Accept mixed read/write traffic including same-address write/read
            pairs, row hits, misses, and timing stalls.
          expected: Dispatch and retirement follow acceptance order exactly; command
            readiness does not control admission; younger requests never bypass older
            requests.
          status: planned_not_executed
        system.verification.V_REFRESH: &id028
          rules:
          - R8
          - BASE_REFRESH
          - SYS_SIMULTANEOUS
          scenario: Cause deadlines while idle, active, candidate-blocked, cleanup-active,
            and during REF acknowledgment.
          expected: Deadlines coalesce; active and cleanup drain; banks close ascending;
            REF occurs after all-bank tRP; due with REF leaves pending; traffic resumes
            after tRFC.
          status: planned_not_executed
        system.verification.V_RESET: *id016
        system.verification.V_MEMORY: &id025
          rules:
          - R6
          - BASE_DATA
          - CONSTRAINT_12
          - SYS_STORAGE
          scenario: Write and read every compact address in every bank, overlap response
            delivery with later reads, and reset during response visibility.
          expected: WRITE updates only its addressed word; READ captures pre-edge
            data and yields one E+1 response; banks isolate; reset zeros memory and
            cancels validity.
          status: planned_not_executed
    invariants:
    - 'system.rules.BASE_QUEUE: Provide 4 WAITING request slots PLUS one separately
      stored active-service request: waiting plus active capacity is 5. The active
      request must not consume a waiting slot. Dispatch captures the complete pre-edge
      request in active registers and frees its waiting slot without retiring the
      transaction. A full queue may admit on the same edge as dispatch; retirement
      alone does not free waiting storage. Accepted request fields survive stalls
      and each accepted request is serviced exactly once within a reset-free epoch.
      Keep admission, dispatch, retirement and read response delivery distinct. Captured
      response storage consumes neither waiting nor active capacity.'
    - 'system.rules.CONSTRAINT_11: Requested constraint /microarchitecture/waiting_capacity
      = 4.'
    - 'system.rules.R1: Implement global FIFO service in acceptance order, including
      same-address writes and reads. Admit on every rising-edge txn_valid && txn_ready,
      independently of command readiness.'
    - 'system.rules.R2: Provide four waiting entries plus one separately stored active
      request. Dispatch only previously stored requests, capture the complete pre-edge
      head before releasing its slot, and permit full-queue simultaneous dispatch/admission
      including capacity one. No empty-queue bypass or same-edge active replacement
      at retirement.'
    - 'system.rules.SYS_SIMULTANEOUS: Reset wins over every event. With reset inactive,
      admission may coincide with command commit. Full waiting storage may admit on
      a dispatch edge using the pre-edge head for dispatch and the incoming request
      for the tail. Dispatch and retirement do not coincide because active ownership
      remains occupied through retirement. A refresh due coincident with REF commit
      leaves pending asserted.'
    - 'system.rules.SYS_STORAGE: Waiting storage holds admitted undispatched requests,
      active storage holds one dispatched unretired request, and response storage
      holds one captured read response. These capacities are independent. Dispatch
      release is not retirement.'
    implementation_constraints:
    - Use the exact elaborated port widths and packed field offsets; no additional
      public ports.
    - Honor every contract handshake, reset, update event, stall and simultaneous-event
      rule.
    - Do not transfer owned state or responsibilities into another module or top-level
      wiring.
    - Implement the declared combinational dependencies accurately; internal registers
      and helper logic remain implementation choices.
    - Parameter values and timing values in specification_context are concrete for
      this build; do not substitute legacy defaults.
    - A conditionally omitted input has no signal in this build; apply its specified
      absent-port behavior.
    combinational_dependencies: *id017
