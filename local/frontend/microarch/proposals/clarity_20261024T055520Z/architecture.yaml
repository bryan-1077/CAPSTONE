              invariants:
              - system.rules.BASE_QUEUE
              - system.rules.CONSTRAINT_11
              - system.rules.R1
              - system.rules.R2
              - system.rules.SYS_SIMULTANEOUS
              - system.rules.SYS_STORAGE
              verification:
              - system.verification.V_CAPACITY
              - system.verification.V_EXACTLY_ONCE
              - system.verification.V_FIFO
              - system.verification.V_REFRESH
              - system.verification.V_RESET
              - system.verification.V_MEMORY
              combinational_dependencies:
                enq_ready:
                - head_take
                head_valid: []
                head_request: []
              dependency_note: Registered occupancy and head contents have no current-cycle
                input dependency.
            fifo_scheduler:
              status: draft
              role: request_selection
              owned_state: {}
              interfaces:
                head_valid:
                  direction: input
                  type: shared.types.bit
                head_request:
                  direction: input
                  type: shared.types.request
                dispatch_ready:
                  direction: input
                  type: shared.types.bit
                dispatch_valid:
                  direction: output
                  type: shared.types.bit
                dispatch_request:
                  direction: output
                  type: shared.types.request
                head_take:
                  direction: output
                  type: shared.types.bit
              handshakes:
                selection: Select the pre-edge FIFO head independently of timing permission.
                dispatch: head_take requests release only when selected head and dispatch_ready
                  form shared.events.dispatch.
              reset: Immediately gate dispatch_valid and head_take low.
              update_events: {}
              stalls: A blocked selection remains the same FIFO head; younger entries
                never bypass it.
              simultaneous_events:
                admission_and_dispatch: Selection remains the pre-edge head while
                  storage appends a simultaneous admission.
                retirement_and_dispatch: Active ownership prevents dispatch through
                  retirement.
                reset_and_events: Reset suppresses selection.
              invariants:
              - system.rules.BASE_POLICY
              - system.rules.CONSTRAINT_5
              verification:
              - system.verification.V_FIFO
              - system.verification.V_PAGE
              - system.verification.V_CONFIGURATION
              combinational_dependencies:
                dispatch_valid:
                - head_valid
                dispatch_request:
                - head_request
                head_take:
                - head_valid
                - dispatch_ready
            command_engine:
              status: draft
              role: command_sequencing
              owned_state:
                active_request: One complete dispatched request retained until final
                  READ or WRITE commit.
                candidate: Registered valid candidate slot and command payload.
                cleanup: Close-page reservation retained until legal PRE commit.
                refresh_preparation: Registered ascending-bank preparation state.
              interfaces:
                dispatch_valid:
                  direction: input
                  type: shared.types.bit
                dispatch_request:
                  direction: input
                  type: shared.types.request
                open_valid:
                  direction: input
                  type: shared.types.bank_valid
                open_rows:
                  direction: input
                  type: shared.types.bank_rows
                candidate_ok:
                  direction: input
                  type: shared.types.bit
                probe_request:
                  direction: input
                  type: shared.types.request
                probe_permitted:
                  direction: input
                  type: shared.types.bit
                refresh_pending:
                  direction: input
                  type: shared.types.bit
                refresh_busy:
                  direction: input
                  type: shared.types.bit
                dispatch_ready:
                  direction: output
                  type: shared.types.bit
                candidate_valid:
                  direction: output
                  type: shared.types.bit
                candidate_command:
                  direction: output
                  type: shared.types.command
                commit_valid:
                  direction: output
                  type: shared.types.bit
                commit_command:
                  direction: output
                  type: shared.types.command
                probe_valid:
                  direction: output
                  type: shared.types.bit
                probe_command:
                  direction: output
                  type: shared.types.command
                cmd_ready:
                  direction: output
                  type: shared.types.bit
              handshakes:
                dispatch: Dispatch captures registered active ownership and does not
                  create a candidate on that edge.
                candidate: Create the first candidate only on a later edge from registered
                  active ownership and bank state; blocked candidates hold unchanged.
                commit: commit_command mirrors candidate_command. commit_valid requires
                  inactive reset, valid permitted non-NOP nonreserved candidate.
                probe: probe_command is the combinational first-command query even
                  when probe_valid is low.
              reset: Synchronously clear active, candidate, cleanup, and preparation
                state. Immediately gate all valid, ready, and commit outputs low and
                force command payloads to zero NOP.
              update_events:
                shared.events.dispatch: Capture dispatch_request and leave candidate
                  storage empty.
                shared.events.candidate_create: Create only from registered ownership
                  when candidate storage is empty.
                shared.events.command_commit: READ or WRITE retire active ownership;
                  close-page retains cleanup; ACT, PRE, and REF advance service state.
                every_clock: Outstanding candidate hold or commit precedes active
                  drain, cleanup, then refresh preparation.
              stalls: Candidate and active request hold while permission is low; newly
                pending refresh does not replace a blocked candidate.
              simultaneous_events:
                commit_and_candidate_create: Replacement is later-edge only.
                dispatch_and_candidate_create: Initial creation is later than dispatch.
                due_and_REF: Due leaves pending asserted.
                reset_and_events: Reset wins.
              invariants:
              - system.rules.BASE_SEQUENCE
              - system.rules.CONSTRAINT_3
              - system.rules.CONSTRAINT_10
              - system.rules.R3
              - system.rules.R7
              - system.rules.R12
              - system.rules.R13
              - execution.rules.EXEC_CLEANUP
              - execution.rules.EXEC_COMMIT
              - execution.rules.EXEC_PAYLOAD
              - execution.rules.EXEC_READY
              verification:
              - system.verification.V_SEQUENCE
              - system.verification.V_CONFIGURATION
              - system.verification.V_PAGE
              - system.verification.V_CANDIDATE
              - system.verification.V_PAYLOAD
              - execution.verification.X_CLEANUP
              - execution.verification.X_COMMIT
              - execution.verification.X_PAYLOAD
              - execution.verification.X_READY
              combinational_dependencies:
                dispatch_ready:
                - refresh_pending
                - refresh_busy
                candidate_valid: []
                candidate_command: []
                commit_valid:
                - candidate_ok
                commit_command: []
                probe_valid:
                - refresh_pending
                - refresh_busy
                probe_command:
                - probe_request
                - open_valid
                - open_rows
                cmd_ready:
                - refresh_pending
                - refresh_busy
                - probe_permitted
            timing_enforcement:
              status: draft
              role: timing_enforcement
              owned_state:
                bank_history: Registered committed ACT and PRE history by bank.
                global_history: Registered committed ACT spacing, tFAW-window, and
                  REF exclusion history.
              interfaces:
                candidate_valid:
                  direction: input
                  type: shared.types.bit
                candidate_command:
                  direction: input
                  type: shared.types.command
                probe_valid:
                  direction: input
                  type: shared.types.bit
                probe_command:
                  direction: input
                  type: shared.types.command
                open_valid:
                  direction: input
                  type: shared.types.bank_valid
                open_rows:
                  direction: input
                  type: shared.types.bank_rows
                commit_valid:
                  direction: input
                  type: shared.types.bit
                commit_command:
                  direction: input
                  type: shared.types.command
                candidate_ok:
                  direction: output
                  type: shared.types.bit
                probe_ok:
                  direction: output
                  type: shared.types.bit
              handshakes:
                permission: Permission uses only pre-edge registered history, pre-edge
                  row state, and current candidate inputs; it never depends on commit_valid.
                history: Only committed ACT, PRE, and REF update history.
                probe: Probe permission is independent and has no state effect.
              reset: Synchronously clear timing histories and immediately gate candidate_ok
                and probe_ok low.
              update_events:
                shared.events.command_commit: Insert history only for committed ACT,
                  PRE, or REF.
                every_clock: Age and expire history using exact edge differences.
              stalls: Elapsed time advances during stalls but blocked candidates create
                no history.
              simultaneous_events:
                expiration_and_ACT: Evaluate from pre-edge history, then age and insert
                  committed ACT.
                reset_and_commit: Reset wins.
              invariants:
              - system.rules.BASE_LEGALITY
              - system.rules.BASE_TFAW
              - system.rules.BASE_TIMING
              - system.rules.BASE_TRRD
              - system.rules.CONSTRAINT_6
              - system.rules.CONSTRAINT_7
              - system.rules.CONSTRAINT_8
              - system.rules.CONSTRAINT_9
              - system.rules.R5
              - execution.rules.EXEC_PERMISSION
              verification:
              - system.verification.V_TIMING
              - system.verification.V_CONFIGURATION
              - execution.verification.X_PERMISSION
              combinational_dependencies:
                candidate_ok:
                - candidate_valid
                - candidate_command
                - open_valid
                - open_rows
                probe_ok:
                - probe_valid
                - probe_command
                - open_valid
                - open_rows
            bank_state:
              status: draft
              role: bank_state
              owned_state:
                rows: Registered row for each bank.
                valid: Registered open-row validity for each bank.
              interfaces:
                commit_valid:
                  direction: input
                  type: shared.types.bit
                commit_command:
                  direction: input
                  type: shared.types.command
                open_valid:
                  direction: output
                  type: shared.types.bank_valid
                open_rows:
                  direction: output
                  type: shared.types.bank_rows
              handshakes:
                commit: Only common committed ACT, PRE, and REF alter row state.
              reset: Synchronously clear row validity and values; immediately gate
                open_valid low.
              update_events:
                shared.events.command_commit: ACT opens its bank and records row;
                  PRE closes its bank; REF closes all banks; READ and WRITE retain
                  rows.
              stalls: No responsible committed operation means no row-state change.
              simultaneous_events:
                commits: At most one command commits per edge.
                reset_and_commit: Reset wins.
              invariants:
              - execution.rules.EXEC_BANK_STATE
              verification:
              - execution.verification.X_BANK
              combinational_dependencies:
                open_valid: []
                open_rows: []
            functional_memory:
              status: draft
              role: functional_memory_and_responses
              owned_state:
                words: Four banks of sixteen registered 32-bit words.
                response: One registered valid/data response stage independent of
                  request capacity.
              interfaces:
                commit_valid:
                  direction: input
                  type: shared.types.bit
                commit_command:
                  direction: input
                  type: shared.types.command
                rsp_valid:
                  direction: output
                  type: shared.types.bit
                rsp_data:
                  direction: output
                  type: shared.types.data
              handshakes:
                commit: Committed WRITE updates only its word; committed READ captures
                  pre-edge data.
                response: response_delivery samples pre-edge response. A simultaneous
                  new READ replaces the response slot for the following edge.
              reset: Synchronously zero memory, response data, and response validity;
                immediately gate rsp_valid low.
              update_events:
                shared.events.command_commit: WRITE updates addressed storage and
                  READ captures pre-edge data and asserts response validity.
                shared.events.response_delivery: Clear old validity unless simultaneous
                  committed READ replaces it.
              stalls: No command-side or response-side backpressure exists.
              simultaneous_events:
                delivery_and_READ: Deliver old response and capture replacement.
                reset_and_events: Reset wins.
              invariants:
              - system.rules.BASE_DATA
              - system.rules.CONSTRAINT_12
              - system.rules.R6
              - execution.rules.EXEC_RESPONSE
              verification:
              - system.verification.V_MEMORY
              - system.verification.V_ADDRESS
              - execution.verification.X_RESPONSE
              combinational_dependencies:
                rsp_valid: []
                rsp_data: []
            refresh_control:
              status: draft
              role: refresh_control
              owned_state:
                deadline: Periodic deadline rebased from reset-sampled edge using
                  tREFI.
                pending: Sticky coalesced refresh request.
                service: Committed REF exclusion interval using tRFC.
              interfaces:
                commit_valid:
                  direction: input
                  type: shared.types.bit
                commit_command:
                  direction: input
                  type: shared.types.command
                refresh_pending:
                  direction: output
                  type: shared.types.bit
                refresh_busy:
                  direction: output
                  type: shared.types.bit
              handshakes:
                request: refresh_due sets sticky pending; command sequencing drains
                  work and cleanup before REF preparation.
                acknowledgment: Committed REF acknowledges one pending request and
                  begins exclusion.
              reset: Synchronously clear deadline, pending, and service state and
                rebase schedule; immediately gate refresh outputs low.
              update_events:
                shared.events.refresh_due: Set pending and advance deadline by tREFI.
                shared.events.refresh_start: Clear pending unless due coincides, then
                  start tRFC exclusion.
                shared.events.refresh_end: End exclusion while retaining independently
                  accumulated pending refresh.
              stalls: Pending persists through active work, candidate stalls, cleanup,
                and exclusion.
              simultaneous_events:
                due_and_REF: Due wins and pending remains asserted.
                reset_and_events: Reset wins.
              invariants:
              - system.rules.BASE_REFRESH
              - system.rules.CONSTRAINT_4
              - system.rules.R8
              - execution.rules.EXEC_REFRESH
              verification:
              - system.verification.V_REFRESH
              - system.verification.V_CONFIGURATION
              - execution.verification.X_REFRESH
              combinational_dependencies:
                refresh_pending: []
                refresh_busy: []
        graph:
          graph_id: ddr4_controller_top_structural
          clock_reset:
            definition: shared.clock_reset
            clock_source: top.clk
            reset_source: top.rst_n
            consumers:
            - host_protocol
            - waiting_queue
            - fifo_scheduler
            - command_engine
            - timing_enforcement
            - bank_state
            - functional_memory
            - refresh_control
          connections:
            top.txn_valid:
            - host_protocol.txn_valid
            top.txn_is_write:
            - host_protocol.txn_is_write
            top.txn_addr:
            - host_protocol.txn_addr
            top.txn_wdata:
            - host_protocol.txn_wdata
            top.txn_bank:
            - host_protocol.txn_bank
            host_protocol.enq_valid:
            - waiting_queue.enq_valid
            host_protocol.enq_request:
            - waiting_queue.enq_request
            waiting_queue.enq_ready:
            - host_protocol.queue_ready
            waiting_queue.head_valid:
            - fifo_scheduler.head_valid
            waiting_queue.head_request:
            - fifo_scheduler.head_request
            fifo_scheduler.head_take:
            - waiting_queue.head_take
            fifo_scheduler.dispatch_valid:
            - command_engine.dispatch_valid
            fifo_scheduler.dispatch_request:
            - command_engine.dispatch_request
            command_engine.dispatch_ready:
            - fifo_scheduler.dispatch_ready
            host_protocol.probe_request:
            - command_engine.probe_request
            command_engine.probe_command:
            - timing_enforcement.probe_command
            command_engine.probe_valid:
            - timing_enforcement.probe_valid
            timing_enforcement.probe_ok:
            - command_engine.probe_permitted
            bank_state.open_valid:
            - command_engine.open_valid
            - timing_enforcement.open_valid
            bank_state.open_rows:
            - command_engine.open_rows
            - timing_enforcement.open_rows
            command_engine.candidate_valid:
            - timing_enforcement.candidate_valid
            command_engine.candidate_command:
            - timing_enforcement.candidate_command
            timing_enforcement.candidate_ok:
            - command_engine.candidate_ok
            command_engine.commit_valid:
            - timing_enforcement.commit_valid
            - bank_state.commit_valid
            - functional_memory.commit_valid
            - refresh_control.commit_valid
            command_engine.commit_command:
            - timing_enforcement.commit_command
            - bank_state.commit_command
            - functional_memory.commit_command
            - refresh_control.commit_command
            refresh_control.refresh_pending:
            - command_engine.refresh_pending
            refresh_control.refresh_busy:
            - command_engine.refresh_busy
            command_engine.cmd_ready:
            - host_protocol.probe_ready
            functional_memory.rsp_valid:
            - host_protocol.memory_rsp_valid
            functional_memory.rsp_data:
            - host_protocol.memory_rsp_data
            host_protocol.txn_ready:
            - top.txn_ready
            host_protocol.cmd_ready:
            - top.cmd_ready
            host_protocol.rsp_valid:
            - top.rsp_valid
            host_protocol.rsp_rdata:
            - top.rsp_rdata
          presence: {}
          integration: Top integration is structural only; ordinary connections are
            typed whole-port wiring and clock/reset are implicit child inputs.
        verification:
          binding_version: 1
          sampling:
            phase: pre_edge
            reset_gates_events: true
          events:
            admission:
              status: bound
              when:
                all:
                - endpoint: top.txn_valid
                  equals: 1
                - endpoint: top.txn_ready
                  equals: 1
              payload:
                request:
                  endpoint: host_protocol.enq_request
            candidate_create:
              status: unbound
              reason: No observable creation pulse exists; independently infer creation
                from candidate outputs and declared later-edge rules.
            command_commit:
              status: bound
              when:
                endpoint: command_engine.commit_valid
                equals: 1
              payload:
                command:
                  endpoint: command_engine.commit_command
            dispatch:
              status: bound
              when:
                all:
                - endpoint: fifo_scheduler.dispatch_valid
                  equals: 1
                - endpoint: command_engine.dispatch_ready
                  equals: 1
              payload:
                request:
                  endpoint: fifo_scheduler.dispatch_request
            refresh_due:
              status: unbound
              reason: Deadline state is internal; independently predict tREFI deadlines
                from reset and observe refresh state.
            refresh_end:
              status: unbound
              reason: No end pulse is exported; independently measure tRFC from committed
                REF and observe refresh_busy.
            refresh_start:
              status: bound
              when:
                all:
                - endpoint: command_engine.commit_valid
                  equals: 1
                - endpoint: command_engine.commit_command
                  field: opcode
                  equals: REF
              payload:
                command:
                  endpoint: command_engine.commit_command
            response_delivery:
              status: bound
              when:
                endpoint: top.rsp_valid
                equals: 1
              payload:
                data:
                  endpoint: top.rsp_rdata
            retirement:
              status: bound
              when:
                all:
                - endpoint: command_engine.commit_valid
                  equals: 1
                - any:
                  - endpoint: command_engine.commit_command
                    field: opcode
                    equals: READ
                  - endpoint: command_engine.commit_command
                    field: opcode
                    equals: WRITE
              payload:
                command:
                  endpoint: command_engine.commit_command
          observations:
            host_ready:
              endpoint: top.txn_ready
            cmd_ready:
              endpoint: top.cmd_ready
            candidate_valid:
              endpoint: command_engine.candidate_valid
            candidate_command:
              endpoint: command_engine.candidate_command
            candidate_ok:
              endpoint: timing_enforcement.candidate_ok
            commit_command:
              endpoint: command_engine.commit_command
            open_valid:
              endpoint: bank_state.open_valid
            open_rows:
              endpoint: bank_state.open_rows
            refresh_pending:
              endpoint: refresh_control.refresh_pending
            refresh_busy:
              endpoint: refresh_control.refresh_busy
            response_valid:
              endpoint: top.rsp_valid
            response_data:
              endpoint: top.rsp_rdata
          checks:
            system.verification.V_ADDRESS:
              scope: both
              events:
              - admission
              observations:
              - host_ready
              note: Scoreboard compact mapping and topology.
            system.verification.V_MEMORY:
              scope: both
              events:
              - command_commit
              - response_delivery
              observations:
              - response_valid
              - response_data
              note: Use independent banked memory model.
            system.verification.V_HOST:
              scope: both
              events:
              - admission
              observations:
              - host_ready
              - cmd_ready
              note: Check valid-ready admission separation.
            system.verification.V_RESET:
              scope: both
              events:
              - admission
              - command_commit
              observations:
              - host_ready
              - cmd_ready
              - response_valid
              note: Check gating and synchronous clearing.
            system.verification.V_ISOLATION:
              scope: system
              events:
              - dispatch
              - command_commit
              observations:
              - candidate_valid
              - candidate_ok
              - open_valid
              note: Review distinct typed functional owners.
            system.verification.V_IDENTITY:
              scope: system
              observations:
              - host_ready
              events: []
              note: Inspect declared identity.
            system.verification.V_DIAGNOSTIC:
              scope: both
              events:
              - admission
              observations:
              - cmd_ready
              note: Check diagnostic side effects are absent.
            system.verification.V_EXPORT:
              scope: system
              observations:
              - candidate_command
              events: []
              note: Inspect declared links and bindings.
            system.verification.V_CAPACITY:
              scope: both
              events:
              - admission
              - dispatch
              - retirement
              observations:
              - host_ready
              note: Reconstruct waiting and active capacity.
            system.verification.V_EXACTLY_ONCE:
              scope: system
              events:
              - admission
              - dispatch
              - retirement
              observations:
              - candidate_valid
              note: Track reset-free request lifecycle.
            system.verification.V_FIFO:
              scope: both
              events:
              - admission
              - dispatch
              - retirement
              observations:
              - candidate_command
              note: Compare acceptance and retirement order.
            system.verification.V_REFRESH:
              scope: both
              events:
              - refresh_start
              - command_commit
              observations:
              - refresh_pending
              - refresh_busy
              - open_valid
              note: Predict drain, REF, exclusion, and resume.
            system.verification.V_CONFIGURATION:
              scope: system
              events:
              - command_commit
              observations:
              - candidate_command
              - refresh_pending
              note: Inspect locked configuration use.
            system.verification.V_PAGE:
              scope: both
              events:
              - retirement
              - command_commit
              - dispatch
              observations:
              - open_valid
              - open_rows
              note: Check open-page and close-page cleanup.
            system.verification.V_SEQUENCE:
              scope: both
              events:
              - dispatch
              - command_commit
              observations:
              - candidate_command
              - open_valid
              note: Check closed, hit, and conflict sequences.
            system.verification.V_CANDIDATE:
              scope: both
              events:
              - dispatch
              - command_commit
              observations:
              - candidate_valid
              - candidate_command
              note: Check delayed creation and later replacement.
            system.verification.V_PAYLOAD:
              scope: both
              events:
              - command_commit
              observations:
              - candidate_valid
              - candidate_command
              - commit_command
              note: Check NOP masking and independent probe payload.
            system.verification.V_TIMING:
              scope: both
              events:
              - command_commit
              observations:
              - candidate_command
              - candidate_ok
              - open_valid
              note: Evaluate exact timing boundaries.
            execution.verification.X_BANK:
              scope: both
              events:
              - command_commit
              observations:
              - open_valid
              - open_rows
              note: Compare rows only against committed operations.
            execution.verification.X_CLEANUP:
              scope: both
              events:
              - retirement
              - command_commit
              observations:
              - open_valid
              - refresh_pending
              note: Check cleanup reservation.
            execution.verification.X_COMMIT:
              scope: both
              events:
              - command_commit
              observations:
              - candidate_valid
              - candidate_command
              - candidate_ok
              - commit_command
              note: Check legal single commit.
            execution.verification.X_PAYLOAD:
              scope: both
              events:
              - command_commit
              observations:
              - candidate_valid
              - candidate_command
              - commit_command
              note: Check payload behavior.
            execution.verification.X_PERMISSION:
              scope: both
              events:
              - command_commit
              observations:
              - candidate_command
              - candidate_ok
              - open_valid
              - open_rows
              note: Check pre-edge permission.
            execution.verification.X_READY:
              scope: both
              events:
              - admission
              - dispatch
              observations:
              - host_ready
              - cmd_ready
              note: Check capacity and diagnostic readiness.
            execution.verification.X_REFRESH:
              scope: both
              events:
              - refresh_start
              - command_commit
              observations:
              - refresh_pending
              - refresh_busy
              - open_valid
              note: Check drain and exclusion.
            execution.verification.X_RESPONSE:
              scope: both
              events:
              - command_commit
              - response_delivery
              observations:
              - response_valid
              - response_data
              note: Check E+1 read response.
      timing_library:
        DDR4-2400:
          clock_frequency_mhz: 1200
          tck_ns: 0.833
          timing_ns:
            tRCD: 13.75
            tRP: 13.75
            tRAS: 32.0
            tRC: 45.75
            tRRD: 3.333
            tFAW: 25.0
            tRFC1: 350.0
            tREFI: 7800.0
          timing_cycles:
            tRCD: 17
            tRP: 17
            tRAS: 39
            tRC: 55
            tRRD: 4
            tFAW: 30
            tRFC1: 420
            tREFI: 9360
          cas_latency_options:
