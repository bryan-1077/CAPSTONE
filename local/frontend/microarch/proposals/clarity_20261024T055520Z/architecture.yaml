      direction: input
      width: 53
      description: shared.types.command
    - name: candidate_ok
      direction: output
      width: 1
      description: shared.types.bit
    - name: probe_ok
      direction: output
      width: 1
      description: shared.types.bit
    behavior:
      description: Implement the complete timing_enforcement contract below. All structured
        contract and system context fields are normative. Internal representations
        and algorithms may vary within this boundary.
      contract:
        status: draft
        role: timing_enforcement
        owned_state:
          bank_history: Registered committed ACT and PRE history by bank.
          global_history: Registered committed ACT spacing, tFAW-window, and REF exclusion
            history.
        interfaces:
          candidate_valid:
            direction: input
            type: shared.types.bit
            width: 1
          candidate_command:
            direction: input
            type: shared.types.command
            width: 53
          probe_valid:
            direction: input
            type: shared.types.bit
            width: 1
          probe_command:
            direction: input
            type: shared.types.command
            width: 53
          open_valid:
            direction: input
            type: shared.types.bank_valid
            width: 4
          open_rows:
            direction: input
            type: shared.types.bank_rows
            width: 40
          commit_valid:
            direction: input
            type: shared.types.bit
            width: 1
          commit_command:
            direction: input
            type: shared.types.command
            width: 53
          candidate_ok:
            direction: output
            type: shared.types.bit
            width: 1
          probe_ok:
            direction: output
            type: shared.types.bit
            width: 1
        handshakes:
          permission: Permission uses only pre-edge registered history, pre-edge row
            state, and current candidate inputs; it never depends on commit_valid.
          history: Only committed ACT, PRE, and REF update history.
          probe: Probe permission is independent and has no state effect.
        reset: Synchronously clear timing histories and immediately gate candidate_ok
          and probe_ok low.
        update_events:
          shared.events.command_commit: Insert history only for committed ACT, PRE,
            or REF.
          every_clock: Age and expire history using exact edge differences.
        stalls: Elapsed time advances during stalls but blocked candidates create
          no history.
        simultaneous_events:
          expiration_and_ACT: Evaluate from pre-edge history, then age and insert
            committed ACT.
          reset_and_commit: Reset wins.
        invariants:
        - system.rules.BASE_LEGALITY
        - system.rules.BASE_TFAW
        - system.rules.BASE_TIMING
        - system.rules.BASE_TRRD
        - system.rules.CONSTRAINT_6
        - system.rules.CONSTRAINT_7
        - system.rules.CONSTRAINT_8
        - system.rules.CONSTRAINT_9
        - system.rules.R5
        - execution.rules.EXEC_PERMISSION
        verification:
        - system.verification.V_TIMING
        - system.verification.V_CONFIGURATION
        - execution.verification.X_PERMISSION
        combinational_dependencies: &id023
          candidate_ok:
          - candidate_valid
          - candidate_command
          - open_valid
          - open_rows
          probe_ok:
          - probe_valid
          - probe_command
          - open_valid
          - open_rows
      specification_context: *id015
      active_ports:
      - candidate_command
      - candidate_ok
      - candidate_valid
      - commit_command
      - commit_valid
      - open_rows
      - open_valid
      - probe_command
      - probe_ok
      - probe_valid
      verification_obligations:
        system.verification.V_TIMING: &id102
          rules:
          - R5
          - BASE_TIMING
          - BASE_LEGALITY
          - BASE_TRRD
          - BASE_TFAW
          scenario: Test trigger and blocked commands at E+T-1 and E+T, including
            global ACT spacing and four prior ACTs.
          expected: Only committed commands update history; permission is independent
            of its own acceptance; no command commits early; exact boundaries are
            eligible when other conditions hold.
          status: planned_not_executed
        system.verification.V_CONFIGURATION: *id020
        execution.verification.X_PERMISSION: &id114
          rules:
          - EXEC_PERMISSION
          scenario: Test every trigger/block pair one cycle before and at its exact
            timing bound.
          expected: Permission derives only from pre-edge registered state and becomes
            eligible only at declared boundaries.
          status: planned_not_executed
    invariants:
    - 'system.rules.BASE_LEGALITY: Compute command permission from registered timing/bank
      history and an independent candidate. An accepted ACT pulse is derived from
      candidate && permission; permission must not combinationally depend on that
      same accepted pulse. Scheduler selection/validity must be available independently
      of timing_ok; timing_ok may gate commit but must not create a selection-validity
      feedback loop. Declare accurate per-output combinational input dependencies.'
    - 'system.rules.BASE_TFAW: tFAW is enabled; honor that setting and resolve enabled
      timing values from DDR4-3200.'
    - 'system.rules.BASE_TIMING: Retain existing tRCD, tRAS and tRP timing protection
      from the selected JEDEC profile. ACT-to-READ/WRITE must wait tRCD, ACT-to-PRE
      must respect tRAS, and PRE-to-next-ACT must respect tRP if explicit commands
      are used. Aggregate service may retain the existing protected timing envelope
      instead. Configured tRRD and tFAW gates must use accepted activation events,
      not host admissions or stalled proposals. Never treat existing basic timing
      as an unrequested future feature.'
    - 'system.rules.BASE_TRRD: tRRD is enabled; honor that setting and resolve enabled
      timing values from DDR4-3200.'
    - 'system.rules.CONSTRAINT_6: Requested constraint /features/tFAW = true.'
    - 'system.rules.CONSTRAINT_7: Requested constraint /features/tRRD = true.'
    - 'system.rules.CONSTRAINT_8: Requested constraint /memory/protocol = "DDR4".'
    - 'system.rules.CONSTRAINT_9: Requested constraint /memory/speed = "3200".'
    - 'system.rules.R5: Update bank state and timing history only from committed commands.
      Enforce tRCD, tRAS, tRP, tRRD, tFAW and tRFC using the selected project profile.
      A trigger at E permits the blocked command at E+T; tFAW counts earlier ACT commits
      with age strictly less than its window. Reset creates no synthetic timing history.'
    - 'execution.rules.EXEC_PERMISSION: Permission uses registered timing history,
      registered bank state, independent candidate, and selected bindings. ACT requires
      closed bank; READ/WRITE require matching open row; PRE requires open bank; REF
      requires all banks closed and all-bank tRP. Permission does not depend on same-edge
      commit or updates.'
    implementation_constraints:
    - Use the exact elaborated port widths and packed field offsets; no additional
      public ports.
    - Honor every contract handshake, reset, update event, stall and simultaneous-event
      rule.
    - Do not transfer owned state or responsibilities into another module or top-level
      wiring.
    - Implement the declared combinational dependencies accurately; internal registers
      and helper logic remain implementation choices.
    - Parameter values and timing values in specification_context are concrete for
      this build; do not substitute legacy defaults.
    - A conditionally omitted input has no signal in this build; apply its specified
      absent-port behavior.
    combinational_dependencies: *id023
