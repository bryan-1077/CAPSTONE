design_name: ddr4_command_engine
design_type: datapath
clock:
  name: clk
reset:
  name: rst_n
  active_low: true
  synchronous: true
ports:
- name: sel_valid
  direction: input
  width: 1
- name: sel_idx
  direction: input
  width: 2
- name: sel_req
  direction: input
  width: 51
- name: ref_req
  direction: input
  width: 1
- name: timing_ok
  direction: input
  width: 1
- name: bank_active
  direction: input
  width: 4
- name: bank_open_row
  direction: input
  width: 40
- name: dispatch_fire
  direction: output
  width: 1
- name: dispatch_idx
  direction: output
  width: 2
- name: cmd_ready
  direction: output
  width: 1
- name: candidate_valid
  direction: output
  width: 1
- name: candidate_opcode
  direction: output
  width: 3
- name: candidate_bank
  direction: output
  width: 2
- name: candidate_row
  direction: output
  width: 10
- name: cmd_commit
  direction: output
  width: 1
- name: commit_opcode
  direction: output
  width: 3
- name: commit_bank
  direction: output
  width: 2
- name: commit_row
  direction: output
  width: 10
- name: rw_commit
  direction: output
  width: 1
- name: active_req
  direction: output
  width: 51
- name: service_done
  direction: output
  width: 1
- name: ref_ack
  direction: output
  width: 1
behavior:
  description: The engine has IDLE, PREPARE_PRE, PREPARE_ACT, ACCESS, and REFRESH
    states. It owns one active 51-bit request register and active-valid bit separate
    from waiting slots. In IDLE, ref_req has priority. A pending refresh enters REFRESH
    without capturing a transaction. Otherwise sel_valid produces dispatch_fire; on
    that edge sel_req is captured, active-valid is set, and dispatch_idx frees the
    queue slot. With active state, a conflicting open row causes PRE, a closed bank
    causes ACT, and a matching open row causes READ or WRITE. PRE commit advances
    to ACT, ACT commit advances to ACCESS, and a committed READ or WRITE asserts rw_commit
    and service_done, clears active-valid, and returns IDLE. REFRESH proposes opcode
    5 and ref_ack only when REF commits. candidate signals derive only from registered
    engine state, active request, ref_req, and registered row state. cmd_commit equals
    candidate_valid and timing_ok. A stalled candidate changes no row state, timing
    history, memory, refresh state, or active state. cmd_ready is high only in IDLE
    without ref_req.
  invariants:
  - Active request does not consume a waiting queue slot
  - Dispatch captures all request fields before slot free
  - PRE and ACT never retire active request
  - READ or WRITE is the only normal retirement point
  - Refresh cannot overwrite queued or active traffic
  - Open-page operation retains the active row after READ or WRITE
invariants:
- cmd_commit never occurs without candidate_valid
- dispatch_fire occurs only in IDLE without ref_req
- ref_ack occurs exactly once per committed simplified REF
combinational_dependencies:
  dispatch_fire:
  - sel_valid
  - sel_idx
  - sel_req
  - ref_req
  dispatch_idx:
  - sel_idx
  cmd_ready:
  - ref_req
  candidate_valid:
  - ref_req
  - bank_active
  - bank_open_row
  candidate_opcode:
  - ref_req
  - bank_active
  - bank_open_row
  candidate_bank:
  - sel_req
  - bank_active
  - bank_open_row
  candidate_row:
  - sel_req
  - bank_open_row
  cmd_commit:
  - timing_ok
  - ref_req
  - bank_active
  - bank_open_row
  commit_opcode:
  - timing_ok
  - ref_req
  - bank_active
  - bank_open_row
  commit_bank:
  - timing_ok
  - sel_req
  - bank_active
  - bank_open_row
  commit_row:
  - timing_ok
  - sel_req
  - bank_open_row
  rw_commit:
  - timing_ok
  - bank_active
  - bank_open_row
  active_req: []
  service_done:
  - timing_ok
  - bank_active
  - bank_open_row
  ref_ack:
  - timing_ok
  - ref_req
verification_requirements:
- id: R1
  text: 'Implement the controller constraints: {"design_name": "ddr4_controller",
    "features": {"page_policy": "open_page", "refresh": true, "scheduler": "simple",
    "tFAW": true, "tRRD": true}, "memory": {"protocol": "DDR4", "speed": "3200"},
    "profile": {"type": "basic"}, "topology": {"banks": 4}}'
  owners:
  - u_request_queue
  - u_scheduler
  - u_command_engine
  - u_timing
  - u_memory
  - u_row_state
  - u_refresh
  verification: Run directed accesses across all four banks with DDR4-3200 timing
    counters enabled and confirm simple selection, open rows, refresh, tRRD, and tFAW
    behavior.
- id: BASE_HOST
  text: Preserve the existing host ports and widths listed in the baseline contract.
    Accept a request only on a rising clk edge with txn_valid && txn_ready. Hold payload
    while stalled. Consecutive accepted cycles with txn_valid held high are distinct
    requests. cmd_ready is execution/timing visibility, not the host acceptance handshake.
    Deassert txn_ready and rsp_valid during reset.
  owners:
  - u_host_adapter
  - u_request_queue
  - u_command_engine
  - u_memory
  verification: Drive txn_valid high for consecutive ready cycles and verify distinct
    queue entries; stall with txn_ready low and verify no admission; assert reset
    and verify txn_ready and rsp_valid are low.
- id: BASE_ADDRESS
  text: 'Preserve the simplified 4-bit txn_addr mapping: row=txn_addr[3:2], column=txn_addr[1:0],
    zero-extended into the internal 10-bit row and 6-bit column fields. Preserve explicit
    txn_bank for multi-bank configurations; a single-bank configuration uses bank
    0. Internal packed requests retain bank(2), row(10), column(6), write flag(1),
    write data(32).'
  owners:
  - u_host_adapter
  - u_request_queue
  - u_command_engine
  - u_memory
  verification: Submit all sixteen txn_addr values in two banks and inspect packed
    fields and independent memory locations.
- id: BASE_QUEUE
  text: 'Preserve four WAITING request slots PLUS one separately stored active-service
    request: total capacity is five outstanding requests. The active request must
    not consume one of the four waiting slots. Dispatch transfers a queued request
    into active registers and frees its waiting slot without retiring the transaction.
    Full queues backpressure the host; a same-cycle transfer/retirement may reuse
    a slot. Accepted request fields survive stalls and each accepted request is serviced
    exactly once. Keep admission, dispatch/retirement, service completion and read
    response delivery distinct.'
  owners:
  - u_request_queue
  - u_scheduler
  - u_command_engine
  - u_memory
  verification: Fill four waiting slots, dispatch one into active service, refill
    the freed slot, and verify five outstanding requests with exactly one eventual
    completion per accepted request.
- id: BASE_DATA
  text: Provide functional 32-bit memory storage with 16 addresses per bank, bank
    isolation and reset-to-zero contents. Accepted writes update only their addressed
    location at service completion or a committed WRITE. Each accepted read produces
    exactly one one-cycle rsp_valid pulse with the stored rsp_rdata after read service/READ
    commit, using the existing one-cycle response stage. Writes produce no host response.
    Selection and stalled candidates cannot mutate memory; mere command output without
    storage and read responses is insufficient.
  owners:
  - u_command_engine
  - u_memory
  - u_host_adapter
  verification: Write distinct values to equal addresses in separate banks, read both
    back, verify one delayed response pulse per read, no response for writes, and
    reset-to-zero behavior.
- id: BASE_TIMING
  text: Retain existing tRCD, tRAS and tRP timing protection from the selected JEDEC
    profile. ACT-to-READ/WRITE must wait tRCD, ACT-to-PRE must respect tRAS, and PRE-to-next-ACT
    must respect tRP if explicit commands are used. Aggregate service may retain the
    existing protected timing envelope instead. Configured tRRD and tFAW gates must
    use accepted activation events, not host admissions or stalled proposals. Never
    treat existing basic timing as an unrequested future feature.
  owners:
  - u_command_engine
  - u_timing
  verification: Force row misses and verify ACT-to-access waits 22 cycles, ACT-to-PRE
    waits 52 cycles, PRE-to-ACT waits 22 cycles, and stalled candidates do not advance
    history.
- id: BASE_SEQUENCE
  text: Dispatch captures the complete selected request in separate active-service
    registers before freeing its waiting queue slot. Hold that active request and
    payload across setup PRE/ACT and timing stalls until its final READ/WRITE commits.
    Setup commands never retire the active request. Aggregate service also keeps active-service
    ownership through completion. Waiting-queue dequeue at dispatch is distinct from
    active-request retirement. Row state changes only on the responsible committed
    operation; uncommitted proposals cannot change state.
  owners:
  - u_request_queue
  - u_scheduler
  - u_command_engine
  - u_row_state
  - u_timing
  verification: Dispatch a row-miss request, hold timing permission low through PRE
    and ACT candidates, and verify active payload remains unchanged until committed
    READ or WRITE.
- id: BASE_MODULARITY
  text: Keep request storage, request selection, command sequencing, timing enforcement
    and functional memory in independently verifiable modules with explicit interfaces.
    No single controller core may own all these functions. Each mandatory role has
    distinct module owners with functional inter-module connections. Module names
    and further decomposition remain design choices.
  owners:
  - u_request_queue
  - u_scheduler
  - u_command_engine
  - u_timing
  - u_memory
  verification: Independently simulate queue admission and removal, scheduler selection,
    engine sequencing, timing permission, and memory response modules through declared
    interfaces.
- id: BASE_LEGALITY
  text: Compute command permission from registered timing/bank history and an independent
    candidate. An accepted ACT pulse is derived from candidate && permission; permission
    must not combinationally depend on that same accepted pulse. Scheduler selection/validity
    must be available independently of timing_ok; timing_ok may gate commit but must
    not create a selection-validity feedback loop. Declare accurate per-output combinational
    input dependencies.
  owners:
  - u_scheduler
  - u_command_engine
  - u_timing
  verification: Hold an ACT candidate while timing_ok is false and verify history
    is unchanged; verify scheduler selection remains present regardless of timing
    permission.
- id: BASE_RESET
  text: Use top-level clk and active-low rst_n. Reset clears pending requests, active
    service, row validity, memory and responses. Preserve reusable blocks with either
    synchronous or asynchronous active-low resets driven by the same rst_n; differing
    assertion styles do not require rebuilding otherwise reusable blocks. Do not change
    polarity without an explicit adapter.
  owners:
  - u_host_adapter
  - u_request_queue
  - u_scheduler
  - u_command_engine
  - u_timing
  - u_row_state
  - u_memory
  - u_refresh
  verification: Assert rst_n low and verify queue valids, active service, row valids,
    timing counters, memory words, refresh state, and response stage clear.
- id: BASE_POLICY
  text: Preserve page policy open_page and scheduler simple. Simple scheduling prefers
    a row hit then the lowest-index valid request; do not claim oldest-first fairness
    or same-address ordering is already implemented. Open-page retains a serviced
    row; close-page closes it before subsequent bank use. Preserve request ownership
    through any setup sequence.
  owners:
  - u_scheduler
  - u_command_engine
  - u_row_state
  verification: Queue a lower-index row miss and higher-index row hit; verify row
    hit dispatches first and serviced row remains open after READ or WRITE.
- id: BASE_REFRESH
  text: Retain periodic refresh requests using profile tREFI, refresh priority and
    request/acknowledgment handling without dropping queued traffic. Refresh must
    make progress and normal requests must resume. Existing refresh is simplified;
    full REF/tRFC servicing remains later feature work. If explicit REF is proposed,
    describe drain/row-state interaction and acknowledge once at commit.
  owners:
  - u_refresh
  - u_command_engine
  - u_timing
  - u_request_queue
  verification: Reach tREFI=12480 with queued traffic, verify ref_req persists until
    one REF commit and ref_ack, then verify queued transaction dispatch resumes.
- id: BASE_TRRD
  text: tRRD is enabled; honor that setting and resolve enabled timing values from
    DDR4-3200.
  owners:
  - u_timing
  - u_command_engine
  verification: Commit an ACT and verify subsequent ACT candidates are blocked for
    the DDR4-3200 tRRD interval.
- id: BASE_TFAW
  text: tFAW is enabled; honor that setting and resolve enabled timing values from
    DDR4-3200.
  owners:
  - u_timing
  - u_command_engine
  verification: Commit four ACT commands within fewer than 40 cycles and verify a
    fifth ACT candidate is blocked until the oldest committed ACT exits the 40-cycle
    window.
