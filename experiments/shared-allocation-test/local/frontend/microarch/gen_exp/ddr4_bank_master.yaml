design_name: ddr4_bank
design_type: top_level
source_feature: basic_commands
jedec_profile: DDR4-3200
submodules:
- name: activate_fsm
  spec: ddr4_bank_activate_fsm.yaml
  design_name: ddr4_bank_activate_fsm
- name: tRAS_fsm
  spec: ddr4_bank_tRAS_fsm.yaml
  design_name: ddr4_bank_tRAS_fsm
- name: precharge_fsm
  spec: ddr4_bank_precharge_fsm.yaml
  design_name: ddr4_bank_precharge_fsm
- name: bank_sequencer
  spec: ddr4_bank_bank_sequencer.yaml
  design_name: ddr4_bank_bank_sequencer
interfaces:
- signal: activate_start
  from_module: bank_sequencer
  from_port: cmd_valid
  to_module: activate_fsm
  to_port: start
  width: 1
  note: Gated by cmd_type == 0 (ACTIVATE) in top-level wrapper
- signal: tRAS_start
  from_module: bank_sequencer
  from_port: cmd_valid
  to_module: tRAS_fsm
  to_port: start
  width: 1
  note: "Starts in parallel with activate_fsm \u2014 same start condition"
- signal: precharge_start
  from_module: bank_sequencer
  from_port: tRAS_done
  to_module: precharge_fsm
  to_port: start
  width: 1
- signal: tRCD_done
  from_module: activate_fsm
  from_port: tRCD_done
  to_module: bank_sequencer
  to_port: tRCD_done
  width: 1
- signal: tRAS_done
  from_module: tRAS_fsm
  from_port: tRAS_done
  to_module: bank_sequencer
  to_port: tRAS_done
  width: 1
- signal: tRP_done
  from_module: precharge_fsm
  from_port: tRP_done
  to_module: bank_sequencer
  to_port: tRP_done
  width: 1
