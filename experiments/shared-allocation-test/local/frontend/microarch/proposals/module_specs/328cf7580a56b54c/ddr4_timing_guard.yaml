design_name: ddr4_timing_guard
design_type: datapath
clock:
  name: clk
reset:
  name: rst_n
  active_low: true
  synchronous: true
ports:
- name: candidate_valid
  direction: input
  width: 1
- name: candidate_opcode
  direction: input
  width: 3
- name: candidate_bank
  direction: input
  width: 2
- name: cmd_commit
  direction: input
  width: 1
- name: commit_opcode
  direction: input
  width: 3
- name: commit_bank
  direction: input
  width: 2
- name: timing_ok
  direction: output
  width: 1
behavior:
  description: Opcode 1 is ACT, 2 PRE, 3 READ, 4 WRITE, and 5 simplified REF. Registered
    per-bank ACT-to-CAS cooldowns load to 22 on committed ACT; READ or WRITE requires
    zero. Per-bank ACT-to-PRE cooldowns load to 52 on committed ACT; PRE requires
    zero. Per-bank PRE-to-ACT cooldowns load to 22 on committed PRE; ACT requires
    zero. Global tRRD cooldown loads to 5 on committed ACT and blocks ACT while nonzero.
    A registered 40-cycle ACT history window permits ACT only when fewer than four
    preceding committed ACTs are in the window. Cooldowns decrement once per cycle
    unless reloaded. timing_ok is combinationally computed from registered histories
    and independent candidate. cmd_commit updates histories but does not feed timing_ok
    combinationally. Simplified REF is permitted whenever candidate_valid is asserted
    and does not model tRFC.
  invariants:
  - ACT-to-READ/WRITE waits tRCD=22 cycles
  - ACT-to-PRE waits tRAS=52 cycles
  - PRE-to-next-ACT waits tRP=22 cycles
  - Committed ACT events are the only tRRD and tFAW history source
  - tRRD=6 uses reload value 5 after ACT commit
  - No accepted-ACT feedback appears in timing_ok logic
invariants:
- Stalled or proposed ACT never reloads tRRD or enters tFAW history
- tFAW history contains only prior committed ACTs
- timing_ok is false when candidate_valid is false
combinational_dependencies:
  timing_ok:
  - candidate_valid
  - candidate_opcode
  - candidate_bank
verification_requirements:
- id: R1
  text: 'Implement the controller constraints: {"design_name": "ddr4_controller",
    "features": {"page_policy": "open_page", "refresh": true, "scheduler": "simple",
    "tFAW": true, "tRRD": true}, "memory": {"protocol": "DDR4", "speed": "3200"},
    "profile": {"type": "basic"}, "topology": {"banks": 4}}'
  owners:
  - u_request_queue
  - u_scheduler
  - u_command_engine
  - u_timing
  - u_memory
  - u_row_state
  - u_refresh
  verification: Run directed accesses across all four banks with DDR4-3200 timing
    counters enabled and confirm simple selection, open rows, refresh, tRRD, and tFAW
    behavior.
- id: BASE_TIMING
  text: Retain existing tRCD, tRAS and tRP timing protection from the selected JEDEC
    profile. ACT-to-READ/WRITE must wait tRCD, ACT-to-PRE must respect tRAS, and PRE-to-next-ACT
    must respect tRP if explicit commands are used. Aggregate service may retain the
    existing protected timing envelope instead. Configured tRRD and tFAW gates must
    use accepted activation events, not host admissions or stalled proposals. Never
    treat existing basic timing as an unrequested future feature.
  owners:
  - u_command_engine
  - u_timing
  verification: Force row misses and verify ACT-to-access waits 22 cycles, ACT-to-PRE
    waits 52 cycles, PRE-to-ACT waits 22 cycles, and stalled candidates do not advance
    history.
- id: BASE_SEQUENCE
  text: Dispatch captures the complete selected request in separate active-service
    registers before freeing its waiting queue slot. Hold that active request and
    payload across setup PRE/ACT and timing stalls until its final READ/WRITE commits.
    Setup commands never retire the active request. Aggregate service also keeps active-service
    ownership through completion. Waiting-queue dequeue at dispatch is distinct from
    active-request retirement. Row state changes only on the responsible committed
    operation; uncommitted proposals cannot change state.
  owners:
  - u_request_queue
  - u_scheduler
  - u_command_engine
  - u_row_state
  - u_timing
  verification: Dispatch a row-miss request, hold timing permission low through PRE
    and ACT candidates, and verify active payload remains unchanged until committed
    READ or WRITE.
- id: BASE_MODULARITY
  text: Keep request storage, request selection, command sequencing, timing enforcement
    and functional memory in independently verifiable modules with explicit interfaces.
    No single controller core may own all these functions. Each mandatory role has
    distinct module owners with functional inter-module connections. Module names
    and further decomposition remain design choices.
  owners:
  - u_request_queue
  - u_scheduler
  - u_command_engine
  - u_timing
  - u_memory
  verification: Independently simulate queue admission and removal, scheduler selection,
    engine sequencing, timing permission, and memory response modules through declared
    interfaces.
- id: BASE_LEGALITY
  text: Compute command permission from registered timing/bank history and an independent
    candidate. An accepted ACT pulse is derived from candidate && permission; permission
    must not combinationally depend on that same accepted pulse. Scheduler selection/validity
    must be available independently of timing_ok; timing_ok may gate commit but must
    not create a selection-validity feedback loop. Declare accurate per-output combinational
    input dependencies.
  owners:
  - u_scheduler
  - u_command_engine
  - u_timing
  verification: Hold an ACT candidate while timing_ok is false and verify history
    is unchanged; verify scheduler selection remains present regardless of timing
    permission.
- id: BASE_RESET
  text: Use top-level clk and active-low rst_n. Reset clears pending requests, active
    service, row validity, memory and responses. Preserve reusable blocks with either
    synchronous or asynchronous active-low resets driven by the same rst_n; differing
    assertion styles do not require rebuilding otherwise reusable blocks. Do not change
    polarity without an explicit adapter.
  owners:
  - u_host_adapter
  - u_request_queue
  - u_scheduler
  - u_command_engine
  - u_timing
  - u_row_state
  - u_memory
  - u_refresh
  verification: Assert rst_n low and verify queue valids, active service, row valids,
    timing counters, memory words, refresh state, and response stage clear.
- id: BASE_REFRESH
  text: Retain periodic refresh requests using profile tREFI, refresh priority and
    request/acknowledgment handling without dropping queued traffic. Refresh must
    make progress and normal requests must resume. Existing refresh is simplified;
    full REF/tRFC servicing remains later feature work. If explicit REF is proposed,
    describe drain/row-state interaction and acknowledge once at commit.
  owners:
  - u_refresh
  - u_command_engine
  - u_timing
  - u_request_queue
  verification: Reach tREFI=12480 with queued traffic, verify ref_req persists until
    one REF commit and ref_ack, then verify queued transaction dispatch resumes.
- id: BASE_TRRD
  text: tRRD is enabled; honor that setting and resolve enabled timing values from
    DDR4-3200.
  owners:
  - u_timing
  - u_command_engine
  verification: Commit an ACT and verify subsequent ACT candidates are blocked for
    the DDR4-3200 tRRD interval.
- id: BASE_TFAW
  text: tFAW is enabled; honor that setting and resolve enabled timing values from
    DDR4-3200.
  owners:
  - u_timing
  - u_command_engine
  verification: Commit four ACT commands within fewer than 40 cycles and verify a
    fifth ACT candidate is blocked until the oldest committed ACT exits the 40-cycle
    window.
