architecture_version: 1
design_name: ddr4_controller_top
profile: DDR4-3200
rationale: The controller separates waiting-request storage, row-hit selection, active-request
  command sequencing, timing legality, row state, refresh generation, and functional
  memory. The queue owns exactly four waiting entries while the command engine owns
  a distinct active-service register. Scheduler selection is independent of timing
  permission. The command engine proposes commands from registered state and commits
  only when the timing owner permits them. Row state changes only from committed ACT
  or PRE commands. Simplified refresh has priority when the command engine is idle
  and does not overwrite active or queued traffic.
top_ports:
- name: clk
  direction: input
  width: 1
- name: rst_n
  direction: input
  width: 1
- name: txn_valid
  direction: input
  width: 1
- name: txn_is_write
  direction: input
  width: 1
- name: txn_addr
  direction: input
  width: 4
- name: txn_wdata
  direction: input
  width: 32
- name: txn_bank
  direction: input
  width: 2
- name: txn_ready
  direction: output
  width: 1
- name: cmd_ready
  direction: output
  width: 1
- name: rsp_valid
  direction: output
  width: 1
- name: rsp_rdata
  direction: output
  width: 32
modules:
- instance: u_host_adapter
  roles:
  - host_adapter
  responsibility: Own host handshake presentation, address expansion, packed request
    construction, reset masking, and host response forwarding.
  spec:
    design_name: ddr4_host_adapter
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: txn_valid
      direction: input
      width: 1
    - name: txn_is_write
      direction: input
      width: 1
    - name: txn_addr
      direction: input
      width: 4
    - name: txn_wdata
      direction: input
      width: 32
    - name: txn_bank
      direction: input
      width: 2
    - name: queue_ready
      direction: input
      width: 1
    - name: engine_cmd_ready
      direction: input
      width: 1
    - name: mem_rsp_valid
      direction: input
      width: 1
    - name: mem_rsp_rdata
      direction: input
      width: 32
    - name: enq_valid
      direction: output
      width: 1
    - name: enq_req
      direction: output
      width: 51
    - name: txn_ready
      direction: output
      width: 1
    - name: cmd_ready
      direction: output
      width: 1
    - name: rsp_valid
      direction: output
      width: 1
    - name: rsp_rdata
      direction: output
      width: 32
    behavior:
      description: Packed request layout is bank[50:49], row[48:39], column[38:33],
        is_write[32], wdata[31:0]. Row is zero-extended from txn_addr[3:2] and column
        is zero-extended from txn_addr[1:0]. enq_valid equals txn_valid when rst_n
        is high. txn_ready equals queue_ready when rst_n is high. A host request is
        accepted only on a rising edge with txn_valid and txn_ready high; no edge
        detector is used, so consecutive qualifying cycles are distinct requests.
        The host holds payload stable while txn_valid is high and txn_ready is low.
        cmd_ready forwards engine execution visibility and does not affect admission.
        rsp_valid forwards the one-cycle memory response stage when rst_n is high.
        Reset forces outputs low.
      invariants:
      - txn_ready is independent of cmd_ready
      - txn_bank is retained for the four-bank topology
      - no request bypasses the waiting queue
      - rsp_valid is low during reset
    invariants:
    - row[9:2] is zero and row[1:0] equals txn_addr[3:2]
    - column[5:2] is zero and column[1:0] equals txn_addr[1:0]
    combinational_dependencies:
      enq_valid:
      - txn_valid
      - rst_n
      enq_req:
      - txn_is_write
      - txn_addr
      - txn_wdata
      - txn_bank
      txn_ready:
      - queue_ready
      - rst_n
      cmd_ready:
      - engine_cmd_ready
      - rst_n
      rsp_valid:
      - mem_rsp_valid
      - rst_n
      rsp_rdata:
      - mem_rsp_rdata
      - rst_n
- instance: u_request_queue
  roles:
  - request_queue
  responsibility: Own four indexed waiting slots, host admission, same-cycle dispatch-slot
    reuse, and explicit removal at dispatch.
  spec:
    design_name: ddr4_waiting_request_queue
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: enq_valid
      direction: input
      width: 1
    - name: enq_req
      direction: input
      width: 51
    - name: enq_ready
      direction: output
      width: 1
    - name: req_array
      direction: output
      width: 204
    - name: req_valid
      direction: output
      width: 4
    - name: deq_en
      direction: input
      width: 1
    - name: deq_idx
      direction: input
      width: 2
    behavior:
      description: Four independent waiting slots store 51-bit requests and four valid
        bits. A request is admitted on a rising edge when enq_valid and enq_ready
        are high. enq_ready is high if any slot is invalid or if deq_en permits same-cycle
        reuse of deq_idx. The insertion target is the lowest-index invalid slot; when
        all slots are valid and deq_en is high, insertion target is deq_idx. deq_en
        clears only deq_idx except same-cycle insertion to that index wins and leaves
        the new entry valid. Entries never shift. req_array and req_valid expose registered
        storage. Reset clears valid bits and request storage.
      invariants:
      - There are exactly four waiting slots
      - Dispatch dequeue removes only a waiting slot and never indicates service retirement
      - At most one enqueue and one dequeue occur per cycle
      - Accepted requests remain stored until explicit dequeue
    invariants:
    - enq_ready is asserted on same-cycle dequeue reuse even when all slots were valid
    - same-index enqueue takes priority over dequeue clear
    combinational_dependencies:
      enq_ready:
      - deq_en
      - deq_idx
      req_array: []
      req_valid: []
- instance: u_row_state
  roles:
  - row_state
  responsibility: Own registered open-row state for four banks and update it only
    on committed ACT or PRE commands.
  spec:
    design_name: ddr4_row_state
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: commit_valid
      direction: input
      width: 1
    - name: commit_opcode
      direction: input
      width: 3
    - name: commit_bank
      direction: input
      width: 2
    - name: commit_row
      direction: input
      width: 10
    - name: bank_active
      direction: output
      width: 4
    - name: bank_open_row
      direction: output
      width: 40
    behavior:
      description: Four row-valid bits and four 10-bit open-row registers reset to
        zero. On committed ACT opcode 1, the selected bank valid bit is set and its
        open-row register captures commit_row. On committed PRE opcode 2, the selected
        bank valid bit is cleared. READ opcode 3, WRITE opcode 4, REF opcode 5, stalled
        candidates, and uncommitted proposals do not modify row state. bank_open_row
        packs bank 0 in [9:0], bank 1 in [19:10], bank 2 in [29:20], and bank 3 in
        [39:30].
      invariants:
      - Only committed ACT and PRE modify row state
      - At most one bank row state changes on one clock edge
      - REF does not alter simplified row state
    invariants:
    - bank_active reflects registered row-valid state
    combinational_dependencies:
      bank_active: []
      bank_open_row: []
- instance: u_scheduler
  roles:
  - scheduler
  responsibility: Own simple row-hit-first selection and stable selected waiting-slot
    identity until command-engine dispatch.
  spec:
    design_name: ddr4_simple_scheduler
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: req_array
      direction: input
      width: 204
    - name: req_valid
      direction: input
      width: 4
    - name: bank_active
      direction: input
      width: 4
    - name: bank_open_row
      direction: input
      width: 40
    - name: dispatch_fire
      direction: input
      width: 1
    - name: sel_valid
      direction: output
      width: 1
    - name: sel_idx
      direction: output
      width: 2
    - name: sel_req
      direction: output
      width: 51
    behavior:
      description: When not locked, select the lowest-index valid row-hit request.
        A row hit requires the addressed bank_active bit and equality between that
        bank open row and request row. If no row hit exists, select the lowest-index
        valid request. When a selected request cannot dispatch, register and hold
        the selected index and request. dispatch_fire clears the lock on the rising
        edge. Selection depends only on queue and registered row state; it does not
        consume timing_ok and does not dequeue storage.
      invariants:
      - Lowest-index row hit wins over non-hits
      - Lowest-index valid fallback is used when no row hit exists
      - Locked selection remains stable until dispatch_fire
      - No oldest-first, fairness, or same-address ordering guarantee
    invariants:
    - sel_valid implies req_valid for the selected slot unless dispatch_fire completes
      selected dispatch on that edge
    combinational_dependencies:
      sel_valid:
      - req_array
      - req_valid
      - bank_active
      - bank_open_row
      sel_idx:
      - req_array
      - req_valid
      - bank_active
      - bank_open_row
      sel_req:
      - req_array
      - req_valid
      - bank_active
      - bank_open_row
- instance: u_refresh
  roles:
  - refresh
  responsibility: Generate periodic persistent simplified refresh requests using DDR4-3200
    tREFI.
  reuse:
    feature: refresh_controller
    submodule: refresh_controller
    design_name: ddr4_refresh_controller
- instance: u_command_engine
  roles:
  - command_engine
  responsibility: Own separately stored active-service request, setup sequencing,
    refresh arbitration, command candidacy, command commit, and service retirement.
  spec:
    design_name: ddr4_command_engine
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: sel_valid
      direction: input
      width: 1
    - name: sel_idx
      direction: input
      width: 2
    - name: sel_req
      direction: input
      width: 51
    - name: ref_req
      direction: input
      width: 1
    - name: timing_ok
      direction: input
      width: 1
    - name: bank_active
      direction: input
      width: 4
    - name: bank_open_row
      direction: input
      width: 40
    - name: dispatch_fire
      direction: output
      width: 1
    - name: dispatch_idx
      direction: output
      width: 2
    - name: cmd_ready
      direction: output
      width: 1
    - name: candidate_valid
      direction: output
      width: 1
    - name: candidate_opcode
      direction: output
      width: 3
    - name: candidate_bank
      direction: output
      width: 2
    - name: candidate_row
      direction: output
      width: 10
    - name: cmd_commit
      direction: output
      width: 1
    - name: commit_opcode
      direction: output
      width: 3
    - name: commit_bank
      direction: output
      width: 2
    - name: commit_row
      direction: output
      width: 10
    - name: rw_commit
      direction: output
      width: 1
    - name: active_req
      direction: output
      width: 51
    - name: service_done
      direction: output
      width: 1
    - name: ref_ack
      direction: output
      width: 1
    behavior:
      description: The engine has IDLE, PREPARE_PRE, PREPARE_ACT, ACCESS, and REFRESH
        states. It owns one active 51-bit request register and active-valid bit separate
        from waiting slots. In IDLE, ref_req has priority. A pending refresh enters
        REFRESH without capturing a transaction. Otherwise sel_valid produces dispatch_fire;
        on that edge sel_req is captured, active-valid is set, and dispatch_idx frees
        the queue slot. With active state, a conflicting open row causes PRE, a closed
        bank causes ACT, and a matching open row causes READ or WRITE. PRE commit
        advances to ACT, ACT commit advances to ACCESS, and a committed READ or WRITE
        asserts rw_commit and service_done, clears active-valid, and returns IDLE.
        REFRESH proposes opcode 5 and ref_ack only when REF commits. candidate signals
        derive only from registered engine state, active request, ref_req, and registered
        row state. cmd_commit equals candidate_valid and timing_ok. A stalled candidate
        changes no row state, timing history, memory, refresh state, or active state.
        cmd_ready is high only in IDLE without ref_req.
      invariants:
      - Active request does not consume a waiting queue slot
      - Dispatch captures all request fields before slot free
      - PRE and ACT never retire active request
      - READ or WRITE is the only normal retirement point
      - Refresh cannot overwrite queued or active traffic
      - Open-page operation retains the active row after READ or WRITE
    invariants:
    - cmd_commit never occurs without candidate_valid
    - dispatch_fire occurs only in IDLE without ref_req
    - ref_ack occurs exactly once per committed simplified REF
    combinational_dependencies:
      dispatch_fire:
      - sel_valid
      - sel_idx
      - sel_req
      - ref_req
      dispatch_idx:
      - sel_idx
      cmd_ready:
      - ref_req
      candidate_valid:
      - ref_req
      - bank_active
      - bank_open_row
      candidate_opcode:
      - ref_req
      - bank_active
      - bank_open_row
      candidate_bank:
      - sel_req
      - bank_active
      - bank_open_row
      candidate_row:
      - sel_req
      - bank_open_row
      cmd_commit:
      - timing_ok
      - ref_req
      - bank_active
      - bank_open_row
      commit_opcode:
      - timing_ok
      - ref_req
      - bank_active
      - bank_open_row
      commit_bank:
      - timing_ok
      - sel_req
      - bank_active
      - bank_open_row
      commit_row:
      - timing_ok
      - sel_req
      - bank_open_row
      rw_commit:
      - timing_ok
      - bank_active
      - bank_open_row
      active_req: []
      service_done:
      - timing_ok
      - bank_active
      - bank_open_row
      ref_ack:
      - timing_ok
      - ref_req
- instance: u_timing
  roles:
  - timing
  responsibility: Own registered per-bank and global DDR4-3200 timing history and
    independently computed command permission.
  spec:
    design_name: ddr4_timing_guard
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: candidate_valid
      direction: input
      width: 1
    - name: candidate_opcode
      direction: input
      width: 3
    - name: candidate_bank
      direction: input
      width: 2
    - name: cmd_commit
      direction: input
      width: 1
    - name: commit_opcode
      direction: input
      width: 3
    - name: commit_bank
      direction: input
      width: 2
    - name: timing_ok
      direction: output
      width: 1
    behavior:
      description: Opcode 1 is ACT, 2 PRE, 3 READ, 4 WRITE, and 5 simplified REF.
        Registered per-bank ACT-to-CAS cooldowns load to 22 on committed ACT; READ
        or WRITE requires zero. Per-bank ACT-to-PRE cooldowns load to 52 on committed
        ACT; PRE requires zero. Per-bank PRE-to-ACT cooldowns load to 22 on committed
        PRE; ACT requires zero. Global tRRD cooldown loads to 5 on committed ACT and
        blocks ACT while nonzero. A registered 40-cycle ACT history window permits
        ACT only when fewer than four preceding committed ACTs are in the window.
        Cooldowns decrement once per cycle unless reloaded. timing_ok is combinationally
        computed from registered histories and independent candidate. cmd_commit updates
        histories but does not feed timing_ok combinationally. Simplified REF is permitted
        whenever candidate_valid is asserted and does not model tRFC.
      invariants:
      - ACT-to-READ/WRITE waits tRCD=22 cycles
      - ACT-to-PRE waits tRAS=52 cycles
      - PRE-to-next-ACT waits tRP=22 cycles
      - Committed ACT events are the only tRRD and tFAW history source
      - tRRD=6 uses reload value 5 after ACT commit
      - No accepted-ACT feedback appears in timing_ok logic
    invariants:
    - Stalled or proposed ACT never reloads tRRD or enters tFAW history
    - tFAW history contains only prior committed ACTs
    - timing_ok is false when candidate_valid is false
    combinational_dependencies:
      timing_ok:
      - candidate_valid
      - candidate_opcode
      - candidate_bank
- instance: u_memory
  roles:
  - memory
  responsibility: Own resettable four-bank functional storage, write commitment, read
    data capture, and one-cycle response staging.
  spec:
    design_name: ddr4_functional_memory
    design_type: datapath
    clock:
      name: clk
    reset:
      name: rst_n
      active_low: true
      synchronous: true
    ports:
    - name: rw_commit
      direction: input
      width: 1
    - name: commit_opcode
      direction: input
      width: 3
    - name: active_req
      direction: input
      width: 51
    - name: rsp_valid
      direction: output
      width: 1
    - name: rsp_rdata
      direction: output
      width: 32
    behavior:
      description: Storage is four isolated banks of sixteen 32-bit words reset to
        zero. active_req is decoded as bank[50:49], row[48:39], column[38:33], is_write[32],
        wdata[31:0]. Functional address within a bank is {row[1:0],column[1:0]}. On
        rw_commit with WRITE opcode 4, only addressed bank and location update and
        no response is generated. On rw_commit with READ opcode 3, the stored word
        is captured into the registered response stage and rsp_valid is set for the
        following cycle. rsp_valid otherwise clears each cycle. Stalled candidates,
        dispatch, ACT, PRE, REF, and uncommitted proposals cannot modify storage or
        create a response.
      invariants:
      - Each committed read produces exactly one rsp_valid pulse
      - Writes produce no host response
      - Storage is bank-isolated
      - Reset clears every word and response stage
    invariants:
    - Memory write enable is rw_commit and commit_opcode==4 only
    combinational_dependencies:
      rsp_valid: []
      rsp_rdata: []
