parameters:
  BANK_COUNT: {value: 4, allowed: [1, 2, 4]}
  WAITING_CAPACITY: {value: 4, minimum: 1, configurable: true}
  ACTIVE_CAPACITY: {value: 1, configurable: false}
  HOST_ADDR_WIDTH: {value: 4}
  HOST_BANK_WIDTH:
    derive: ceil_log2(BANK_COUNT)
    note: Host bank port is omitted for one bank; internal bank remains present.
  DATA_WIDTH: {value: 32}
  REQUEST_BANK_WIDTH: {value: 2}
  REQUEST_ROW_WIDTH: {value: 10}
  REQUEST_COLUMN_WIDTH: {value: 6}
  COMMAND_OPCODE_WIDTH: {value: 3}
  TFAW_ACT_LIMIT: {value: 4}
  RESPONSE_CAPACITY: {value: 1, configurable: false}
  MEMORY_WORDS_PER_BANK: {derive: 2**HOST_ADDR_WIDTH}
  PAGE_POLICY: {value: open_page, allowed: [open_page, close_page]}
  READ_RESPONSE_LATENCY:
    value: 1
    configurable: false
    unit: cycles
    note: READ commit at edge E captures data and asserts registered rsp_valid after E; the host samples it at E+1.
clock_reset:
  clock: clk
  edge: rising
  reset: rst_n
  active_level: 0
  priority: reset_before_all_events
  assertion_style: synchronous_for_all_stateful_modules_in_this_example
  handshake_gating: While rst_n is low, all event conditions are false and txn_ready/rsp_valid are low.
types:
  bit: {kind: unsigned, width: 1}
  host_address: {kind: unsigned, width: shared.parameters.HOST_ADDR_WIDTH}
  host_bank: {kind: unsigned, width: shared.parameters.HOST_BANK_WIDTH}
  data: {kind: unsigned, width: shared.parameters.DATA_WIDTH}
  bank: {kind: unsigned, width: shared.parameters.REQUEST_BANK_WIDTH}
  row: {kind: unsigned, width: shared.parameters.REQUEST_ROW_WIDTH}
  column: {kind: unsigned, width: shared.parameters.REQUEST_COLUMN_WIDTH}
  opcode:
    kind: enum
    width: shared.parameters.COMMAND_OPCODE_WIDTH
    encodings: {NOP: 0, ACT: 1, PRE: 2, READ: 3, WRITE: 4, REF: 5}
    reserved: [6, 7]
  bank_valid:
    kind: array
    element_type: shared.types.bit
    count: shared.parameters.BANK_COUNT
    packed_order: ascending_index_from_lsb
  bank_rows:
    kind: array
    element_type: shared.types.row
    count: shared.parameters.BANK_COUNT
    packed_order: ascending_index_from_lsb
  command:
    kind: record
    packed_order: msb_to_lsb
    fields:
      - {name: opcode, type: shared.types.opcode}
      - {name: bank, type: shared.types.bank}
      - {name: row, type: shared.types.row}
      - {name: column, type: shared.types.column}
      - {name: wdata, type: shared.types.data}
    semantics:
      NOP: No command commit; candidate_valid must be false. All other fields zero.
      ACT: Open command.bank at command.row; column and wdata zero.
      PRE: Close command.bank; row, column, and wdata zero. No implicit all-bank PRE.
      READ: Read command.bank/row/column; wdata zero. Requires a matching open row.
      WRITE: Write command.wdata at command.bank/row/column. Requires a matching open row.
      REF: All-bank refresh after every bank is closed and tRP satisfied; all other fields zero.
    legal_values: Bank-addressed commands require bank < BANK_COUNT; reserved opcodes must never be proposed or committed.
  request:
    kind: record
    packed_order: msb_to_lsb
    fields:
      - {name: bank, type: shared.types.bank}
      - {name: row, type: shared.types.row}
      - {name: column, type: shared.types.column}
      - {name: is_write, type: shared.types.bit}
      - {name: wdata, type: shared.types.data}
    mapping:
      bank: Zero-extend txn_bank; use zero when the host bank port is absent.
      row: Zero-extend txn_addr[3:2].
      column: Zero-extend txn_addr[1:0].
      is_write: txn_is_write
      wdata: txn_wdata
    legal_values: bank < BANK_COUNT; upper row/column bits zero for this host mapping.
host_interface:
  clk: {direction: input, type: shared.types.bit}
  rst_n: {direction: input, type: shared.types.bit}
  txn_valid: {direction: input, type: shared.types.bit}
  txn_ready: {direction: output, type: shared.types.bit}
  txn_is_write: {direction: input, type: shared.types.bit}
  txn_addr: {direction: input, type: shared.types.host_address}
  txn_bank: {direction: input, type: shared.types.host_bank, when: BANK_COUNT > 1}
  txn_wdata: {direction: input, type: shared.types.data}
  cmd_ready: {direction: output, type: shared.types.bit}
  rsp_valid: {direction: output, type: shared.types.bit}
  rsp_rdata: {direction: output, type: shared.types.data}
events:
  admission:
    condition: txn_valid and txn_ready, with reset inactive.
    effect: Capture the mapped complete request into waiting storage.
  dispatch:
    condition: dispatch_valid and dispatch_ready, with reset inactive.
    effect: Capture the pre-edge FIFO head in active storage and remove that waiting entry atomically.
  command_commit:
    condition: command_engine.candidate_valid and timing.candidate_ok, with reset inactive.
    effect: Update only the state associated with this committed command; maximum one commit per edge.
  retirement:
    condition: command_commit is the final READ or WRITE of the active request.
    effect: Complete exactly one active request; capture read response state before releasing active ownership.
  response_delivery:
    condition: rsp_valid is sampled high at a rising edge, with reset inactive.
    effect: Host samples rsp_rdata; this is distinct from retirement.
  refresh_due:
    condition: The periodic refresh deadline is reached at a rising edge, with reset inactive.
    effect: Set refresh pending; do not discard queued requests or preempt active service.
  refresh_start:
    condition: shared.events.command_commit has opcode REF.
    effect: Acknowledge pending refresh once and start tRFC exclusion.
  refresh_end:
    condition: The next sampling edge is at least tRFC cycles after the committed REF.
    effect: End refresh command exclusion; engine may resume dispatch once idle.
timing_profile:
  source: ../../jedec/jedec_dictionary.yaml
  selection: DDR4-3200
  supported_profiles: [DDR4-2400, DDR4-3200]
  unit: cycles
  bindings:
    tRCD: timing_cycles.tRCD
    tRAS: timing_cycles.tRAS
    tRP: timing_cycles.tRP
    tRRD: timing_cycles.tRRD
    tFAW: timing_cycles.tFAW
    tREFI: timing_cycles.tREFI
    tRFC: timing_cycles.tRFC1
  note: Resolve from the selected project profile once. These are project timing profiles, not a claim of complete JEDEC compliance.
timing_rules:
  tRCD:
    scope: same_bank
    trigger: ACT
    blocked: [READ, WRITE]
    minimum: shared.timing_profile.bindings.tRCD
  tRAS:
    scope: same_bank
    trigger: ACT
    blocked: [PRE]
    minimum: shared.timing_profile.bindings.tRAS
  tRP:
    scope: same_bank_for_ACT_all_banks_for_REF
    trigger: PRE
    blocked: [ACT, REF]
    minimum: shared.timing_profile.bindings.tRP
  tRRD:
    scope: all_banks
    trigger: ACT
    blocked: [ACT]
    minimum: shared.timing_profile.bindings.tRRD
  tFAW:
    scope: all_banks
    trigger: ACT
    blocked: [ACT]
    window: shared.timing_profile.bindings.tFAW
    limit: shared.parameters.TFAW_ACT_LIMIT
  tRFC:
    scope: all_banks
    trigger: REF
    blocked: [ACT, PRE, READ, WRITE, REF]
    minimum: shared.timing_profile.bindings.tRFC
  edge_convention: A trigger committed at E allows its blocked command at E+T, never earlier; tFAW counts earlier ACT commits whose age at the candidate edge is strictly less than its window. Initial history is invalid, so reset imposes no synthetic delay.
